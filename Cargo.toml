[workspace]
members = [
  "src-tauri",
  "crates/domain",
  "crates/model-api",
  "crates/model-stub",
  "crates/research-gateway",
  "crates/application",
  "crates/analytics-engine",
  "crates/analysis-package",
  "crates/persistence-postgres",
  "crates/review-engine",
  "crates/spreadsheet-io",
]
resolver = "2"

[workspace.package]
version = "0.23.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
calamine = { version = "0.36", features = ["chrono"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust_xlsxwriter = { version = "0.95", features = ["chrono"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials"] }
zeroize = "1"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
