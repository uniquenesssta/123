<style>*{animation:none!important;transition:none!important}body{overflow:hidden}.fixture-shell{height:100vh;display:grid;grid-template-columns:60px 154px minmax(0,1fr)}.rail,.side{background:var(--panel);border-right:1px solid var(--line)}.rail{padding:8px 5px}.rail b{width:30px;height:30px;display:grid;place-items:center;margin:auto;border-radius:7px;color:#fff;background:var(--accent)}.rail nav{margin-top:10px}.rail button,.side button{width:100%;min-height:34px;border:0;background:transparent;color:var(--muted);font-size:11px}.rail button.active,.side button.active{color:var(--accent);background:var(--accent-soft)}.side{padding:10px 7px}.side h2{margin:0 6px 9px;font-size:13px}.main{min-width:0;min-height:0;padding:9px 11px;overflow:hidden}.mock-stage{height:100%;min-height:0;display:grid;grid-template-columns:255px minmax(0,1fr);gap:8px}.mock-directory{padding:9px;overflow:hidden}.mock-directory h3{margin:0 0 8px;font-size:13px}.mock-directory input{width:100%;height:32px}.mock-list{display:grid;gap:4px;margin-top:8px}.mock-list div{padding:8px;border:1px solid var(--line);border-radius:6px;font-size:11px}.mock-body{padding:8px}.mock-import{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.7fr);gap:8px}.mock-card{padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.mock-card h3{margin:3px 0 8px;font-size:14px}.mock-card p{color:var(--muted);font-size:10px}.mock-drop{min-height:210px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:11px}</style></head><body><div class="fixture-shell"><aside class="rail"><b>F</b><nav><button>首页</button><button>比赛</button><button class="active">资源</button><button>模型</button><button>分析</button><button>AI</button><button>管理</button></nav></aside><aside class="side"><h2>资源</h2><nav><button class="active">球队中心</button><button>球员中心</button><button>Excel 工作包</button></nav></aside><main class="main app-shell" data-current-page="teams"><section class="entity-page task-page core-workspace-page">
