name: Temporary R2 Stage Closure

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

concurrency:
  group: temp-r2-stage-close-new-B
  cancel-in-progress: false

jobs:
  close-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - name: Close R2 records
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              write(path, text.replace(old, new, 1))

          root_readme = 'README.md'
          replace_once(
              root_readme,
              '- R2-08 已将 `crates/domain/src/lib.rs` 收敛为 17 个模块声明和 365 个显式公共兼容类型 re-export，根级 glob export 已清零；三个私有默认值实现迁入 `shared/defaults.rs`，新增确定性根出口生成/验证门禁并接入 `verify:architecture`。当前状态为 `VERIFYING`，等待 Windows 本机阶段回归。',
              '- R2-08 已将 `crates/domain/src/lib.rs` 收敛为 17 个模块声明、365 个显式公共兼容类型 re-export，并补齐 34 个既有公共根常量的显式兼容出口；根级 glob export 已清零，三个私有默认值实现迁入 `shared/defaults.rs`，确定性根出口生成/验证门禁已接入 `verify:architecture`。Windows 专项 run `31236344727` 已通过根出口、球队资料包和保护资产门禁并生成最终实现提交 `62b1f622b9c14b33dbaac850812a49c063ccb090`；用户本机阶段回归未见报错，上传 runtime 日志共 58 条且全部为 `info`，启动 `connection_error=null`，球队、阵容、分析、Postmatch 与 API 工作区读取均正常完成。R2-08 状态为 `DONE`，R2 阶段已关闭。',
          )

          stage_readme = 'docs/modular-rewrite/R02-domain-rewrite/README.md'
          replace_once(stage_readme, '`IN_PROGRESS`', '`DONE`')
          replace_once(
              stage_readme,
              '| R2-08 | Domain 根出口收敛 | IN_PROGRESS | [`R02-08-domain-根出口收敛.md`](R02-08-domain-根出口收敛.md) | R2-07 已关闭，开始显式根出口收敛 |',
              '| R2-08 | Domain 根出口收敛 | DONE | [`R02-08-domain-根出口收敛.md`](R02-08-domain-根出口收敛.md) | Windows 专项 run `31236344727` 与用户本机阶段回归通过 |',
          )
          replace_once(
              stage_readme,
              'R2-01 至 R2-08 全部 `DONE` 后创建 `R02-stage-completion.md`，并实际完成阶段规定的 Domain、Serde、workspace、模型保护及最终延期验收记录。当前不得创建阶段完成记录。',
              'R2-01 至 R2-08 已全部 `DONE`；阶段完成记录见 [`R02-stage-completion.md`](R02-stage-completion.md)。Domain、Serde、workspace 与模型公开保护门禁已完成，真实原有 PostgreSQL 运行路径已由用户本机验证；专用可清空测试库基线与私有模型固定回归继续按既定策略留待最终统一验收。',
          )
          replace_once(
              stage_readme,
              '`R2-07 DONE`；`R2-08 IN_PROGRESS`。Analytics 39、Exchange 54、AI Workspace 16、Release 9 共 118 个类型已完成职责迁移；Windows 本机 `cargo fmt --check`、17/17 Serde 契约、365 类型清单及架构门禁通过。R2-08 现在只收敛 `crates/domain/src/lib.rs`：根文件必须仅声明模块并显式 re-export 公共兼容类型，不再承载定义或 glob 根出口。',
              '`R2 DONE`。R2-01 至 R2-08 已完成 Domain 业务职责拆分和根出口收敛；最终根文件仅保留 17 个模块声明、365 个显式公共兼容类型出口、34 个既有公共根常量出口及 3 个 crate 内默认值兼容出口，不再承载领域定义、构造器、业务逻辑或公共 glob re-export。Windows 专项 run `31236344727` 通过，用户本机阶段回归未见报错，runtime 日志 58/58 为 `info` 且数据库启动连接错误为空。',
          )
          stage_text = read(stage_readme)
          if '## R2-08 当前结果' not in stage_text:
              stage_text += '''\n\n## R2-08 当前结果\n\n- `crates/domain/src/lib.rs` 已收敛为 17 个业务模块声明和确定性的显式公共出口。\n- 365 个公共兼容类型继续保留 `football_domain::TypeName` 根路径；原根级 glob re-export 为 0。\n- 为保持既有根 API，额外显式登记并 re-export 34 个公共常量/格式版本符号；生成器与验证器共同锁定该兼容集合。\n- `default_true`、`default_team_page_limit`、`default_confidence` 实现已迁至 `shared/defaults.rs`，根文件仅保留 crate 内兼容出口。\n- `verify-team-package.mjs` 已跟随新的 `exchange/team_package/` 职责路径；保护资产验证继续使用冻结 verifier，本体与 18 个保护资产指纹未变。\n- Windows 专项 run `31236344727` 通过根出口、球队资料包、确定性保护资产验证，并生成最终实现提交 `62b1f622b9c14b33dbaac850812a49c063ccb090`。\n- 用户本机阶段回归未见报错；runtime 日志 `football-runtime-20260808T031048.796Z-pid28528-5d6458a8.jsonl` 共 58 条记录，全部为 `info`，`bootstrap` 返回 `connection_error=null`，并实际完成球队、阵容、分析、Postmatch 和 API 工作区读取。\n- R2-08 状态为 `DONE`，R2 阶段正式关闭。\n'''
              write(stage_readme, stage_text)

          task = 'docs/modular-rewrite/R02-domain-rewrite/R02-08-domain-根出口收敛.md'
          replace_once(task, '- 任务状态：`VERIFYING`', '- 任务状态：`DONE`')
          replace_once(task, '- 当前实现树：`4ef8d8ecc90bac4c39da7449de7ed2fa6de2fa5a`', '- 最终实现提交：`62b1f622b9c14b33dbaac850812a49c063ccb090`')
          replace_once(
              task,
              '- 365 个 `publicCompatibilityType` 全部继续保留 `football_domain::TypeName` 根级公共路径。',
              '- 365 个 `publicCompatibilityType` 全部继续保留 `football_domain::TypeName` 根级公共路径。\n- 为保持历史根 API，额外登记并显式 re-export 34 个既有公共常量/格式版本符号；公共根兼容不再依赖 glob export。',
          )
          replace_once(
              task,
              '源码切换和确定性静态门禁已经完成，当前进入 Windows 本机最小验证。仍需执行格式、根出口门禁、Serde、类型清单和架构验证；通过后再运行 protected assets、完整 frontend、完整 Rust 与 Tauri smoke。任一硬门禁失败即保持 `VERIFYING`。',
              '源码切换、确定性静态门禁和 Windows 本机阶段回归均已完成。Windows 专项 run `31236344727` 通过根出口、球队资料包和确定性保护资产门禁，并生成最终实现提交 `62b1f622b9c14b33dbaac850812a49c063ccb090`。用户按阶段回归执行后反馈未见报错；上传 runtime 日志 58 条记录全部为 `info`，`bootstrap` 的 `connection_error` 为 `null`，球队、阵容、分析、Postmatch 与 API 工作区读取均正常完成。R2-08 关闭为 `DONE`。',
          )
          replace_once(
              task,
              '- 根 README、阶段 README 与本记录同步实际结果。',
              '- 根 README、阶段 README 与本记录同步实际结果。\n\n以上完成标准均已满足；专用可清空 PostgreSQL 测试库基线和私有模型固定回归仍按阶段既有策略保留到最终统一验收，不在本节点伪报为已通过。',
          )

          completion = Path('docs/modular-rewrite/R02-domain-rewrite/R02-stage-completion.md')
          if completion.exists():
              raise SystemExit('R02-stage-completion.md already exists')
          completion.write_text('''# R02 Domain 完整重写阶段完成记录\n\n- 阶段状态：`DONE`\n- R2 开始前已验证基线：`274d689b9c4a3d3ce83c7006878a5508ca3f31d6`\n- R2-08 最终实现提交：`62b1f622b9c14b33dbaac850812a49c063ccb090`\n- 目标平台：Windows\n\n## 1. 阶段完成范围\n\n- R2-01：建立 365 个 Domain 公共兼容类型、Serde、数据库映射和调用链的机器清单。\n- R2-02：完成 Competition / Routing 领域职责迁移。\n- R2-03：完成 Team / Player / Coach / Formation / Shared 领域职责迁移。\n- R2-04：完成 Lineup / Match 领域职责迁移。\n- R2-05：完成 Prediction / Research 外围领域职责迁移，不触碰模型实现。\n- R2-06：完成 Review / Postmatch 领域职责迁移，并保持原有 PostgreSQL 历史数据兼容。\n- R2-07：完成 Analytics / Exchange / AI Workspace / Release 领域职责迁移。\n- R2-08：将 Domain 根出口收敛为显式组合根；删除公共 glob export 和根文件领域实现。\n- R2-01 至 R2-08 均已关闭为 `DONE`。\n\n## 2. 最终 Domain 边界\n\n- `crates/domain/src/lib.rs` 只保留 17 个业务模块声明、显式 re-export 和 crate 内默认值兼容出口。\n- 365 个公共兼容类型继续保持 `football_domain::TypeName` 根路径。\n- 34 个历史公共根常量/格式版本符号继续通过显式 re-export 保持兼容。\n- 公共根 glob re-export：0。\n- `default_true`、`default_team_page_limit`、`default_confidence` 的实现归属 `shared/defaults.rs`。\n- 旧职责混合根文件已按各原子任务删除，不保留双实现或复制版本。\n\n## 3. 验证结论\n\n- Domain 类型清单：365 个类型、365 个公共兼容类型、299 个 PostgreSQL 映射类型。\n- R2-07 Windows 本机：rustfmt、17/17 Serde、类型清单和架构门禁通过。\n- R2-08 Windows 专项 workflow run `31236344727`：根出口验证、球队资料包契约和确定性保护资产验证通过，并生成最终实现提交 `62b1f622b9c14b33dbaac850812a49c063ccb090`。\n- 模型公开保护边界保持不变；18 个冻结保护资产继续由原 verifier 指纹锁定，私有 P4/P7 资产未进入公开仓库。\n- 用户本机阶段回归未见报错。上传 runtime 日志 `football-runtime-20260808T031048.796Z-pid28528-5d6458a8.jsonl` 共 58 条记录，全部为 `info`；`bootstrap` 返回 `connection_error=null`。\n- runtime 实际完成球队列表/详情、阵容引用数据、分析概览、Postmatch 概览、OpenAI 配置与 API Workspace 预设/会话读取，未出现 `error`、`critical`、`panic`、migration 失败或 `new-match-competition` 缺失控件错误。\n\n## 4. 兼容性结论\n\n- 未改变已登记公共领域类型名、Serde 字段/枚举表示、optional/default 语义。\n- 未改变 Application/Tauri 公共调用边界、SQL Row 或数据库历史 JSON 语义。\n- 未修改生产依赖、模型实现、模型参数、Profile、私有 Schema/fixture/Golden Master。\n- R2-06 的历史数据库兼容路径继续 fail-closed，不清库、不覆盖未知 migration 历史。\n\n## 5. 延期到最终统一验收\n\n以下项目仍按阶段既有策略保留到最终统一验收，不描述为已通过：\n\n- 使用名称包含 `test` 的专用可清空 PostgreSQL 数据库执行完整 `run_database_baseline.mjs` 集成测试集合。\n- 私有 ModelProvider 环境中的 P4/P7 固定模型回归；公开仓只验证模型 API 与保护边界。\n- Windows Full 全交互验收。\n\n用户本机已验证原有 PostgreSQL 数据库可正常启动和读取代表性业务路径，该证据补充但不替代上述专用集成测试。\n\n## 6. 基线与下一阶段\n\n- R2 最终实现基线：`62b1f622b9c14b33dbaac850812a49c063ccb090`。\n- 不保留临时 workflow、临时生成脚本副本或并行 Domain 根实现。\n- R2 已完成并关闭；下一阶段可进入 R3 Application Ports 与 Service 重写，从 R3-01 端口设计开始。\n''', encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-root-exports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit stage closure
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/temp-r2-stage-close.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md architecture/domain-type-inventory.json docs/modular-rewrite/R02-domain-rewrite/README.md docs/modular-rewrite/R02-domain-rewrite/R02-08-domain-根出口收敛.md docs/modular-rewrite/R02-domain-rewrite/R02-stage-completion.md .github/workflows/temp-r2-stage-close.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'docs(r2): close domain rewrite stage'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
