name: R6-03 Closeout Doc Cleanup

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
    paths:
      - .github/workflows/r6-03-closeout-doc-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
      - name: Remove stale duplicate status line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = path.read_text(encoding='utf-8')
          stale = '- R6-01 与 R6-02 均已 `DONE`。\n'
          if text.count(stale) != 1:
              raise SystemExit(f'stale summary count={text.count(stale)}')
          path.write_text(text.replace(stale, '', 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          git rm .github/workflows/r6-03-closeout-doc-cleanup.yml
          changed="$(git status --short | awk '{print $2}')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(docs/modular-rewrite/R06-entity-catalog-persistence/README.md|\.github/workflows/r6-03-closeout-doc-cleanup.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modular-rewrite/R06-entity-catalog-persistence/README.md
          git commit -m "docs(r6-03): clean closeout index"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
