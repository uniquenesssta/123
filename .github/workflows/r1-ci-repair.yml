name: R1 CI contract repair

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - name: Align force-delete ownership contract with Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $catalogPath = "src-tauri/src/commands/catalog.rs"
          $catalog = [IO.File]::ReadAllText($catalogPath)
          $dropMatches = [regex]::Matches($catalog, '(?m)^    drop\(state\);\r?\n')
          if ($dropMatches.Count -ne 2) {
            throw "Expected exactly two explicit State drops, found $($dropMatches.Count)."
          }
          $catalog = [regex]::Replace($catalog, '(?m)^    drop\(state\);\r?\n', '')
          [IO.File]::WriteAllText($catalogPath, $catalog.Replace("`r`n", "`n"), $utf8NoBom)

          $verifierPath = "scripts/verify-force-team-delete.mjs"
          $lines = [Collections.Generic.List[string]]::new()
          foreach ($line in [IO.File]::ReadAllLines($verifierPath)) {
            [void]$lines.Add($line)
          }
          $dropIndex = -1
          for ($index = 0; $index -lt $lines.Count; $index += 1) {
            if ($lines[$index].Contains('source.includes("drop(state)")')) {
              $dropIndex = $index
              break
            }
          }
          if ($dropIndex -lt 0) {
            throw "Force-delete verifier drop assertion was not found."
          }
          if ($dropIndex + 1 -ge $lines.Count -or -not $lines[$dropIndex + 1].Contains('source.includes("tauri::async_runtime::spawn_blocking")')) {
            throw "Force-delete verifier isolation assertions have an unexpected shape."
          }
          $lines.RemoveAt($dropIndex + 1)
          $lines.RemoveAt($dropIndex)
          $replacement = @(
            '  const blockingStart = source.indexOf("tauri::async_runtime::spawn_blocking");',
            '  const blockingSource = blockingStart >= 0 ? source.slice(blockingStart) : "";',
            '  requireTrue(source.includes("tauri::async_runtime::spawn_blocking(move ||"), `强制清除${label}命令未隔离非Send长事务Future`);',
            '  requireTrue(',
            '    blockingSource.includes("service.") && !blockingSource.includes("state."),',
            '    `强制清除${label}阻塞事务仍捕获State借用`,',
            '  );'
          )
          for ($offset = $replacement.Count - 1; $offset -ge 0; $offset -= 1) {
            $lines.Insert($dropIndex, $replacement[$offset])
          }
          [IO.File]::WriteAllText($verifierPath, (($lines -join "`n") + "`n"), $utf8NoBom)

          $changed = @(git diff --name-only)
          $expected = @($catalogPath, $verifierPath)
          if ($changed.Count -ne 2 -or @($changed | Where-Object { $_ -notin $expected }).Count -ne 0) {
            throw "Unexpected repair scope: $($changed -join ', ')"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $catalogPath $verifierPath
          git commit -m "fix(ci): align state ownership verifier with Clippy"
          git push origin HEAD:new-B
