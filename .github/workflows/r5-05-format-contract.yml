name: R5-05 Format Contract

on:
  push:
    branches:
      - agent/r5-05-route-resolution
    paths:
      - ".github/workflows/r5-05-format-contract.yml"

permissions:
  contents: write

jobs:
  format-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-05-route-resolution
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format and verify scope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/persistence-postgres/tests/route_resolution_repository_contract.rs"
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/persistence-postgres/tests/route_resolution_repository_contract.rs
          git commit -m "test(r5-05): format route resolution contract"
          git push origin HEAD:agent/r5-05-route-resolution
