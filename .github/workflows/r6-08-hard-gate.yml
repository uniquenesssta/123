name: R6-08 hard gate

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
    paths-ignore:
      - .r6-08-hard-gate-result.json

permissions:
  contents: write

concurrency:
  group: r6-08-hard-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.88.0

    steps:
      - name: Checkout R6-08 implementation
        uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify hard-gate baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $implementation = "89dfbb101989116b5c858dbb8dc4564c50f86f9d"
          git merge-base --is-ancestor $implementation HEAD
          if ($LASTEXITCODE -ne 0) { throw "R6-08 implementation baseline is not an ancestor" }
          $changed = @(git diff --name-only "$implementation..HEAD" | Sort-Object)
          $expected = @(
            ".github/workflows/r6-08-hard-gate.yml",
            "scripts/verify-global-name-search.mjs"
          )
          if ($changed.Count -ne $expected.Count) {
            throw "Unexpected hard-gate diff count: $($changed -join ', ')"
          }
          for ($i = 0; $i -lt $expected.Count; $i++) {
            if ($changed[$i] -ne $expected[$i]) {
              throw "Unexpected hard-gate diff: $($changed -join ', ')"
            }
          }
          if (Test-Path ".r6-08-hard-gate-result.json") { throw "stale hard-gate result exists" }
          if (Test-Path ".r6-08") { throw "stale R6-08 helper directory exists" }
          if (Test-Path ".r6-08-failure.txt") { throw "stale R6-08 failure file exists" }
          if (Test-Path ".github/workflows/r6-08-bootstrap.yml") { throw "stale bootstrap workflow exists" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Prepare locked Node dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/ensure-node-dependencies.mjs --install-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend stage regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rustfmt stage regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Workspace Clippy -D warnings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Workspace tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Final Windows diff hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  postgres-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football_test
          POSTGRES_PASSWORD: football_test
          POSTGRES_DB: football_r6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football_test -d football_r6_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgresql://football_test:football_test@127.0.0.1:5432/football_r6_test
      RUSTUP_TOOLCHAIN: 1.88.0

    steps:
      - name: Checkout R6-08 implementation
        uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify hard-gate baseline
        shell: bash
        run: |
          set -euo pipefail
          implementation="89dfbb101989116b5c858dbb8dc4564c50f86f9d"
          git merge-base --is-ancestor "$implementation" HEAD
          mapfile -t changed < <(git diff --name-only "$implementation"..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/r6-08-hard-gate.yml"
          test "${changed[1]}" = "scripts/verify-global-name-search.mjs"
          test ! -e .r6-08-hard-gate-result.json
          test ! -e .r6-08
          test ! -e .r6-08-failure.txt
          test ! -e .github/workflows/r6-08-bootstrap.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          rustc --version
          cargo --version
          node --version

      - name: Verify official inventory and R6-08 ownership
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-domain-type-inventory.mjs
          git diff --exit-code -- architecture/domain-type-inventory.json
          node scripts/verify-entity-matching-references-persistence.mjs
          node scripts/verify-coach-formation-persistence.mjs
          node scripts/verify-entity-relationships.mjs
          npm run verify:architecture
          node scripts/verify-protected-assets-deterministic.mjs
          node scripts/verify_database_baseline.mjs
          node scripts/run_database_baseline.mjs --dry-run

      - name: R6-03 PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test player_directory_detail_repository_contract -- --ignored --test-threads=1

      - name: R6-04 PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test player_names_positions_repository_contract -- --ignored --test-threads=1

      - name: R6-05 PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test player_team_periods_availability_repository_contract -- --ignored --test-threads=1

      - name: R6-06 PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test player_abilities_dynamic_tags_repository_contract -- --ignored --test-threads=1

      - name: R6-07 PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test coach_formation_repository_contract -- --ignored --test-threads=1

      - name: R6-08 PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test entity_matching_references_repository_contract -- --ignored --test-threads=1

      - name: Final PostgreSQL diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- architecture/domain-type-inventory.json

  record-result:
    if: always() && github.actor != 'github-actions[bot]'
    needs:
      - windows-stage
      - postgres-contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record R6-08 hard-gate result
        shell: bash
        env:
          WINDOWS_STAGE: ${{ needs.windows-stage.result }}
          POSTGRES_CONTRACTS: ${{ needs.postgres-contracts.result }}
        run: |
          set -euo pipefail
          status=failure
          if [ "$WINDOWS_STAGE" = "success" ] && [ "$POSTGRES_CONTRACTS" = "success" ]; then
            status=success
          fi
          cat > .r6-08-hard-gate-result.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "source_sha": "${GITHUB_SHA}",
            "windows_stage": "${WINDOWS_STAGE}",
            "postgres_contracts": "${POSTGRES_CONTRACTS}",
            "status": "${status}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .r6-08-hard-gate-result.json
          git commit -m "chore(r6-08): record hard gate ${status}"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
