name: R3-06 P4 Freeze Execution Migration

on:
  push:
    branches:
      - rewrite/r3-06-prediction-service

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-06-prediction-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Generate Atomic Task 2B
        shell: pwsh
        run: |
          python scripts/r3-06-phase2b.py
          python scripts/r3-06-phase2b-docs.py
      - name: Format and refresh derived inventory
        shell: pwsh
        run: |
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
      - name: Validate Atomic Task 2B
        shell: pwsh
        run: |
          node scripts/verify-r3-06-p4-freeze.mjs
          node scripts/verify-application-ports.mjs
          npm run verify:architecture
          cargo fmt --all -- --check
          cargo check --locked -p football-application
          cargo test --locked -p football-application
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Commit clean Atomic Task 2B
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-06-phase2b.yml
          git rm -f scripts/r3-06-phase2b.py
          git rm -f scripts/r3-06-phase2b-docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "refactor(r3): migrate P4 freeze execution"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-06-prediction-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
