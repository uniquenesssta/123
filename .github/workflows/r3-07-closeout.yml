name: R3-07 Closeout

on:
  push:
    branches:
      - agent/r3-07-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update closeout records
        shell: pwsh
        run: python scripts/r3-07-closeout.py

      - name: Verify Research Service
        shell: pwsh
        run: node scripts/verify-research-service.mjs

      - name: Verify full architecture
        shell: pwsh
        run: npm run verify:architecture

      - name: Verify closeout diff
        shell: pwsh
        run: |
          $files = git diff --name-only
          $allowed = @(
            'README.md',
            'docs/modular-rewrite/R03-application-services/README.md'
          )
          foreach ($file in $files) {
            if ($allowed -notcontains $file) {
              throw "Unexpected closeout change: $file"
            }
          }
          foreach ($file in $allowed) {
            if ($files -notcontains $file) {
              throw "Expected closeout change missing: $file"
            }
          }

      - name: Commit clean closeout
        shell: pwsh
        run: |
          Remove-Item .github/workflows/r3-07-closeout.yml
          Remove-Item scripts/r3-07-closeout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R03-application-services/README.md .github/workflows/r3-07-closeout.yml scripts/r3-07-closeout.py
          git diff --cached --check
          git commit -m "docs(r3): close Research Service"
          git push origin HEAD:agent/r3-07-closeout
