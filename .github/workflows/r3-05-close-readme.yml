name: R3 05 Close Readme

on:
  push:
    branches:
      - rewrite/r3-05-lineups-service
    paths:
      - scripts/r3-05-close-readme.ps1
      - .github/workflows/r3-05-close-readme.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-05-lineups-service
          fetch-depth: 0
      - shell: pwsh
        run: .\scripts\r3-05-close-readme.ps1
