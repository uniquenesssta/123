          const teamFacade=read("crates/application/src/services/teams/facade.rs"); const playerFacade=read("crates/application/src/services/players/facade.rs"); const app=read("crates/application/src/service/application_service.rs"); const composition=read("crates/application/src/composition/application_composition.rs"); const registry=read("crates/application/src/composition/port_registry.rs"); const transitional=read("crates/application/src/player_catalog.rs"); const tauri=read("src-tauri/src/commands/catalog.rs"); const packageJson=JSON.parse(read("package.json")); const frontend=read("scripts/verify-frontend.mjs");
