name: Temporary R3-04 Implement

on:
  push:
    branches: [rewrite/r3-04-teams-players]
    paths: [.github/workflows/temp-r3-04-implement.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-04-teams-players
          fetch-depth: 0
      - name: Generate Teams and Players Services
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + "\n", encoding="utf-8", newline="\n")

          def simple_uc(path, port_import, trait, domain_imports, signature, call):
              domain = f"use football_domain::{{{domain_imports}}};\n" if domain_imports else ""
              write(path, f'''use crate::{{ports::{port_import}::{trait}, ApplicationResult}};
          {domain}
          pub(crate) async fn execute<P>({signature}) -> ApplicationResult<_>
          where
              P: {trait} + ?Sized,
          {{
              Ok({call}.await?)
          }}'''.replace('ApplicationResult<_>', '__RETURN__'))

          # Teams use cases: explicit files keep each responsibility independently testable.
          team_files = {
          'create_team': '''use crate::{ports::team::TeamCatalogPort, ApplicationResult};
          use football_domain::{TeamDraft, TeamRecord};
          pub(crate) async fn execute<P>(port: &P, draft: TeamDraft) -> ApplicationResult<TeamRecord>
          where P: TeamCatalogPort + ?Sized { Ok(port.create_team(&draft).await?) }''',
          'list_team_options': '''use crate::{ports::team::TeamCatalogPort, ApplicationResult};
          use football_domain::TeamOption;
          pub(crate) async fn execute<P>(port: &P, search: Option<String>, limit: u32) -> ApplicationResult<Vec<TeamOption>>
          where P: TeamCatalogPort + ?Sized { Ok(port.list_team_options(search.as_deref(), limit).await?) }''',
          'list_teams': '''use crate::{ports::team::TeamCatalogPort, ApplicationResult};
          use football_domain::{TeamListPage, TeamListQuery};
          pub(crate) async fn execute<P>(port: &P, query: TeamListQuery) -> ApplicationResult<TeamListPage>
          where P: TeamCatalogPort + ?Sized { Ok(port.list_teams(&query).await?) }''',
          'read_team': '''use crate::{ports::team::TeamCatalogPort, ApplicationResult};
          use football_domain::TeamDetail;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, team_id: Uuid) -> ApplicationResult<TeamDetail>
          where P: TeamCatalogPort + ?Sized { Ok(port.read_team(team_id).await?) }''',
          'update_team': '''use crate::{ports::team::TeamCatalogPort, ApplicationResult};
          use football_domain::{TeamDraft, TeamRecord};
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, team_id: Uuid, draft: TeamDraft) -> ApplicationResult<TeamRecord>
          where P: TeamCatalogPort + ?Sized { Ok(port.update_team(team_id, &draft).await?) }''',
          'add_team_name': '''use crate::{ports::team::TeamCatalogPort, ApplicationResult};
          use football_domain::{TeamNameDraft, TeamNameRecord};
          pub(crate) async fn execute<P>(port: &P, draft: TeamNameDraft) -> ApplicationResult<TeamNameRecord>
          where P: TeamCatalogPort + ?Sized { Ok(port.add_team_name(&draft).await?) }''',
          'upsert_team_profile': '''use crate::{ports::team::TeamCatalogPort, ApplicationResult};
          use football_domain::{TeamProfileDraft, TeamProfileRecord};
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, team_id: Uuid, draft: TeamProfileDraft) -> ApplicationResult<TeamProfileRecord>
          where P: TeamCatalogPort + ?Sized { Ok(port.upsert_team_profile(team_id, &draft).await?) }''',
          'bulk_delete_teams': '''use crate::{ports::team::TeamLifecyclePort, ApplicationResult};
          use football_domain::BulkDeleteResult;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, team_ids: Vec<Uuid>) -> ApplicationResult<BulkDeleteResult>
          where P: TeamLifecyclePort + ?Sized { Ok(port.bulk_delete_teams(&team_ids).await?) }''',
          'preview_force_delete_team': '''use crate::{ports::team::TeamLifecyclePort, ApplicationResult};
          use football_domain::TeamForceDeletePreview;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, team_id: Uuid) -> ApplicationResult<TeamForceDeletePreview>
          where P: TeamLifecyclePort + ?Sized { Ok(port.preview_force_delete_team(team_id).await?) }''',
          'force_delete_team': '''use crate::{ports::team::TeamLifecyclePort, ApplicationResult};
          use football_domain::{TeamForceDeleteRequest, TeamForceDeleteResult};
          pub(crate) async fn execute<P>(port: &P, request: TeamForceDeleteRequest) -> ApplicationResult<TeamForceDeleteResult>
          where P: TeamLifecyclePort + ?Sized { Ok(port.force_delete_team(&request).await?) }''',
          }
          for name, content in team_files.items():
              write(f'crates/application/src/use_cases/teams/{name}/mod.rs', content)
          write('crates/application/src/use_cases/teams/mod.rs', '\n'.join(f'pub(crate) mod {name};' for name in team_files))

          player_files = {
          'reference_data': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::PlayerCatalogReferenceData;
          pub(crate) async fn execute<P>(port: &P) -> ApplicationResult<PlayerCatalogReferenceData>
          where P: PlayerCatalogPort + ?Sized { Ok(port.reference_data().await?) }''',
          'create_player': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::{PlayerDraft, PlayerRecord};
          pub(crate) async fn execute<P>(port: &P, draft: PlayerDraft) -> ApplicationResult<PlayerRecord>
          where P: PlayerCatalogPort + ?Sized { Ok(port.create_player(&draft).await?) }''',
          'update_player': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::{PlayerDraft, PlayerRecord};
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, player_id: Uuid, draft: PlayerDraft) -> ApplicationResult<PlayerRecord>
          where P: PlayerCatalogPort + ?Sized { Ok(port.update_player(player_id, &draft).await?) }''',
          'delete_player': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, player_id: Uuid) -> ApplicationResult<()>
          where P: PlayerCatalogPort + ?Sized { Ok(port.delete_player(player_id).await?) }''',
          'bulk_delete_players': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::BulkDeleteResult;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, player_ids: Vec<Uuid>) -> ApplicationResult<BulkDeleteResult>
          where P: PlayerCatalogPort + ?Sized { Ok(port.bulk_delete_players(&player_ids).await?) }''',
          'list_players': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::{PlayerListPage, PlayerListQuery};
          pub(crate) async fn execute<P>(port: &P, query: PlayerListQuery) -> ApplicationResult<PlayerListPage>
          where P: PlayerCatalogPort + ?Sized { Ok(port.list_players(&query).await?) }''',
          'read_player': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::PlayerDetail;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, player_id: Uuid) -> ApplicationResult<PlayerDetail>
          where P: PlayerCatalogPort + ?Sized { Ok(port.read_player(player_id).await?) }''',
          'add_player_name': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::{PlayerNameDraft, PlayerNameRecord};
          pub(crate) async fn execute<P>(port: &P, draft: PlayerNameDraft) -> ApplicationResult<PlayerNameRecord>
          where P: PlayerCatalogPort + ?Sized { Ok(port.add_player_name(&draft).await?) }''',
          'assign_player_position': '''use crate::{ports::player::PlayerCatalogPort, ApplicationResult};
          use football_domain::{PlayerPositionDraft, PlayerPositionRecord};
          pub(crate) async fn execute<P>(port: &P, draft: PlayerPositionDraft) -> ApplicationResult<PlayerPositionRecord>
          where P: PlayerCatalogPort + ?Sized { Ok(port.assign_player_position(&draft).await?) }''',
          'add_player_team_period': '''use crate::{ports::player::PlayerCatalogPort, ApplicationError, ApplicationResult};
          use football_domain::{PlayerTeamPeriodDraft, PlayerTeamPeriodRecord};
          const ALLOWED_REGISTRATION_STATUSES: [&str; 5] = ["registered", "loan", "trial", "released", "unknown"];
          pub(crate) async fn execute<P>(port: &P, draft: PlayerTeamPeriodDraft) -> ApplicationResult<PlayerTeamPeriodRecord>
          where P: PlayerCatalogPort + ?Sized {
              validate_registration_status(&draft.registration_status)?;
              Ok(port.add_player_team_period(&draft).await?)
          }
          fn validate_registration_status(status: &str) -> ApplicationResult<()> {
              if ALLOWED_REGISTRATION_STATUSES.contains(&status) { return Ok(()); }
              Err(ApplicationError::Validation(format!("未知注册状态：{status}")))
          }
          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn registration_status_contract_is_preserved() {
                  for status in ALLOWED_REGISTRATION_STATUSES { assert!(validate_registration_status(status).is_ok()); }
                  assert_eq!(validate_registration_status("invalid").unwrap_err().to_string(), "赛事或规则包输入无效：未知注册状态：invalid");
              }
          }''',
          'add_player_availability': '''use crate::{ports::player::PlayerSignalPort, ApplicationResult};
          use football_domain::{PlayerAvailabilityDraft, PlayerAvailabilityRecord};
          pub(crate) async fn execute<P>(port: &P, draft: PlayerAvailabilityDraft) -> ApplicationResult<PlayerAvailabilityRecord>
          where P: PlayerSignalPort + ?Sized { Ok(port.add_availability(&draft).await?) }''',
          'add_player_ability_observation': '''use crate::{ports::player::PlayerSignalPort, ApplicationError, ApplicationResult};
          use football_domain::{PlayerAbilityObservationDraft, PlayerAbilityObservationRecord};
          pub(crate) async fn execute<P>(port: &P, draft: PlayerAbilityObservationDraft) -> ApplicationResult<PlayerAbilityObservationRecord>
          where P: PlayerSignalPort + ?Sized {
              validate_calculation_version(&draft.calculation_version)?;
              Ok(port.add_ability_observation(&draft).await?)
          }
          fn validate_calculation_version(version: &str) -> ApplicationResult<()> {
              if !version.trim().is_empty() { return Ok(()); }
              Err(ApplicationError::Validation("能力观察必须提供 calculation_version".to_string()))
          }
          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn calculation_version_remains_required() {
                  assert!(validate_calculation_version("v1").is_ok());
                  assert_eq!(validate_calculation_version("   ").unwrap_err().to_string(), "赛事或规则包输入无效：能力观察必须提供 calculation_version");
              }
          }''',
          'add_player_dynamic_tag': '''use crate::{ports::player::PlayerSignalPort, ApplicationResult};
          use football_domain::{PlayerDynamicTagDraft, PlayerDynamicTagRecord};
          pub(crate) async fn execute<P>(port: &P, draft: PlayerDynamicTagDraft) -> ApplicationResult<PlayerDynamicTagRecord>
          where P: PlayerSignalPort + ?Sized { Ok(port.add_dynamic_tag(&draft).await?) }''',
          'calculate_player_match_contribution': '''use crate::{ports::player::PlayerSignalPort, ApplicationResult};
          use football_domain::{PlayerMatchContribution, PlayerMatchContributionRequest};
          pub(crate) async fn execute<P>(port: &P, request: PlayerMatchContributionRequest) -> ApplicationResult<PlayerMatchContribution>
          where P: PlayerSignalPort + ?Sized { Ok(port.calculate_match_contribution(&request).await?) }''',
          'create_coach': '''use crate::{ports::player::CoachCatalogPort, ApplicationResult};
          use football_domain::{CoachDraft, CoachRecord};
          pub(crate) async fn execute<P>(port: &P, draft: CoachDraft) -> ApplicationResult<CoachRecord>
          where P: CoachCatalogPort + ?Sized { Ok(port.create_coach(&draft).await?) }''',
          'list_coaches': '''use crate::{ports::player::CoachCatalogPort, ApplicationResult};
          use football_domain::{CoachListItem, CoachListQuery};
          pub(crate) async fn execute<P>(port: &P, query: CoachListQuery) -> ApplicationResult<Vec<CoachListItem>>
          where P: CoachCatalogPort + ?Sized { Ok(port.list_coaches(&query).await?) }''',
          'read_coach': '''use crate::{ports::player::CoachCatalogPort, ApplicationResult};
          use football_domain::CoachDetail;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, coach_id: Uuid) -> ApplicationResult<CoachDetail>
          where P: CoachCatalogPort + ?Sized { Ok(port.read_coach(coach_id).await?) }''',
          'add_coach_name': '''use crate::{ports::player::CoachCatalogPort, ApplicationResult};
          use football_domain::{CoachNameDraft, CoachNameRecord};
          pub(crate) async fn execute<P>(port: &P, draft: CoachNameDraft) -> ApplicationResult<CoachNameRecord>
          where P: CoachCatalogPort + ?Sized { Ok(port.add_coach_name(&draft).await?) }''',
          'add_team_coach_period': '''use crate::{ports::player::CoachCatalogPort, ApplicationResult};
          use football_domain::{TeamCoachPeriodDraft, TeamCoachPeriodRecord};
          pub(crate) async fn execute<P>(port: &P, draft: TeamCoachPeriodDraft) -> ApplicationResult<TeamCoachPeriodRecord>
          where P: CoachCatalogPort + ?Sized { Ok(port.add_team_coach_period(&draft).await?) }''',
          'list_entity_references': '''use crate::{ports::player::EntityReferencePort, ApplicationResult};
          use football_domain::{EntityReferenceQuery, EntityReferenceRecord};
          pub(crate) async fn execute<P>(port: &P, query: EntityReferenceQuery) -> ApplicationResult<Vec<EntityReferenceRecord>>
          where P: EntityReferencePort + ?Sized { Ok(port.list_references(&query).await?) }''',
          'resolve_entity_reference': '''use crate::{ports::player::EntityReferencePort, ApplicationResult};
          use football_domain::{EntityMatchRequest, EntityMatchResult};
          pub(crate) async fn execute<P>(port: &P, request: EntityMatchRequest) -> ApplicationResult<EntityMatchResult>
          where P: EntityReferencePort + ?Sized { Ok(port.resolve_reference(&request).await?) }''',
          'check_entity_deletion': '''use crate::{ports::player::EntityReferencePort, ApplicationResult};
          use football_domain::EntityDeletionCheck;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, entity_type: String, entity_id: Uuid) -> ApplicationResult<EntityDeletionCheck>
          where P: EntityReferencePort + ?Sized { Ok(port.check_deletion(&entity_type, entity_id).await?) }''',
          'bulk_archive_entities': '''use crate::{ports::player::EntityReferencePort, ApplicationResult};
          use football_domain::BulkArchiveResult;
          use uuid::Uuid;
          pub(crate) async fn execute<P>(port: &P, entity_type: String, entity_ids: Vec<Uuid>) -> ApplicationResult<BulkArchiveResult>
          where P: EntityReferencePort + ?Sized { Ok(port.bulk_archive(&entity_type, &entity_ids).await?) }''',
          'create_data_provider': '''use crate::{ports::player::EntityReferencePort, ApplicationResult};
          use football_domain::{DataProviderDraft, DataProviderRecord};
          pub(crate) async fn execute<P>(port: &P, draft: DataProviderDraft) -> ApplicationResult<DataProviderRecord>
          where P: EntityReferencePort + ?Sized { Ok(port.create_data_provider(&draft).await?) }''',
          'add_external_entity_id': '''use crate::{ports::player::EntityReferencePort, ApplicationResult};
          use football_domain::{ExternalEntityIdDraft, ExternalEntityIdRecord};
          pub(crate) async fn execute<P>(port: &P, draft: ExternalEntityIdDraft) -> ApplicationResult<ExternalEntityIdRecord>
          where P: EntityReferencePort + ?Sized { Ok(port.add_external_id(&draft).await?) }''',
          }
          for name, content in player_files.items():
              write(f'crates/application/src/use_cases/players/{name}/mod.rs', content)
          write('crates/application/src/use_cases/players/mod.rs', '\n'.join(f'pub(crate) mod {name};' for name in player_files))

          write('crates/application/src/services/teams/mod.rs', '''mod facade;
          mod service;
          pub(crate) use service::TeamService;''')
          write('crates/application/src/services/teams/service.rs', '''use crate::{
              ports::team::{TeamCatalogPort, TeamLifecyclePort},
              use_cases::teams::{add_team_name, bulk_delete_teams, create_team, force_delete_team, list_team_options, list_teams, preview_force_delete_team, read_team, update_team, upsert_team_profile},
              ApplicationResult,
          };
          use football_domain::{BulkDeleteResult, TeamDetail, TeamDraft, TeamForceDeletePreview, TeamForceDeleteRequest, TeamForceDeleteResult, TeamListPage, TeamListQuery, TeamNameDraft, TeamNameRecord, TeamOption, TeamProfileDraft, TeamProfileRecord, TeamRecord};
          use uuid::Uuid;
          pub(crate) struct TeamService;
          impl TeamService {
              pub(crate) fn new() -> Self { Self }
              pub(crate) async fn create_team<P: TeamCatalogPort + ?Sized>(&self, port: &P, draft: TeamDraft) -> ApplicationResult<TeamRecord> { create_team::execute(port, draft).await }
              pub(crate) async fn list_team_options<P: TeamCatalogPort + ?Sized>(&self, port: &P, search: Option<String>, limit: u32) -> ApplicationResult<Vec<TeamOption>> { list_team_options::execute(port, search, limit).await }
              pub(crate) async fn list_teams<P: TeamCatalogPort + ?Sized>(&self, port: &P, query: TeamListQuery) -> ApplicationResult<TeamListPage> { list_teams::execute(port, query).await }
              pub(crate) async fn read_team<P: TeamCatalogPort + ?Sized>(&self, port: &P, team_id: Uuid) -> ApplicationResult<TeamDetail> { read_team::execute(port, team_id).await }
              pub(crate) async fn update_team<P: TeamCatalogPort + ?Sized>(&self, port: &P, team_id: Uuid, draft: TeamDraft) -> ApplicationResult<TeamRecord> { update_team::execute(port, team_id, draft).await }
              pub(crate) async fn add_team_name<P: TeamCatalogPort + ?Sized>(&self, port: &P, draft: TeamNameDraft) -> ApplicationResult<TeamNameRecord> { add_team_name::execute(port, draft).await }
              pub(crate) async fn upsert_team_profile<P: TeamCatalogPort + ?Sized>(&self, port: &P, team_id: Uuid, draft: TeamProfileDraft) -> ApplicationResult<TeamProfileRecord> { upsert_team_profile::execute(port, team_id, draft).await }
              pub(crate) async fn bulk_delete_teams<P: TeamLifecyclePort + ?Sized>(&self, port: &P, team_ids: Vec<Uuid>) -> ApplicationResult<BulkDeleteResult> { bulk_delete_teams::execute(port, team_ids).await }
              pub(crate) async fn preview_force_delete_team<P: TeamLifecyclePort + ?Sized>(&self, port: &P, team_id: Uuid) -> ApplicationResult<TeamForceDeletePreview> { preview_force_delete_team::execute(port, team_id).await }
              pub(crate) async fn force_delete_team<P: TeamLifecyclePort + ?Sized>(&self, port: &P, request: TeamForceDeleteRequest) -> ApplicationResult<TeamForceDeleteResult> { force_delete_team::execute(port, request).await }
          }''')
          write('crates/application/src/services/teams/facade.rs', '''use crate::{ApplicationError, ApplicationResult, ApplicationService};
          use football_domain::{BulkDeleteResult, TeamDetail, TeamDraft, TeamForceDeletePreview, TeamForceDeleteRequest, TeamForceDeleteResult, TeamListPage, TeamListQuery, TeamNameDraft, TeamNameRecord, TeamOption, TeamProfileDraft, TeamProfileRecord, TeamRecord};
          use uuid::Uuid;
          impl ApplicationService {
              async fn team_session(&self) -> ApplicationResult<crate::composition::ActiveDatabase> { self.database.active_session().await.ok_or(ApplicationError::DatabaseNotConnected) }
              pub async fn create_team(&self, draft: TeamDraft) -> ApplicationResult<TeamRecord> { let session = self.team_session().await?; self.teams.create_team(&session, draft).await }
              pub async fn list_team_options(&self, search: Option<String>, limit: u32) -> ApplicationResult<Vec<TeamOption>> { let session = self.team_session().await?; self.teams.list_team_options(&session, search, limit).await }
              pub async fn list_teams(&self, query: TeamListQuery) -> ApplicationResult<TeamListPage> { let session = self.team_session().await?; self.teams.list_teams(&session, query).await }
              pub async fn read_team(&self, team_id: Uuid) -> ApplicationResult<TeamDetail> { let session = self.team_session().await?; self.teams.read_team(&session, team_id).await }
              pub async fn update_team(&self, team_id: Uuid, draft: TeamDraft) -> ApplicationResult<TeamRecord> { let session = self.team_session().await?; self.teams.update_team(&session, team_id, draft).await }
              pub async fn add_team_name(&self, draft: TeamNameDraft) -> ApplicationResult<TeamNameRecord> { let session = self.team_session().await?; self.teams.add_team_name(&session, draft).await }
              pub async fn upsert_team_profile(&self, team_id: Uuid, draft: TeamProfileDraft) -> ApplicationResult<TeamProfileRecord> { let session = self.team_session().await?; self.teams.upsert_team_profile(&session, team_id, draft).await }
              pub async fn bulk_delete_teams(&self, team_ids: Vec<Uuid>) -> ApplicationResult<BulkDeleteResult> { let session = self.team_session().await?; self.teams.bulk_delete_teams(&session, team_ids).await }
              pub async fn preview_force_delete_team(&self, team_id: Uuid) -> ApplicationResult<TeamForceDeletePreview> { let session = self.team_session().await?; self.teams.preview_force_delete_team(&session, team_id).await }
              pub async fn force_delete_team(&self, request: TeamForceDeleteRequest) -> ApplicationResult<TeamForceDeleteResult> { let session = self.team_session().await?; self.teams.force_delete_team(&session, request).await }
          }''')

          write('crates/application/src/services/players/mod.rs', '''mod facade;
          mod service;
          pub(crate) use service::PlayerService;''')
          write('crates/application/src/services/players/service.rs', '''use crate::{
              ports::player::{CoachCatalogPort, EntityReferencePort, PlayerCatalogPort, PlayerSignalPort},
              use_cases::players::{add_coach_name, add_external_entity_id, add_player_ability_observation, add_player_availability, add_player_dynamic_tag, add_player_name, add_player_team_period, add_team_coach_period, assign_player_position, bulk_archive_entities, bulk_delete_players, calculate_player_match_contribution, check_entity_deletion, create_coach, create_data_provider, create_player, delete_player, list_coaches, list_entity_references, list_players, read_coach, read_player, reference_data, resolve_entity_reference, update_player},
              ApplicationResult,
          };
          use football_domain::{BulkArchiveResult, BulkDeleteResult, CoachDetail, CoachDraft, CoachListItem, CoachListQuery, CoachNameDraft, CoachNameRecord, CoachRecord, DataProviderDraft, DataProviderRecord, EntityDeletionCheck, EntityMatchRequest, EntityMatchResult, EntityReferenceQuery, EntityReferenceRecord, ExternalEntityIdDraft, ExternalEntityIdRecord, PlayerAbilityObservationDraft, PlayerAbilityObservationRecord, PlayerAvailabilityDraft, PlayerAvailabilityRecord, PlayerCatalogReferenceData, PlayerDetail, PlayerDraft, PlayerDynamicTagDraft, PlayerDynamicTagRecord, PlayerListPage, PlayerListQuery, PlayerMatchContribution, PlayerMatchContributionRequest, PlayerNameDraft, PlayerNameRecord, PlayerPositionDraft, PlayerPositionRecord, PlayerRecord, PlayerTeamPeriodDraft, PlayerTeamPeriodRecord, TeamCoachPeriodDraft, TeamCoachPeriodRecord};
          use uuid::Uuid;
          pub(crate) struct PlayerService;
          impl PlayerService {
              pub(crate) fn new() -> Self { Self }
              pub(crate) async fn reference_data<P: PlayerCatalogPort + ?Sized>(&self, port: &P) -> ApplicationResult<PlayerCatalogReferenceData> { reference_data::execute(port).await }
              pub(crate) async fn create_player<P: PlayerCatalogPort + ?Sized>(&self, port: &P, draft: PlayerDraft) -> ApplicationResult<PlayerRecord> { create_player::execute(port, draft).await }
              pub(crate) async fn update_player<P: PlayerCatalogPort + ?Sized>(&self, port: &P, player_id: Uuid, draft: PlayerDraft) -> ApplicationResult<PlayerRecord> { update_player::execute(port, player_id, draft).await }
              pub(crate) async fn delete_player<P: PlayerCatalogPort + ?Sized>(&self, port: &P, player_id: Uuid) -> ApplicationResult<()> { delete_player::execute(port, player_id).await }
              pub(crate) async fn bulk_delete_players<P: PlayerCatalogPort + ?Sized>(&self, port: &P, player_ids: Vec<Uuid>) -> ApplicationResult<BulkDeleteResult> { bulk_delete_players::execute(port, player_ids).await }
              pub(crate) async fn list_players<P: PlayerCatalogPort + ?Sized>(&self, port: &P, query: PlayerListQuery) -> ApplicationResult<PlayerListPage> { list_players::execute(port, query).await }
              pub(crate) async fn read_player<P: PlayerCatalogPort + ?Sized>(&self, port: &P, player_id: Uuid) -> ApplicationResult<PlayerDetail> { read_player::execute(port, player_id).await }
              pub(crate) async fn add_player_name<P: PlayerCatalogPort + ?Sized>(&self, port: &P, draft: PlayerNameDraft) -> ApplicationResult<PlayerNameRecord> { add_player_name::execute(port, draft).await }
