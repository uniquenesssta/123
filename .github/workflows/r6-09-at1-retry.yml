  windows-stage:
    needs: implement
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.sha }}
          path: 项目源码
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Stage regression
        shell: pwsh
        working-directory: 项目源码
        run: |
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

  postgres-contract:
    needs: implement
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://football:football@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: R6-09 PostgreSQL 16 contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test entity_deletion_repository_contract -- --ignored --nocapture
          git diff --check

  record-result:
    needs: [implement, windows-stage, postgres-contract]
    if: always() && needs.implement.result == 'success' && needs.windows-stage.result == 'success' && needs.postgres-contract.result == 'success'
