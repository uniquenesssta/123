      - name: Verify and commit R6-08 closeout
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/r6-08-closeout.log) 2>&1
          node scripts/verify-entity-matching-references-persistence.mjs
          node scripts/verify-coach-formation-persistence.mjs
          node scripts/verify-entity-relationships.mjs
          node scripts/verify-global-name-search.mjs
          git diff --check
          grep -F '| R6-08 | Entity Matching 与 References | DONE |' docs/modular-rewrite/R06-entity-catalog-persistence/README.md
          grep -F '| R6-09 | Archive / Delete / Force Delete | READY |' docs/modular-rewrite/R06-entity-catalog-persistence/README.md
