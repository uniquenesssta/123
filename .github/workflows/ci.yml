name: Public Platform CI

on:
  push:
    branches:
      - main
      - "new-*"
      - "rewrite/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-automated-delivery-gate:
    name: Windows automated delivery gate
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache

    steps:
      - name: Checkout repository in acceptance layout
        uses: actions/checkout@v4
        with:
          path: 项目源码
          ref: agent/r3-09-at2-builder

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Apply rustfmt to AT2 Exchange scope
        shell: pwsh
        working-directory: 项目源码
        run: |
          cargo fmt --all
          $changed = @(git diff --name-only)
          $allowedExact = @(
            "crates/application/src/lib.rs",
            "crates/application/src/ports/exchange/mod.rs"
          )
          $allowedPrefixes = @(
            "crates/application/src/composition/adapters/exchange/",
            "crates/application/src/services/exchange/",
            "crates/application/src/use_cases/exchange/"
          )
          $unexpected = @()
          foreach ($file in $changed) {
            $allowed = $allowedExact -contains $file
            if (-not $allowed) {
              foreach ($prefix in $allowedPrefixes) {
                if ($file.StartsWith($prefix)) { $allowed = $true; break }
              }
            }
            if (-not $allowed) { $unexpected += $file }
          }
          if ($unexpected.Count -gt 0) {
            Write-Error ("rustfmt touched files outside AT2 scope: " + ($unexpected -join ", "))
            exit 1
          }
          if ($changed.Count -eq 0) {
            Write-Host "No rustfmt changes required."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $changed
          git commit -m "style(r3-09): apply rustfmt to exchange modules"
          git push origin HEAD:agent/r3-09-at2-builder

      - name: Verify architecture after formatting
        shell: pwsh
        working-directory: 项目源码
        run: npm run verify:architecture

      - name: Verify Rust after formatting
        shell: pwsh
        working-directory: 项目源码
        run: npm run verify:rust
