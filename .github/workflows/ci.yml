name: Public Platform CI

on:
  push:
    branches:
      - main
      - "new-*"
      - "rewrite/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-automated-delivery-gate:
    name: Windows automated delivery gate
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository in acceptance layout
        uses: actions/checkout@v4
        with:
          path: 项目源码

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 项目源码 -> ../.cargo-target

      - name: Verify R1 architecture contract JSON
        shell: powershell
        working-directory: 项目源码
        run: |
          $module = Get-Content -Raw -Encoding UTF8 architecture/module-boundaries.json | ConvertFrom-Json
          $state = Get-Content -Raw -Encoding UTF8 architecture/state-ownership.json | ConvertFrom-Json

          if ($module.contract_id -ne "football.module-boundaries.v1") {
            throw "模块边界契约 ID 不匹配。"
          }
          if ($state.contract_id -ne "football.state-ownership.v1") {
            throw "状态所有权契约 ID 不匹配。"
          }
          if ($module.policy.state_contract -ne "architecture/state-ownership.json") {
            throw "模块契约未引用状态所有权契约。"
          }

          $featureCount = @($module.frontend.features.PSObject.Properties).Count
          $crateCount = @($module.rust.crates.PSObject.Properties).Count
          $stateIds = @($state.states | ForEach-Object { $_.id })
          $uniqueStateIds = @($stateIds | Sort-Object -Unique)

          if ($featureCount -ne 18) { throw "前端 Feature 数量异常：$featureCount" }
          if ($crateCount -ne 11) { throw "Rust workspace crate 数量异常：$crateCount" }
          if ($stateIds.Count -ne [int]$state.count) { throw "状态数量与 count 字段不一致。" }
          if ($uniqueStateIds.Count -ne $stateIds.Count) { throw "状态 ID 存在重复。" }

          Write-Host "R1 architecture contract smoke check passed."

      - name: Run Windows automated acceptance
        shell: powershell
        run: |
          & ".\项目源码\scripts\windows-acceptance.ps1" `
            -Mode Automated `
            -ProjectRoot "$env:GITHUB_WORKSPACE" `
            -LogDirectory "logs"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-automated-delivery-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/**
            .cargo-target/release/bundle/**
