          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "docs(r6-08): close node and open r6-09"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence

      - name: Persist R6-08 closeout failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml || true
          {
            printf 'R6-08 closeout failed.\n'
            printf 'canonical_run=%s\n' "$GITHUB_RUN_ID"
            printf 'windows_result=%s\n' "$WINDOWS_RESULT"
            if [ -f /tmp/r6-08-closeout.log ]; then
              tail -n 220 /tmp/r6-08-closeout.log
            fi
          } > .r6-08-closeout-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .r6-08-closeout-failure.txt
          git commit -m "chore(r6-08): record closeout failure"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
