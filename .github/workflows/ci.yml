name: Public Platform CI

on:
  push:
    branches:
      - main
      - "new-*"
      - "rewrite/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-automated-delivery-gate:
    name: Windows automated delivery gate
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache

    steps:
      - name: Checkout repository in acceptance layout
        uses: actions/checkout@v4
        with:
          path: 项目源码
          ref: agent/r3-09-at2-builder

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Refresh post-rustfmt Domain inventory
        shell: pwsh
        working-directory: 项目源码
        run: |
          node scripts/generate-domain-type-inventory.mjs
          $changed = @(git diff --name-only)
          foreach ($file in $changed) {
            if ($file -ne "architecture/domain-type-inventory.json") {
              Write-Error "Inventory generator touched unexpected file: $file"
              exit 1
            }
          }
          if ($changed.Count -gt 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add architecture/domain-type-inventory.json
            git commit -m "chore(r3-09): refresh post-rustfmt domain inventory"
            git push origin HEAD:agent/r3-09-at2-builder
          }

      - name: Verify R1 architecture boundaries
        shell: pwsh
        working-directory: 项目源码
        run: npm run verify:architecture

      - name: Verify Rust workspace
        shell: pwsh
        working-directory: 项目源码
        run: npm run verify:rust
