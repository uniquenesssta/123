name: Public Platform CI

on:
  push:
    branches:
      - main
      - "new-*"
      - "rewrite/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-automated-delivery-gate:
    name: Windows automated delivery gate
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache

    steps:
      - name: Checkout repository in acceptance layout
        uses: actions/checkout@v4
        with:
          path: 项目源码

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 项目源码 -> ../.cargo-target

      - name: Verify R1 architecture boundaries
        shell: pwsh
        working-directory: 项目源码
        run: npm run verify:architecture

      - name: Run Windows automated acceptance
        shell: pwsh
        working-directory: 项目源码
        run: |
          & ".\scripts\windows-acceptance.ps1" `
            -Mode Automated `
            -ProjectRoot "$env:GITHUB_WORKSPACE" `
            -LogDirectory "logs"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-automated-delivery-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/**
            .cargo-target/release/bundle/**

  r6-08-closeout:
    name: R6-08 verified closeout
    needs: windows-automated-delivery-gate
    if: always() && github.ref == 'refs/heads/rewrite/r6-entity-catalog-persistence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      WINDOWS_RESULT: ${{ needs.windows-automated-delivery-gate.result }}
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify R6-08 closeout prerequisites
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r6-08-closeout.log
          exec > >(tee -a /tmp/r6-08-closeout.log) 2>&1
          test "$WINDOWS_RESULT" = "success"
          base="a44e11aceccdb1c582636ff8d4c49f9d24529baa"
          implementation="89dfbb101989116b5c858dbb8dc4564c50f86f9d"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$implementation" HEAD
          test ! -e .github/workflows/r6-08-hard-gate.yml
          test ! -e .r6-08-hard-gate-result.json
          test ! -e .github/workflows/r6-08-closeout.yml
          test ! -e .r6-08
          test ! -e .r6-08-failure.txt
          node scripts/verify-entity-matching-references-persistence.mjs
          node scripts/verify-coach-formation-persistence.mjs
          node scripts/verify-entity-relationships.mjs
          node scripts/verify-global-name-search.mjs
          git diff --check

      - name: Update R6-08 closeout records
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/r6-08-closeout.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          canonical_run = os.environ["GITHUB_RUN_ID"]
          detail = Path("docs/modular-rewrite/R06-entity-catalog-persistence/R06-08-entity-matching-and-references.md")
          current = detail.read_text(encoding="utf-8")
          if "`VERIFYING`" not in current or "a44e11aceccdb1c582636ff8d4c49f9d24529baa" not in current:
              raise SystemExit("R6-08 detail baseline mismatch")
          detail.write_text(f"""# R6-08 Entity Matching 与 References

## 状态

`DONE`

## 基线与范围

- 唯一阶段分支：`rewrite/r6-entity-catalog-persistence`。
- 节点起点：`a44e11aceccdb1c582636ff8d4c49f9d24529baa`；生产 owner-switch 提交：`89dfbb101989116b5c858dbb8dc4564c50f86f9d`。
- 本节点只重写 Entity Matching 与 References persistence；R6-09 Archive/Delete/Force Delete 与 R6-10 Global Name Search 未提前迁移。

## 实现结果

- Entity Matching 收敛到 `adapters/catalog/entity_matching/`：resolve orchestration、stable-ID existence、external-ID lookup、name candidates、normalization 与 outcome 分责。
- References 收敛到 `adapters/catalog/references/`：reference directory read/mapper/list、provider validation/read/write/mapper、external-ID validation/write/mapper 分责。
- `resolve.rs` 与 reference `directory/list.rs` 仅编排，不直接执行 SQL；SQL I/O 集中在明确的 adapter read/write/lookup owner。
- `entity_catalog.rs` 已移除 R6-08 matching/reference-list owner，仅保留 R6-09 deletion/archive/reference-count；`player_catalog.rs` 已移除 provider/external-ID owner。
- R6-07 retained verifier、Entity Relationships verifier 与 Global Name Search verifier 仅跟随权威 owner 路径，原契约未删除、跳过或放宽。

## 契约与兼容性

- `EntityReferencePort`、Domain DTO、Schema、0001–0046 migrations、数据格式、配置、日志等级、错误语义、UI 行为均未改变。
- Stable entity ID 优先于 trusted provider external ID，external ID 优先于 normalized name matching。
- Team / Player / Coach canonical name 与 alias matching、country/nationality/date-of-birth disambiguation、`exact` / `no_match` / `ambiguous` 状态及 candidate score/reason 文案保持不变。
- Reference Directory 继续复用统一 `NameSearch`，保持中文、英文、别名、重音、多关键词检索、active-only、500 上限与稳定排序语义。
- Data Provider upsert、metadata merge、active re-enable 与 External ID upsert/metadata merge 语义不变。
- 历史 P4/运行引用保护不变；模型保护资产未变化；无新增生产依赖。

