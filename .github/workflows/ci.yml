name: Public Platform CI

on:
  push:
    branches:
      - main
      - "new-*"
      - "rewrite/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-automated-delivery-gate:
    name: Windows automated delivery gate
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache

    steps:
      - name: Checkout repository in acceptance layout
        uses: actions/checkout@v4
        with:
          path: 项目源码
          ref: agent/r3-09-at2-builder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 项目源码 -> ../.cargo-target

      - name: Refresh generated Domain inventory for AT2
        shell: pwsh
        working-directory: 项目源码
        run: |
          node scripts/generate-domain-type-inventory.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/domain-type-inventory.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(r3-09): refresh domain type inventory"
            git push origin HEAD:agent/r3-09-at2-builder
          }

      - name: Verify R1 architecture boundaries
        shell: pwsh
        working-directory: 项目源码
        run: npm run verify:architecture

      - name: Run Windows automated acceptance
        shell: pwsh
        working-directory: 项目源码
        run: |
          & ".\scripts\windows-acceptance.ps1" `
            -Mode Automated `
            -ProjectRoot "$env:GITHUB_WORKSPACE" `
            -LogDirectory "logs"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-automated-delivery-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/**
            .cargo-target/release/bundle/**
