name: R5-01 Windows Workspace Rust

on:
  push:
    branches:
      - agent/r5-01-competitions-repository
    paths:
      - ".github/workflows/r5-01-contract-baseline.yml"

permissions:
  contents: read

jobs:
  workspace-rust:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Run workspace Clippy with warnings denied
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        shell: pwsh
        run: cargo test --locked --workspace
