name: R5-01 Inventory Diff

on:
  push:
    branches:
      - agent/r5-01-competitions-repository
    paths:
      - ".github/workflows/r5-01-contract-baseline.yml"

permissions:
  contents: read

jobs:
  inventory-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate derived Domain inventory without publishing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-domain-type-inventory.mjs
          git diff --check -- architecture/domain-type-inventory.json
          git diff -- architecture/domain-type-inventory.json
          test -n "$(git diff --name-only -- architecture/domain-type-inventory.json)"
