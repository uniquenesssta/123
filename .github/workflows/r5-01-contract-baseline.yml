name: R5-01 Minimum Gate

on:
  push:
    branches:
      - agent/r5-01-competitions-repository
    paths:
      - "crates/persistence-postgres/src/adapters/competition/**"
      - "crates/persistence-postgres/src/adapters/mod.rs"
      - "crates/persistence-postgres/src/competitions.rs"
      - "crates/persistence-postgres/tests/competitions_repository_contract.rs"
      - ".github/workflows/r5-01-contract-baseline.yml"

permissions:
  contents: read

jobs:
  minimum-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d football_r5_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/football_r5_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check persistence crate
        run: cargo check --locked -p football-persistence-postgres
      - name: Run persistence unit tests
        run: cargo test --locked -p football-persistence-postgres
      - name: Run frozen R5-01 competitions contract
        run: cargo test --locked -p football-persistence-postgres --test competitions_repository_contract -- --ignored --test-threads=1
