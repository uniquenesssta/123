name: R3-10 Documentation
on:
  push:
    branches:
      - agent/r3-10-application-service-facade
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-10-application-service-facade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record R3-10 implementation facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          root = Path('README.md')
          root_text = root.read_text(encoding='utf-8')
          old_status = 'R3-10 ApplicationService 兼容门面开放为 `READY`。'
          new_status = 'R3-10 ApplicationService 兼容门面已完成 AT1/AT2 源码迁移并进入 `VERIFYING`。'
          if old_status not in root_text:
              raise SystemExit('root README R3-10 READY status not found')
          root_text = root_text.replace(old_status, new_status, 1)
          section = '''

## R3-10 ApplicationService 兼容门面（VERIFYING）

- R3-10 从 R3-09 已关闭阶段树开始实施，目标是让 `ApplicationService` 只保留稳定公共兼容入口、数据库 session 获取和单一 Service/Use Case 委托；公共方法名、参数、返回 DTO、Tauri 调用面、错误语义和数据库行为保持不变。
- Atomic Task 1 删除旧根级 `crates/application/src/p4_orchestration.rs`（136 行），建立 `services/p4_orchestration/` 与 `use_cases/p4_orchestration/`；后台 job claim/complete/fail 通过新增最小 `P4OrchestrationQueuePort` 穿越边界，P4 worker 运行状态由 `P4OrchestrationService.running` 单一持有。Application Port inventory 从 37 个增至 38 个最小 trait，仍为 15 个职责域。
- AT1 同时删除已失去调用方的 `active_store`、私有 freeze/research worker facade helper 与 `PersistenceStore` 内部 re-export，不使用 `#[allow(dead_code)]` 掩盖；Prediction/Research/P4 freeze、Application Composition、state ownership 与 Port 历史验证器均迁移到新 authoritative owner，原断言未删除或放宽。
- Atomic Task 2 新建 `use_cases/application_facade/`，将 bootstrap、database connect/initialize/reset 生命周期编排从兼容 facade 下沉；Research 多 Port access 组装进入 `ResearchService` 单-session compatibility 边界，Prediction recent-run `ModelRunListItem` 转换进入 `services/prediction/compatibility.rs`。Database bootstrap/facade 分别净减少 67/60 行，Prediction facade 净减少 15 行，Research facade 净减少 27 行；新增 lifecycle/bootstrap use cases 共 155 行并按职责分文件。
- 新增 `scripts/verify-application-service-facade.mjs` 并接入 `verify:architecture`，扫描当前 22 个 `impl ApplicationService` 文件，拒绝根对象业务异步方法/运行状态、facade 中具体 PostgreSQL/SQLx/HTTP 实现、Database 生命周期编排、Research 多 Port 组装、Prediction DTO 映射与 P4 job orchestration 回流。
- AT1 最终严格 hard gate run `31591061641` / job `94095867258` 已整体 `SUCCESS`：rustfmt、官方 Domain inventory、P4 freeze/Prediction/Research、38-Port、Application Composition、完整 architecture、Application check、Application tests 33/33 与 Clippy `-D warnings` 全部通过；AT1 提交为 `2bc98df768ed36bfe9e9712b4eae9cc54f83b1c6`。
- AT2 最终严格 hard gate run `31592634518` / job `94100834403` 已整体 `SUCCESS`：新的 ApplicationService 兼容门面专项、Database/Competition-Rules/Research/Prediction/Application Composition、完整 architecture、Application check、Application tests 与 Clippy `-D warnings` 全部通过；AT2 提交为 `dd0aa8e32c8459acbbb68805b6fa099d92d17f91`。实施过程中被历史 owner 路径或源码变换精确匹配阻塞的 recovery runs 均在提交前硬停，未把失败树提交为生产结果。
- 相对 R3-10 基线，当前源码/验证变更共 42 个文件、`+740/-389`；旧 P4 单文件 owner 清零，新增职责文件均保持小型化。未修改 PostgreSQL SQL/migration/Schema、Tauri 产品命令、前端产品源码、模型实现/私有资产、配置或生产依赖。
- 18 个需要专用可写 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试未在 AT1/AT2 hard gate 执行，未记为通过；未执行破坏性数据库验证。PR #21 当前保持 Draft / Open / 未合并；R3-10 在 clean Public Platform CI 与正式合并/收口前保持 `VERIFYING`，不得提前标记 `DONE`。
'''
          if '## R3-10 ApplicationService 兼容门面（VERIFYING）' not in root_text:
              root_text += section
          root.write_text(root_text, encoding='utf-8', newline='\n')

          stage = Path('docs/modular-rewrite/R03-application-services/README.md')
          stage_text = stage.read_text(encoding='utf-8')
          old_row = '| R3-10 | ApplicationService 兼容门面 | READY |'
          new_row = '| R3-10 | ApplicationService 兼容门面 | VERIFYING |'
          if old_row not in stage_text:
              raise SystemExit('R3 stage README R3-10 READY row not found')
          stage_text = stage_text.replace(old_row, new_row, 1)
          stage_section = '''

## R3-10 当前执行

- Atomic Task 1 — P4 Orchestration owner extraction：`DONE`。旧根级 `p4_orchestration.rs` 已删除，P4 job queue、worker state、dispatch/failure terminal transition 进入独立 Service / Use Case / Port；最终 hard gate run `31591061641` / job `94095867258` 全绿，提交 `2bc98df768ed36bfe9e9712b4eae9cc54f83b1c6`。
- Atomic Task 2 — ApplicationService facade convergence：`DONE`。bootstrap/database lifecycle、Research 多 Port access assembly、Prediction recent-run compatibility mapping 已迁出兼容 facade；新增最终 `verify-application-service-facade.mjs` 门禁。最终 hard gate run `31592634518` / job `94100834403` 全绿，提交 `dd0aa8e32c8459acbbb68805b6fa099d92d17f91`。
- Application Port inventory 当前为 15 个职责域 / 38 个最小 trait；`ApplicationService` 根对象不再直接持有 P4 worker 状态，旧根级 P4 owner 清零。公共 ApplicationService/Tauri 契约、SQL/migration、前端产品行为、模型实现和生产依赖保持不变。
- R3-10 当前为 `VERIFYING`；PR #21 保持 Draft / Open / 未合并。clean Public Platform CI 与正式收口完成前，不创建 `R03-stage-completion.md`，R3 阶段继续 `IN_PROGRESS`。
- 18 个需要专用可写 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试未执行，未记为通过；未执行破坏性数据库验证。
'''
          if '## R3-10 当前执行' not in stage_text:
              stage_text += stage_section
          stage.write_text(stage_text, encoding='utf-8', newline='\n')

          task = Path('docs/modular-rewrite/R03-application-services/R03-10-application-service-facade.md')
          task.write_text('''# R3-10 ApplicationService 兼容门面

## 状态

`VERIFYING`

## 目标与边界

R3-10 以 R3-09 已关闭的 Application Services 累计代码树为基线，将 `ApplicationService` 收敛为稳定兼容门面。公共 ApplicationService 方法名、参数、返回 DTO、Tauri 调用面、错误语义、数据库行为与模型调用契约保持不变；本节点不修改 PostgreSQL SQL/migration/Schema、Tauri 产品命令、前端产品源码、模型实现/私有资产、配置或生产依赖。

阶段工作分支 `agent/r3-10-application-service-facade` 从阶段分支提交 `961c7bbc58a7f29edb06c8b30c565b5eb91540d7` 建立；该提交的源码树与 R3-09 收口 canonical CI 已验证树保持一致。

## Atomic Task 1 — P4 Orchestration Owner Extraction

状态：`DONE`

- 删除旧根级 `crates/application/src/p4_orchestration.rs`（136 行），不保留转发壳。
- 建立 `services/p4_orchestration/{service,worker,facade,tests}.rs` 与 `use_cases/p4_orchestration/{process_next,failure}.rs`，P4 job claim/dispatch/complete/fail、最大尝试次数终态迁移和 worker loop 分责。
- 新增最小 `P4OrchestrationQueuePort` 与显式 `SerializedP4OrchestrationResult`，具体 PostgreSQL job 调用仍只由 `composition/adapters/prediction.rs` 的 `ActiveDatabase` 适配；Application Ports 从 37 增至 38 个最小 trait，职责域仍为 15 个。
- P4 worker `AtomicBool` 状态从 `ApplicationService` 移入 `P4OrchestrationService.running`，`architecture/state-ownership.json` 同步为唯一 owner/writer；根 `ApplicationService` 不再持有该运行状态。
- 删除已经失去调用方的 Application/Database `active_store`、私有 Prediction freeze helper、私有 Research worker helper 和 `PersistenceStore` 内部 re-export；没有增加 dead-code/lint 抑制。
- 历史 P4 freeze、Prediction、Research、Application Composition 与 state ownership 验证器只迁移 authoritative owner；原契约断言未删除、跳过或放宽。

### AT1 验证

最终严格 hard gate run `31591061641` / job `94095867258` 为 `SUCCESS`：rustfmt、官方 Domain inventory、P4 freeze/Prediction/Research 专项、38-Port、Application Composition、完整 `verify:architecture`、`cargo check --locked -p football-application`、Application tests 33/33、`cargo clippy --locked -p football-application --all-targets -- -D warnings` 全部通过。最终 AT1 提交：`2bc98df768ed36bfe9e9712b4eae9cc54f83b1c6`。所有 AT1 临时 workflows 已在同一成功提交删除。

## Atomic Task 2 — ApplicationService Facade Convergence

状态：`DONE`

- 新建 `use_cases/application_facade/bootstrap.rs` 与 `database_lifecycle/{connect,initialize,reset}.rs`；Database facade 的 connect/reset 与 bootstrap facade 只保留公共兼容签名和单一 Use Case 委托。
- 保持连接生命周期既有顺序：prepare → Rules/Research built-in initialization → health → activate → Analytics worker → P4 worker；初始化失败关闭 prepared connection。reset 失败且连接丢失时继续保留 best-effort reconnect，成功 reset 后重新 connect。
- Research facade 不再直接构造 `P4ManualConflictAccess` 或重复传递多个 `&session`；多 Port access 组装下沉到 `ResearchService` 的单-session compatibility 方法。
- Prediction `list_recent_runs` facade 不再持有 iterator/DTO mapping；`ModelRunListItem` 的既有 compatibility 身份保持，由 `services/prediction/compatibility.rs` 完成转换。
- 新增 `scripts/verify-application-service-facade.mjs` 并接入 `verify:architecture`。门禁扫描当前 22 个 `impl ApplicationService` 文件，拒绝根对象业务异步方法/运行状态、具体 PostgreSQL/SQLx/HTTP 实现、Database 生命周期编排、Research 多 Port 组装、Prediction DTO mapping 与 P4 orchestration 回流。
- R3-02/R3-03/R3-06/R3-07 历史验证器仅将 bootstrap/lifecycle/Research/Prediction authoritative owner 指向当前模块；没有弱化原初始化、Competition/Rules、Prediction 或 Research 断言。

### AT2 验证

最终严格 hard gate run `31592634518` / job `94100834403` 为 `SUCCESS`：新的 ApplicationService facade 专项、Database、Competition/Rules、Research、Prediction、Application Composition、完整 `verify:architecture`、Application check/tests 与 Clippy `-D warnings` 全部通过。最终 AT2 提交：`dd0aa8e32c8459acbbb68805b6fa099d92d17f91`。所有 AT2 临时 workflows 已在同一成功提交删除。

实施过程中若 recovery run 在源码变换、历史 owner 契约、rustfmt/Clippy 等硬门禁失败，提交步骤均被跳过；失败树未被描述或提交为通过结果。

## 模块规模与职责收敛

相对 R3-10 基线，当前变更为 42 个文件、`+740/-389`。旧 136 行 `p4_orchestration.rs` 被删除；P4 orchestration 分布到 8 个小型职责文件。Database bootstrap 从本节点 diff 的 `+2/-69`、Database facade `+5/-65`、Prediction facade `+3/-18`、Research facade `+4/-31`；新增 application lifecycle/bootstrap use case 文件合计 155 行，Prediction compatibility 18 行，最终 facade verifier 78 行。没有把迁出的流程重新堆入单一新文件。

## 兼容性与未执行验证

- 公共 ApplicationService 方法、参数、返回类型和 Tauri 调用保持不变。
- 数据格式、持久化结构、SQL/migration、配置、日志等级、安全/权限、模型保护边界和生产依赖未改变。
- 18 个需要专用可写 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试未在 AT1/AT2 hard gate 执行，未记为通过；未执行破坏性数据库验证。
- PR #21 当前保持 Draft / Open / 未合并。R3-10 技术实现和专项硬门禁已完成，但 clean Public Platform CI 与正式合并/收口前状态保持 `VERIFYING`。
- `R03-stage-completion.md` 仅在 R3-10 正式关闭后创建；本节点当前不提前关闭 R3 阶段。
''', encoding='utf-8', newline='\n')
          '@ | Set-Content -Path r3_10_docs.py -Encoding UTF8
          python r3_10_docs.py
          Remove-Item r3_10_docs.py

          npm run verify:frontend
          npm run verify:architecture
      - name: Commit verified documentation and remove helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r3-10-docs.yml
          git add README.md docs/modular-rewrite/R03-application-services/README.md docs/modular-rewrite/R03-application-services/R03-10-application-service-facade.md
          git commit -m 'docs(r3-10): record facade convergence verification'
          git push origin HEAD:agent/r3-10-application-service-facade
