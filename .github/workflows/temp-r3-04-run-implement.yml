name: Temporary R3-04 Run Implement

on:
  push:
    branches:
      - rewrite/r3-04-teams-players
    paths:
      - .github/workflows/temp-r3-04-run-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-04-teams-players
          fetch-depth: 0
      - name: Extract and run implementation generator
        shell: bash
        run: |
          awk '/^[[:space:]]*python - <<'"'"'PY'"'"'$/ {capture=1; next} capture && /^[[:space:]]*PY$/ {exit} capture {sub(/^          /, ""); print}' .github/workflows/temp-r3-04-implement.yml > /tmp/r304.py
          python /tmp/r304.py
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
          node scripts/verify-domain-type-inventory.mjs
          node scripts/verify-teams-players-service.mjs
          node scripts/verify-entity-relationships.mjs
          node scripts/verify-force-team-delete.mjs
          node scripts/verify-team-player-management.mjs
          npm run verify:architecture
          node scripts/verify-protected-assets-deterministic.mjs
          git diff --check
      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git rm .github/workflows/temp-r3-04-scan.yml .github/workflows/temp-r3-04-implement.yml
          git add crates/application scripts package.json architecture/domain-type-inventory.json
          git commit -m "refactor(application): rewrite teams and players services"
          git rm .github/workflows/temp-r3-04-run-implement.yml
          git commit -m "chore(r3): remove temporary R3-04 implementation workflows"
          git push origin HEAD:rewrite/r3-04-teams-players
