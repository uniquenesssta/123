name: Temporary R2-08 Compatibility Fix

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

concurrency:
  group: temp-r2-08-compat-fix-new-B
  cancel-in-progress: false

jobs:
  patch-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Apply R2-08 compatibility corrections
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          policy = r'''const DOMAIN_MODULES = [
            "ai_workspace",
            "analytics",
            "coach",
            "competition",
            "exchange",
            "formation",
            "lineup",
            "match_record",
            "player",
            "postmatch",
            "prediction",
            "release",
            "research",
            "review",
            "routing",
            "shared",
            "team",
          ];

          const PUBLIC_ROOT_SYMBOLS = new Map([
            ["ai_workspace", ["API_WORKSPACE_SCHEMA_VERSION"]],
            [
              "analytics",
              [
                "AI_ANALYSIS_PACKAGE_FORMAT",
                "AI_ANALYSIS_RESPONSE_FORMAT",
                "ANALYTICS_CALCULATION_VERSION",
              ],
            ],
            [
              "exchange",
              [
                "AI_MATCH_PACKAGE_FORMAT",
                "MATCH_LINEUP_IMPORT_FORMAT",
                "MATCH_LINEUP_IMPORT_LEGACY_FORMAT",
                "PLAYER_IMPORT_FORMAT",
                "PLAYER_MONTHLY_FORMAT",
                "TEAM_MONTHLY_FORMAT",
                "TEAM_PACKAGE_FORMAT",
                "TEAM_PACKAGE_PREVIEW_EXPORT_FORMAT",
              ],
            ],
            ["lineup", ["FORMAL_LINEUP_SNAPSHOT_TYPES"]],
            ["postmatch", ["POSTMATCH_MONITORING_VERSION", "POSTMATCH_SETTLEMENT_VERSION"]],
            [
              "prediction",
              [
                "P4_EVIDENCE_SCHEMA_VERSION",
                "P4_FEATURE_FIELD_COUNT",
                "P4_FREEZE_GRACE_MINUTES",
                "P4_ORCHESTRATION_CONTRACT_VERSION",
                "P4_ORCHESTRATION_PLANNER_VERSION",
                "P4_PERSISTENCE_CONTRACT_VERSION",
                "P4_RESEARCH_LEAD_MINUTES",
                "P4_SNAPSHOT_SCHEMA_VERSION",
                "P4_WORKBENCH_CONTRACT_VERSION",
                "PREDICTION_INPUT_AUDIT_VERSION",
              ],
            ],
            [
              "release",
              ["RELEASE_ACCEPTANCE_CONTRACT_VERSION", "RELEASE_ACCEPTANCE_FIXTURE_VERSION"],
            ],
            [
              "research",
              [
                "P4_EVIDENCE_ROUTE_VERSION",
                "P4_FACT_PIPELINE_CONTRACT_VERSION",
                "P4_RESEARCH_GATEWAY_CONTRACT_VERSION",
                "P4_RESEARCH_OUTPUT_SCHEMA_VERSION",
                "P4_RESEARCH_PROMPT_VERSION",
                "P4_SOURCE_POLICY_VERSION",
              ],
            ],
            ["review", ["MATCH_REVIEW_PACKAGE_FORMAT"]],
          ]);

          function compareNames(left, right) {
            if (left < right) return -1;
            if (left > right) return 1;
            return 0;
          }

          export function publicCompatibilityRootSymbols() {
            return new Map(
              [...PUBLIC_ROOT_SYMBOLS.entries()].map(([moduleName, names]) => [
                moduleName,
                [...names].sort(compareNames),
              ]),
            );
          }

          export function renderDomainRoot(inventory) {
            if (!inventory || !Array.isArray(inventory.types)) {
              throw new Error("Domain 类型清单缺少 types 数组");
            }

            const grouped = new Map(DOMAIN_MODULES.map((moduleName) => [moduleName, []]));
            const seen = new Set();

            for (const entry of inventory.types) {
              if (!entry.publicCompatibilityType) {
                continue;
              }
              if (!grouped.has(entry.targetModule)) {
                throw new Error(`公共兼容类型 ${entry.typeName} 缺少受支持的目标模块：${entry.targetModule}`);
              }
              if (seen.has(entry.typeName)) {
                throw new Error(`公共兼容类型重复：${entry.typeName}`);
              }
              seen.add(entry.typeName);
              grouped.get(entry.targetModule).push(entry.typeName);
            }

            if (seen.size !== inventory.summary.publicCompatibilityTypeCount) {
              throw new Error(
                `公共兼容类型数量不一致：清单 ${inventory.summary.publicCompatibilityTypeCount}，根出口 ${seen.size}`,
              );
            }

            const lines = [];
            for (const moduleName of DOMAIN_MODULES) {
              lines.push(`pub mod ${moduleName};`);
            }
            lines.push("");

            for (const moduleName of DOMAIN_MODULES) {
              const names = grouped.get(moduleName).sort(compareNames);
              if (names.length === 0) {
                throw new Error(`目标模块没有公共兼容类型：${moduleName}`);
              }
              lines.push(`pub use ${moduleName}::{`);
              for (const name of names) {
                lines.push(`    ${name},`);
              }
              lines.push("};");
              lines.push("");
            }

            for (const moduleName of DOMAIN_MODULES) {
              const symbols = [...(PUBLIC_ROOT_SYMBOLS.get(moduleName) ?? [])].sort(compareNames);
              if (symbols.length === 0) continue;
              lines.push(`pub use ${moduleName}::{`);
              for (const symbol of symbols) {
                lines.push(`    ${symbol},`);
              }
              lines.push("};");
              lines.push("");
            }

            lines.push(
              "pub(crate) use shared::defaults::{default_confidence, default_team_page_limit, default_true};",
            );
            lines.push("");
            return lines.join("\n");
          }

          export function publicCompatibilityTypeNames(inventory) {
            return inventory.types
              .filter((entry) => entry.publicCompatibilityType)
              .map((entry) => entry.typeName)
              .sort(compareNames);
          }
          '''
          write('scripts/domain-inventory/root-export-policy.mjs', policy)

          verifier = r'''import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          import {
            publicCompatibilityRootSymbols,
            publicCompatibilityTypeNames,
          } from "./domain-inventory/root-export-policy.mjs";

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const inventory = JSON.parse(
            readFileSync(resolve(root, "architecture/domain-type-inventory.json"), "utf8"),
          );
          const libPath = resolve(root, "crates/domain/src/lib.rs");
          const actual = readFileSync(libPath, "utf8");

          if (/pub\s+use\s+[^;]+::\*\s*;/s.test(actual)) {
            console.error("Domain 根出口禁止 glob re-export。");
            process.exit(1);
          }

          if (/^\s*(?:pub(?:\([^)]*\))?\s+)?(?:struct|enum|union|trait|impl|fn|const|static|type)\b/m.test(actual)) {
            console.error("Domain 根文件只能声明模块和 re-export，不得承载领域定义或实现。");
            process.exit(1);
          }

          const expectedModules = [...new Set(inventory.types.map((entry) => entry.targetModule))].sort();
          const declaredModules = [...actual.matchAll(/^pub mod ([a-z0-9_]+);$/gm)]
            .map((match) => match[1])
            .sort();
          if (JSON.stringify(declaredModules) !== JSON.stringify(expectedModules)) {
            console.error(
              `Domain 根模块声明不一致：expected=${expectedModules.join(",")}; actual=${declaredModules.join(",")}`,
            );
            process.exit(1);
          }

          const expectedByModule = new Map(expectedModules.map((moduleName) => [moduleName, []]));
          for (const entry of inventory.types) {
            if (entry.publicCompatibilityType) {
              expectedByModule.get(entry.targetModule).push(entry.typeName);
            }
          }
          const rootSymbols = publicCompatibilityRootSymbols();
          for (const [moduleName, symbols] of rootSymbols) {
            if (!expectedByModule.has(moduleName)) {
              console.error(`公共根符号登记了未知模块：${moduleName}`);
              process.exit(1);
            }
            expectedByModule.get(moduleName).push(...symbols);
          }
          for (const names of expectedByModule.values()) {
            names.sort();
          }

          const actualByModule = new Map(expectedModules.map((moduleName) => [moduleName, []]));
          for (const match of actual.matchAll(/pub\s+use\s+([a-z0-9_]+)::\{([^}]*)\};/gs)) {
            const moduleName = match[1];
            if (!actualByModule.has(moduleName)) {
              console.error(`Domain 根出口出现未知模块：${moduleName}`);
              process.exit(1);
            }
            const names = match[2]
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            actualByModule.get(moduleName).push(...names);
          }

          for (const moduleName of expectedModules) {
            const expected = expectedByModule.get(moduleName);
            const actualNames = actualByModule.get(moduleName).sort();
            if (JSON.stringify(actualNames) !== JSON.stringify(expected)) {
              console.error(
                `Domain 根出口 ${moduleName} 与兼容清单不一致：expected=${expected.length}; actual=${actualNames.length}`,
              );
              process.exit(1);
            }
          }

          const publicTypes = publicCompatibilityTypeNames(inventory);
          const symbolCount = [...rootSymbols.values()].reduce((total, names) => total + names.length, 0);
          const exportedNames = [...actualByModule.values()].flat();
          if (new Set(exportedNames).size !== publicTypes.length + symbolCount) {
            console.error("Domain 根出口包含重复公共名称，或遗漏公共兼容类型/公共根符号。");
            process.exit(1);
          }

          console.log(
            `Domain 根出口验证通过：${publicTypes.length} 个公共兼容类型、${symbolCount} 个公共根符号全部显式 re-export，0 条 glob export。`,
          );
          '''
          write('scripts/verify-domain-root-exports.mjs', verifier)

          generator = read('scripts/generate-domain-root-exports.mjs')
          generator = generator.replace(
              '`Domain 根出口已生成：${inventory.summary.publicCompatibilityTypeCount} 个公共兼容类型，显式 re-export。`',
              '`Domain 根出口已生成：${inventory.summary.publicCompatibilityTypeCount} 个公共兼容类型及登记公共根符号，显式 re-export。`',
          )
          write('scripts/generate-domain-root-exports.mjs', generator)

          team = read('scripts/verify-team-package.mjs')
          old = 'const domain = read("crates/domain/src/team_package.rs") + (read("crates/domain/src/lib.rs") + read("crates/domain/src/lineup/kind.rs") + read("crates/domain/src/lineup/player.rs") + read("crates/domain/src/lineup/snapshot.rs") + read("crates/domain/src/lineup/preset.rs") + read("crates/domain/src/lineup/chain.rs") + read("crates/domain/src/match_record/status.rs") + read("crates/domain/src/match_record/catalog.rs"));'
          new = 'const domain = read("crates/domain/src/exchange/team_package/export.rs") + read("crates/domain/src/exchange/team_package/import.rs") + (read("crates/domain/src/lib.rs") + read("crates/domain/src/lineup/kind.rs") + read("crates/domain/src/lineup/player.rs") + read("crates/domain/src/lineup/snapshot.rs") + read("crates/domain/src/lineup/preset.rs") + read("crates/domain/src/lineup/chain.rs") + read("crates/domain/src/match_record/status.rs") + read("crates/domain/src/match_record/catalog.rs"));'
          if team.count(old) != 1:
              raise SystemExit('verify-team-package legacy domain path not found exactly once')
          write('scripts/verify-team-package.mjs', team.replace(old, new))

          protected = read('scripts/verify_protected_assets.mjs')
          old_sort = '.sort((left, right) => left.path.localeCompare(right.path))'
          new_sort = '.sort((left, right) => (left.path < right.path ? -1 : left.path > right.path ? 1 : 0))'
          if protected.count(old_sort) != 1:
              raise SystemExit('protected asset locale sort not found exactly once')
          write('scripts/verify_protected_assets.mjs', protected.replace(old_sort, new_sort))
          '@ | python -

          node scripts/generate-domain-root-exports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-root-exports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-team-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify_protected_assets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified corrections
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/temp-r2-08-compat-fix.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/domain/src/lib.rs scripts/domain-inventory/root-export-policy.mjs scripts/generate-domain-root-exports.mjs scripts/verify-domain-root-exports.mjs scripts/verify-team-package.mjs scripts/verify_protected_assets.mjs .github/workflows/temp-r2-08-compat-fix.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix(domain): preserve explicit root compatibility symbols'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
