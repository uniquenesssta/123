name: Temporary R2-08 Compatibility Fix

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

concurrency:
  group: temp-r2-08-compat-fix-new-B
  cancel-in-progress: false

jobs:
  generate-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Generate complete explicit root and deterministic protected hash
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('scripts/verify_protected_assets.mjs')
          text = path.read_text(encoding='utf-8')
          old = '.sort((left, right) => left.path.localeCompare(right.path))'
          new = '.sort((left, right) => (left.path < right.path ? -1 : left.path > right.path ? 1 : 0))'
          if text.count(old) != 1:
              raise SystemExit('protected asset locale-dependent aggregate sort not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node scripts/generate-domain-root-exports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-root-exports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-team-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify_protected_assets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified generated tree
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/temp-r2-08-compat-fix.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/domain/src/lib.rs scripts/verify_protected_assets.mjs .github/workflows/temp-r2-08-compat-fix.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'no generated compatibility changes staged' }
          git commit -m 'fix(domain): preserve explicit root compatibility symbols'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
