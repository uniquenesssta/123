name: R3-06 Prediction Clippy Fix

on:
  push:
    branches:
      - rewrite/r3-06-prediction-service

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-06-prediction-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Apply exact Clippy fixes
        shell: pwsh
        run: python scripts/r3-06-prediction-clippy-fix.py
      - name: Refresh derived inventory
        shell: pwsh
        run: node scripts/generate-domain-type-inventory.mjs
      - name: Validate exact fixes
        shell: pwsh
        run: |
          npm run verify:architecture
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Commit clean fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-06-prediction-clippy-fix.yml
          git rm -f scripts/r3-06-prediction-clippy-fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix(r3): remove Prediction registry needless borrows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-06-prediction-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
