name: R3-07 AT1 Verifier Repair

on:
  push:
    branches:
      - rewrite/r3-07-at1-staging

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-07-at1-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record formal CI verifier finding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootPath = 'README.md'
          $root = Get-Content -Raw -Encoding UTF8 $rootPath
          $anchor = '- `verify:research-service` 已接入 `verify:architecture` 与 `verify:frontend`。Atomic Task 1 Windows hard gate run `31295528438` 只有在 Research 专项、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests 全部通过后才形成 clean 提交。OpenAI Research、Fact Pipeline、P4 Research worker 和人工冲突裁决留给后续 R3-07 Atomic Tasks。'
          $extra = "- 正式 Public Platform CI run ``31295931710`` 在 Database Service verifier 检出旧 ``p4_persistence.rs`` owner 断言；产品源码和 AT1 Rust 门禁未失败。验证器已改为检查 Database facade -> ResearchService -> Artifact Catalog -> ResearchArtifactPort 的完整内置 P4 artifact 注册链，不删除或放宽初始化断言。修复门禁 run ``$env:GITHUB_RUN_ID`` 通过后才提交本记录。"
          if (-not $root.Contains($anchor)) { throw 'root README AT1 anchor not found' }
          if (-not $root.Contains('正式 Public Platform CI run `31295931710`')) {
            $root = $root.Replace($anchor, "$anchor`n$extra")
          }
          Set-Content -Path $rootPath -Value $root -Encoding UTF8 -NoNewline

          $indexPath = 'docs/modular-rewrite/R03-application-services/README.md'
          $index = Get-Content -Raw -Encoding UTF8 $indexPath
          $indexAnchor = '- `verify:research-service` 已接入 architecture / frontend。Windows hard gate run `31295528438` 负责 Research 专项、Ports、architecture、Application check/tests、workspace Clippy/tests。OpenAI Research、Fact Pipeline、Research worker 与人工 conflict mutation 尚未迁移，R3-07 保持 `IN_PROGRESS`。'
          $indexExtra = "- 正式 Public CI run ``31295931710`` 暴露 Database Service 验证器仍追踪旧 ``register_p4_persistence_artifacts`` owner；已将断言迁移到 ResearchService / Artifact Catalog / ResearchArtifactPort 权威链，保持原初始化语义门禁强度。修复门禁 run ``$env:GITHUB_RUN_ID`` 通过后提交。"
          if (-not $index.Contains($indexAnchor)) { throw 'R03 AT1 anchor not found' }
          if (-not $index.Contains('正式 Public CI run `31295931710`')) {
            $index = $index.Replace($indexAnchor, "$indexAnchor`n$indexExtra")
          }
          Set-Content -Path $indexPath -Value $index -Encoding UTF8 -NoNewline
      - name: Validate repaired owner chain
        shell: pwsh
        run: |
          npm run verify:database-service
          npm run verify:research-service
          npm run verify:application-ports
          npm run verify:architecture
          git diff --check
      - name: Commit clean verifier repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-07-at1-verifier-fix.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add scripts/verify-database-service.mjs README.md docs/modular-rewrite/R03-application-services/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test(r3): follow Research artifact registration owner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-07-at1-staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
