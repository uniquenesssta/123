name: R6-02 Baseline Contract

on:
  push:
    branches:
      - agent/r6-02-team-names-profiles
    paths:
      - .github/workflows/r6-02-baseline-contract.yml

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_02_baseline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_02_baseline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_02_baseline_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Run R6-02 legacy-owner contract
        run: cargo test --locked -p football-persistence-postgres --test team_names_profiles_repository_contract -- --ignored --nocapture
