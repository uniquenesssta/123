          ## 2. 真实调用面基线

          临时 Windows 扫描 workflow run `31237537087`、job `93052732745` 对 `crates/persistence-postgres/src/**/*.rs` 与 `crates/application/src/**/*.rs` 做了实际静态交叉扫描：

