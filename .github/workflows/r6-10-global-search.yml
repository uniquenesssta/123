        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          record = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md')
          record.write_text(f'''# R6-10 Global Name Search\n\n## 状态\n\n`VERIFYING`\n\n## 基线与范围\n\n- 基线：`e79f1becb1595b03f5d1ba4686363dd62fbac9e2`，分支保持 `rewrite/r6-entity-catalog-persistence`，未创建新分支。\n- 任务书目标 owner：`crates/persistence-postgres/src/adapters/catalog/global_search/`。\n- 仅迁移统一名称搜索的查询解析、名称归一化与 PostgreSQL 谓词构造；球队目录、球员目录、球队选择器、教练目录与 Entity Reference 调用点只切换 owner。\n- `football.global-name-search.v1`、公共 Port/DTO、Schema、0001–0046 migrations、配置、错误语义、UI 与模型保护资产均不改变。\n\n## 实施结果\n\n- 旧 `crates/persistence-postgres/src/name_search.rs` 拆为 `global_search/{{query,normalization,predicate}}.rs`；`mod.rs` 仅负责模块声明和显式导出。\n- `query.rs` 唯一拥有查询解析与多关键词 token；`normalization.rs` 唯一拥有大小写、拉丁重音、标点/空白与 compact 规则；`predicate.rs` 唯一拥有 SQL QueryBuilder 名称谓词。\n- 现有 7 个 `NameSearch::parse` 接入点保持 contains、多关键词 AND、正式名/本地化名/别名、中文/英文部分匹配、标点/空白无关和拉丁重音折叠语义。\n- 新增 PostgreSQL contract 覆盖球队目录与分页、球队 selector、球员、教练以及 team/player/coach Entity Reference；不新增拼音转换或编辑距离纠错。\n\n## 文件清单\n\n### 新增\n- `crates/persistence-postgres/src/adapters/catalog/global_search/mod.rs`\n- `crates/persistence-postgres/src/adapters/catalog/global_search/query.rs`\n- `crates/persistence-postgres/src/adapters/catalog/global_search/normalization.rs`\n- `crates/persistence-postgres/src/adapters/catalog/global_search/predicate.rs`\n- `crates/persistence-postgres/tests/global_name_search_repository_contract.rs`\n- 本记录\n\n### 修改\n- `crates/persistence-postgres/src/adapters/catalog/mod.rs`\n- `crates/persistence-postgres/src/lib.rs`\n- `crates/persistence-postgres/src/adapters/catalog/players/directory/list_players.rs`\n- `crates/persistence-postgres/src/adapters/catalog/teams/directory/list_teams.rs`\n- `crates/persistence-postgres/src/adapters/catalog/teams/directory/list_team_options.rs`\n- `crates/persistence-postgres/src/adapters/catalog/coaches/directory/list.rs`\n- `crates/persistence-postgres/src/adapters/catalog/references/directory/read.rs`\n- `scripts/verify-global-name-search.mjs`\n- `architecture/domain-type-inventory.json`（由官方生成器同步 owner 路径）\n- 根 `README.md` 与阶段 `README.md`\n\n### 删除\n- `crates/persistence-postgres/src/name_search.rs`\n\n## 验证\n\n- implementation/minimum gate workflow run `{os.environ['RUN_ID']}` 正在执行；硬门禁通过前保持 `VERIFYING`。\n- 阶段级 Windows regression 与 retained PostgreSQL contracts 将在 production owner-switch 提交后的独立 verify run 执行。\n\n## 回退点\n\n- 回退到基线 `e79f1becb1595b03f5d1ba4686363dd62fbac9e2`；不保留双实现或兼容转发壳。\n''', encoding='utf-8')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = stage.read_text(encoding='utf-8')
          old = '| R6-10 | Global Name Search | READY |'
          if old not in text:
              raise SystemExit('R6 stage README no longer marks R6-10 READY')
          text = text.replace(old, '| R6-10 | Global Name Search | VERIFYING |')
          anchor = '## R6-01 当前事实'
          facts = f'''## R6-10 当前事实\n\n- 详细记录：[`R06-10-global-name-search.md`](R06-10-global-name-search.md)。\n- 旧根部 `name_search.rs` 已迁入 `adapters/catalog/global_search/{{query,normalization,predicate}}`，现有搜索调用点只切换 owner，搜索契约与 UI 不变。\n- implementation/minimum gate run `{os.environ['RUN_ID']}` 正在执行；完成前状态保持 `VERIFYING`。\n\n'''
          if '## R6-10 当前事实' not in text:
              text = text.replace(anchor, facts + anchor)
          stage.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          anchor = '### R6-09 Archive / Delete / Force Delete'
          summary = f'''### R6-10 Global Name Search\n\n- 统一名称搜索 owner 正迁移到 `adapters/catalog/global_search/`，按查询解析、归一化策略和 PostgreSQL 谓词构造分责；球队、球员、教练、球队 selector 与 Entity Reference 仅切换内部 owner。\n- `football.global-name-search.v1` 的中文/英文/别名/重音/标点与空白无关、多关键词 AND 和 contains 语义保持不变；公共 DTO、Schema、0001–0046 migrations、配置、UI 与生产依赖不变。implementation/minimum gate run `{os.environ['RUN_ID']}` 执行中，R6-10 暂为 `VERIFYING`。\n\n'''
          if '### R6-10 Global Name Search' not in text:
              text = text.replace(anchor, summary + anchor)
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Refresh official type inventory
        run: node scripts/generate-domain-type-inventory.mjs

      - name: Format Rust
        run: cargo fmt --all

      - name: Minimum gate - global search verifier
        run: node scripts/verify-global-name-search.mjs
      - name: Minimum gate - persistence check
        run: cargo check --locked -p football-persistence-postgres
      - name: Minimum gate - focused unit tests
        run: cargo test --locked -p football-persistence-postgres --lib global_search -- --nocapture
      - name: Minimum gate - protected assets
        run: node scripts/verify_protected_assets.mjs
      - name: Minimum gate - frozen database baseline
        run: node scripts/verify_database_baseline.mjs
      - name: Minimum gate - PostgreSQL 16 contract
        run: cargo test --locked -p football-persistence-postgres --test global_name_search_repository_contract -- --ignored --nocapture
      - name: Minimum gate - domain inventory
        run: node scripts/verify-domain-type-inventory.mjs
      - name: Diff hygiene and scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = (
              'README.md',
              'architecture/domain-type-inventory.json',
              'crates/persistence-postgres/src/lib.rs',
              'crates/persistence-postgres/src/name_search.rs',
