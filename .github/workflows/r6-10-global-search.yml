          requireTrue(contract.requirements.latin_diacritic_insensitive, "契约未要求拉丁重音无关匹配");

          requireTrue(!fs.existsSync(path.join(root, "crates/persistence-postgres/src/name_search.rs")), "旧 name_search.rs 仍存在");
          requireTrue(!persistenceLib.includes("mod name_search;"), "旧根模块入口仍存在");
          requireTrue(catalogMod.includes("pub(crate) mod global_search;"), "Catalog 未注册 Global Search 模块");
          requireTrue(globalSearchMod.includes("mod normalization;") && globalSearchMod.includes("mod predicate;") && globalSearchMod.includes("mod query;"), "Global Search 职责目录不完整");
          requireTrue(globalSearchMod.includes("pub(crate) use predicate") && globalSearchMod.includes("pub(crate) use query::NameSearch"), "Global Search 出口不完整");
          requireTrue(query.includes("pub(crate) struct NameSearch"), "缺少统一名称搜索查询对象");
          requireTrue(predicate.includes('format!("%{token}%")'), "名称搜索仍未使用包含匹配");
          requireTrue(predicate.includes("regexp_replace"), "名称搜索未处理空格与标点差异");
          requireTrue(normalization.includes("LATIN_FOLD_SOURCE"), "名称搜索未处理拉丁重音字符");
          requireTrue(normalization.includes("character.is_alphanumeric()"), "名称搜索未统一中英文字符归一化");
          requireTrue(predicate.includes("columns.alias_normalized"), "名称搜索未覆盖别名归一化字段");
          requireTrue(predicate.includes("columns.alias_display"), "名称搜索未覆盖别名原始显示字段");

          const searchOwners = [playerCatalog, playerDirectoryList, teamDirectoryList, teamOptionList, referenceDirectoryRead, coachDirectoryList];
          const combined = searchOwners.join("\n");
          const helperUsages = (combined.match(/NameSearch::parse\(/g) ?? []).length;
          requireTrue(helperUsages >= 7, `全局名称搜索接入点不足：${helperUsages}/7`);
          requireTrue(!combined.includes("name_search::{"), "仍有调用点依赖旧 name_search owner");
          for (const source of searchOwners) {
            requireTrue(!source.includes('format!("{search}%")'), "仍残留仅前缀匹配逻辑");
            requireTrue(!/normalized_name LIKE \$1 \|\| '%'/u.test(source), "实体引用仍残留仅前缀匹配SQL");
          }
          requireTrue(playerDirectoryList.includes("adapters::catalog::global_search") && playerDirectoryList.includes("NameSearch::parse"), "Player Directory 未接入新 Global Search owner");
          requireTrue(teamDirectoryList.includes("adapters::catalog::global_search") && teamDirectoryList.includes("NameSearch::parse"), "Team Directory 未接入新 Global Search owner");
          requireTrue(teamOptionList.includes("adapters::catalog::global_search") && teamOptionList.includes("NameSearch::parse"), "Team options 未接入新 Global Search owner");
          requireTrue(coachDirectoryList.includes("adapters::catalog::global_search") && coachDirectoryList.includes("NameSearch::parse"), "Coach Directory 未接入新 Global Search owner");
          requireTrue(referenceDirectoryRead.includes("adapters::catalog::global_search") && referenceDirectoryRead.includes("NameSearch::parse") && referenceDirectoryRead.includes("push_name_search"), "Reference Directory 未接入新 Global Search owner");

          requireTrue(playerPage.includes("支持中文名、原名或别名的部分匹配"), "球员搜索提示未说明中英文部分匹配");
          requireTrue(teamPage.includes("支持中英文球队名称或别名的部分匹配"), "球队搜索提示未说明中英文部分匹配");
          requireTrue(presetPage.includes("支持中英文球队名称或别名的部分匹配"), "阵容预设球队搜索提示未同步");

          const foldMap = new Map([
            ...["á", "à", "â", "ä", "ã", "å", "ā", "ă", "ą"].map((value) => [value, "a"]),
            ...["ç", "ć", "č"].map((value) => [value, "c"]),
            ...["ď", "đ"].map((value) => [value, "d"]),
            ...["é", "è", "ê", "ë", "ē", "ė", "ę", "ě"].map((value) => [value, "e"]),
            ...["í", "ì", "î", "ï", "ī", "į"].map((value) => [value, "i"]),
            ["ł", "l"],
            ...["ñ", "ń"].map((value) => [value, "n"]),
            ...["ó", "ò", "ô", "ö", "õ", "ø", "ō", "ő"].map((value) => [value, "o"]),
            ["ř", "r"],
            ...["ś", "š"].map((value) => [value, "s"]),
            ...["ú", "ù", "û", "ü", "ū", "ů", "ű"].map((value) => [value, "u"]),
            ...["ý", "ÿ"].map((value) => [value, "y"]),
            ...["ž", "ź", "ż"].map((value) => [value, "z"]),
          ]);
          const normalize = (value) => [...value.trim().toLocaleLowerCase("zh-CN")]
            .map((character) => foldMap.get(character) ?? character)
            .map((character) => /[\p{L}\p{N}]/u.test(character) ? character : " ")
            .join("")
            .replace(/\s+/gu, " ")
            .trim();
          const compact = (value) => normalize(value).replace(/\s+/gu, "");
          const matches = (search, names) => {
            const tokens = normalize(search).split(" ").filter(Boolean);
            const normalizedNames = names.map(normalize);
            const compactNames = names.map(compact);
            return tokens.every((token) => {
              const compactToken = compact(token);
              return normalizedNames.some((name) => name.includes(token))
                || compactNames.some((name) => name.includes(compactToken));
            });
          };

          for (const example of contract.examples) {
            requireTrue(matches(example.query, example.names) === example.expected_match,
              `搜索示例失败：${example.query}`);
          }

          console.log(`全局中英文名称搜索验证通过：${helperUsages} 个后端入口已统一到 catalog/global_search，${contract.examples.length} 个中英文示例匹配正确。`);
          EOF

      - name: Update R6-10 records to VERIFYING
