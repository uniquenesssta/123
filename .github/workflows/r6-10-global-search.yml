              assert_eq!(first.items.len(), 1);
              assert!(first.has_more);
              let second = store
                  .list_teams(&TeamListQuery {
                      search: Some(token.clone()),
                      country_code: None,
                      team_type: None,
                      active_only: true,
                      limit: 1,
                      cursor_name: first.next_cursor_name.clone(),
