              assert!(coaches.iter().any(|item| item.id == coach.id));

              for (entity_type, search, id) in [
                  ("team", format!("sao 验收 {token}"), team.id),
                  ("player", format!("marlon 索萨 {token}"), player.id),
                  ("coach", format!("jose 教练 {token}"), coach.id),
