  windows-stage:
    needs: detect
    if: needs.detect.outputs.mode == 'verify'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target
      - name: Sync dependencies
        run: npm run setup
      - name: Frontend and static contracts
        run: npm run verify:frontend
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Diff hygiene
        shell: pwsh
        run: git diff --check

  postgres-stage:
    needs: detect
    if: needs.detect.outputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: R6-10 ownership and frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-global-name-search.mjs
          node scripts/verify-domain-type-inventory.mjs
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify_database_baseline.mjs
      - name: R6 retained PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            team_directory_detail_repository_contract
            team_names_profiles_repository_contract
            player_directory_detail_repository_contract
            player_names_positions_repository_contract
            player_team_periods_availability_repository_contract
            player_abilities_dynamic_tags_repository_contract
            coach_formation_repository_contract
            entity_matching_references_repository_contract
            entity_deletion_repository_contract
            entity_permanent_delete_repository_contract
            team_force_delete_repository_contract
            global_name_search_repository_contract
          )
          for test_name in "${tests[@]}"; do
            test -f "crates/persistence-postgres/tests/${test_name}.rs"
            cargo test --locked -p football-persistence-postgres --test "$test_name" -- --ignored --nocapture
          done
      - name: Diff hygiene
        run: git diff --check

  finalize-r6-10:
    needs: [detect, windows-stage, postgres-stage]
    if: >-
      always() &&
      needs.detect.outputs.mode == 'verify' &&
      needs.windows-stage.result == 'success' &&
      needs.postgres-stage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Capture job evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          win_id="$(jq -r '.jobs[] | select(.name=="Windows stage regression" or .name=="windows-stage") | .id' <<<"$jobs" | head -n1)"
          pg_id="$(jq -r '.jobs[] | select(.name=="PostgreSQL stage regression" or .name=="postgres-stage") | .id' <<<"$jobs" | head -n1)"
          echo "WIN_JOB_ID=${win_id:-unknown}" >> "$GITHUB_ENV"
          echo "PG_JOB_ID=${pg_id:-unknown}" >> "$GITHUB_ENV"
      - name: Finalize R6-10 records and remove temporary workflow
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git rm .github/workflows/r6-10-global-search.yml
          python - <<'PY'
          from pathlib import Path
          import os

          run = os.environ['RUN_ID']
          win = os.environ.get('WIN_JOB_ID', 'unknown')
          pg = os.environ.get('PG_JOB_ID', 'unknown')

          record = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md')
          text = record.read_text(encoding='utf-8')
          text = text.replace('`VERIFYING`', '`DONE`', 1)
          text = text.replace(
              '- 阶段级 Windows regression 与 retained PostgreSQL contracts 将在 production owner-switch 提交后的独立 verify run 执行。',
              f'- 阶段级 verify workflow run `{run}` 已通过：Windows job `{win}` 完整执行 frontend、rustfmt、workspace Clippy `-D warnings` 与 workspace tests；PostgreSQL 16 job `{pg}` 完整执行 R6-10 ownership/architecture/protected/database 门禁及 R6-01～R6-10 retained contracts。'
          )
          text += '\n## 完成结论\n\n- R6-10 唯一生产 owner 已切换到 `adapters/catalog/global_search/`，旧 `name_search.rs` 与旧根模块入口已删除，无双实现或转发壳。\n- R6-10 最小验证与阶段回归均已实际通过，节点据此关闭为 `DONE`。\n- 本节点不修改 UI；此前用户人工球队目录/详情及球队名称/档案写入回读已明确通过，球员人工检查仅收到“应该OK了”，不将其扩大表述为完整 Windows Full 验收。\n'
          record.write_text(text, encoding='utf-8')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = stage.read_text(encoding='utf-8')
          text = text.replace('| R6-10 | Global Name Search | VERIFYING |', '| R6-10 | Global Name Search | DONE |')
          old = next((line for line in text.splitlines() if line.startswith('- implementation/minimum gate run `') and 'R6-10' in text[text.find('## R6-10 当前事实'):text.find('## R6-01 当前事实')]), None)
          facts_start = text.find('## R6-10 当前事实')
          facts_end = text.find('## R6-01 当前事实')
          if facts_start < 0 or facts_end < 0:
              raise SystemExit('R6-10 stage facts missing')
          facts = text[facts_start:facts_end]
          lines = [line for line in facts.splitlines() if not line.startswith('- implementation/minimum gate run `')]
          lines.append(f'- production owner-switch 后的 verify run `{run}` 已通过；Windows job `{win}` 与 PostgreSQL 16 job `{pg}` 均 SUCCESS，R6-10 正式 `DONE`。')
          new_facts = '\n'.join(lines).rstrip() + '\n\n'
          text = text[:facts_start] + new_facts + text[facts_end:]
          stage.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          start = text.find('### R6-10 Global Name Search')
          end = text.find('### R6-09 Archive / Delete / Force Delete')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('root README R6-10 section missing')
          final = f'''### R6-10 Global Name Search\n\n- 统一名称搜索已收敛到 `adapters/catalog/global_search/{{query,normalization,predicate}}`；球队目录、球员目录、球队 selector、教练目录与 Entity Reference 只切换内部 owner，旧 `name_search.rs` 已删除。\n- `football.global-name-search.v1` 的中文/英文/别名/重音/标点与空白无关、多关键词 AND、contains 与分页语义保持不变；公共 DTO、Schema、0001–0046 migrations、配置、UI、错误语义和生产依赖不变。阶段 verify run `{run}` 的 Windows job `{win}` 与 PostgreSQL 16 job `{pg}` 均 `SUCCESS`；R6-10 正式 `DONE`。\n\n'''
          text = text[:start] + final + text[end:]
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit R6-10 closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence .github/workflows/r6-10-global-search.yml
          git commit -m 'docs(r6-10): close global name search'
          git push origin HEAD:"$R6_BRANCH"
