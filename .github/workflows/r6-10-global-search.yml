name: R6-10 Global Name Search

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r6-10-global-search-${{ github.ref }}
  cancel-in-progress: false

env:
  R6_BRANCH: rewrite/r6-entity-catalog-persistence
  R6_10_BASELINE: e79f1becb1595b03f5d1ba4686363dd62fbac9e2

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: mode
        shell: bash
        run: |
          set -euo pipefail
          old='crates/persistence-postgres/src/name_search.rs'
          new='crates/persistence-postgres/src/adapters/catalog/global_search/mod.rs'
          record='docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md'
          if [[ -f "$old" && ! -f "$new" ]]; then
            echo 'mode=implement' >> "$GITHUB_OUTPUT"
          elif [[ ! -f "$old" && -f "$new" && -f "$record" ]]; then
            echo 'mode=verify' >> "$GITHUB_OUTPUT"
          else
            echo 'R6-10 tree is neither clean baseline nor implemented state.' >&2
            exit 1
          fi

  implement:
    needs: detect
    if: needs.detect.outputs.mode == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.R6_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Confirm protected baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" != ''
          git merge-base --is-ancestor "$R6_10_BASELINE" HEAD
          test -z "$(git status --short)"
          test -f crates/persistence-postgres/src/name_search.rs
          test ! -e crates/persistence-postgres/src/adapters/catalog/global_search

      - name: Implement R6-10 responsibility split
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          target = root / 'crates/persistence-postgres/src/adapters/catalog/global_search'
          target.mkdir(parents=True, exist_ok=False)

          (target / 'mod.rs').write_text('''mod normalization;\nmod predicate;\nmod query;\n\npub(crate) use predicate::{push_name_search, NameSearchColumns};\npub(crate) use query::NameSearch;\n''', encoding='utf-8')

          (target / 'normalization.rs').write_text(r'''pub(super) const COMPACT_SQL_PATTERN: &str = "[[:space:][:punct:]·•・，。！？：；（）【】《》“”‘’]+";
pub(super) const LATIN_FOLD_SOURCE: &str = "áàâäãåāăąçćčďđéèêëēėęěíìîïīįłñńóòôöõøōőřśšúùûüūůűýÿžźż";
pub(super) const LATIN_FOLD_TARGET: &str = "aaaaaaaaacccddeeeeeeeeiiiiiilnnoooooooorssuuuuuuuyyzzz";

pub(super) fn normalize_query(value: &str) -> String {
    value
        .trim()
        .to_lowercase()
        .chars()
        .map(fold_latin_character)
        .map(|character| {
            if character.is_alphanumeric() {
                character
            } else {
                ' '
            }
        })
        .collect::<String>()
        .split_whitespace()
        .collect::<Vec<_>>()
        .join(" ")
}

fn fold_latin_character(character: char) -> char {
    match character {
        'á' | 'à' | 'â' | 'ä' | 'ã' | 'å' | 'ā' | 'ă' | 'ą' => 'a',
        'ç' | 'ć' | 'č' => 'c',
        'ď' | 'đ' => 'd',
        'é' | 'è' | 'ê' | 'ë' | 'ē' | 'ė' | 'ę' | 'ě' => 'e',
        'í' | 'ì' | 'î' | 'ï' | 'ī' | 'į' => 'i',
        'ł' => 'l',
        'ñ' | 'ń' => 'n',
        'ó' | 'ò' | 'ô' | 'ö' | 'õ' | 'ø' | 'ō' | 'ő' => 'o',
        'ř' => 'r',
        'ś' | 'š' => 's',
        'ú' | 'ù' | 'û' | 'ü' | 'ū' | 'ů' | 'ű' => 'u',
        'ý' | 'ÿ' => 'y',
        'ž' | 'ź' | 'ż' => 'z',
        other => other,
    }
}

pub(super) fn compact_query(value: &str) -> String {
    value
        .chars()
        .filter(|character| character.is_alphanumeric())
        .collect()
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn punctuation_free_query_can_match_compact_name() {
        assert_eq!(normalize_query("马龙·索萨"), "马龙 索萨");
        assert_eq!(compact_query("马龙·索萨"), "马龙索萨");
        assert_eq!(compact_query("marlon-sousa"), "marlonsousa");
    }

    #[test]
    fn latin_diacritics_are_folded_for_search() {
        assert_eq!(normalize_query("São Tomé"), "sao tome");
        assert_eq!(normalize_query("Kovačić"), "kovacic");
    }
}
