name: R6-10 Global Name Search

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r6-10-global-search-${{ github.ref }}
  cancel-in-progress: false

env:
  R6_BRANCH: rewrite/r6-entity-catalog-persistence
  R6_10_SOURCE_BASELINE: e79f1becb1595b03f5d1ba4686363dd62fbac9e2

jobs:
  implement:
    name: R6-10 implementation and minimum gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Confirm R6-10 baseline and protected scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$R6_10_SOURCE_BASELINE" HEAD
          test -z "$(git status --short)"
          test -f scripts/r6-10-apply.py
          test -f crates/persistence-postgres/src/name_search.rs
          test ! -e crates/persistence-postgres/src/adapters/catalog/global_search

      - name: Apply responsibility split
        run: python scripts/r6-10-apply.py

      - name: Refresh official inventory and format
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-domain-type-inventory.mjs
          cargo fmt --all

      - name: Verify Global Search ownership and contract
        run: node scripts/verify-global-name-search.mjs
      - name: Check persistence crate
        run: cargo check --locked -p football-persistence-postgres
      - name: Run focused Global Search unit tests
        run: cargo test --locked -p football-persistence-postgres --lib global_search -- --nocapture
      - name: Verify protected model assets
        run: node scripts/verify_protected_assets.mjs
      - name: Verify frozen database baseline
        run: node scripts/verify_database_baseline.mjs
      - name: Verify official Domain inventory
        run: node scripts/verify-domain-type-inventory.mjs
      - name: Run PostgreSQL 16 Global Search contract
        run: cargo test --locked -p football-persistence-postgres --test global_name_search_repository_contract -- --ignored --nocapture

      - name: Verify R6-10 diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = (
              'README.md',
              'architecture/domain-type-inventory.json',
              'crates/persistence-postgres/src/lib.rs',
              'crates/persistence-postgres/src/name_search.rs',
              'crates/persistence-postgres/src/adapters/catalog/mod.rs',
              'crates/persistence-postgres/src/adapters/catalog/global_search/',
              'crates/persistence-postgres/src/adapters/catalog/players/directory/list_players.rs',
              'crates/persistence-postgres/src/adapters/catalog/teams/directory/list_teams.rs',
              'crates/persistence-postgres/src/adapters/catalog/teams/directory/list_team_options.rs',
              'crates/persistence-postgres/src/adapters/catalog/coaches/directory/list.rs',
              'crates/persistence-postgres/src/adapters/catalog/references/directory/read.rs',
              'crates/persistence-postgres/tests/global_name_search_repository_contract.rs',
              'scripts/verify-global-name-search.mjs',
              'scripts/r6-10-apply.py',
              'docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md',
              'docs/modular-rewrite/R06-entity-catalog-persistence/README.md',
          )
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unexpected = [p for p in changed if not any(p == a or (a.endswith('/') and p.startswith(a)) for a in allowed)]
          if unexpected:
              raise SystemExit('unexpected R6-10 scope: ' + ', '.join(unexpected))
          print('R6-10 scoped files:')
          print('\n'.join(changed))
          PY

      - name: Record minimum gate success
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          run = os.environ['RUN_ID']
          record = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md')
          text = record.read_text(encoding='utf-8').replace(
              f'- implementation/minimum gate run `{run}` 执行中；硬门禁通过前保持 `VERIFYING`。',
              f'- implementation/minimum gate run `{run}` 已通过：Global Search owner/contract、Persistence check、focused unit tests、模型保护、database baseline、Domain inventory、PostgreSQL 16 focused contract 与 diff scope 全部 PASS。'
          )
          record.write_text(text, encoding='utf-8')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = stage.read_text(encoding='utf-8').replace(
              f'- implementation/minimum gate run `{run}` 执行中；完成前保持 `VERIFYING`。',
              f'- implementation/minimum gate run `{run}` 已通过；R6-10 保持 `VERIFYING`，等待完整 Windows 与 retained PostgreSQL 16 阶段回归。'
          )
          stage.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8').replace(
              f'implementation/minimum gate run `{run}` 执行中，节点暂为 `VERIFYING`。',
              f'implementation/minimum gate run `{run}` 已通过，节点暂为 `VERIFYING`，等待阶段回归。'
          )
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit production owner switch
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/r6-10-apply.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md architecture/domain-type-inventory.json crates/persistence-postgres docs/modular-rewrite/R06-entity-catalog-persistence scripts/verify-global-name-search.mjs
          git commit -m 'refactor(r6-10): modularize global name search'
          git push origin HEAD:"$R6_BRANCH"

  windows-stage:
    name: Windows stage regression
    needs: implement
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target
      - name: Sync dependencies
        run: npm run setup
      - name: Frontend and static contracts
        run: npm run verify:frontend
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Diff hygiene
        run: git diff --check

  postgres-stage:
    name: PostgreSQL stage regression
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: R6 ownership and frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-global-name-search.mjs
          node scripts/verify-domain-type-inventory.mjs
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify_database_baseline.mjs
      - name: R6-01 through R6-10 retained PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            team_directory_detail_repository_contract
            team_names_profiles_repository_contract
            player_directory_detail_repository_contract
            player_names_positions_repository_contract
            player_team_periods_availability_repository_contract
            player_abilities_dynamic_tags_repository_contract
            coach_formation_repository_contract
            entity_matching_references_repository_contract
            entity_deletion_repository_contract
            entity_permanent_delete_repository_contract
            team_force_delete_repository_contract
            global_name_search_repository_contract
          )
          for test_name in "${tests[@]}"; do
            test -f "crates/persistence-postgres/tests/${test_name}.rs"
            cargo test --locked -p football-persistence-postgres --test "$test_name" -- --ignored --nocapture
          done
      - name: Diff hygiene
        run: git diff --check

  finalize:
    name: Finalize R6-10
    needs: [implement, windows-stage, postgres-stage]
    if: ${{ always() && needs.implement.result == 'success' && needs.windows-stage.result == 'success' && needs.postgres-stage.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Capture stage job evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          win="$(jq -r '.jobs[] | select(.name=="Windows stage regression") | .id' <<<"$jobs" | head -n1)"
          pg="$(jq -r '.jobs[] | select(.name=="PostgreSQL stage regression") | .id' <<<"$jobs" | head -n1)"
          test -n "$win" && test "$win" != null
          test -n "$pg" && test "$pg" != null
          echo "WIN_JOB_ID=$win" >> "$GITHUB_ENV"
          echo "PG_JOB_ID=$pg" >> "$GITHUB_ENV"
      - name: Close R6-10 records
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          run = os.environ['RUN_ID']
          win = os.environ['WIN_JOB_ID']
          pg = os.environ['PG_JOB_ID']

          record = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md')
          text = record.read_text(encoding='utf-8')
          text = text.replace('`VERIFYING`', '`DONE`', 1)
          text = text.replace(
              '- production owner-switch 后继续运行完整 Windows stage regression 与 R6-01～R6-10 retained PostgreSQL 16 contracts。',
              f'- stage verification run `{run}` 已通过：Windows job `{win}` 完成 frontend、rustfmt、workspace Clippy `-D warnings` 与 workspace tests；PostgreSQL 16 job `{pg}` 完成 architecture/protected/database 门禁及 R6-01～R6-10 retained contracts。'
          )
          text += '\n## 完成结论\n\n- R6-10 唯一生产 owner 为 `adapters/catalog/global_search/`；旧 `name_search.rs` 已删除，无双实现或转发壳。\n- 最小验证与阶段回归均已实际通过，R6-10 据此关闭为 `DONE`。\n- 本节点未修改 UI；此前球队目录/详情及球队名称/档案写入回读由用户明确通过，球员人工验收仅记录为用户“应该OK了”，不扩大表述为完整 Windows Full 验收。\n'
          record.write_text(text, encoding='utf-8')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = stage.read_text(encoding='utf-8').replace('| R6-10 | Global Name Search | VERIFYING |', '| R6-10 | Global Name Search | DONE |')
          start = text.find('## R6-10 当前事实')
          end = text.find('## R6-01 当前事实')
          if start < 0 or end < 0 or end <= start:
            raise SystemExit('R6-10 stage facts missing')
          facts = f'''## R6-10 当前事实\n\n- 详细记录：[`R06-10-global-name-search.md`](R06-10-global-name-search.md)。\n- 旧根部 `name_search.rs` 已按 `query / normalization / predicate` 分责迁入 `adapters/catalog/global_search/`；搜索契约与 UI 不变。\n- stage verification run `{run}` 已通过；Windows job `{win}` 与 PostgreSQL 16 job `{pg}` 均 SUCCESS，R6-10 正式 `DONE`。\n\n'''
          text = text[:start] + facts + text[end:]
          stage.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          start = text.find('### R6-10 Global Name Search')
          end = text.find('### R6-09 Archive / Delete / Force Delete')
          if start < 0 or end < 0 or end <= start:
            raise SystemExit('root README R6-10 section missing')
          final = f'''### R6-10 Global Name Search\n\n- 统一名称搜索已收敛到 `adapters/catalog/global_search/{{query,normalization,predicate}}`；球队目录、球员目录、球队 selector、教练目录与 Entity Reference 只切换内部 owner，旧 `name_search.rs` 已删除。\n- `football.global-name-search.v1` 的中文/英文/别名/重音/标点与空白无关、多关键词 AND、contains 与分页语义保持不变；公共 DTO、Schema、0001–0046 migrations、配置、UI、错误语义和生产依赖不变。stage verification run `{run}` 的 Windows job `{win}` 与 PostgreSQL 16 job `{pg}` 均 `SUCCESS`；R6-10 正式 `DONE`。\n\n'''
          text = text[:start] + final + text[end:]
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Remove temporary workflow and commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r6-10-global-search.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence
          git commit -m 'docs(r6-10): close global name search'
          git push origin HEAD:"$R6_BRANCH"

  record-implement-failure:
    name: Record R6-10 implementation failure
    needs: implement
    if: ${{ always() && needs.implement.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Write failure marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "phase=implement"
            echo "head=$(git rev-parse HEAD)"
          } > .r6-10-failure.txt
          gh run view "$GITHUB_RUN_ID" --log-failed >> .r6-10-failure.txt 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .r6-10-failure.txt
          git commit -m 'ci(r6-10): record implementation failure'
          git push origin HEAD:"$R6_BRANCH"

  record-verify-failure:
    name: Record R6-10 stage failure
    needs: [implement, windows-stage, postgres-stage]
    if: ${{ always() && needs.implement.result == 'success' && (needs.windows-stage.result == 'failure' || needs.postgres-stage.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Write failure marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "phase=stage"
            echo "windows=${{ needs.windows-stage.result }}"
            echo "postgres=${{ needs.postgres-stage.result }}"
            echo "head=$(git rev-parse HEAD)"
          } > .r6-10-failure.txt
          gh run view "$GITHUB_RUN_ID" --log-failed >> .r6-10-failure.txt 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .r6-10-failure.txt
          git commit -m 'ci(r6-10): record stage failure'
          git push origin HEAD:"$R6_BRANCH"
