name: R2-01 Domain Inventory Generate

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'chore(r2): bootstrap R2-01 inventory generation'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Expand deterministic implementation files
        shell: pwsh
        run: Expand-Archive -Path .r2-01/r2-01-files.zip -DestinationPath . -Force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Generate domain inventory
        run: node scripts/generate-domain-type-inventory.mjs

      - name: Verify domain inventory
        run: node scripts/verify-domain-type-inventory.mjs

      - name: Verify serde contracts
        run: cargo test --locked -p football-domain --test serde_contracts

      - name: Verify architecture and protected assets
        shell: pwsh
        run: |
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify full frontend
        run: npm run verify:frontend

      - name: Verify full Rust workspace
        run: npm run verify:rust

      - name: Commit generated inventory
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r2-01-generate.yml .r2-01/r2-01-files.zip
          git add architecture/domain-type-inventory.json crates/domain/tests scripts/domain-inventory scripts/generate-domain-type-inventory.mjs scripts/verify-domain-type-inventory.mjs
          git diff --cached --check
          git commit -m "rewrite(r2): generate R2-01 domain inventory baseline"
          git push origin HEAD:new-B
