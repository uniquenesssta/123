name: R4 Final Docs Correction

on:
  push:
    branches:
      - rewrite/r4-persistence-foundation
    paths:
      - ".github/r4-docs-correction.py"
      - ".github/workflows/r4-docs-correction.yml"

permissions:
  contents: write

jobs:
  correct-r4-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected correction base
        shell: bash
        run: |
          set -euo pipefail
          git config core.quotePath false
          git merge-base --is-ancestor f7bc0101a4c443e1fc6e95d2e604a7df7e073d5e HEAD
          test -f .github/r4-docs-correction.py

      - name: Apply and validate final documentation correction
        shell: bash
        run: python3 .github/r4-docs-correction.py

      - name: Commit documentation-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "docs(r4): correct final stage closeout record"
          git push origin HEAD:rewrite/r4-persistence-foundation
