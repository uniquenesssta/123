name: Temporary R3-03 Strict Validate

on:
  push:
    branches:
      - rewrite/r3-03-competition-rules

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Regenerate deterministic inventory after formatting
        run: node scripts/generate-domain-type-inventory.mjs
      - name: Verify domain inventory
        run: node scripts/verify-domain-type-inventory.mjs
      - name: Verify R3-03 service boundary
        run: node scripts/verify-competition-rules-service.mjs
      - name: Verify architecture
        run: npm run verify:architecture
      - name: Verify protected model boundary fingerprint
        run: node scripts/verify-protected-assets-deterministic.mjs
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Check Application crate
        run: cargo check --locked -p football-application
      - name: Test Application crate
        run: cargo test --locked -p football-application
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit validated generated changes and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/temp-r3-03-validate.yml
          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(r3): finalize R3-03 verification state"
            git push origin HEAD:rewrite/r3-03-competition-rules
          }
