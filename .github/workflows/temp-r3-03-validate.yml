name: Temporary R3-03 Validate

on:
  push:
    branches:
      - rewrite/r3-03-competition-rules

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Regenerate deterministic inventory
        shell: pwsh
        run: node scripts/generate-domain-type-inventory.mjs
      - name: Normalize Rust formatting
        shell: pwsh
        run: cargo fmt --all
      - name: Verify R3-03 boundaries
        shell: pwsh
        run: |
          node scripts/verify-domain-type-inventory.mjs
          node scripts/verify-competition-rules-service.mjs
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify-protected-assets-deterministic.mjs
      - name: Verify Application crate
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo check --locked -p football-application
          cargo test --locked -p football-application
          git diff --check
      - name: Commit validated generated changes and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/temp-r3-03-validate.yml
          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(r3): synchronize R3-03 verification state"
            git push origin HEAD:rewrite/r3-03-competition-rules
          }
