name: R3-08 AT2 Stage-A Fix

on:
  push:
    branches:
      - agent/r3-08-at2-stage-a-fix

permissions:
  contents: write

jobs:
  stage-a-fix:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Setup dependencies
        shell: pwsh
        run: npm run setup

      - name: Record formal CI failure and focused fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          readme = Path('README.md')
          marker = '- R3-08 AT2 首次 canonical Public Platform CI run `31363234205`'
          text = readme.read_text(encoding='utf-8')
          if marker not in text:
              text = text.rstrip() + '\n\n' + marker + '：完整 architecture 已通过，但 Windows Automated 在 `verify-stage-a-architecture.mjs` 因仍读取已删除的旧 `crates/application/src/match_review_package.rs` 而 `ENOENT` 停止；AT2 业务专项、37-Port、Domain inventory、Review/Package architecture 均已在同一 clean checkout 中通过。修复仅将 Stage-A 应用层断言读取源迁移到新 authoritative `use_cases/review/package/preview.rs` 与 `lifecycle.rs`，原 Preview/Confirm/Commit/Generate 门禁断言保持，不修改生产源码、公共接口、SQL/Schema、Tauri、Domain、Postmatch/Analytics、模型或依赖。另：AT2 canonical 发布过程中曾出现连接器误操作造成 README 瞬时被清空/缩减的文档提交；最终 HEAD 已通过 fast-forward 恢复为已验证完整 publication tree，生产源码从未被该误操作修改，相关异常 run 不作为验收证据。\n'
              readme.write_text(text, encoding='utf-8')

          task = Path('docs/modular-rewrite/R03-application-services/R03-08-review-postmatch-and-analytics.md')
          marker2 = '### Canonical CI 第一次失败与 Stage-A 验证器恢复'
          text = task.read_text(encoding='utf-8')
          if marker2 not in text:
              text = text.rstrip() + '\n\n' + marker2 + '\n\n- canonical run `31363234205` 的 `verify:architecture` 已通过；Windows Automated 在 frontend 聚合门禁执行 `verify-stage-a-architecture.mjs` 时因该旧验证器仍读取已删除 `match_review_package.rs` 而失败。\n- `verify-stage-a-architecture.mjs` 只迁移读取路径到 `use_cases/review/package/preview.rs` + `lifecycle.rs`；强类型工作流动作、状态权威、Tauri 薄层、前端能力 DTO、PostgreSQL 状态迁移等原断言保持。\n- canonical 发布期间连接器曾产生瞬时 README-only 异常提交；随后采用 non-force fast-forward 将完整已验证 publication tree 恢复。生产源码未受这些文档异常提交影响，异常 CI 不作为通过证据。\n- AT2 继续保持 `VERIFYING`，等待修复后的完整 frontend/Rust 与 canonical Public Platform CI。\n'
              task.write_text(text, encoding='utf-8')

          stage = Path('docs/modular-rewrite/R03-application-services/README.md')
          marker3 = '- AT2 canonical run `31363234205`'
          text = stage.read_text(encoding='utf-8')
          if marker3 not in text:
              text = text.rstrip() + '\n' + marker3 + '：architecture PASS，Windows Automated 因旧 Stage-A verifier 读取已删除 `match_review_package.rs` 失败；当前只迁移该验证器 authoritative source 路径，AT2 仍为 `VERIFYING`。\n'
              stage.write_text(text, encoding='utf-8')
          '@ | python -
          git diff --check

      - name: Stage-A verifier gate
        shell: pwsh
        run: |
          node --check scripts/verify-stage-a-architecture.mjs
          node scripts/verify-stage-a-architecture.mjs

      - name: AT2 architecture gate
        shell: pwsh
        run: |
          npm run verify:review-service
          npm run verify:match-review-package
          npm run verify:application-ports
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs

      - name: Full stage regression
        shell: pwsh
        run: |
          npm run verify:frontend
          npm run verify:rust

      - name: Verify focused scope
        shell: pwsh
        run: |
          $base = '48df873d2abe65b6f2f79960d8d70e9aa0a52f1c'
          $allowed = @(
            'README.md',
            'docs/modular-rewrite/R03-application-services/README.md',
            'docs/modular-rewrite/R03-application-services/R03-08-review-postmatch-and-analytics.md',
            'scripts/verify-stage-a-architecture.mjs',
            '.github/workflows/r3-08-at2-stage-a-fix.yml'
          )
          $changed = @()
          $changed += @(git diff --name-only "$base...HEAD")
          $changed += @(git diff --name-only HEAD)
          foreach ($path in ($changed | Where-Object { $_ } | Sort-Object -Unique)) {
            if ($allowed -notcontains $path) { throw "AT2 Stage-A fix unexpected changed path: $path" }
          }
          if (git diff --name-only $base -- crates/application/src crates/domain src-tauri crates/persistence-postgres crates/model-api crates/model-p4 crates/model-p7 Cargo.toml Cargo.lock package.json package-lock.json) {
            throw 'AT2 Stage-A verifier fix changed protected production scope'
          }

      - name: Commit clean Stage-A fix tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r3-08-at2-stage-a-fix.yml
          git add README.md `
            docs/modular-rewrite/R03-application-services/README.md `
            docs/modular-rewrite/R03-application-services/R03-08-review-postmatch-and-analytics.md `
            scripts/verify-stage-a-architecture.mjs
          git diff --cached --check
          git commit -m "fix(r3): migrate stage-a review package verifier"
          git push origin HEAD:agent/r3-08-at2-stage-a-fix

      - name: Verify clean fix tree
        shell: pwsh
        run: |
          if (Test-Path .github/workflows/r3-08-at2-stage-a-fix.yml) { throw 'temporary Stage-A workflow remains' }
          node --check scripts/verify-stage-a-architecture.mjs
          node scripts/verify-stage-a-architecture.mjs
          npm run verify:review-service
          npm run verify:match-review-package
          npm run verify:application-ports
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          if (git status --short) { throw 'Stage-A fix tree is not clean' }
