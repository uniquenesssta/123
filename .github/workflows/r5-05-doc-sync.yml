name: R5-05 Documentation Sync

on:
  push:
    branches:
      - agent/r5-05-route-resolution
    paths:
      - ".github/workflows/r5-05-doc-sync.yml"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-05-route-resolution
      - name: Update root and stage records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          stage_path = Path("docs/modular-rewrite/R05-competition-routing-persistence/README.md")
          stage = stage_path.read_text(encoding="utf-8")
          old_status = "| R5-05 | Route Resolution Reads | READY |"
          if old_status not in stage:
              raise SystemExit("R5-05 READY row missing")
          stage = stage.replace(old_status, "| R5-05 | Route Resolution Reads | VERIFYING |", 1)
          stale = "- R5-04 当前保持 `VERIFYING`；需清理 transient workflow、完成 clean PR canonical CI、固定 HEAD merge、merged stage CI 与最终 closeout canonical CI 后，才可标记 `DONE` 并开放 R5-05 `READY`。\n"
          stage = stage.replace(stale, "", 1)
          marker = "## 兼容与限制\n"
          section = "\n".join([
              "## R5-05 当前事实",
              "",
              "- 详细记录：[`R05-05-route-resolution-reads.md`](R05-05-route-resolution-reads.md)。",
              "- Route Resolution / Competition Context persistence 已收敛到 `adapters/competition/route_resolution/{context,route}/`；coordinator、typed Row、Domain Mapper、Stage/Season context read、explicit package read、binding candidate read 与 scope validation 按职责拆分。",
              "- legacy `competitions.rs` 已删除；legacy `routing.rs` 已删除 R5-05 route owner，只保留 R5-06 model registration，且未创建 `model_run_identity/`。",
              "- old-owner PostgreSQL 16 contract run `31869022228` / job `94974599427` 与 owner-switch/new-owner run `31869137395` / job `94974903779` 均为 `SUCCESS`；同一 contract 冻结 hierarchy context、route specificity/fallback、有效期、模型过滤、显式包、错误与 reason 字段。",
              "- ownership gate run `31869503602` / job `94975820076` 与 official inventory run `31869537207` / job `94975903916` 均为 `SUCCESS`。",
              "- 第一轮 hard gate `31869573253` 因 R4-03 旧 mapping verifier 读取已删除 legacy path 而 fail-fast；更新 call-path 后，第二轮 run `31869727870` / job `94976380579` 为 `SUCCESS`，完整 architecture、模型保护、rustfmt、Persistence/Application check/tests 与同一 PostgreSQL contract 全部通过。",
              "- R5-05 当前为 `VERIFYING`，R5-06 继续 `BLOCKED`；clean PR 与合并后/final canonical Windows 门禁尚未完成。",
              "",
              "",
          ])
          if "## R5-05 当前事实" not in stage:
              if marker not in stage:
                  raise SystemExit("stage compatibility marker missing")
              stage = stage.replace(marker, section + marker, 1)
          stage_path.write_text(stage, encoding="utf-8")

          root = Path("README.md")
          lines = root.read_text(encoding="utf-8").splitlines()
          if not any(line.startswith("- R5-05 Route Resolution Reads ") for line in lines):
              indices = [i for i, line in enumerate(lines) if line.startswith("- R5-04 Competition Bindings ")]
              if len(indices) != 1:
                  raise SystemExit(f"expected one R5-04 README line, got {len(indices)}")
              entry = "- R5-05 Route Resolution Reads 已完成生产 owner 切换并进入 `VERIFYING`：`resolve_competition_context` / scope validation 与 `resolve_route` / RouteDecision mapping 已从 legacy `competitions.rs` / `routing.rs` 收敛到 `adapters/competition/route_resolution/{context,route}/`；legacy `competitions.rs` 已删除，`routing.rs` 只保留 R5-06 model registration，未提前创建 `model_run_identity/`。old-owner PostgreSQL contract run `31869022228` / job `94974599427`、owner-switch/new-owner run `31869137395` / job `94974903779`、ownership gate `31869503602` / job `94975820076`、official inventory `31869537207` / job `94975903916` 均为 `SUCCESS`；第一轮 hard gate `31869573253` 因 R4-03 旧 mapping verifier 读取已删除 legacy path 而 fail-fast，推进 call-path 后第二轮 hard gate `31869727870` / job `94976380579` 为 `SUCCESS`，完整 architecture、模型保护、rustfmt、Persistence/Application check/tests 与同一 PostgreSQL 16 route/context contract 全部通过。Domain/Application/Tauri/Schema/0001–0046 migration、配置/错误/日志、前端行为、route algorithm/result、model identity、Cargo manifests/Cargo.lock、生产依赖与模型保护资产保持不变。18 个 broad PostgreSQL ignored tests 与 destructive reset 未执行，未触碰用户数据库。R5-06 继续 `BLOCKED`；详见 `docs/modular-rewrite/R05-competition-routing-persistence/R05-05-route-resolution-reads.md`。"
              lines.insert(indices[0] + 1, entry)
          root.write_text("\n".join(lines) + "\n", encoding="utf-8")

          subprocess.run(["git", "diff", "--check"], check=True)
          expected = {"README.md", "docs/modular-rewrite/R05-competition-routing-persistence/README.md"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected docs diff: {sorted(actual)}")
          PY
      - name: Commit README records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R05-competition-routing-persistence/README.md
          git commit -m "docs(r5-05): record route resolution verification"
          git push origin HEAD:agent/r5-05-route-resolution
