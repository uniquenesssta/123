name: R3-09 AT3 Hard Gate

on:
  push:
    branches:
      - agent/r3-09-at3-ai-workspace

permissions:
  contents: write

jobs:
  hard-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Checkout AT3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-09-at3-ai-workspace
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Wire AT3 validators to authoritative owners
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['verify:ai-workspace-service'] = 'node scripts/verify-ai-workspace-service.mjs';
          if (!pkg.scripts['verify:architecture'].includes('verify-ai-workspace-service.mjs')) {
            pkg.scripts['verify:architecture'] = pkg.scripts['verify:architecture'].replace(
              'node scripts/verify-exchange-service.mjs',
              'node scripts/verify-exchange-service.mjs && node scripts/verify-ai-workspace-service.mjs',
            );
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const frontendPath = 'scripts/verify-frontend.mjs';
          let frontend = fs.readFileSync(frontendPath, 'utf8');
          if (!frontend.includes('"verify-ai-workspace-service.mjs"')) {
            frontend = frontend.replace(
              '  "verify-exchange-service.mjs",\n',
              '  "verify-exchange-service.mjs",\n  "verify-ai-workspace-service.mjs",\n',
            );
          }
          fs.writeFileSync(frontendPath, frontend);

          const legacyVerifierPath = 'scripts/verify-api-workspace.mjs';
          let legacyVerifier = fs.readFileSync(legacyVerifierPath, 'utf8');
          legacyVerifier = legacyVerifier.replace(
            'const application = text("crates/application/src/api_workspace.rs");',
            'const application = text("crates/application/src/use_cases/ai_workspace/presets/mod.rs");',
          );
          fs.writeFileSync(legacyVerifierPath, legacyVerifier);
          '@ | node

      - name: Format AT3 Rust and refresh deterministic inventory
        shell: pwsh
        run: |
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify architecture
        shell: pwsh
        run: npm run verify:architecture

      - name: Check Application
        shell: pwsh
        run: cargo check --locked -p football-application

      - name: Test Application
        shell: pwsh
        run: cargo test --locked -p football-application

      - name: Clippy Application
        shell: pwsh
        run: cargo clippy --locked -p football-application --all-targets -- -D warnings

      - name: Validate formatter scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          $unexpectedRust = @($changed | Where-Object {
            $_ -like '*.rs' -and
            $_ -notlike 'crates/application/src/services/ai_workspace/*' -and
            $_ -notlike 'crates/application/src/use_cases/ai_workspace/*' -and
            $_ -ne 'crates/application/src/ports/ai_workspace/mod.rs' -and
            $_ -ne 'crates/application/src/composition/adapters/ai_workspace.rs' -and
            $_ -ne 'crates/application/src/composition/adapters/mod.rs' -and
            $_ -ne 'crates/application/src/composition/application_composition.rs' -and
            $_ -ne 'crates/application/src/service/application_service.rs' -and
            $_ -ne 'crates/application/src/services/mod.rs' -and
            $_ -ne 'crates/application/src/use_cases/mod.rs' -and
            $_ -ne 'crates/application/src/lib.rs'
          })
          if ($unexpectedRust.Count -gt 0) {
            Write-Error ('rustfmt touched unrelated Rust files: ' + ($unexpectedRust -join ', '))
            exit 1
          }

      - name: Commit deterministic formatting and remove temporary workflow
        shell: pwsh
        run: |
          git rm .github/workflows/r3-09-at3-hard-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/application architecture/domain-type-inventory.json package.json scripts/verify-frontend.mjs scripts/verify-api-workspace.mjs scripts/verify-ai-workspace-service.mjs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "chore(r3-09): normalize AT3 source and validators"
          git push origin HEAD:agent/r3-09-at3-ai-workspace
