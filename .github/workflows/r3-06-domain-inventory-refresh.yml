name: R3-06 Domain Inventory Refresh

on:
  push:
    branches:
      - rewrite/r3-06-prediction-service

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-06-prediction-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate domain inventory
        shell: pwsh
        run: |
          node scripts/generate-domain-type-inventory.mjs
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'architecture/domain-type-inventory.json') {
            Write-Error "Unexpected generated change set: $($changed -join ', ')"
            exit 1
          }
      - name: Validate refreshed inventory
        shell: pwsh
        run: |
          npm run verify:architecture
          git diff --check
      - name: Commit clean inventory refresh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-06-domain-inventory-refresh.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add architecture/domain-type-inventory.json
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "chore(r3): refresh domain type inventory"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-06-prediction-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
