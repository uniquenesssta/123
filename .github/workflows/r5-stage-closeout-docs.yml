name: R5 Stage Closeout Docs

on:
  push:
    branches:
      - rewrite/r5-competition-routing-persistence
    paths:
      - .github/workflows/r5-stage-closeout-docs.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/r5-competition-routing-persistence
          fetch-depth: 0
      - name: Finalize R5 records and initialize R6 index
        run: python .github/scripts/r5_stage_closeout.py
      - name: Commit closeout records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No closeout changes to commit."
            exit 0
          fi
          git commit -m "docs(r5): close stage and open r6"
          git push origin HEAD:rewrite/r5-competition-routing-persistence
