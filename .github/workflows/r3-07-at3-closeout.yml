name: R3-07 AT3 Closeout

on:
  push:
    branches:
      - rewrite/r3-07-at3-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-07-at3-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record verified AT3 closeout
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          root = Path("README.md")
          text = root.read_text(encoding="utf-8")
          prefix = "- R3-07 Atomic Task 3 已迁移 OpenAI Research Gateway execution："
          matches = [line for line in text.splitlines() if line.startswith(prefix)]
          if len(matches) != 1:
              raise RuntimeError(f"root README AT3 anchor mismatch: {len(matches)}")
          replacement = "- R3-07 Atomic Task 3 已正式关闭为 `DONE`。OpenAI Research Gateway execution 已从旧 `crates/application/src/openai_research.rs` 迁入按 artifacts / gateway / attempt audit / references / execution / validation 职责拆分的 `use_cases/research/openai_gateway/`；公共 `execute_p4_openai_research` / `OpenAiResearchCommand` 契约与错误语义保持不变，`ResearchGatewayAuditPort` 仅补齐既有 attempt-number offset 能力并由 `ActiveDatabase` 复用现有 PostgreSQL gateway records。迁移后无调用者的 `PreparedDatabaseConnection::transition_store` 与 `ResearchService::register_fact_pipeline_artifacts` 过渡桥接已移除。Windows hard gate run `31312515543` / job `93242388772` 已通过 Research/Database/Prediction 专项、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests，并生成 clean 实施提交 `d818276bc93c1dfb8fd7c1c5fbab71a97e6cd5e2`。与该 clean tree SHA 完全一致的验收提交 `ad12e8d8d574ee3df8c3c1e83cf7705e718d0c49` 的 Public Platform CI run `31313043256` / Windows Automated job `93243752378` 已全部 SUCCESS，validation evidence upload 成功；artifact `9038223561` 大小 `14263377` 字节，SHA-256 `611f79b5b5789fce242d1429c1060415187f7f07f5253d03eb478bb7deed5bd3`。AT3 临时 workflow / generator / fix / CI trigger 均已清理；R3-07 继续为 `IN_PROGRESS`，下一 Atomic Task 进入 P4 Research worker，人工冲突裁决保持后续边界。"
          text = text.replace(matches[0], replacement, 1)
          root.write_text(text, encoding="utf-8", newline="\n")

          index = Path("docs/modular-rewrite/R03-application-services/README.md")
          text = index.read_text(encoding="utf-8")
          prefix = "- Atomic Task 3 已迁移 OpenAI Research Gateway execution："
          matches = [line for line in text.splitlines() if line.startswith(prefix)]
          if len(matches) != 1:
              raise RuntimeError(f"R03 README AT3 anchor mismatch: {len(matches)}")
          replacement = "- Atomic Task 3 已正式关闭为 `DONE`。OpenAI Research Gateway execution 已删除旧 `openai_research.rs` 并按 artifacts / gateway / attempt audit / references / execution / validation 职责拆入 Research use cases；公共命令与错误语义保持不变，`ResearchGatewayAuditPort` 仅补齐 attempt-number offset 并由 `ActiveDatabase` 复用既有 PostgreSQL gateway records。迁移后无调用者的 Database transition-store 与 ResearchService Fact Pipeline 转发桥接已移除。Windows hard gate run `31312515543` / job `93242388772` 已通过 Research/Database/Prediction 专项、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests，并生成 clean 提交 `d818276bc93c1dfb8fd7c1c5fbab71a97e6cd5e2`；相同 clean tree 的验收提交 `ad12e8d8d574ee3df8c3c1e83cf7705e718d0c49` 的 Public Platform CI run `31313043256` / Windows Automated job `93243752378` 全部 SUCCESS，validation evidence upload 成功。artifact `9038223561` 大小 `14263377` 字节，SHA-256 `611f79b5b5789fce242d1429c1060415187f7f07f5253d03eb478bb7deed5bd3`。AT3 临时施工与 CI trigger 文件均已清理；R3-07 保持 `IN_PROGRESS`，下一 Atomic Task 为 P4 Research worker，manual conflict mutation 留待后续。"
          text = text.replace(matches[0], replacement, 1)
          index.write_text(text, encoding="utf-8", newline="\n")
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'r3-07-at3-closeout.py'
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          python $scriptPath
      - name: Verify Research Service
        shell: pwsh
        run: npm run verify:research-service
      - name: Verify Application Ports
        shell: pwsh
        run: npm run verify:application-ports
      - name: Verify architecture
        shell: pwsh
        run: npm run verify:architecture
      - name: Commit clean AT3 closeout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-07-at3-closeout.yml
          git add README.md docs/modular-rewrite/R03-application-services/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "docs(r3): close OpenAI research gateway task"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-07-at3-closeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-07-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
