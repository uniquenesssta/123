name: R4-02 Scope Audit

on:
  push:
    branches:
      - rewrite/r4-persistence-foundation
    paths:
      - .github/workflows/r4-02-scope-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r4-persistence-foundation
      - name: Scan audit ownership and callers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patterns = @('write_audit_event','sha256_json','audit\.events','audit_events','Sha256','hex::encode')
          foreach ($pattern in $patterns) {
            Write-Host "=== $pattern ==="
            Get-ChildItem crates,architecture,scripts -Recurse -File | Select-String -Pattern $pattern | ForEach-Object {
              Write-Host ("{0}:{1}:{2}" -f $_.Path.Replace($PWD.Path + '\',''), $_.LineNumber, $_.Line.Trim())
            }
          }
