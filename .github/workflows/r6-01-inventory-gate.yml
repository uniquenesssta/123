name: R6-01 Ownership Inventory Gate

on:
  push:
    branches:
      - agent/r6-01-team-directory-detail
    paths:
      - .github/workflows/r6-01-inventory-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_01_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_01_inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_01_inventory_test
    steps:
      - name: Checkout R6-01 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r6-01-team-directory-detail
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Wire R6-01 verifier and clean baseline helper
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          gate = "node scripts/verify-team-directory-detail.mjs"
          architecture = scripts["verify:architecture"]
          if gate not in architecture:
              scripts["verify:architecture"] = architecture + " && " + gate
          scripts["verify:team-directory-detail"] = gate
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path(".github/workflows/r6-01-contract-baseline.yml").unlink(missing_ok=True)
          PY
      - name: Refresh official Domain inventory
        run: node scripts/generate-domain-type-inventory.mjs
      - name: Verify R6-01 ownership gate
        run: node scripts/verify-team-directory-detail.mjs
      - name: Verify Domain inventory drift
        run: node scripts/verify-domain-type-inventory.mjs
      - name: Verify protected model assets
        run: node scripts/verify_protected_assets.mjs
      - name: Run full architecture gate
        run: npm run verify:architecture
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Check persistence and application
        run: cargo check --locked -p football-persistence-postgres -p football-application
      - name: Run persistence unit tests
        run: cargo test --locked -p football-persistence-postgres --lib
      - name: Run frozen R6-01 PostgreSQL contract
        run: cargo test --locked -p football-persistence-postgres --test team_directory_detail_repository_contract -- --ignored --nocapture
      - name: Commit verified inventory and gate wiring
        shell: bash
        run: |
          rm -f .github/workflows/r6-01-inventory-gate.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(r6-01): enforce team directory detail ownership"
          git push origin HEAD:agent/r6-01-team-directory-detail
