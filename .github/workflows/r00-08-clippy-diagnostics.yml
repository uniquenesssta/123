name: R0-08 Secondary Clippy Diagnostics Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secondary-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: new-A
          fetch-depth: 1

      - name: Capture source and call sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r0-08-secondary/source
          cp crates/application/src/analytics.rs r0-08-secondary/source/
          cp crates/application/src/prediction.rs r0-08-secondary/source/
          cp crates/application/src/release_acceptance.rs r0-08-secondary/source/
          cp crates/application/src/spreadsheet.rs r0-08-secondary/source/
          cp crates/persistence-postgres/tests/postgres_integration.rs r0-08-secondary/source/
          {
            echo '=== insert_match_event_fixture ==='
            grep -n -C 4 'insert_match_event_fixture' crates/persistence-postgres/tests/postgres_integration.rs || true
            echo
            echo '=== readiness_check ==='
            grep -n -C 3 'readiness_check' crates/application/src/prediction.rs || true
            echo
            echo '=== release check helper ==='
            grep -n -C 3 'check(' crates/application/src/release_acceptance.rs || true
            echo
            echo '=== lifecycle split/window ==='
            grep -n -C 4 -E 'training_end|lifecycle_window_json|lifecycle_split' crates/application/src/analytics.rs || true
          } > r0-08-secondary/references.txt
          git rev-parse HEAD > r0-08-secondary/head.txt
          git status --short > r0-08-secondary/status.txt

      - name: Upload secondary diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: r00-08-secondary-clippy-diagnostics
          path: r0-08-secondary/**
          if-no-files-found: error
          retention-days: 30
