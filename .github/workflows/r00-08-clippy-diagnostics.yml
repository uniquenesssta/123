name: R0-08 Exact Rust Verification Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-rust-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: new-A
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux system packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Rust 1.88.0 with rustfmt and clippy
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install locked Node dependencies
        shell: bash
        run: npm ci

      - name: Run exact npm Rust verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p r0-08-exact-evidence
          git rev-parse HEAD > r0-08-exact-evidence/tested-commit.txt
          set +e
          npm run verify:rust 2>&1 | tee r0-08-exact-evidence/verify-rust.txt
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > r0-08-exact-evidence/verify-rust-exit-code.txt
          printf 'verify_rust_exit_code=%s\n' "$status" > r0-08-exact-evidence/summary.txt
          exit "$status"

      - name: Upload exact Rust verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r00-08-exact-rust-verification
          path: r0-08-exact-evidence/**
          if-no-files-found: error
          retention-days: 30
