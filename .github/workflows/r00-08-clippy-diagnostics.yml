name: R0-08 Clippy Apply Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clippy-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: new-A
          fetch-depth: 2

      - name: Install Tauri Linux system packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Rust 1.88.0 with rustfmt and clippy
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Apply exact R0-08 fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r0-08-evidence
          if git apply --check .github/r0-08-clippy.patch; then
            git apply .github/r0-08-clippy.patch
            printf 'apply_state=applied\n' > r0-08-evidence/summary.txt
          elif git apply --reverse --check .github/r0-08-clippy.patch; then
            printf 'apply_state=already_applied\n' > r0-08-evidence/summary.txt
          else
            echo 'R0-08 patch does not match either baseline or applied state.' >&2
            exit 1
          fi
          cargo fmt --all
          git diff --check
          git diff --name-only | sort > r0-08-evidence/changed-files.txt
          if [[ -s r0-08-evidence/changed-files.txt ]]; then
            cat > r0-08-evidence/expected-files.txt <<'EOF'
          crates/persistence-postgres/src/postmatch.rs
          crates/persistence-postgres/src/release_acceptance.rs
          crates/spreadsheet-io/src/match_review_workbook.rs
          crates/spreadsheet-io/src/team_package.rs
          EOF
            diff -u r0-08-evidence/expected-files.txt r0-08-evidence/changed-files.txt
          fi
          git diff --stat > r0-08-evidence/diff-stat.txt
          git diff > r0-08-evidence/r0-08.patch

      - name: Run focused package tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p football-spreadsheet-io -p football-persistence-postgres --lib 2>&1 | tee r0-08-evidence/focused-tests.txt

      - name: Run workspace Clippy gate
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee r0-08-evidence/clippy.txt

      - name: Commit verified R0-08 source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            git rev-parse HEAD > r0-08-evidence/implementation-commit.txt
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/spreadsheet-io/src/match_review_workbook.rs \
            crates/spreadsheet-io/src/team_package.rs \
            crates/persistence-postgres/src/postmatch.rs \
            crates/persistence-postgres/src/release_acceptance.rs
          git commit -m 'fix(r00-08): close Rust clippy gate'
          git push origin HEAD:new-A
          git rev-parse HEAD > r0-08-evidence/implementation-commit.txt

      - name: Upload R0-08 apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r00-08-clippy-apply
          path: r0-08-evidence/**
          if-no-files-found: warn
          retention-days: 30
