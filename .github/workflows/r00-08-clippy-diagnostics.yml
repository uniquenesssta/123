name: R0-08 Clippy Diagnostics Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clippy-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: new-A
          fetch-depth: 1

      - name: Capture exact source context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r0-08-evidence/source
          git rev-parse HEAD > r0-08-evidence/head.txt
          git status --short > r0-08-evidence/worktree-status.txt
          cp crates/spreadsheet-io/src/match_review_workbook.rs r0-08-evidence/source/
          cp crates/spreadsheet-io/src/team_package.rs r0-08-evidence/source/
          cp crates/persistence-postgres/src/postmatch.rs r0-08-evidence/source/
          cp crates/persistence-postgres/src/release_acceptance.rs r0-08-evidence/source/
          {
            echo '=== validate_event_score_consistency ==='
            rg -n -C 8 'validate_event_score_consistency' crates/spreadsheet-io/src/match_review_workbook.rs
            echo
            echo '=== insert_postmatch_evaluation_sample_in_tx ==='
            rg -n -C 10 'insert_postmatch_evaluation_sample_in_tx' crates/persistence-postgres/src/postmatch.rs
            echo
            echo '=== PostmatchPartition ==='
            rg -n -C 10 'PostmatchPartition' crates/persistence-postgres/src/postmatch.rs
            echo
            echo '=== SettlementFingerprint ==='
            rg -n -C 8 'SettlementFingerprint' crates/persistence-postgres/src/postmatch.rs
            echo
            echo '=== relevant test names ==='
            rg -n 'postmatch|settlement|evidence|review_workbook|team_package' crates/spreadsheet-io crates/persistence-postgres --glob '*.rs'
          } > r0-08-evidence/references.txt

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: r00-08-clippy-diagnostics
          path: r0-08-evidence/**
          if-no-files-found: error
          retention-days: 30
