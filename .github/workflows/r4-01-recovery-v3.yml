name: R4-01 Recovery V3 Strict Gate

on:
  push:
    branches:
      - agent/r4-01-store-error-pool

permissions:
  contents: write

jobs:
  recovery-v3:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BASE_SHA: 4f8bc9a19fbbd9f52a36b6f94d6d819755482e8f
    steps:
      - name: Checkout R4-01 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4-01-store-error-pool
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Prepare transformed R4-01 tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          workflow = Path('.github/workflows/r4-01-hard-gate.yml').read_text(encoding='utf-8')

          def extract(filename: str) -> str:
              end_marker = f"          '@ | Set-Content -Path {filename} -Encoding UTF8"
              end = workflow.find(end_marker)
              if end < 0:
                  raise SystemExit(f'end marker missing: {filename}')
              candidates = ["          @'\n", "          @'\r\n"]
              starts = [(workflow.rfind(marker, 0, end), marker) for marker in candidates]
              start, marker = max(starts, key=lambda item: item[0])
              if start < 0:
                  raise SystemExit(f'start marker missing: {filename}')
              raw = workflow[start + len(marker):end]
              lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
              return '\n'.join(lines) + '\n'

          transform = extract('r4_01_transform.py')
          exec(compile(transform, 'r4_01_transform.py', 'exec'), {'__name__': '__main__'})

          baseline = extract('r4_01_baseline.py')
          stale = 'b378d734495c0846818e7cd06c30d93f69131231'
          base_blob = '44dcd594ac739ab341bd5009f613d5de6fd1aa1e'
          if stale not in baseline:
              raise SystemExit('stale integration runtime-source fingerprint missing')
          baseline = baseline.replace(stale, base_blob, 1)
          Path('r4_01_v3_baseline_payload.py').write_text(baseline, encoding='utf-8', newline='\n')
          '@ | Set-Content -Path r4_01_v3_prepare.py -Encoding UTF8
          python r4_01_v3_prepare.py
          Remove-Item r4_01_v3_prepare.py
          npm run prepare:cargo
          cargo fmt --all
          python r4_01_v3_baseline_payload.py
          Remove-Item r4_01_v3_baseline_payload.py

      - name: Prove immutable migration dependency and integration-test scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --exit-code $env:BASE_SHA -- crates/persistence-postgres/migrations
          git diff --exit-code $env:BASE_SHA -- crates/persistence-postgres/Cargo.toml crates/persistence-postgres/build.rs crates/persistence-postgres/tests/postgres_integration.rs Cargo.lock

      - name: Verify Persistence Foundation and frozen database contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run verify:persistence-foundation
          node scripts/verify-database-migration-compatibility.mjs
          node scripts/verify-database-reset.mjs
          node scripts/verify_database_baseline.mjs

      - name: Verify complete architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run verify:architecture

      - name: Verify rustfmt
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Check persistence crate
        shell: pwsh
        run: cargo check --locked -p football-persistence-postgres

      - name: Test persistence crate
        shell: pwsh
        run: cargo test --locked -p football-persistence-postgres

      - name: Clippy persistence crate
        shell: pwsh
        run: cargo clippy --locked -p football-persistence-postgres --all-targets -- -D warnings

      - name: Record verified R4-01 facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          workflow = Path('.github/workflows/r4-01-hard-gate.yml').read_text(encoding='utf-8')
          end_marker = "          '@ | Set-Content -Path r4_01_docs.py -Encoding UTF8"
          end = workflow.find(end_marker)
          if end < 0:
              raise SystemExit('docs end marker missing')
          candidates = ["          @'\n", "          @'\r\n"]
          starts = [(workflow.rfind(marker, 0, end), marker) for marker in candidates]
          start, marker = max(starts, key=lambda item: item[0])
          if start < 0:
              raise SystemExit('docs start marker missing')
          raw = workflow[start + len(marker):end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          script = '\n'.join(lines) + '\n'
          exec(compile(script, 'r4_01_docs.py', 'exec'), {'__name__': '__main__'})

          node = Path('docs/modular-rewrite/R04-persistence-foundation/R04-01-store-error-and-pool.md')
          text = node.read_text(encoding='utf-8')
          extra = '- 首轮 strict gate run `31613473804` 在提交前已通过 R4-01 专项、migration compatibility 与 reset 契约，但数据库静态 baseline 暴露 R0 对 `postgres_integration.rs` 的 runtime-source 指纹已陈旧；R4 起点实际 blob 为 `44dcd594ac739ab341bd5009f613d5de6fd1aa1e`。恢复 gate 以 `git diff --exit-code` 证明该测试文件、build.rs、Cargo.toml、Cargo.lock 与 0001–0046 migrations 对 R4 起点均零 diff，再仅刷新 runtime-source 指纹。Recovery V1/V2 只因临时 workflow 的嵌入脚本截取错误在验证前停止，均未提交生产源码。\n'
          marker2 = '## 兼容性\n'
          if extra not in text:
              text = text.replace(marker2, extra + '\n' + marker2, 1)
          node.write_text(text, encoding='utf-8', newline='\n')
          '@ | Set-Content -Path r4_01_v3_docs.py -Encoding UTF8
          python r4_01_v3_docs.py
          Remove-Item r4_01_v3_docs.py

      - name: Final architecture validation after docs
        shell: pwsh
        run: npm run verify:architecture

      - name: Commit only fully verified R4-01 tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r4-01-recovery-v3.yml .github/workflows/r4-01-hard-gate.yml .github/workflows/r4-01-scope-audit.yml
          git add crates/persistence-postgres/src scripts/verify-database-migration-compatibility.mjs scripts/verify-database-reset.mjs scripts/verify-persistence-foundation.mjs package.json architecture/database-baseline.json architecture/module-boundaries.json architecture/state-ownership.json README.md docs/modular-rewrite/R04-persistence-foundation
          git commit -m 'refactor(r4-01): modularize persistence foundation'
          git push origin HEAD:agent/r4-01-store-error-pool
