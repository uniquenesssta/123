name: R6-09 AT3 documented closeout

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-09-at3-closeout
  cancel-in-progress: true

env:
  AT3_PRODUCTION_SHA: "07a1d421a9903cc588b500aab2b9f6eb8d9a4bc7"
  AT3_VERIFICATION_RUN: "32231046269"

jobs:
  finalize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize R6-09 records
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AT3_PRODUCTION_SHA" HEAD
          python3 - <<'PY'
          from pathlib import Path
          import os

          prod = os.environ['AT3_PRODUCTION_SHA']
          run_id = os.environ['AT3_VERIFICATION_RUN']

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one closeout anchor, got {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          stage_path = 'docs/modular-rewrite/R06-entity-catalog-persistence/README.md'
          replace_once(
              stage_path,
              '| R6-09 | Archive / Delete / Force Delete | IN_PROGRESS |',
              '| R6-09 | Archive / Delete / Force Delete | DONE |',
          )
          replace_once(
              stage_path,
              '| R6-10 | Global Name Search | BLOCKED |',
              '| R6-10 | Global Name Search | READY |',
          )
          replace_once(
              stage_path,
              '- Atomic Task 1/2 已 `DONE` 并保留既有 PostgreSQL 16 / Windows 验收证据。Atomic Task 3：Team Force Delete 已完成模块 owner switch、Minimum Gate 与 AT1/AT2/AT3 focused PostgreSQL 16 contracts，当前等待完整 Windows Stage Regression 与 R6 retained PostgreSQL contracts；R6-09 继续 `IN_PROGRESS`，R6-10 继续 `BLOCKED`。',
              f'- Atomic Task 1/2/3 均已 `DONE`。AT3 生产提交 `{prod}` 的 Minimum Gate、focused PostgreSQL 16 contracts、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过（recovery workflow run `{run_id}`；Windows job `96000683932`、PostgreSQL job `96000683845` 均 `SUCCESS`）；R6-09 正式关闭，R6-10 Global Name Search 开放为 `READY`。用户现有 PostgreSQL 数据真实 sample/write 与 Windows Full 人工交互验收继续保留到最终统一验收。',
          )

          root_path = 'README.md'
          replace_once(
              root_path,
              '- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、配置、错误语义、安全确认、历史 P4/运行引用保护、普通永久删除和 force purge 用户可观察行为均未改变；无新增生产依赖。AT1/AT2 已独立关闭。AT3 Team Force Delete 已完成 owner switch、Minimum Gate 与 focused PostgreSQL 16 contracts；完整 Windows Stage Regression / R6 retained PostgreSQL contracts 尚待本 workflow 后续 jobs，R6-09 继续 `IN_PROGRESS`。',
              f'- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、配置、错误语义、安全确认、历史 P4/运行引用保护、普通永久删除和 force purge 用户可观察行为均未改变；无新增生产依赖。AT1/AT2/AT3 均已独立验证并关闭；AT3 生产提交 `{prod}` 的 Minimum Gate、focused PostgreSQL 16 contracts、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过（recovery workflow run `{run_id}`；Windows job `96000683932`、PostgreSQL job `96000683845` 均 `SUCCESS`）。R6-09 正式 `DONE`，R6-10 开放为 `READY`；用户现有 PostgreSQL 数据真实 sample/write 与 Windows Full 人工交互验收继续保留到最终统一验收。',
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence/README.md
          git commit -m "docs(r6-09): finalize force-delete verification"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence

  record-failure:
    if: ${{ always() && github.actor != 'github-actions[bot]' && needs.finalize-docs.result != 'success' }}
    needs: finalize-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record closeout failure
        shell: bash
        run: |
          set -euo pipefail
          cat > .r6-09-at3-closeout-failure.txt <<EOF
          run_id=$GITHUB_RUN_ID
          trigger_sha=$GITHUB_SHA
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .r6-09-at3-closeout-failure.txt
          git commit -m "ci(r6-09): record AT3 closeout failure"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
