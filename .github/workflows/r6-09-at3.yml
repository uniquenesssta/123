name: R6-09 AT3 verification recovery

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-09-at3
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.88.0"
  AT3_PRODUCTION_SHA: "07a1d421a9903cc588b500aab2b9f6eb8d9a4bc7"

jobs:
  windows-stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Verify recovery input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:AT3_PRODUCTION_SHA HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'crates/persistence-postgres/src/team_force_delete.rs') { throw 'legacy team_force_delete.rs still exists' }
          foreach ($path in @(
            'crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/operation.rs',
            'crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/targets.rs',
            'crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/counts.rs',
            'crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/execute.rs',
            'crates/persistence-postgres/tests/team_force_delete_repository_contract.rs'
          )) {
            if (-not (Test-Path $path)) { throw "missing AT3 owner: $path" }
          }
      - name: Windows stage regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-entity-deletion-persistence.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-force-team-delete.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  postgres-retained:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Verify recovery input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AT3_PRODUCTION_SHA" HEAD
          test ! -e crates/persistence-postgres/src/team_force_delete.rs
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/operation.rs
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/targets.rs
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/counts.rs
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/force_delete/execute.rs
          test -f crates/persistence-postgres/tests/team_force_delete_repository_contract.rs
      - name: Frozen architecture and database baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-entity-deletion-persistence.mjs
          node scripts/verify-force-team-delete.mjs
          npm run verify:architecture
          node scripts/verify-public-model-boundary.mjs
          node scripts/verify-protected-assets-deterministic.mjs
          node scripts/verify_database_baseline.mjs
          cargo fmt --all -- --check
          cargo check --locked -p football-persistence-postgres
          cargo test --locked -p football-persistence-postgres --lib
          cargo check --locked -p football-application
          git diff --check
      - name: R6 retained PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in \
            team_directory_detail_repository_contract \
            team_names_profiles_repository_contract \
            player_directory_detail_repository_contract \
            player_names_positions_repository_contract \
            player_team_periods_availability_repository_contract \
            player_abilities_dynamic_tags_repository_contract \
            coach_formation_repository_contract \
            entity_matching_references_repository_contract \
            entity_deletion_repository_contract \
            entity_permanent_delete_repository_contract \
            team_force_delete_repository_contract
          do
            cargo test --locked -p football-persistence-postgres --test "$contract" -- --ignored --test-threads=1
          done

  finalize:
    if: ${{ always() && github.actor != 'github-actions[bot]' && needs.windows-stage.result == 'success' && needs.postgres-retained.result == 'success' }}
    needs: [windows-stage, postgres-retained]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Close AT3 and R6-09
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AT3_PRODUCTION_SHA" HEAD
          python3 - <<'PY'
          from pathlib import Path
          import os

          prod = os.environ['AT3_PRODUCTION_SHA']
          run_id = os.environ['GITHUB_RUN_ID']

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one closeout anchor, got {text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          detail_path = 'docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md'
          replace_once(detail_path, '`IN_PROGRESS`', '`DONE`')
          replace_once(detail_path, '**状态：VERIFYING**', '**状态：DONE**')
          replace_once(
              detail_path,
              '- 新增 PostgreSQL 16 contract 覆盖预检、错误确认回滚、受引用球员/球队强制清除、external-ID 清理、审计墓碑与无关 provider 保留。AT3 Minimum Gate 与 focused PostgreSQL 16 contracts 已通过；完整 Windows Stage Regression 与 R6 retained PostgreSQL contracts 尚待本 workflow 后续 jobs，在成功前 AT3/R6-09 不关闭。',
              f'- AT3 生产提交 `{prod}`：Minimum Gate、focused PostgreSQL 16 contracts、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过（recovery workflow run `{run_id}`）。新增 contract 实际覆盖预检、错误确认回滚、受引用球员/球队强制清除、external-ID 清理、审计墓碑与无关 provider 保留；AT3 与 R6-09 据此关闭。用户现有 PostgreSQL 数据真实 sample/write 与 Windows Full 人工交互验收继续保留到最终统一验收。',
          )

          stage_path = 'docs/modular-rewrite/R06-entity-catalog-persistence/README.md'
          replace_once(
              stage_path,
              '| R6-09 | Archive / Delete / Force Delete | IN_PROGRESS |',
              '| R6-09 | Archive / Delete / Force Delete | DONE |',
          )
          replace_once(
              stage_path,
              '| R6-10 | Global Name Search | BLOCKED |',
              '| R6-10 | Global Name Search | READY |',
          )
          replace_once(
              stage_path,
              '- Atomic Task 1/2 已 `DONE` 并保留既有 PostgreSQL 16 / Windows 验收证据。Atomic Task 3：Team Force Delete 已完成模块 owner switch、Minimum Gate 与 AT1/AT2/AT3 focused PostgreSQL 16 contracts，当前等待完整 Windows Stage Regression 与 R6 retained PostgreSQL contracts；R6-09 继续 `IN_PROGRESS`，R6-10 继续 `BLOCKED`。',
              f'- Atomic Task 1/2/3 均已 `DONE`。AT3 生产提交 `{prod}` 的 Minimum Gate、focused PostgreSQL 16 contracts、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过（recovery workflow run `{run_id}`）；R6-09 正式关闭，R6-10 Global Name Search 开放为 `READY`。用户现有 PostgreSQL 数据真实 sample/write 与 Windows Full 人工交互验收继续保留到最终统一验收。',
          )

          root_path = 'README.md'
          replace_once(
              root_path,
              '- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、配置、错误语义、安全确认、历史 P4/运行引用保护、普通永久删除和 force purge 用户可观察行为均未改变；无新增生产依赖。AT1/AT2 已独立关闭。AT3 Team Force Delete 已完成 owner switch、Minimum Gate 与 focused PostgreSQL 16 contracts；完整 Windows Stage Regression / R6 retained PostgreSQL contracts 尚待本 workflow 后续 jobs，R6-09 继续 `IN_PROGRESS`。',
              f'- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、配置、错误语义、安全确认、历史 P4/运行引用保护、普通永久删除和 force purge 用户可观察行为均未改变；无新增生产依赖。AT1/AT2/AT3 均已独立验证并关闭；AT3 生产提交 `{prod}` 的 Minimum Gate、focused PostgreSQL 16 contracts、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过（recovery workflow run `{run_id}`）。R6-09 正式 `DONE`，R6-10 开放为 `READY`；用户现有 PostgreSQL 数据真实 sample/write 与 Windows Full 人工交互验收继续保留到最终统一验收。',
          )
          PY
          rm -f .r6-09-at3-recovery-failure.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence/README.md docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md .r6-09-at3-recovery-failure.txt
          git commit -m "docs(r6-09): close force-delete task"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence

  record-failure:
    if: ${{ always() && github.actor != 'github-actions[bot]' && (needs.windows-stage.result != 'success' || needs.postgres-retained.result != 'success' || needs.finalize.result != 'success') }}
    needs: [windows-stage, postgres-retained, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record recovery failure
        shell: bash
        env:
          WINDOWS_RESULT: ${{ needs.windows-stage.result }}
          POSTGRES_RESULT: ${{ needs.postgres-retained.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
        run: |
          set -euo pipefail
          cat > .r6-09-at3-recovery-failure.txt <<EOF
          run_id=$GITHUB_RUN_ID
          trigger_sha=$GITHUB_SHA
          windows_stage=$WINDOWS_RESULT
          postgres_retained=$POSTGRES_RESULT
          finalize=$FINALIZE_RESULT
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .r6-09-at3-recovery-failure.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(r6-09): record AT3 recovery failure"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
