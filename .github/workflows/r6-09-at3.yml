name: R6-09 AT3 cleanup barrier

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: read

concurrency:
  group: r6-09-at3
  cancel-in-progress: true

jobs:
  closeout-barrier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Stop superseded AT3 recovery runs
        run: echo "R6-09 AT3 is already verified; this one-time barrier only cancels superseded recovery runs before workflow cleanup."
