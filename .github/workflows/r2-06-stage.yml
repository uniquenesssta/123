# retry after registering review/postmatch directory policy
name: R2-06 Staged Migration Gate

on:
  push:
    branches:
      - new-B
    paths:
      - ".github/workflows/r2-06-stage.yml"

permissions:
  contents: write

concurrency:
  group: r2-06-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-finalize:
    name: Format, regenerate inventory, and verify R2-06
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache

    steps:
      - name: Checkout repository in parent-dependency layout
        uses: actions/checkout@v4
        with:
          path: 项目源码
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 项目源码 -> ../.cargo-target

      - name: Prepare parent development dependencies
        shell: pwsh
        working-directory: 项目源码
        run: npm run setup

      - name: Format migrated Rust sources
        shell: pwsh
        working-directory: 项目源码
        run: cargo fmt --all

      - name: Regenerate and verify Domain type inventory
        shell: pwsh
        working-directory: 项目源码
        run: |
          node scripts/generate-domain-type-inventory.mjs
          node scripts/verify-domain-type-inventory.mjs

      - name: Verify R2-06 Serde and module identity contracts
        shell: pwsh
        working-directory: 项目源码
        run: cargo test --locked -p football-domain --test serde_contracts

      - name: Verify architecture and protected assets
        shell: pwsh
        working-directory: 项目源码
        run: |
          npm run verify:architecture
          node scripts/verify-protected-assets-deterministic.mjs

      - name: Verify full frontend and Rust gates
        shell: pwsh
        working-directory: 项目源码
        run: |
          npm run verify:frontend
          npm run verify:rust

      - name: Commit validated R2-06 tree and remove temporary workflow
        shell: pwsh
        working-directory: 项目源码
        run: |
          Remove-Item ".github/workflows/r2-06-stage.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if (git diff --cached --quiet) {
            throw "R2-06 staged gate produced no finalization changes"
          }
          git commit -m "refactor(domain): finalize R2-06 generated inventory [skip ci]"
          git push origin HEAD:new-B
