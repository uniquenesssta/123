name: R2-04 Implementation Windows 2022

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  implement:
    if: "${{ github.event.head_commit.message == 'chore(r2): run R2-04 on Windows 2022 runner' }}"
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Execute canonical V3 migration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/r2-04-implement-final-v3.yml").read_text(encoding="utf-8").replace("\r\n", "\n")
          marker = "      - name: Apply R2-04 migration and validator path contracts\n"
          if source.count(marker) != 1:
              raise RuntimeError("Canonical V3 apply step not found exactly once")
          block = source.split(marker, 1)[1]
          run_marker = "        run: |\n"
          if block.count(run_marker) < 1:
              raise RuntimeError("Canonical V3 run block missing")
          block = block.split(run_marker, 1)[1]
          next_step = "\n      - name: Install frontend dependencies\n"
          if block.count(next_step) != 1:
              raise RuntimeError("Canonical V3 apply boundary mismatch")
          script = textwrap.dedent(block.split(next_step, 1)[0])
          Path("execute_v3_apply.ps1").write_text(script, encoding="utf-8", newline="\n")
          '@ | Set-Content extract_v3_apply.py -Encoding utf8
          python extract_v3_apply.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item extract_v3_apply.py -Force
          & pwsh -NoProfile -File execute_v3_apply.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item execute_v3_apply.ps1 -Force

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify targeted Serde and module path contracts
        run: cargo test --locked -p football-domain --test serde_contracts

      - name: Regenerate and verify Domain inventory
        shell: pwsh
        run: |
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify architecture and protected assets
        shell: pwsh
        run: |
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify frontend
        run: npm run verify:frontend

      - name: Verify Rust workspace
        run: npm run verify:rust

      - name: Commit R2-04 implementation
        shell: pwsh
        env:
          BASE_SHA: 3256454e9d76b7b442a83f25964363256257cbcc
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $remoteHead = (git ls-remote origin refs/heads/new-B).Split("`t")[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteHead -ne $env:GITHUB_SHA) { throw "new-B changed during R2-04 implementation" }

          git rm .github/workflows/r2-04-implement.yml .github/workflows/r2-04-implement-retry.yml .github/workflows/r2-04-implement-final.yml .github/workflows/r2-04-implement-final-v2.yml .github/workflows/r2-04-implement-final-v3.yml .github/workflows/r2-04-implement-windows-2022.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          import subprocess
          from pathlib import Path

          base = "3256454e9d76b7b442a83f25964363256257cbcc"
          fixed = {
              "README.md", "architecture/domain-migration-progress.json", "architecture/domain-type-inventory.json",
              "crates/domain/src/lib.rs", "crates/domain/src/lineup/chain.rs", "crates/domain/src/lineup/kind.rs",
              "crates/domain/src/lineup/mod.rs", "crates/domain/src/lineup/player.rs", "crates/domain/src/lineup/preset.rs",
              "crates/domain/src/lineup/snapshot.rs", "crates/domain/src/lineup_chain.rs",
              "crates/domain/src/match_record/catalog.rs", "crates/domain/src/match_record/mod.rs",
              "crates/domain/src/match_record/status.rs", "crates/domain/tests/serde_contracts/module_paths.rs",
              "docs/README.md", "docs/modular-rewrite/R02-domain-rewrite/R02-04-lineup-and-match.md",
              "docs/modular-rewrite/R02-domain-rewrite/README.md", "scripts/domain-inventory/target-module-policy.mjs",
          }
          def git(*args):
              return subprocess.check_output(["git", *args], text=True, encoding="utf-8").replace("\r\n", "\n")

          actual = set(git("diff", "--name-only", base).splitlines())
          unexpected = sorted(path for path in actual if path not in fixed and not (path.startswith("scripts/") and path.endswith(".mjs")))
          missing = sorted(fixed - actual)
          if unexpected or missing:
              print("Missing:", missing)
              print("Unexpected:", unexpected)
              raise RuntimeError("Unexpected R2-04 change set")
          if Path("README.md").read_bytes() != b"":
              raise RuntimeError("Root README must be exactly empty")
          docs = Path("docs/README.md").read_text(encoding="utf-8")
          if not docs.strip() or "R2-04 Lineup 与 Match" not in docs:
              raise RuntimeError("docs/README.md is not the canonical populated record")
          if any(Path(".github/workflows").glob("r2-04-implement*.yml")):
              raise RuntimeError("Temporary R2-04 workflow remains staged")
          '@ | Set-Content verify_r2_04_change_set.py -Encoding utf8
          python verify_r2_04_change_set.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item verify_r2_04_change_set.py -Force

          git commit -m "rewrite(r2): implement R2-04 lineup and match domains"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
