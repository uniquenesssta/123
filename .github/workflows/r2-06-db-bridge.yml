name: R2-06 DB bridge patch

on:
  push:
    branches: [new-B]
    paths: [.github/workflows/r2-06-db-bridge.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Wire compatibility bridge before SQLx migrator
        shell: pwsh
        run: |
          $path = 'crates/persistence-postgres/src/connection.rs'
          $text = Get-Content $path -Raw
          $oldUse = 'use super::{PersistenceError, PersistenceResult, PostgresStore};'
          $newUse = "use super::migration_compatibility::reconcile_known_legacy_migrations;`n$oldUse"
          if (-not $text.Contains($oldUse)) { throw 'connection.rs import anchor missing' }
          $text = $text.Replace($oldUse, $newUse)
          $oldMigrate = "    pub async fn migrate(&self) -> PersistenceResult<()> {`n        MIGRATOR.run(&self.pool).await?;"
          $newMigrate = "    pub async fn migrate(&self) -> PersistenceResult<()> {`n        reconcile_known_legacy_migrations(&self.pool).await?;`n        MIGRATOR.run(&self.pool).await?;"
          if (-not $text.Contains($oldMigrate)) { throw 'connection.rs migrate anchor missing' }
          $text = $text.Replace($oldMigrate, $newMigrate)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
      - name: Format and compile persistence crate
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo check --locked -p football-persistence-postgres
          cargo test --locked -p football-persistence-postgres migration_compatibility::tests::compatibility_allowlist_is_exact_and_checksums_are_sha384
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/persistence-postgres/src/connection.rs
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(database): run legacy bridge before sqlx migrations'
            git push origin HEAD:new-B
          }
