name: R5-03 Rule Package Owner Switch V2

on:
  push:
    branches:
      - agent/r5-03-rule-packages
    paths:
      - ".github/workflows/r5-03-owner-switch-v2.yml"

permissions:
  contents: write

jobs:
  switch-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply corrected owner switch from frozen helper source
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/r5-03-owner-switch.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          old = "pub(super) async fn upsert_rule_source_document("
          new = "pub(in crate::adapters::rules::packages) async fn upsert_rule_source_document("
          if script.count(old) != 1:
              raise SystemExit(f'expected exactly one visibility anchor, got {script.count(old)}')
          script = script.replace(old, new, 1)
          Path('/tmp/r5_03_owner_switch.py').write_text(script, encoding='utf-8')
          exec(compile(script, '/tmp/r5_03_owner_switch.py', 'exec'), {'__name__': '__main__'})
      - name: Verify owner switch before commit
        shell: bash
        run: |
          cargo fmt --all
          cargo check --locked -p football-persistence-postgres -p football-application
          node scripts/verify-rule-package-repository.mjs
      - name: Commit verified production owner switch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/persistence-postgres/src/adapters crates/persistence-postgres/src/routing.rs scripts/verify-competition-repository.mjs scripts/verify-rule-package-repository.mjs
          git commit -m "refactor(r5-03): split rule package persistence owner"
          git push origin HEAD:agent/r5-03-rule-packages
