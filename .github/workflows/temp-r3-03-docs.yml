name: Temporary R3-03 Docs Sync

on:
  push:
    branches:
      - rewrite/r3-03-competition-rules

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update root README deterministically
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          r3 = "- R3 已从 R2 完成提交 `7cf906b8f98ab0fdcf89f80952bc8fb9cf21801f` 建立独立分支 `new-C`。R3-01 Application Ports 与 R3-02 Database Service 已完成；R3-03 已将赛事层级、规则包与赛事绑定从旧根级职责文件重写到 `services/competition/`、`services/rules/` 及对应 `use_cases/`，删除旧 `competition.rs` 与 `rule_packages.rs`，并由 `ActiveDatabase` 在组合根实现 Competition/Rules Ports。数据库初始化与 bootstrap 的相关调用已切换到 Services，公共 ApplicationService/Tauri DTO、SQL/迁移、依赖与模型保护边界保持不变。Windows 2025 严格实施验证 run `31248365735` / job `93080599447` 已通过专项、完整 architecture、确定性模型保护指纹、Application check/tests 与 diff hygiene；R3-03 当前为 `VERIFYING`，等待用户 Windows 本机完整阶段回归和非破坏性运行时烟测，R3-04 继续 `BLOCKED`。"
          text, count = re.subn(r"^- R3 已从 R2 完成提交 .*?$", r3, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f"R3 根 README 摘要替换数量异常：{count}")

          status = "已创建 `R00-stage-completion.md`、`R01-stage-completion.md` 与 `R02-stage-completion.md`。R1、R2 阶段均已关闭；R3-01 Application Ports 与 R3-02 Database Service 状态均为 `DONE`，R3-03 Competition / Rules Services 为 `VERIFYING`，R3-04 Teams / Players Services 为 `BLOCKED`。详细状态见 `docs/modular-rewrite/R03-application-services/README.md`。"
          text, count = re.subn(r"^已创建 `R00-stage-completion\.md`.*?$", status, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f"R3 状态摘要替换数量异常：{count}")

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -
      - name: Verify README change and remove workflow
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path README.md -SimpleMatch 'R3-03 Competition / Rules Services 为 `VERIFYING`' | Out-Null
          Remove-Item .github/workflows/temp-r3-03-docs.yml
          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md .github/workflows/temp-r3-03-docs.yml
          git commit -m "docs(r3): summarize R3-03 implementation"
          git push origin HEAD:rewrite/r3-03-competition-rules
