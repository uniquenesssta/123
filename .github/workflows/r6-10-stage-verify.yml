name: R6-10 Stage Verification

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r6-10-stage-verify-${{ github.ref }}
  cancel-in-progress: false

env:
  R6_BRANCH: rewrite/r6-entity-catalog-persistence
  R6_10_PRODUCTION: fbe013b96f38d3c61e7b536e1ef67a89109c57c4

jobs:
  windows:
    name: Windows stage regression
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target
      - name: Confirm production commit
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:R6_10_PRODUCTION HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sync dependencies
        run: npm run setup
      - name: Frontend and static contracts
        run: npm run verify:frontend
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Diff hygiene
        run: git diff --check

  postgres:
    name: PostgreSQL 16 stage regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Confirm production commit
        shell: bash
        run: git merge-base --is-ancestor "$R6_10_PRODUCTION" HEAD
      - name: R6 ownership and frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-global-name-search.mjs
          node scripts/verify-domain-type-inventory.mjs
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify_database_baseline.mjs
      - name: R6-01 through R6-10 retained PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            team_directory_detail_repository_contract
            team_names_profiles_repository_contract
            player_directory_detail_repository_contract
            player_names_positions_repository_contract
            player_team_periods_availability_repository_contract
            player_abilities_dynamic_tags_repository_contract
            coach_formation_repository_contract
            entity_matching_references_repository_contract
            entity_deletion_repository_contract
            entity_permanent_delete_repository_contract
            team_force_delete_repository_contract
            global_name_search_repository_contract
          )
          for test_name in "${tests[@]}"; do
            test -f "crates/persistence-postgres/tests/${test_name}.rs"
            cargo test --locked -p football-persistence-postgres --test "$test_name" -- --ignored --nocapture
          done
      - name: Diff hygiene
        run: git diff --check

  record-success:
    name: Record R6-10 verification success
    needs: [windows, postgres]
    if: ${{ always() && needs.windows.result == 'success' && needs.postgres.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Save verification evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          win="$(jq -r '.jobs[] | select(.name=="Windows stage regression") | .id' <<<"$jobs" | head -n1)"
          pg="$(jq -r '.jobs[] | select(.name=="PostgreSQL 16 stage regression") | .id' <<<"$jobs" | head -n1)"
          test -n "$win" && test "$win" != null
          test -n "$pg" && test "$pg" != null
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "production=$R6_10_PRODUCTION"
            echo "windows_job=$win"
            echo "postgres_job=$pg"
            echo "windows=success"
            echo "postgres=success"
          } > .r6-10-verify-success.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .r6-10-verify-success.txt
          git commit -m 'ci(r6-10): record stage verification success'
          git push origin HEAD:"$R6_BRANCH"

  record-failure:
    name: Record R6-10 verification failure
    needs: [windows, postgres]
    if: ${{ always() && (needs.windows.result == 'failure' || needs.postgres.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Save failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "phase=stage"
            echo "production=$R6_10_PRODUCTION"
            echo "windows=${{ needs.windows.result }}"
            echo "postgres=${{ needs.postgres.result }}"
          } > .r6-10-failure.txt
          gh run view "$GITHUB_RUN_ID" --log-failed >> .r6-10-failure.txt 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .r6-10-failure.txt
          git commit -m 'ci(r6-10): record stage verification failure'
          git push origin HEAD:"$R6_BRANCH"
