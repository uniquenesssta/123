name: R2-02 Implement Competition Routing

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  implement:
    if: "${{ github.event.head_commit.message == 'chore(r2): bootstrap R2-02 implementation' }}"
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Apply R2-02 modular migration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem ".r2-02-payload/part*" | Sort-Object Name
          if ($parts.Count -ne 10) {
            throw "Expected 10 R2-02 payload parts, found $($parts.Count)"
          }
          $base64 = ($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) }) -join ""
          $bytes = [Convert]::FromBase64String($base64)
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($digest -ne "25ebcd14d9581b4c357fdb4119cc2b29a026ec2714d31804ceabb26add835e88") {
            throw "R2-02 payload digest mismatch: $digest"
          }
          $scriptPath = "scripts/r2-02-apply.py"
          [System.IO.File]::WriteAllBytes($scriptPath, $bytes)
          $scriptText = [System.IO.File]::ReadAllText($scriptPath)
          $oldAncestry = @'
              parent = run("git", "rev-parse", "HEAD^")
              if parent != BASE_SHA:
                  raise RuntimeError(f"unexpected bootstrap parent: {parent}")
          '@.TrimEnd()
          $newAncestry = @'
              merge_base = run("git", "merge-base", "HEAD", BASE_SHA)
              if merge_base != BASE_SHA:
                  raise RuntimeError(f"unexpected bootstrap ancestry: {merge_base}")
          '@.TrimEnd()
          $oldAncestry = $oldAncestry.Replace("`r`n", "`n")
          $newAncestry = $newAncestry.Replace("`r`n", "`n")
          if (($scriptText.Split($oldAncestry).Count - 1) -ne 1) {
            throw "R2-02 ancestry guard did not match exactly once"
          }
          $scriptText = $scriptText.Replace($oldAncestry, $newAncestry)
          [System.IO.File]::WriteAllText($scriptPath, $scriptText, [System.Text.UTF8Encoding]::new($false))
          Add-Content -Path ".git/info/exclude" -Value "scripts/r2-02-apply.py"
          python -m py_compile $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "scripts/__pycache__" -Recurse -Force -ErrorAction SilentlyContinue
          python $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Format migrated Rust modules
        shell: pwsh
        run: cargo fmt --all

      - name: Regenerate Domain inventory
        shell: pwsh
        run: node scripts/generate-domain-type-inventory.mjs

      - name: Verify R2-02 module and Serde contracts
        shell: pwsh
        run: cargo test --locked -p football-domain --test serde_contracts

      - name: Verify architecture and migration progress
        shell: pwsh
        run: npm run verify:architecture

      - name: Verify protected model assets
        shell: pwsh
        run: node scripts/verify-protected-assets-deterministic.mjs

      - name: Verify full frontend gate
        shell: pwsh
        run: npm run verify:frontend

      - name: Verify full Rust gate
        shell: pwsh
        run: npm run verify:rust

      - name: Record implementation verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $taskPath = "docs/modular-rewrite/R02-domain-rewrite/R02-02-competition-and-routing.md"
          $text = [System.IO.File]::ReadAllText($taskPath)
          $old = @'
          ## 5. 验证计划

          - `cargo test --locked -p football-domain --test serde_contracts`
          - `node scripts/generate-domain-type-inventory.mjs`
          - `node scripts/verify-domain-type-inventory.mjs`
          - `npm run verify:architecture`
          - `node scripts/verify-protected-assets-deterministic.mjs`
          - `npm run verify:frontend`
          - `npm run verify:rust`
          - 最终实施提交上的正式 `Public Platform CI` Windows Automated

          正式 Windows Automated 完成前保持 `VERIFYING`，R2-03 保持 `BLOCKED`。
          '@.Trim()
          $new = @"
          ## 5. 实际验证

          Windows 实施 workflow run ``$env:GITHUB_RUN_ID`` 已实际通过：

          - ``cargo test --locked -p football-domain --test serde_contracts``：通过。
          - ``node scripts/generate-domain-type-inventory.mjs``：通过。
          - ``node scripts/verify-domain-type-inventory.mjs``：通过。
          - ``npm run verify:architecture``：通过。
          - ``node scripts/verify-protected-assets-deterministic.mjs``：通过。
          - ``npm run verify:frontend``：通过。
          - ``npm run verify:rust``：通过。
          - 临时实施 workflow 与脚本在提交前删除：通过。

          最终实施提交上的正式 ``Public Platform CI`` Windows Automated 尚待确认；完成前保持 ``VERIFYING``，R2-03 保持 ``BLOCKED``。
          "@.Trim()
          if (($text.Split($old).Count - 1) -ne 1) {
            throw "R2-02 validation section did not match exactly once"
          }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($taskPath, $text, [System.Text.UTF8Encoding]::new($false))

          $stagePath = "docs/modular-rewrite/R02-domain-rewrite/README.md"
          $stage = [System.IO.File]::ReadAllText($stagePath)
          $stageOld = '| R2-02 | Competition 与 Routing | VERIFYING | [`R02-02-competition-and-routing.md`](R02-02-competition-and-routing.md) | 专项、架构、前端和 Rust 门禁执行中 |'
          $stageNew = "| R2-02 | Competition 与 Routing | VERIFYING | [``R02-02-competition-and-routing.md``](R02-02-competition-and-routing.md) | 实施 run ``$env:GITHUB_RUN_ID`` 已通过；正式 Windows Automated 待确认 |"
          if (($stage.Split($stageOld).Count - 1) -ne 1) {
            throw "R2 stage row did not match exactly once"
          }
          $stage = $stage.Replace($stageOld, $stageNew)
          [System.IO.File]::WriteAllText($stagePath, $stage, [System.Text.UTF8Encoding]::new($false))

          $readmePath = "README.md"
          $readme = [System.IO.File]::ReadAllText($readmePath)
          $readmeOld = '专项与全量门禁执行中，状态为 `VERIFYING`，正式 Windows Automated 通过前 R2-03 保持 `BLOCKED`。'
          $readmeNew = "专项与全量门禁 run ``$env:GITHUB_RUN_ID`` 已通过，状态为 ``VERIFYING``；正式 Windows Automated 通过前 R2-03 保持 ``BLOCKED``。"
          if (($readme.Split($readmeOld).Count - 1) -ne 1) {
            throw "root README R2-02 validation text did not match exactly once"
          }
          $readme = $readme.Replace($readmeOld, $readmeNew)
          [System.IO.File]::WriteAllText($readmePath, $readme, [System.Text.UTF8Encoding]::new($false))

      - name: Commit verified R2-02 implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item "scripts/r2-02-apply.py" -Force
          git rm .github/workflows/r2-02-implement.yml
          git rm -r .r2-02-payload
          git add -A
          git diff --cached --check

          $base = "43029b3ca5c6e61ea6ff81d74a1fb489d398ad48"
          $expected = @(
            'README.md',
            'architecture/domain-migration-progress.json',
            'architecture/domain-type-inventory.json',
            'crates/domain/src/competition/catalog.rs',
            'crates/domain/src/competition/kind.rs',
            'crates/domain/src/competition/mod.rs',
            'crates/domain/src/competition/profile.rs',
             'crates/domain/src/competition/round.rs',
            'crates/domain/src/competition/rule_package.rs',
            'crates/domain/src/competition/season.rs',
             'crates/domain/src/competition/stage.rs',
            'crates/domain/src/lib.rs',
            'crates/domain/src/routing/binding.rs',
             'crates/domain/src/routing/context.rs',
            'crates/domain/src/routing/identity.rs',
            'crates/domain/src/routing/mod.rs',
            'crates/domain/src/routing/route.rs',
            'crates/domain/src/routing/rules.rs',
            'crates/domain/tests/serde_contracts.rs',
            'crates/domain/tests/serde_contracts/module_paths.rs',
            'docs/modular-rewrite/R02-domain-rewrite/R02-02-competition-and-routing.md',
            'docs/modular-rewrite/R02-domain-rewrite/README.md',
            'scripts/domain-inventory/target-module-policy.mjs',
            'scripts/verify-domain-type-inventory.mjs'
          ) | Sort-Object
          $actual = @(git diff --name-only $base | Sort-Object)
          $difference = Compare-Object $expected $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Host
            throw "Unexpected R2-02 final change set"
          }

          git commit -m "rewrite(r2): implement R2-02 competition routing domains"
          git push origin HEAD:new-B
