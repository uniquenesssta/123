name: R4-04 Port Adapter Scope Audit

on:
  push:
    branches:
      - agent/r4-04-port-adapter-registration
    paths:
      - .github/workflows/r4-04-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-04-port-adapter-registration
          fetch-depth: 0
      - name: Audit stale adapter-owner validators
        shell: bash
        run: |
          set -euo pipefail
          echo '=== branch diff ==='
          git -c core.quotePath=false diff --name-status b508d1ff7808b8735694cf1e57a4d603f2e973e3...HEAD
          echo '=== ActiveDatabase references in verification scripts ==='
          grep -RIn --include='*.mjs' --include='*.js' 'ActiveDatabase' scripts || true
          echo '=== transition_store references in verification scripts ==='
          grep -RIn --include='*.mjs' --include='*.js' 'transition_store' scripts || true
          echo '=== port_registry impl-owner assertions ==='
          grep -RIn --include='verify-*-service.mjs' -E 'port_registry|registry\.includes\(|impl .*Port for ' scripts || true
          echo '=== persistence concrete-target assertions ==='
          grep -RIn --include='*.mjs' -E 'PostgresStore as PersistenceStore|PersistenceStore|register_adapters' scripts | head -n 400 || true
