name: R4-04 Port Adapter Scope Audit

on:
  push:
    branches:
      - agent/r4-04-port-adapter-registration
    paths:
      - .github/workflows/r4-04-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-04-port-adapter-registration
          fetch-depth: 0
      - name: Audit application session type boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ActiveDatabase references outside composition ==='
          grep -RIn --include='*.rs' 'ActiveDatabase' crates/application/src | grep -v 'crates/application/src/composition/' || true
          echo '=== ActiveDatabase references inside composition ==='
          grep -RIn --include='*.rs' 'ActiveDatabase' crates/application/src/composition || true
          echo '=== verifier concrete persistence bans ==='
          grep -RIn --include='verify-*-service.mjs' -E 'forbiddenTokens|PersistenceStore|football_persistence_postgres|PostgresStore' scripts | head -n 400 || true
