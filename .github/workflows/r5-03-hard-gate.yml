name: R5-03 Rule Package Hard Gate

on:
  push:
    branches:
      - agent/r5-03-rule-packages
    paths:
      - ".github/workflows/r5-03-hard-gate.yml"

permissions:
  contents: read

jobs:
  hard-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify R5 ownership and full architecture
        run: |
          node scripts/verify-rule-package-repository.mjs
          npm run verify:architecture
      - name: Verify protected model boundaries
        run: |
          node scripts/verify-public-model-boundary.mjs
          node scripts/verify_protected_assets.mjs
      - name: Verify canonical Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Persistence and Application
        run: cargo check --locked -p football-persistence-postgres -p football-application
      - name: Test Persistence
        run: cargo test --locked -p football-persistence-postgres
      - name: Test Application
        run: cargo test --locked -p football-application
      - name: Re-run identical Rule Package PostgreSQL contract
        run: cargo test --locked -p football-persistence-postgres --test rule_package_repository_contract -- --ignored --test-threads=1
