name: R1-04 Tauri composition apply

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-apply.yml
      - scripts/r1-04-apply.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Install dependencies
        run: npm ci

      - name: Apply and verify R1-04
        shell: pwsh
        run: |
          $source = [System.IO.File]::ReadAllText("scripts/r1-04-apply.mjs", [System.Text.Encoding]::UTF8)
          $architectureOld = "run(npm,['run','verify:architecture']);"
          $architectureReplacement = "run(process.execPath,['scripts/architecture/verifyModuleBoundaries.mjs']);run(process.execPath,['scripts/architecture/verifyStateOwnership.mjs']);run(process.execPath,['scripts/architecture/verifyProtectedImports.mjs']);"
          $formatOld = "run('cargo',['fmt','--all']);"
          $formatReplacement = "run('rustfmt',['--edition','2021','src-tauri/src/bootstrap/mod.rs','src-tauri/src/bootstrap/application.rs','src-tauri/src/bootstrap/state.rs','src-tauri/src/bootstrap/command_registry.rs','src-tauri/src/bootstrap/error.rs','src-tauri/src/lib.rs','src-tauri/src/commands.rs']);"
          if (-not $source.Contains($architectureOld)) {
            throw "R1-04 architecture invocation anchor missing"
          }
          if (-not $source.Contains($formatOld)) {
            throw "R1-04 format invocation anchor missing"
          }
          $patched = $source.Replace($architectureOld, $architectureReplacement).Replace($formatOld, $formatReplacement)
          $executionPath = Join-Path $env:GITHUB_WORKSPACE ".git\r1-04-apply.mjs"
          [System.IO.File]::WriteAllText($executionPath, $patched, [System.Text.UTF8Encoding]::new($false))
          node $executionPath
