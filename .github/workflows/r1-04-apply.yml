name: R1-04 Tauri composition apply

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-apply.yml
      - scripts/r1-04-apply.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Install dependencies
        run: npm ci

      - name: Apply and verify R1-04
        run: node scripts/r1-04-apply.mjs
