name: R5-01 README Patch

on:
  push:
    branches:
      - agent/r5-01-competitions-repository
    paths:
      - ".github/workflows/r5-01-readme-patch.yml"

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-01-competitions-repository
          fetch-depth: 0
      - name: Patch exact R4/R5 summary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'^- R4 Persistence 基础设施阶段已正式关闭为 `DONE`。.*?(?=\n- 开发依赖布局已外置：)',
              re.MULTILINE | re.DOTALL,
          )
          replacement = (
              '- R4 Persistence 基础设施阶段已正式关闭为 `DONE`。R4-04 已由 PR #25 squash merge `b97587c9d20165018f80040dc2a2c098dbbec177` 收口；hard gate `31712193150`、PR CI `31717901248` / job `94507174688`、post-merge stage CI `31724131556` / job `94528167665` 均 `SUCCESS`。真实 PostgreSQL broad diagnostic `31728096953` 执行 18 个 ignored tests 为 14/18，并安全通过临时 test DB destructive reset；4 个失败如实保留为 3 个既有过期业务夹具与 1 个 R4 排除范围内的既有 P4 timestamp 精度问题。R4 专项 PostgreSQL gate `31729577225` / job `94546316946` 在空库真实验证 0001–0046、health/stats、audit 失败回滚与成功提交原子性，1/1 PASS。临时数据库/runner-only test/workflow 已清理，未触及用户数据库。最终 closeout HEAD `615dc952491d5e0e21d4979292cbf5170eedece6` 的 canonical Public Platform CI run `31768264193` / Windows automated delivery gate job `94668577704` 为 `SUCCESS`。\n'
              '- R5-01 Competitions Repository 已将 `create/read/list/delete competition` 从旧 `crates/persistence-postgres/src/competitions.rs` 拆入 `adapters/competition/directory/` 与 `detail/`；Competition typed Row 与 Domain Mapper 分离，多表 soft delete 使用具名 transaction 子目录，旧文件只保留 R5-02/R5-05 尚未迁移的 hierarchy/context 职责。未修改 Application Port、Tauri DTO/命令、Schema、0001–0046 migration、路由算法、model identity、Cargo 依赖或模型保护资产。旧实现 PostgreSQL contract baseline run `31772436658` / job `94680947724` 为 `SUCCESS`；新实现的 Persistence 80/80、Application 33/33、PostgreSQL contract 1/1、完整 architecture 均已通过，Windows frontend run `31773777077` / job `94684879652` 与 Windows workspace Rust run `31773900831` / job `94685243308` 也均 `SUCCESS`。18 个既有 broad PostgreSQL ignored tests 与 destructive reset 未在 R5-01 执行。当前保持 `VERIFYING`，等待 clean PR CI、合并与 merged stage CI；详见 `docs/modular-rewrite/R05-competition-routing-persistence/R05-01-competitions-repository.md`。'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one R4 summary block, found {len(matches)}')
          path.write_text(pattern.sub(replacement, text, count=1), encoding='utf-8')
          PY
          test "$(git diff --name-only | tr -d '\r')" = "README.md"
          git diff --check
      - name: Commit README only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --name-only | grep -qx 'README.md'
          git commit -m "docs(r5-01): record competitions repository verification"
          git push origin HEAD:agent/r5-01-competitions-repository
