name: R5-04 Sync Verifying Documentation

on:
  push:
    branches:
      - agent/r5-04-competition-bindings
    paths:
      - ".github/workflows/r5-04-sync-docs.yml"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-04-competition-bindings
      - name: Update stage index and root README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          task = Path("docs/modular-rewrite/R05-competition-routing-persistence/R05-04-competition-bindings.md")
          task_text = task.read_text(encoding="utf-8")
          if "`VERIFYING`" not in task_text or "31862969585" not in task_text:
              raise SystemExit("R5-04 task record is not ready for VERIFYING documentation sync")

          stage = Path("docs/modular-rewrite/R05-competition-routing-persistence/README.md")
          text = stage.read_text(encoding="utf-8")
          if "| R5-04 | Competition Bindings | READY |" not in text:
              raise SystemExit("R5-04 READY row not found in stage README")
          text = text.replace("| R5-04 | Competition Bindings | READY |", "| R5-04 | Competition Bindings | VERIFYING |", 1)
          section_lines = [
              "## R5-04 当前事实",
              "",
              "- 详细记录：[`R05-04-competition-bindings.md`](R05-04-competition-bindings.md)。",
              "- Competition Binding persistence 已从旧 `crates/persistence-postgres/src/routing.rs` 收敛到 `adapters/competition/bindings/`；typed Row/Domain Mapper、package metadata read、list/detail、create transaction 与 type-default transaction 均按职责拆分。",
              "- 旧 `routing.rs` 已删除全部 R5-04 create/list/default/read/package metadata/dynamic mapper/query builder，不保留 Binding 转发壳；R5-05 `resolve_route` 与 R5-06 model registration 保持原 owner，`competitions.rs` 中 R5-05 context/scope helper 同样未迁移。",
              "- Domain 实际只存在 Competition / Season / Stage / CompetitionKind type-default 四种 Binding scope；本节点未新增不存在的 Round Binding 语义。",
              "- 旧 owner PostgreSQL 16 contract run `31862339200` / job `94957776614` 为 `SUCCESS`；new owner minimum gate run `31862713824` / job `94958748006` 使用同一 contract 并 `SUCCESS`。",
              "- owner switch run `31862539782` / job `94958314365` 为 `SUCCESS`，生产切换提交 `2bd703d4b1624e8b73712d1f549e5d4b0f7a80f9`。",
              "- official Domain inventory refresh run `31862856576` / job `94959096109` 为 `SUCCESS`，仅使用项目官方 generator/drift verifier；Domain 365、公共兼容 365、PostgreSQL mapping 299。",
              "- 第一轮 minimum gate `31862639885` 因 R5-03 旧 verifier 仍要求 Binding 留在 `routing.rs` 而 fail-fast；第一轮 stage hard gate `31862890012` 因 R4-03 mapping verifier 仍要求 `routing.rs` 直接调用共享 CompetitionKind parser 而 fail-fast。两处均只推进 owner/call-path 断言到 R5-04 实际边界，没有删除或弱化原架构约束。",
              "- 第二轮 stage hard gate run `31862969585` / job `94959376165` 为 `SUCCESS`：完整 architecture、public/protected model boundary、rustfmt、Persistence/Application check/tests 与同一 PostgreSQL 16 Binding contract 全部通过。",
              "- R5-04 当前保持 `VERIFYING`；需清理 transient workflow、完成 clean PR canonical CI、固定 HEAD merge、merged stage CI 与最终 closeout canonical CI 后，才可标记 `DONE` 并开放 R5-05 `READY`。",
              "",
          ]
          section = "\n".join(section_lines) + "\n"
          marker = "## 兼容与限制\n"
          if "## R5-04 当前事实" not in text:
              if marker not in text:
                  raise SystemExit("stage compatibility marker not found")
              text = text.replace(marker, section + marker, 1)
          old_lines = [
              "- R5-03 未执行 destructive database reset，也未触碰用户数据库；专用 Rule Package contract 使用临时 PostgreSQL 16 测试数据库。",
              "- 既有 `postgres_integration.rs` 18 个 ignored broad PostgreSQL tests 未在 R5-03 执行。",
              "- R5-03 已正式关闭为 `DONE`，R5-04 已开放为 `READY`；本 closeout 仅更新文档，closeout HEAD 仍需通过 canonical Public Platform CI 后才作为 R5-04 起始基线。",
          ]
          new_lines = [
              "- R5-04 未执行 destructive database reset，也未触碰用户数据库；专用 Competition Binding contract 使用 GitHub Actions 临时 PostgreSQL 16 测试数据库。",
              "- 既有 `postgres_integration.rs` 18 个 ignored broad PostgreSQL tests 未在 R5-04 执行。",
              "- R5-04 未改变 Application Port、Tauri 命令/DTO、Schema、0001–0046 migration、配置、错误/日志语义、前端行为、R5-05 route algorithm/result、R5-06 model identity、Cargo manifests/Cargo.lock、生产依赖或模型保护资产。",
              "- R5-04 当前为 `VERIFYING`，R5-05 继续 `BLOCKED`；clean PR 与合并后 canonical Windows 交付门禁尚未完成。",
          ]
          old = "\n".join(old_lines)
          if old not in text:
              raise SystemExit("stage old compatibility block not found")
          text = text.replace(old, "\n".join(new_lines), 1)
          stage.write_text(text, encoding="utf-8")

          root = Path("README.md")
          lines = root.read_text(encoding="utf-8").splitlines()
          if any(line.startswith("- R5-04 Competition Bindings ") for line in lines):
              raise SystemExit("root README already contains R5-04 line")
          indexes = [i for i, line in enumerate(lines) if line.startswith("- R5-03 Rule Packages ")]
          if len(indexes) != 1:
              raise SystemExit(f"expected one R5-03 root README line, got {len(indexes)}")
          r504 = "- R5-04 Competition Bindings 已完成生产 owner 切换并进入 `VERIFYING`：Binding create/list/detail/type-default 与 package route metadata 已从旧 `crates/persistence-postgres/src/routing.rs` 拆入 `adapters/competition/bindings/`，typed `sqlx::FromRow` Row、Domain Mapper、validation、单目的 SQL helper 与具名 transaction 均按职责分离；旧文件不保留 Binding 转发壳，R5-05 `resolve_route`/competition context 与 R5-06 model registration 未提前迁移。旧 owner PostgreSQL 16 contract run `31862339200` / job `94957776614` 为 `SUCCESS`，new owner minimum gate `31862713824` / job `94958748006` 与第二轮 hard gate `31862969585` / job `94959376165` 均使用同一 contract 并 `SUCCESS`；官方 inventory run `31862856576` / job `94959096109` 为 `SUCCESS`。第一轮 minimum/hard gate 暴露的 R5-03/R4-03 旧 owner 路径断言已按实际阶段边界推进，未弱化架构约束。Domain/Application/Tauri/Schema/0001–0046 migration、配置/错误/日志、前端行为、route result/model identity、Cargo manifests/Cargo.lock、生产依赖与模型保护资产保持不变。18 个既有 broad PostgreSQL ignored tests 与 destructive reset 未在本节点执行，未触碰用户数据库。当前等待 transient workflow 清理、clean PR canonical CI、固定 HEAD merge、merged stage CI 与最终 closeout；详见 `docs/modular-rewrite/R05-competition-routing-persistence/R05-04-competition-bindings.md`。"
          lines.insert(indexes[0] + 1, r504)
          root.write_text("\n".join(lines) + "\n", encoding="utf-8")

          subprocess.run(["git", "diff", "--check"], check=True)
          expected = {"README.md", "docs/modular-rewrite/R05-competition-routing-persistence/README.md"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected documentation diff: {sorted(actual)}")
          PY
      - name: Commit documentation sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R05-competition-routing-persistence/README.md
          git commit -m "docs(r5-04): mark binding node verifying"
          git push origin HEAD:agent/r5-04-competition-bindings
