name: R6-03 Refresh Domain Inventory

on:
  push:
    branches:
      - agent/r6-03-player-directory-detail
    paths:
      - .github/workflows/r6-03-refresh-domain-inventory.yml

permissions:
  contents: write

jobs:
  refresh-domain-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r6-03-player-directory-detail
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Regenerate official domain type inventory
        run: node scripts/generate-domain-type-inventory.mjs
      - name: Review generated scope
        shell: bash
        run: |
          git status --short
          git diff -- architecture/domain-type-inventory.json
          changed="$(git status --short --untracked-files=no | awk '{print $2}')"
          if [ -n "$changed" ] && [ "$changed" != "architecture/domain-type-inventory.json" ]; then
            echo "Unexpected generated changes: $changed" >&2
            exit 1
          fi
      - name: Commit refreshed inventory when required
        shell: bash
        run: |
          if git diff --quiet -- architecture/domain-type-inventory.json; then
            echo "Domain type inventory already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/domain-type-inventory.json
          git commit -m "chore(r6-03): refresh domain type inventory"
          git push origin HEAD:agent/r6-03-player-directory-detail
