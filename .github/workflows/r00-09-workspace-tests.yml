name: R0-09 Workspace Tests Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: new-A
          fetch-depth: 2

      - name: Install Tauri Linux system packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install locked Node dependencies
        run: npm ci

      - name: Apply exact R0-09 test fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r0-09-evidence
          python - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path("crates/application/src/openai_research.rs"),
                  '''        assert!(built_in_research_prompt()
                      .content
                      .contains("do not calculate probabilities"));''',
                  '''        assert!(built_in_research_prompt()
                      .content
                      .to_ascii_lowercase()
                      .contains("do not calculate probabilities"));''',
              ),
              (
                  Path("crates/spreadsheet-io/src/team_package.rs"),
                  '''        sheet.set_name("球员与评分").expect("set player sheet name");
                  write_key_row(sheet, PLAYER_KEYS).expect("write player keys");''',
                  '''        sheet.set_name("球员与评分").expect("set player sheet name");
                  write_group_row(sheet, &[(0, 1, "操作")]).expect("write player group row");
                  write_key_row(sheet, PLAYER_KEYS).expect("write player keys");''',
              ),
          ]

          for path, old, new in changes:
              text = path.read_text(encoding="utf-8")
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  path.write_text(text.replace(old, new), encoding="utf-8")
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f"Unexpected replacement state for {path}: old={old_count}, new={new_count}"
                  )
          PY
          printf 'apply_state=applied\n' > r0-09-evidence/summary.txt
          cargo fmt --all
          git diff --check
          git diff --name-only | sort > r0-09-evidence/changed-files.txt
          cat > r0-09-evidence/expected-files.txt <<'EOF'
          crates/application/src/openai_research.rs
          crates/spreadsheet-io/src/team_package.rs
          EOF
          diff -u r0-09-evidence/expected-files.txt r0-09-evidence/changed-files.txt
          git diff --stat > r0-09-evidence/diff-stat.txt
          git diff > r0-09-evidence/r0-09.patch

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p football-application openai_research::tests::built_in_gateway_is_strict_and_has_no_secret --lib 2>&1 | tee r0-09-evidence/openai-research-test.txt
          cargo test --locked -p football-spreadsheet-io team_package::tests::physical_worksheet_row_number_survives_blank_rows --lib 2>&1 | tee r0-09-evidence/team-package-row-test.txt

      - name: Run all workspace tests without fail-fast
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee r0-09-evidence/workspace-tests.txt
          printf 'workspace_tests_exit_code=0\n' >> r0-09-evidence/summary.txt

      - name: Run exact Rust verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:rust 2>&1 | tee r0-09-evidence/exact-verify-rust.txt
          printf 'exact_verify_rust_exit_code=0\n' >> r0-09-evidence/summary.txt

      - name: Commit verified R0-09 changes and remove temporary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/application/src/openai_research.rs \
            crates/spreadsheet-io/src/team_package.rs
          git rm \
            .github/r0-09-workspace-tests.patch \
            .github/workflows/r00-09-workspace-tests.yml
          git commit -m 'test(r00-09): close Rust workspace test gate'
          git push origin HEAD:new-A
          git rev-parse HEAD > r0-09-evidence/implementation-commit.txt

      - name: Upload R0-09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r00-09-workspace-tests-final
          path: r0-09-evidence/**
          if-no-files-found: error
          retention-days: 30
