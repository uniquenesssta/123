name: R1-03 browser composition close

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-03-close.yml
      - scripts/r1-03-close.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  close:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify evidence and close R1-03
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          $sourcePath = Resolve-Path "scripts/r1-03-close.py"
          $executionPath = Join-Path $env:GITHUB_WORKSPACE ".git\r1-03-close.py"
          $script = [System.IO.File]::ReadAllText($sourcePath.Path, [System.Text.Encoding]::UTF8)
          $script = $script.Replace("EVIDENCE_HEAG", "EVIDENCE_HEAD")
          [System.IO.File]::WriteAllText($executionPath, $script, [System.Text.UTF8Encoding]::new($false))
          python $executionPath
