name: R6-04 stage hard gate

on:
  push:
    branches:
      - agent/r6-04-player-names-positions

permissions:
  contents: read

jobs:
  windows-stage-regression:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Install locked frontend dependencies
        shell: pwsh
        run: npm run setup

      - name: Verify frontend aggregate
        shell: pwsh
        run: npm run verify:frontend

      - name: Verify Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Verify workspace Clippy
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Verify workspace tests
        shell: pwsh
        run: cargo test --locked --workspace

  postgres-contract-and-architecture:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_04_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_04_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/football_r6_04_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Verify retained and current R6 ownership
        shell: bash
        run: |
          node scripts/verify-team-directory-detail.mjs
          node scripts/verify-team-names-profiles.mjs
          node scripts/verify-player-directory-detail.mjs
          node scripts/verify-player-names-positions.mjs

      - name: Verify architecture and protected assets
        shell: bash
        run: |
          npm run verify:architecture
          node scripts/verify-public-model-boundary.mjs
          node scripts/verify-protected-assets-deterministic.mjs
          node scripts/verify-database-migration-compatibility.mjs

      - name: Run R6-03 retained PostgreSQL contract
        shell: bash
        run: cargo test --locked -p football-persistence-postgres --test player_directory_detail_repository_contract -- --ignored --nocapture

      - name: Run R6-04 PostgreSQL contract
        shell: bash
        run: cargo test --locked -p football-persistence-postgres --test player_names_positions_repository_contract -- --ignored --nocapture
