name: R3-07 Atomic Task 1 Closeout

on:
  push:
    branches:
      - rewrite/r3-07-research-service

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-07-research-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize Atomic Task 1 records
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rootPath = 'README.md'
          $root = Get-Content -Raw -Encoding UTF8 $rootPath
          $anchor = '- 第三次正式 Public CI run `31296232974` 已确认旧文件读取问题消失，但发现 verifier 将 `p4_snapshot` 内部 `freeze/read` 误按公共 Application 方法名断言。已改为检查真实内部 `freeze/read` 入口及 `P4FreezeExecutionPort` 调用，同时继续由 facade/service 断言公共 `freeze_p4_prematch_snapshot/read_p4_prematch_snapshot` 契约。修复门禁 run `31296338770` 通过后提交本记录。'
          $final = '- Atomic Task 1 已正式关闭为 `DONE`。clean 正式 HEAD `ad53bd6c8cdbd93c9e58a38642ae4d22c7d32df7` 的 Public Platform CI run `31296372108` / Windows Automated job `93201993026` 已全部通过：architecture、完整 Windows automated acceptance 与 validation evidence upload 均为 SUCCESS；此前 AT1 hard gate run `31295528438` 已通过 Research Service 专项、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests。最终 artifact `9033265259` 大小 `14252405` 字节，SHA-256 `730bc98ba24dca2955c7100975ed79fd10a66919fd74a713ec061bddd3b44b59`。AT1 施工和 verifier 修复临时 workflow / 脚本均已清理；R3-07 继续为 `IN_PROGRESS`，OpenAI Research、Fact Pipeline、P4 Research worker 与人工冲突裁决留给后续 Atomic Tasks。'
          if (-not $root.Contains($anchor)) { throw 'root README AT1 final anchor not found' }
          if (-not $root.Contains('Atomic Task 1 已正式关闭为 `DONE`')) {
            $root = $root.Replace($anchor, "$anchor`n$final")
          }
          Set-Content -Path $rootPath -Value $root -Encoding UTF8 -NoNewline

          $indexPath = 'docs/modular-rewrite/R03-application-services/README.md'
          $index = Get-Content -Raw -Encoding UTF8 $indexPath
          $indexAnchor = '- 第三次正式 Public CI run `31296232974` 发现 `p4_snapshot` 内部职责名为 `freeze/read`，并非公共 facade 方法名；验证器已改为检查真实内部入口及 Port 委托，公共 Application API 仍由 facade/service 断言。修复门禁 run `31296338770` 通过后提交。'
          $indexFinal = '- Atomic Task 1 已正式关闭为 `DONE`。正式 HEAD `ad53bd6c8cdbd93c9e58a38642ae4d22c7d32df7` 的 Public Platform CI run `31296372108` / Windows Automated job `93201993026` 已通过 architecture、完整 Windows automated acceptance 与 evidence upload；AT1 hard gate run `31295528438` 已通过 Research 专项、Ports、architecture、Application check/tests、workspace Clippy/tests。artifact `9033265259` 大小 `14252405` 字节，SHA-256 `730bc98ba24dca2955c7100975ed79fd10a66919fd74a713ec061bddd3b44b59`。临时施工与 verifier 修复 workflow / 脚本均已清理；R3-07 保持 `IN_PROGRESS`，下一 Atomic Task 尚未开始。'
          if (-not $index.Contains($indexAnchor)) { throw 'R03 AT1 final anchor not found' }
          if (-not $index.Contains('Atomic Task 1 已正式关闭为 `DONE`')) {
            $index = $index.Replace($indexAnchor, "$indexAnchor`n$indexFinal")
          }
          Set-Content -Path $indexPath -Value $index -Encoding UTF8 -NoNewline
      - name: Verify AT1 closeout
        shell: pwsh
        run: |
          npm run verify:research-service
          npm run verify:database-service
          npm run verify:prediction-service
          npm run verify:application-ports
          npm run verify:architecture
          git diff --check
          Select-String -Path README.md -SimpleMatch 'Atomic Task 1 已正式关闭为 `DONE`' | Out-Null
          Select-String -Path docs/modular-rewrite/R03-application-services/README.md -SimpleMatch '| R3-07 | Research Service | IN_PROGRESS |' | Out-Null
      - name: Commit clean AT1 closeout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-07-at1-closeout.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add README.md docs/modular-rewrite/R03-application-services/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "docs(r3): close Research Atomic Task 1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-07-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
