name: R6 Final Stage Exit

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r6-final-stage-exit-${{ github.ref }}
  cancel-in-progress: false

env:
  R6_BRANCH: rewrite/r6-entity-catalog-persistence
  R6_STAGE_START: 7512ee805fcba8cac3c8f334680f200d625808c0
  R6_PRODUCTION: 809cfb429ec31c165616e65e1b6169f928ee4dcb

jobs:
  windows:
    name: Windows final automated acceptance
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: 项目源码
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 项目源码 -> ../.cargo-target
      - name: Confirm R6 production ancestor and retired owner
        shell: pwsh
        working-directory: 项目源码
        run: |
          git merge-base --is-ancestor $env:R6_PRODUCTION HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "crates/persistence-postgres/src/entity_catalog.rs") { throw "entity_catalog.rs must be retired before R6 exit" }
      - name: Verify architecture
        shell: pwsh
        working-directory: 项目源码
        run: npm run verify:architecture
      - name: Run official Windows automated acceptance
        shell: pwsh
        working-directory: 项目源码
        run: |
          & ".\scripts\windows-acceptance.ps1" -Mode Automated -ProjectRoot "$env:GITHUB_WORKSPACE" -LogDirectory "logs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-final-windows-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/**
            .cargo-target/release/bundle/**

  postgres:
    name: PostgreSQL 16 final R6 regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Confirm R6 production and completion prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$R6_PRODUCTION" HEAD
          test ! -e crates/persistence-postgres/src/entity_catalog.rs
          test ! -e scripts/r6-stage-exit-apply.py
          for task in 01 02 03 04 05 06 07 08 09 10; do
            grep -Eq "^\| R6-${task} \|.*\| DONE \|$" docs/modular-rewrite/R06-entity-catalog-persistence/README.md
          done
      - name: Verify architecture and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify_database_baseline.mjs
          node scripts/verify-domain-type-inventory.mjs
          git diff --check
      - name: Run R6-01 through R6-10 retained PostgreSQL contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            team_directory_detail_repository_contract
            team_names_profiles_repository_contract
            player_directory_detail_repository_contract
            player_names_positions_repository_contract
            player_team_periods_availability_repository_contract
            player_abilities_dynamic_tags_repository_contract
            coach_formation_repository_contract
            entity_matching_references_repository_contract
            entity_deletion_repository_contract
            entity_permanent_delete_repository_contract
            team_force_delete_repository_contract
            global_name_search_repository_contract
          )
          for test_name in "${tests[@]}"; do
            test -f "crates/persistence-postgres/tests/${test_name}.rs"
            cargo test --locked -p football-persistence-postgres --test "$test_name" -- --ignored --nocapture
          done

  finalize:
    name: Close R6 stage
    needs: [windows, postgres]
    if: ${{ always() && needs.windows.result == 'success' && needs.postgres.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Resolve successful job evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          win="$(jq -r '.jobs[] | select(.name=="Windows final automated acceptance") | .id' <<<"$jobs" | head -n1)"
          pg="$(jq -r '.jobs[] | select(.name=="PostgreSQL 16 final R6 regression") | .id' <<<"$jobs" | head -n1)"
          test -n "$win" && test "$win" != null
          test -n "$pg" && test "$pg" != null
          echo "WIN_JOB_ID=$win" >> "$GITHUB_ENV"
          echo "PG_JOB_ID=$pg" >> "$GITHUB_ENV"
      - name: Generate R6 stage completion
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          stage_start = os.environ["R6_STAGE_START"]
          production = os.environ["R6_PRODUCTION"]
          run_id = os.environ["RUN_ID"]
          win_job = os.environ["WIN_JOB_ID"]
          pg_job = os.environ["PG_JOB_ID"]
          stage_dir = Path("docs/modular-rewrite/R06-entity-catalog-persistence")
          stage_readme = stage_dir / "README.md"
          root_readme = Path("README.md")
          completion = stage_dir / "R06-stage-completion.md"

          if completion.exists():
              raise SystemExit("R06-stage-completion.md already exists")

          groups = {"A": [], "M": [], "D": [], "R": []}
          diff_lines = subprocess.check_output(
              ["git", "diff", "--name-status", f"{stage_start}..{production}"],
              text=True,
          ).splitlines()
          for line in diff_lines:
              parts = line.split("\t")
              key = parts[0][0]
              if key == "R":
                  groups["R"].append(f"{parts[1]} -> {parts[2]}")
              elif key in groups:
                  groups[key].append(parts[1])

          def file_table(title, values):
              if not values:
                  return f"## {title}\n\n无。\n\n"
              rows = "\n".join(f"| `{value}` |" for value in values)
              return f"## {title}\n\n共 {len(values)} 项。\n\n| 文件 |\n|---|\n{rows}\n\n"

          tasks = [
              ("01", "Team Directory 与 Detail", "R06-01-team-directory-and-detail.md"),
              ("02", "Team Names 与 Profiles", "R06-02-team-names-and-profiles.md"),
              ("03", "Player Directory 与 Detail", "R06-03-player-directory-and-detail.md"),
              ("04", "Player Names 与 Positions", "R06-04-player-names-and-positions.md"),
              ("05", "Team Periods 与 Availability", "R06-05-team-periods-and-availability.md"),
              ("06", "Abilities 与 Dynamic Tags", "R06-06-abilities-and-dynamic-tags.md"),
              ("07", "Coaches 与 Formation Usage", "R06-07-coaches-and-formation-usage.md"),
              ("08", "Entity Matching 与 References", "R06-08-entity-matching-and-references.md"),
              ("09", "Archive / Delete / Force Delete", "R06-09-archive-delete-and-force-delete.md"),
              ("10", "Global Name Search", "R06-10-global-name-search.md"),
          ]
          task_rows = []
          for number, name, filename in tasks:
              if not (stage_dir / filename).exists():
                  raise SystemExit(f"missing {filename}")
              task_rows.append(
                  f"| R6-{number} | {name} | [`{filename}`]({filename}) | DONE |"
              )

          completion_lines = [
              "# R06 阶段完成记录",
              "",
              "- 阶段状态：`DONE`",
              f"- R6 起点：`{stage_start}`",
              f"- R6 最终生产代码：`{production}`",
              f"- 最终出口验证：run `{run_id}` / Windows job `{win_job}` / PostgreSQL 16 job `{pg_job}`",
              "- 目标平台：Windows + PostgreSQL 16",
              "",
              "## 1. 阶段目标与完成结论",
              "",
              "R6-01 至 R6-10 均已 `DONE`。Teams、Players、Coaches、Formations、Abilities、Dynamic Tags、Availability、Entity Matching、References、Deletion 与 Global Search persistence 已收敛到 `crates/persistence-postgres/src/adapters/catalog/`。",
              "",
              "阶段出口残留的 Team Detail player-period projection、Position reference list 与 season-team membership option read 已进入对应 catalog owner；旧 `entity_catalog.rs` 已删除。`player_catalog.rs` 只保留 R7 Match/Lineup 范围职责。",
              "",
              f"公共 Port/DTO、Tauri 命令、Schema、0001–0046 migrations、配置、错误语义、UI、模型保护资产与生产依赖保持兼容。最终出口 run `{run_id}` 的 Windows job `{win_job}` 与 PostgreSQL 16 job `{pg_job}` 均 `SUCCESS`，R6 满足出口条件。",
              "",
              "## 2. 已完成节点索引",
              "",
              "| 任务 | 范围 | 记录 | 状态 |",
              "|---|---|---|---|",
              *task_rows,
              "",
              "## 3. 最终职责边界",
              "",
              "- `teams/`：Team directory/detail、names、profiles 与 player-period projection。",
              "- `players/`：Player directory/detail、names、positions、team periods、position reference 与 season-team membership read。",
              "- `availability/`、`abilities/`、`dynamic_tags/`：Player signals。",
              "- `coaches/`、`formations/`：Coach 与 formation persistence。",
              "- `entity_matching/`、`references/`：实体匹配与引用。",
              "- `deletion/`：preflight、archive、safe/permanent/force delete。",
              "- `global_search/`：统一名称搜索。",
              "- `player_catalog.rs` 剩余 Match/Lineup 职责归 R7。",
              "",
              "## 4. 最终验证",
              "",
              f"- Windows job `{win_job}`：`verify:architecture` + 官方 `windows-acceptance.ps1 -Mode Automated`，覆盖 frontend、Rust、release build 与 runtime smoke。",
              f"- PostgreSQL 16 job `{pg_job}`：architecture、protected assets、database baseline、Domain inventory 与 R6-01～R6-10 的 12 个 retained contracts。",
              f"- 残留 owner 前置门禁已通过完整 architecture、97/97 Persistence unit tests 与 3 个 focused PostgreSQL contracts；生产收尾 `{production}`。",
              "",
              "## 5. 兼容与保护结论",
              "",
              "- 中文/英文/历史名/别名/重音/多关键词检索与稳定分页保持。",
              "- 默认战术角色与位置映射保持。",
              "- 删除引用不破坏历史 P4/运行引用；force purge 保持审计与显式确认。",
              "- 同源 ID matching 规则保持。",
              "- 模型保护区与 0001–0046 migrations 未修改；无新增生产依赖。",
              "",
          ]
          document = "\n".join(completion_lines) + "\n"
          document += file_table("6. 实际新增文件", groups["A"])
          document += file_table("7. 实际修改文件", groups["M"])
          document += file_table("8. 实际移动或重命名文件", groups["R"])
          document += file_table("9. 实际删除文件", groups["D"])
          document += (
              "## 10. 阶段出口与下一阶段\n\n"
              "R6 正式关闭为 `DONE`。R7 可从 R6 closeout HEAD 建立唯一阶段分支；"
              "Match/Lineup persistence 不再计入 R6。\n"
          )
          completion.write_text(document, encoding="utf-8")

          stage_text = stage_readme.read_text(encoding="utf-8")
          if "`IN_PROGRESS`" not in stage_text:
              raise SystemExit("R6 stage is not IN_PROGRESS")
          stage_text = stage_text.replace("`IN_PROGRESS`", "`DONE`", 1)
          start_marker = stage_text.find("## R6 阶段出口收尾")
          end_marker = stage_text.find("## R6-10 当前事实")
          if start_marker < 0 or end_marker <= start_marker:
              raise SystemExit("R6 stage exit block missing")
          stage_block = "\n".join([
              "## R6 阶段完成",
              "",
              "- 阶段完成记录：[`R06-stage-completion.md`](R06-stage-completion.md)。",
              f"- 生产收尾 `{production}` 已删除旧 `entity_catalog.rs` 并迁出最后三条 R6 read owner；`player_catalog.rs` 的 Match/Lineup 职责留给 R7。",
              f"- 最终出口 run `{run_id}`：Windows job `{win_job}` 与 PostgreSQL 16 job `{pg_job}` 均 `SUCCESS`。R6 正式 `DONE`，R7 开放。",
              "",
              "",
          ])
          stage_readme.write_text(
              stage_text[:start_marker] + stage_block + stage_text[end_marker:],
              encoding="utf-8",
          )

          root_text = root_readme.read_text(encoding="utf-8")
          root_start = root_text.find("### R6 Stage Exit Cleanup")
          root_end = root_text.find("### R6-10 Global Name Search")
          if root_start < 0 or root_end <= root_start:
              raise SystemExit("root R6 exit block missing")
          root_block = "\n".join([
              "### R6 Stage Complete",
              "",
              "- R6-01～R6-10 与阶段出口收尾均完成；Entity Catalog persistence 已收敛到 `adapters/catalog/`，旧 `entity_catalog.rs` 删除，`player_catalog.rs` 只保留 R7 Match/Lineup 职责。阶段记录：`docs/modular-rewrite/R06-entity-catalog-persistence/R06-stage-completion.md`。",
              f"- 最终生产代码 `{production}` 经 run `{run_id}` 验证：Windows job `{win_job}` 官方 Automated acceptance 与 PostgreSQL 16 job `{pg_job}` 的 12 个 retained contracts 均 `SUCCESS`。公共契约、0001–0046 migrations、UI、模型保护资产与生产依赖保持兼容；R6 正式 `DONE`，R7 开放。",
              "",
              "",
          ])
          root_readme.write_text(
              root_text[:root_start] + root_block + root_text[root_end:],
              encoding="utf-8",
          )
          PY
          git diff --check
      - name: Commit final R6 closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r6-final-exit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence
          git diff --cached --check
          git commit -m 'docs(r6): close entity catalog persistence stage'
          git push origin HEAD:"$R6_BRANCH"

  record-failure:
    name: Record R6 final failure
    needs: [windows, postgres]
    if: ${{ always() && (needs.windows.result == 'failure' || needs.postgres.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Persist failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          win="$(jq -r '.jobs[] | select(.name=="Windows final automated acceptance") | .id' <<<"$jobs" | head -n1)"
          pg="$(jq -r '.jobs[] | select(.name=="PostgreSQL 16 final R6 regression") | .id' <<<"$jobs" | head -n1)"
          cat > .r6-final-run.txt <<EOF
          run_id=$GITHUB_RUN_ID
          trigger_sha=$GITHUB_SHA
          production=$R6_PRODUCTION
          phase=failed
          windows=${{ needs.windows.result }}
          windows_job=$win
          postgres=${{ needs.postgres.result }}
          postgres_job=$pg
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .r6-final-run.txt
          git commit -m 'ci(r6): record final stage failure' || true
          git push origin HEAD:"$R6_BRANCH"
