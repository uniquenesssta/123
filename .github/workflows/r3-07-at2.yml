name: R3-07 Fact Pipeline Migration

on:
  push:
    branches:
      - rewrite/r3-07-at2-staging

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-07-at2-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Generate Atomic Task 2
        shell: pwsh
        run: python scripts/r3-07-at2.py
      - name: Format generated Rust
        shell: pwsh
        run: cargo fmt --all
      - name: Capture Research verifier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          & npm run verify:research-service *> diagnostics/r3-07-at2-research-verifier.txt
          $code = $LASTEXITCODE
          Get-Content diagnostics/r3-07-at2-research-verifier.txt
          if ($code -ne 0) { exit $code }
      - name: Persist failed verifier output
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/r3-07-at2-research-verifier.txt
          git commit -m "chore(r3): capture AT2 Research verifier failure"
          git push origin HEAD:rewrite/r3-07-at2-staging
