          prediction = [t for t in r2_05 if t["targetModule"] == "prediction"]
          research = [t for t in r2_05 if t["targetModule"] == "research"]
          if len(r2_05) != 75 or len(prediction) != 48 or len(research) != 27:
              raise RuntimeError("Final R2-05 inventory counts do not match 75/48/27")
          if any(not t["currentPath"].startswith("crates/domain/src/prediction/") for t in prediction):
              raise RuntimeError("Prediction type remains outside prediction directory")
          if any(not t["currentPath"].startswith("crates/domain/src/research/") for t in research):
              raise RuntimeError("Research type remains outside research directory")

          task_path = "docs/modular-rewrite/R02-domain-rewrite/R02-05-prediction-and-research-外围领域.md"
          task = read(task_path).replace("- 任务状态：`IMPLEMENTING`", "- 任务状态：`VERIFYING`")
          task += f"\n## 7. 实施结果\n\n- R2-05A 已迁移 Prediction 48 个类型并通过阶段专项门禁。\n- R2-05B 已迁移 Research 27 个类型并通过阶段专项及完整前端/Rust 回归门禁。\n- 实施 workflow run `{run_id}`。\n- 旧 `p4_orchestration.rs`、`p4_persistence.rs`、`p4_workbench.rs`、`prediction_readiness.rs`、`fact_pipeline.rs`、`research_gateway.rs` 已删除，不保留转发文件或双实现。\n- 根级公共类型路径、Serde、数据库映射、Application/Tauri 调用与模型保护边界保持不变。\n- 正式 Windows Automated 在最终实施源码树通过前，本节点保持 `VERIFYING`，R2-06 保持 `BLOCKED`。\n"
