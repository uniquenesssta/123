name: R2-05 Staged Domain Migration

on:
  push:
    branches:
      - "rewrite/r2-05-prediction-research"

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'chore(r2): run R2-05 staged migration' }}"
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout R2-05 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rewrite/r2-05-prediction-research

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Prepare repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: R2-05A migrate Prediction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import json
          import re

          ROOT = Path(".")

          def read(path):
              return Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.rstrip() + "\n", encoding="utf-8", newline="\n")

          def item_span(text, needle, occurrence=0):
              matches = [m.start() for m in re.finditer(re.escape(needle), text)]
              if len(matches) <= occurrence:
                  raise RuntimeError(f"Missing item {needle} occurrence {occurrence}")
              idx = matches[occurrence]
              start = text.rfind("\n", 0, idx) + 1
              while start > 0:
                  prev_end = start - 1
                  prev_start = text.rfind("\n", 0, prev_end) + 1
                  prev = text[prev_start:prev_end].strip()
                  if prev.startswith("#["):
                      start = prev_start
                  else:
                      break
              brace = text.find("{", idx)
              if brace < 0:
                  raise RuntimeError(f"No opening brace for {needle}")
              depth = 0
              in_string = False
              escape = False
              for pos in range(brace, len(text)):
                  ch = text[pos]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = pos + 1
                          while end < len(text) and text[end] in " \t":
                              end += 1
                          if end < len(text) and text[end] == ";":
                              end += 1
                          if end < len(text) and text[end] == "\n":
                              end += 1
                          return start, end
              raise RuntimeError(f"Unclosed item {needle}")

          def extract(text, needle, occurrence=0):
              start, end = item_span(text, needle, occurrence)
              return text[start:end].strip()

          def remove(text, needle, occurrence=0):
              start, end = item_span(text, needle, occurrence)
              return text[:start] + text[end:]

          def const(text, name):
              m = re.search(rf"(?m)^pub const {re.escape(name)}[^\n]*$", text)
              if not m:
                  raise RuntimeError(f"Missing const {name}")
              return m.group(0)

          def join(imports, blocks):
              body = "\n\n".join(block.strip() for block in blocks if block.strip())
              return imports.rstrip() + "\n\n" + body + "\n"

          lib = read("crates/domain/src/lib.rs")
          orchestration = read("crates/domain/src/p4_orchestration.rs")
          persistence = read("crates/domain/src/p4_persistence.rs")
          workbench = read("crates/domain/src/p4_workbench.rs")
          readiness = read("crates/domain/src/prediction_readiness.rs")
          inventory_before = json.loads(read("architecture/domain-type-inventory.json"))
          prediction_types = sorted(t["typeName"] for t in inventory_before["types"] if t["targetTask"] == "R2-05" and t["targetModule"] == "prediction")
          if len(prediction_types) != 48:
              raise RuntimeError(f"Prediction scope drift: {len(prediction_types)}")

          write("crates/domain/src/prediction/mod.rs", """mod context;
          mod horizon;
          mod orchestration;
          mod persistence;
          mod readiness;
          mod result;
          mod workbench;

          pub use context::*;
          pub use horizon::*;
          pub use orchestration::*;
          pub use persistence::*;
          pub use readiness::*;
          pub use result::*;
          pub use workbench::*;
          """)

          write("crates/domain/src/prediction/context.rs", join(
              "use crate::CompetitionKind;\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(lib, "pub struct MatchContext")],
          ))
          write("crates/domain/src/prediction/result.rs", join(
              "use crate::ModelIdentity;\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(lib, "pub struct PredictionSummary"), extract(lib, "pub struct PersistedModelRun")],
          ))
          write("crates/domain/src/prediction/horizon.rs", join(
              "use chrono::{DateTime, Duration, Utc};\nuse serde::{Deserialize, Serialize};",
              [extract(persistence, "pub enum P4Horizon"), extract(persistence, "impl P4Horizon"), extract(orchestration, "impl P4Horizon")],
          ) + "\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use chrono::TimeZone;\n\n    #[test]\n    fn canonical_horizon_cutoffs_are_exact() {\n        let kickoff = Utc.with_ymd_and_hms(2026, 7, 20, 12, 0, 0).single().expect(\"valid kickoff\");\n        assert_eq!(P4Horizon::T24h.data_cutoff_at(kickoff), Some(kickoff - Duration::hours(24)));\n        assert_eq!(P4Horizon::T6h.data_cutoff_at(kickoff), Some(kickoff - Duration::hours(6)));\n        assert_eq!(P4Horizon::T90m.data_cutoff_at(kickoff), Some(kickoff - Duration::minutes(90)));\n        assert_eq!(P4Horizon::T1h.data_cutoff_at(kickoff), Some(kickoff - Duration::hours(1)));\n        assert_eq!(P4Horizon::LegacyTN.data_cutoff_at(kickoff), None);\n    }\n}\n")

          orchestration_consts = [
              const(orchestration, "P4_ORCHESTRATION_CONTRACT_VERSION"),
              const(orchestration, "P4_ORCHESTRATION_PLANNER_VERSION"),
              const(orchestration, "P4_RESEARCH_LEAD_MINUTES"),
              const(orchestration, "P4_FREEZE_GRACE_MINUTES"),
          ]
          write("crates/domain/src/prediction/orchestration/mod.rs", "mod planning;\nmod readiness;\nmod state;\nmod task;\n\npub use planning::*;\npub use readiness::*;\npub use state::*;\npub use task::*;\n\n" + "\n".join(orchestration_consts))
          state_text = join("use serde::{Deserialize, Serialize};", [extract(orchestration, "pub enum P4FreezeTaskState"), extract(orchestration, "impl P4FreezeTaskState")])
          state_text += "\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn ready_to_freeze_requires_successful_research_path() {\n        assert!(P4FreezeTaskState::ResearchSucceeded.can_transition_to(P4FreezeTaskState::ReadyToFreeze));\n        assert!(P4FreezeTaskState::ResearchPartial.can_transition_to(P4FreezeTaskState::ResearchSucceeded));\n        assert!(P4FreezeTaskState::Blocked.can_transition_to(P4FreezeTaskState::ResearchSucceeded));\n        assert!(!P4FreezeTaskState::ResearchPartial.can_transition_to(P4FreezeTaskState::ReadyToFreeze));\n        assert!(P4FreezeTaskState::ReadyToFreeze.can_transition_to(P4FreezeTaskState::Freezing));\n        assert!(P4FreezeTaskState::Freezing.can_transition_to(P4FreezeTaskState::Frozen));\n        assert!(P4FreezeTaskState::ResearchSucceeded.can_transition_to(P4FreezeTaskState::Missed));\n        assert!(P4FreezeTaskState::ReadyToFreeze.can_transition_to(P4FreezeTaskState::Failed));\n    }\n\n    #[test]\n    fn frozen_task_is_terminal() {\n        assert!(P4FreezeTaskState::Frozen.is_terminal());\n        assert!(!P4FreezeTaskState::Frozen.can_transition_to(P4FreezeTaskState::Freezing));\n    }\n}\n"
          write("crates/domain/src/prediction/orchestration/state.rs", state_text)
          write("crates/domain/src/prediction/orchestration/planning.rs", join(
              "use super::super::P4Horizon;\nuse crate::CompetitionKind;\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse uuid::Uuid;",
              [extract(orchestration, "pub struct P4PlanningMatchContext"), extract(orchestration, "pub struct PlanP4HorizonsCommand")],
          ))
          write("crates/domain/src/prediction/orchestration/task.rs", join(
              "use super::super::P4Horizon;\nuse super::P4FreezeTaskState;\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(orchestration, "pub struct P4FreezeTaskDraft"), extract(orchestration, "pub struct P4FreezeTaskRecord"), extract(orchestration, "pub struct P4FreezeTaskEventRecord"), extract(orchestration, "pub struct P4FreezeTaskTransition")],
          ))
          write("crates/domain/src/prediction/orchestration/readiness.rs", join(
              "use serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(orchestration, "pub struct P4FreezeReadiness"), extract(orchestration, "pub struct P4RoutedFact")],
          ))

          persistence_consts = [
              const(persistence, "P4_PERSISTENCE_CONTRACT_VERSION"),
              const(persistence, "P4_EVIDENCE_SCHEMA_VERSION"),
              const(persistence, "P4_SNAPSHOT_SCHEMA_VERSION"),
              const(persistence, "P4_FEATURE_FIELD_COUNT"),
          ]
          write("crates/domain/src/prediction/persistence/mod.rs", "mod evidence;\nmod research;\nmod snapshot;\nmod version;\n\npub use evidence::*;\npub use research::*;\npub use snapshot::*;\npub use version::*;\n\n" + "\n".join(persistence_consts))
          write("crates/domain/src/prediction/persistence/version.rs", join(
              "use crate::CompetitionKind;\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(persistence, "pub struct SchemaVersionDraft"), extract(persistence, "pub struct SchemaVersionRecord"), extract(persistence, "pub struct PromptVersionDraft"), extract(persistence, "pub struct PromptVersionRecord"), extract(persistence, "pub struct CompetitionProfileVersionDraft"), extract(persistence, "pub struct CompetitionProfileVersionRecord")],
          ))
          write("crates/domain/src/prediction/persistence/research.rs", join(
              "use super::super::P4Horizon;\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(persistence, "pub enum ResearchRunStatus"), extract(persistence, "impl ResearchRunStatus"), extract(persistence, "pub struct ResearchRunDraft"), extract(persistence, "pub struct ResearchRunRecord"), extract(persistence, "pub struct ResearchRunEventDraft")],
          ))
          write("crates/domain/src/prediction/persistence/evidence.rs", join(
              "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(persistence, "pub enum EvidenceVerificationState"), extract(persistence, "impl EvidenceVerificationState"), extract(persistence, "pub struct EvidenceClaimDraft"), extract(persistence, "pub struct EvidenceClaimRecord"), extract(persistence, "pub struct EvidenceConflictDraft"), extract(persistence, "pub struct EvidenceConflictRecord")],
          ))
          write("crates/domain/src/prediction/persistence/snapshot.rs", join(
              "use super::super::P4Horizon;\nuse super::EvidenceVerificationState;\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(persistence, "pub enum SnapshotSourceKind"), extract(persistence, "impl SnapshotSourceKind"), extract(persistence, "pub struct SnapshotFeatureDraft"), extract(persistence, "pub struct SnapshotProbabilityDraft"), extract(persistence, "fn default_matrix_cell_count"), extract(persistence, "pub struct PrematchSnapshotDraft"), extract(persistence, "pub struct PrematchSnapshotRecord"), extract(persistence, "pub struct PrematchSnapshotBundle")],
          ))

          write("crates/domain/src/prediction/workbench/mod.rs", "mod conflict;\nmod workspace;\n\npub use conflict::*;\npub use workspace::*;\n\n" + const(workbench, "P4_WORKBENCH_CONTRACT_VERSION"))
          write("crates/domain/src/prediction/workbench/workspace.rs", join(
              "use super::super::{P4FreezeReadiness, P4FreezeTaskEventRecord, P4FreezeTaskRecord, P4RoutedFact, PrematchSnapshotBundle};\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(workbench, "pub struct P4MatchWorkspace"), extract(workbench, "pub struct P4ResearchRunWorkspace"), extract(workbench, "pub struct P4EvidenceWorkspaceRecord"), extract(workbench, "pub struct P4ConflictWorkspaceRecord"), extract(workbench, "pub struct P4TaskWorkspace")],
          ))
          write("crates/domain/src/prediction/workbench/conflict.rs", join(
              "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(workbench, "pub enum P4ManualConflictDecisionKind"), extract(workbench, "impl P4ManualConflictDecisionKind"), extract(workbench, "pub struct ResolveP4ConflictCommand"), extract(workbench, "pub struct P4ManualRouteOverrideDraft"), extract(workbench, "pub struct P4ManualRouteOverrideRecord")],
          ))

          write("crates/domain/src/prediction/readiness/mod.rs", "mod level;\nmod report;\n\npub use level::*;\npub use report::*;\n\n" + const(readiness, "PREDICTION_INPUT_AUDIT_VERSION"))
          write("crates/domain/src/prediction/readiness/level.rs", join(
              "use serde::{Deserialize, Serialize};",
              [extract(readiness, "pub enum PredictionReadinessLevel"), extract(readiness, "impl PredictionReadinessLevel"), extract(readiness, "pub enum PredictionReadinessCheckStatus")],
          ))
          write("crates/domain/src/prediction/readiness/report.rs", join(
              "use super::{PredictionReadinessCheckStatus, PredictionReadinessLevel};\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(readiness, "pub struct PredictionReadinessCheck"), extract(readiness, "pub struct MatchPredictionReadiness"), extract(readiness, "pub struct PredictionInputAuditSummary")],
          ))

          for needle in ["pub struct MatchContext", "pub struct PredictionSummary", "pub struct PersistedModelRun"]:
              lib = remove(lib, needle)
          for line in [
              "use chrono::{DateTime, Utc};\n",
              "use serde::{Deserialize, Serialize};\n",
              "use serde_json::Value;\n",
              "use uuid::Uuid;\n",
              "mod p4_orchestration;\n",
              "mod p4_persistence;\n",
              "mod p4_workbench;\n",
              "mod prediction_readiness;\n",
              "pub use p4_orchestration::*;\n",
              "pub use p4_persistence::*;\n",
              "pub use p4_workbench::*;\n",
              "pub use prediction_readiness::*;\n",
          ]:
              lib = lib.replace(line, "")
          if "pub mod prediction;\n" not in lib:
              lib = lib.replace("pub mod player;\n", "pub mod player;\npub mod prediction;\n")
          if "pub use prediction::*;\n" not in lib:
              lib = lib.replace("pub use player::*;\n", "pub use player::*;\npub use prediction::*;\n")
          write("crates/domain/src/lib.rs", lib)

          for path in ["crates/domain/src/p4_orchestration.rs", "crates/domain/src/p4_persistence.rs", "crates/domain/src/p4_workbench.rs", "crates/domain/src/prediction_readiness.rs"]:
              Path(path).unlink()

          policy = read("scripts/domain-inventory/target-module-policy.mjs")
          for line in [
              '  ["p4_orchestration.rs", ["prediction", "R2-05"]],\n',
              '  ["p4_persistence.rs", ["prediction", "R2-05"]],\n',
              '  ["p4_workbench.rs", ["prediction", "R2-05"]],\n',
              '  ["prediction_readiness.rs", ["prediction", "R2-05"]],\n',
          ]:
              if line not in policy:
                  raise RuntimeError(f"Prediction policy line missing: {line.strip()}")
              policy = policy.replace(line, "")
          if '["prediction", ["prediction", "R2-05"]]' not in policy:
              policy = policy.replace('  ["player", ["player", "R2-03"]],\n', '  ["player", ["player", "R2-03"]],\n  ["prediction", ["prediction", "R2-05"]],\n')
          write("scripts/domain-inventory/target-module-policy.mjs", policy)

          module_paths = read("crates/domain/tests/serde_contracts/module_paths.rs")
          module_paths = module_paths.replace("coach, competition, formation, lineup, match_record, player, routing, shared, team,", "coach, competition, formation, lineup, match_record, player, prediction, routing, shared, team,")
          if "fn r2_05_prediction_module_paths_preserve_root_type_identity()" not in module_paths:
              lines = ["\n#[test]", "fn r2_05_prediction_module_paths_preserve_root_type_identity() {"]
              for name in prediction_types:
                  lines.append(f"    assert_same_type(None::<football_domain::{name}>, None::<prediction::{name}>);")
              lines.append("}")
              module_paths = module_paths.rstrip() + "\n" + "\n".join(lines) + "\n"
          write("crates/domain/tests/serde_contracts/module_paths.rs", module_paths)
          '@ | Set-Content migrate_r2_05_prediction.py -Encoding utf8
          python migrate_r2_05_prediction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item migrate_r2_05_prediction.py -Force
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: R2-05A verify Prediction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked -p football-domain --test serde_contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: R2-05A commit Prediction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "rewrite(r2): migrate R2-05 prediction domain"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r2-05-prediction-research
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: R2-05B migrate Research
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.rstrip() + "\n", encoding="utf-8", newline="\n")

          def item_span(text, needle, occurrence=0):
              matches = [m.start() for m in re.finditer(re.escape(needle), text)]
              if len(matches) <= occurrence:
                  raise RuntimeError(f"Missing item {needle}")
              idx = matches[occurrence]
              start = text.rfind("\n", 0, idx) + 1
              while start > 0:
                  prev_end = start - 1
                  prev_start = text.rfind("\n", 0, prev_end) + 1
                  prev = text[prev_start:prev_end].strip()
                  if prev.startswith("#["):
                      start = prev_start
                  else:
                      break
              brace = text.find("{", idx)
              if brace < 0:
                  raise RuntimeError(f"No opening brace for {needle}")
              depth = 0
              in_string = False
              escape = False
              for pos in range(brace, len(text)):
                  ch = text[pos]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == "{": depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = pos + 1
                          if end < len(text) and text[end] == "\n": end += 1
                          return start, end
              raise RuntimeError(f"Unclosed item {needle}")

          def extract(text, needle, occurrence=0):
              a, b = item_span(text, needle, occurrence)
              return text[a:b].strip()

          def const(text, name):
              m = re.search(rf"(?m)^pub const {re.escape(name)}[^\n]*$", text)
              if not m: raise RuntimeError(f"Missing const {name}")
              return m.group(0)

          def join(imports, blocks):
              return imports.rstrip() + "\n\n" + "\n\n".join(x.strip() for x in blocks) + "\n"

          fact = read("crates/domain/src/fact_pipeline.rs")
          gateway = read("crates/domain/src/research_gateway.rs")
          lib = read("crates/domain/src/lib.rs")
          inventory_before = json.loads(read("architecture/domain-type-inventory.json"))
          research_types = sorted(t["typeName"] for t in inventory_before["types"] if t["targetTask"] == "R2-05" and t["targetModule"] == "research")
          if len(research_types) != 27:
              raise RuntimeError(f"Research scope drift: {len(research_types)}")

          research_consts = [
              const(fact, "P4_FACT_PIPELINE_CONTRACT_VERSION"),
              const(fact, "P4_SOURCE_POLICY_VERSION"),
              const(fact, "P4_EVIDENCE_ROUTE_VERSION"),
              const(gateway, "P4_RESEARCH_GATEWAY_CONTRACT_VERSION"),
              const(gateway, "P4_RESEARCH_OUTPUT_SCHEMA_VERSION"),
              const(gateway, "P4_RESEARCH_PROMPT_VERSION"),
          ]
          write("crates/domain/src/research/mod.rs", "mod conflict;\nmod entity;\nmod gateway;\nmod pipeline;\nmod routing;\nmod source_policy;\nmod time_audit;\n\npub use conflict::*;\npub use entity::*;\npub use gateway::*;\npub use pipeline::*;\npub use routing::*;\npub use source_policy::*;\npub use time_audit::*;\n\n" + "\n".join(research_consts))
          write("crates/domain/src/research/entity.rs", join(
              "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse uuid::Uuid;",
              [extract(fact, "pub enum EntityResolutionStatus"), extract(fact, "impl EntityResolutionStatus"), extract(fact, "pub struct EntityCandidate"), extract(fact, "pub struct EntityResolutionDraft"), extract(fact, "pub struct EntityResolutionRecord")],
          ))
          write("crates/domain/src/research/time_audit.rs", join(
              "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse uuid::Uuid;",
              [extract(fact, "pub enum TimeAuditStatus"), extract(fact, "impl TimeAuditStatus"), extract(fact, "pub struct TimeAuditDraft"), extract(fact, "pub struct TimeAuditRecord")],
          ))
          write("crates/domain/src/research/source_policy.rs", join(
              "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(fact, "pub struct SourceTierRule"), extract(fact, "pub struct SourceTierDefinition"), extract(fact, "pub struct SourcePolicyDefinition"), extract(fact, "pub struct SourcePolicyVersionDraft"), extract(fact, "pub struct SourcePolicyVersionRecord")],
          ))
          write("crates/domain/src/research/routing.rs", join(
              "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
              [extract(fact, "pub enum EvidenceRouteStatus"), extract(fact, "impl EvidenceRouteStatus"), extract(fact, "pub struct EvidenceRouteRule"), extract(fact, "fn default_true"), extract(fact, "pub struct EvidenceRouteRegistry"), extract(fact, "pub struct EvidenceRouteDraft"), extract(fact, "pub struct EvidenceRouteRecord")],
          ))
          write("crates/domain/src/research/conflict.rs", join(
              "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
