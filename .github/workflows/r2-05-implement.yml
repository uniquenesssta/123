name: R2-05 Research Resume

on:
  push:
    branches:
      - "rewrite/r2-05-prediction-research"

permissions:
  contents: write

jobs:
  resume:
    if: "${{ github.event.head_commit.message == 'chore(r2): resume R2-05 research migration' }}"
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout R2-05 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rewrite/r2-05-prediction-research

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Prepare and verify R2-05A baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($legacy in @(
            "crates/domain/src/p4_orchestration.rs",
            "crates/domain/src/p4_persistence.rs",
            "crates/domain/src/p4_workbench.rs",
            "crates/domain/src/prediction_readiness.rs"
          )) {
            if (Test-Path $legacy) { throw "R2-05A legacy file unexpectedly exists: $legacy" }
          }
          $planning = Get-Content "crates/domain/src/prediction/orchestration/planning.rs" -Raw
          if ($planning.Contains("use super::super::P4Horizon;") -or $planning.Contains("use crate::CompetitionKind;")) {
            throw "R2-05A Clippy repair is missing"
          }
          cargo test --locked -p football-domain --test serde_contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p football-domain --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Migrate R2-05B Research
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.rstrip() + "\n", encoding="utf-8", newline="\n")

          def item_span(text, needle, occurrence=0):
              matches = [m.start() for m in re.finditer(re.escape(needle), text)]
              if len(matches) <= occurrence:
                  raise RuntimeError(f"Missing item {needle}")
              idx = matches[occurrence]
              start = text.rfind("\n", 0, idx) + 1
              while start > 0:
                  prev_end = start - 1
                  prev_start = text.rfind("\n", 0, prev_end) + 1
                  prev = text[prev_start:prev_end].strip()
                  if prev.startswith("#["):
                      start = prev_start
                  else:
                      break
              brace = text.find("{", idx)
              if brace < 0:
                  raise RuntimeError(f"No opening brace for {needle}")
              depth = 0
              in_string = False
              escape = False
              for pos in range(brace, len(text)):
                  ch = text[pos]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = pos + 1
                          while end < len(text) and text[end] in " \t":
                              end += 1
                          if end < len(text) and text[end] == ";":
                              end += 1
                          if end < len(text) and text[end] == "\n":
                              end += 1
                          return start, end
              raise RuntimeError(f"Unclosed item {needle}")

          def extract(text, needle, occurrence=0):
              a, b = item_span(text, needle, occurrence)
              return text[a:b].strip()

          def const(text, name):
              match = re.search(rf"(?m)^pub const {re.escape(name)}[^\n]*$", text)
              if not match:
                  raise RuntimeError(f"Missing const {name}")
              return match.group(0)

          def join(imports, blocks):
              return imports.rstrip() + "\n\n" + "\n\n".join(block.strip() for block in blocks if block.strip()) + "\n"

          fact_path = Path("crates/domain/src/fact_pipeline.rs")
          gateway_path = Path("crates/domain/src/research_gateway.rs")
          if not fact_path.exists() or not gateway_path.exists():
              raise RuntimeError("R2-05B legacy Research sources are not available")

          fact = read(fact_path)
          gateway = read(gateway_path)
          lib = read("crates/domain/src/lib.rs")
          inventory_before = json.loads(read("architecture/domain-type-inventory.json"))
          research_types = sorted(
              t["typeName"]
              for t in inventory_before["types"]
              if t["targetTask"] == "R2-05" and t["targetModule"] == "research"
          )
          if len(research_types) != 27:
              raise RuntimeError(f"Research scope drift: {len(research_types)}")

          research_consts = [
              const(fact, "P4_FACT_PIPELINE_CONTRACT_VERSION"),
              const(fact, "P4_SOURCE_POLICY_VERSION"),
              const(fact, "P4_EVIDENCE_ROUTE_VERSION"),
              const(gateway, "P4_RESEARCH_GATEWAY_CONTRACT_VERSION"),
              const(gateway, "P4_RESEARCH_OUTPUT_SCHEMA_VERSION"),
              const(gateway, "P4_RESEARCH_PROMPT_VERSION"),
          ]
          write(
              "crates/domain/src/research/mod.rs",
              "mod conflict;\nmod entity;\nmod gateway;\nmod pipeline;\nmod routing;\nmod source_policy;\nmod time_audit;\n\n"
              "pub use conflict::*;\npub use entity::*;\npub use gateway::*;\npub use pipeline::*;\npub use routing::*;\n"
              "pub use source_policy::*;\npub use time_audit::*;\n\n" + "\n".join(research_consts),
          )
          write(
              "crates/domain/src/research/entity.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse uuid::Uuid;",
                  [
                      extract(fact, "pub enum EntityResolutionStatus"),
                      extract(fact, "impl EntityResolutionStatus"),
                      extract(fact, "pub struct EntityCandidate"),
                      extract(fact, "pub struct EntityResolutionDraft"),
                      extract(fact, "pub struct EntityResolutionRecord"),
                  ],
              ),
          )
          write(
              "crates/domain/src/research/time_audit.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse uuid::Uuid;",
                  [
                      extract(fact, "pub enum TimeAuditStatus"),
                      extract(fact, "impl TimeAuditStatus"),
                      extract(fact, "pub struct TimeAuditDraft"),
                      extract(fact, "pub struct TimeAuditRecord"),
                  ],
              ),
          )
          write(
              "crates/domain/src/research/source_policy.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
                  [
                      extract(fact, "pub struct SourceTierRule"),
                      extract(fact, "pub struct SourceTierDefinition"),
                      extract(fact, "pub struct SourcePolicyDefinition"),
                      extract(fact, "pub struct SourcePolicyVersionDraft"),
                      extract(fact, "pub struct SourcePolicyVersionRecord"),
                  ],
              ),
          )
          write(
              "crates/domain/src/research/routing.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
                  [
                      extract(fact, "pub enum EvidenceRouteStatus"),
                      extract(fact, "impl EvidenceRouteStatus"),
                      extract(fact, "pub struct EvidenceRouteRule"),
                      extract(fact, "fn default_true"),
                      extract(fact, "pub struct EvidenceRouteRegistry"),
                      extract(fact, "pub struct EvidenceRouteDraft"),
                      extract(fact, "pub struct EvidenceRouteRecord"),
                  ],
              ),
          )
          write(
              "crates/domain/src/research/conflict.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
                  [
                      extract(fact, "pub enum ConflictEvaluationStatus"),
                      extract(fact, "impl ConflictEvaluationStatus"),
                      extract(fact, "pub struct ConflictEvaluationDraft"),
                      extract(fact, "pub struct ConflictEvaluationRecord"),
                  ],
              ),
          )
          write(
              "crates/domain/src/research/pipeline.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse uuid::Uuid;",
                  [
                      extract(fact, "pub struct FactPipelineContext"),
                      extract(fact, "pub struct FactPipelineSummary"),
                      extract(fact, "impl FactPipelineSummary"),
                  ],
              ),
          )
          write(
              "crates/domain/src/research/gateway/mod.rs",
              "mod attempt;\nmod source;\nmod usage;\n\npub use attempt::*;\npub use source::*;\npub use usage::*;\n",
          )
          write(
              "crates/domain/src/research/gateway/attempt.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\nuse uuid::Uuid;",
                  [extract(gateway, "pub struct OpenAiAttemptDraft"), extract(gateway, "pub struct OpenAiAttemptRecord")],
              ),
          )
          write(
              "crates/domain/src/research/gateway/source.rs",
              join(
                  "use chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse uuid::Uuid;",
                  [extract(gateway, "pub struct WebCitationDraft"), extract(gateway, "pub struct WebSourceDraft")],
              ),
          )
          write(
              "crates/domain/src/research/gateway/usage.rs",
              join("use serde::{Deserialize, Serialize};", [extract(gateway, "pub struct OpenAiUsageTotals")]),
          )

          for line in ["mod fact_pipeline;\n", "mod research_gateway;\n", "pub use fact_pipeline::*;\n", "pub use research_gateway::*;\n"]:
              if line not in lib:
                  raise RuntimeError(f"Research root contract missing before migration: {line.strip()}")
              lib = lib.replace(line, "")
          if "pub mod research;\n" not in lib:
              lib = lib.replace("pub mod routing;\n", "pub mod research;\npub mod routing;\n")
          if "pub use research::*;\n" not in lib:
              lib = lib.replace("pub use routing::*;\n", "pub use research::*;\npub use routing::*;\n")
          write("crates/domain/src/lib.rs", lib)
          fact_path.unlink()
          gateway_path.unlink()

          policy_path = "scripts/domain-inventory/target-module-policy.mjs"
          policy = read(policy_path)
          for line in [
              '  ["fact_pipeline.rs", ["research", "R2-05"]],\n',
              '  ["research_gateway.rs", ["research", "R2-05"]],\n',
          ]:
              if line not in policy:
                  raise RuntimeError(f"Research policy line missing: {line.strip()}")
              policy = policy.replace(line, "")
          if '["research", ["research", "R2-05"]]' not in policy:
              anchor = '  ["prediction", ["prediction", "R2-05"]],\n'
              if anchor not in policy:
                  raise RuntimeError("Prediction directory policy missing")
              policy = policy.replace(anchor, anchor + '  ["research", ["research", "R2-05"]],\n')
          write(policy_path, policy)

          module_path = "crates/domain/tests/serde_contracts/module_paths.rs"
          module_paths = read(module_path)
          if "prediction, research, routing" not in module_paths:
              module_paths = module_paths.replace("prediction, routing, shared, team,", "prediction, research, routing, shared, team,")
          if "fn r2_05_research_module_paths_preserve_root_type_identity()" not in module_paths:
              lines = ["\n#[test]", "fn r2_05_research_module_paths_preserve_root_type_identity() {"]
              for name in research_types:
                  lines.append(f"    assert_same_type(None::<football_domain::{name}>, None::<research::{name}>);")
              lines.append("}")
              module_paths = module_paths.rstrip() + "\n" + "\n".join(lines) + "\n"
          write(module_path, module_paths)

          progress_path = "architecture/domain-migration-progress.json"
          progress = json.loads(read(progress_path))
          if "R2-05" not in progress["completedTasks"]:
              progress["completedTasks"].append("R2-05")
          write(progress_path, json.dumps(progress, ensure_ascii=False, indent=2))
          '@ | Set-Content migrate_r2_05_research.py -Encoding utf8
          python migrate_r2_05_research.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item migrate_r2_05_research.py -Force
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify R2-05B targeted contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked -p football-domain --test serde_contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify R2-05B full regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Finalize R2-05 records and tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import json
          import os

          def read(path):
              return Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")

          def write(path, text):
              Path(path).write_text(text.rstrip() + "\n", encoding="utf-8", newline="\n")

          run_id = os.environ["GITHUB_RUN_ID"]
          inventory = json.loads(read("architecture/domain-type-inventory.json"))
          r2_05 = [t for t in inventory["types"] if t["targetTask"] == "R2-05"]
          prediction = [t for t in r2_05 if t["targetModule"] == "prediction"]
          research = [t for t in r2_05 if t["targetModule"] == "research"]
          if len(r2_05) != 75 or len(prediction) != 48 or len(research) != 27:
              raise RuntimeError("Final R2-05 inventory counts do not match 75/48/27")
          if any(not t["currentPath"].startswith("crates/domain/src/prediction/") for t in prediction):
              raise RuntimeError("Prediction type remains outside prediction directory")
          if any(not t["currentPath"].startswith("crates/domain/src/research/") for t in research):
              raise RuntimeError("Research type remains outside research directory")

          for legacy in [
              "crates/domain/src/p4_orchestration.rs",
              "crates/domain/src/p4_persistence.rs",
              "crates/domain/src/p4_workbench.rs",
              "crates/domain/src/prediction_readiness.rs",
              "crates/domain/src/fact_pipeline.rs",
              "crates/domain/src/research_gateway.rs",
          ]:
              if Path(legacy).exists():
                  raise RuntimeError(f"R2-05 legacy source remains: {legacy}")

          task_path = "docs/modular-rewrite/R02-domain-rewrite/R02-05-prediction-and-research-外围领域.md"
          task = read(task_path)
          if "- 任务状态：`IMPLEMENTING`" not in task:
              raise RuntimeError("R2-05 task status is not IMPLEMENTING")
          task = task.replace("- 任务状态：`IMPLEMENTING`", "- 任务状态：`VERIFYING`", 1)
          task += f"\n## 7. 实施与验证结果\n\n- R2-05A Prediction 48 个类型已由独立提交 `2cd685b8057a1bce2f75e4c7f5b56aed1bf3d142` 迁移；专项 Serde 10/10、类型清单、架构和保护资产门禁通过。\n- 首次 staged run `31158780693` 的 R2-05B Research 迁移与专项 Serde 11/11 已通过；完整 `verify:frontend` 通过，但 `verify:rust` 在 Clippy `-D warnings` 因 `prediction/orchestration/planning.rs` 两个未使用 import 失败，因此当次未提交 Research。\n- 已删除两个无效 import，不增加 `allow` 或放宽 Clippy；本次恢复 run `{run_id}` 从已提交的 R2-05A 基线继续执行 Research，不重放 Prediction。\n- R2-05B Research 27 个类型已迁移并删除旧 `fact_pipeline.rs`、`research_gateway.rs`；专项契约、完整 frontend 与 Rust 回归均通过。\n- 75 个类型均位于 `prediction/` 或 `research/` 职责目录，根级公共兼容路径与类型身份保持不变。\n- 正式 Windows Automated 在最终实施源码树通过前，本节点保持 `VERIFYING`，R2-06 保持 `BLOCKED`。\n"
          write(task_path, task)

          stage_path = "docs/modular-rewrite/R02-domain-rewrite/README.md"
          stage = read(stage_path)
          old_row = "| R2-05 | Prediction 与 Research 外围领域 | READY |"
          if old_row not in stage:
              raise RuntimeError("R2-05 stage row is not READY")
          stage = stage.replace(old_row, "| R2-05 | Prediction 与 Research 外围领域 | VERIFYING |", 1)
          stage = stage.replace("`R2-04 DONE`；`R2-05 READY`。", "`R2-04 DONE`；`R2-05 VERIFYING`。")
          if "## R2-05 当前结果" not in stage:
              stage += f"\n\n## R2-05 当前结果\n\n- Prediction 48 个类型已进入 `prediction/` 职责目录；Research 27 个类型已进入 `research/` 职责目录。\n- 75 个类型均保留根级公共兼容路径，并新增 `prediction::*` / `research::*` 业务语义路径身份门禁。\n- Prediction 独立提交为 `2cd685b8057a1bce2f75e4c7f5b56aed1bf3d142`；首次 run `31158780693` 暴露并停止于两个未使用 import，恢复 run `{run_id}` 已在不放宽门禁的前提下完成 Research 与全量回归。\n- 正式 Windows Automated 通过前状态为 `VERIFYING`，R2-06 继续 `BLOCKED`。\n"
          write(stage_path, stage)

          root_path = "README.md"
          root = read(root_path)
          marker = "- R1-04 前置校正"
          entry = f"- R2-05 已按两阶段迁移 Prediction 48 个类型与 Research 27 个类型。Prediction 独立提交 `2cd685b8057a1bce2f75e4c7f5b56aed1bf3d142` 的专项门禁通过；首次 run `31158780693` 中 Research 迁移与专项 Serde 11/11、完整 frontend 均通过，但完整 Rust 在 Clippy `-D warnings` 因 `prediction/orchestration/planning.rs` 两个未使用 import 停止，未提交 Research。已直接删除两个无效 import，不增加抑制；恢复 run `{run_id}` 从已验证 Prediction 基线继续完成 Research 27 类型迁移、类型清单、架构、保护资产、frontend 与 Rust 全量回归。旧 6 个职责混合源文件均已删除，根级公共类型路径、Serde、数据库映射、Application、Tauri DTO、生产依赖和模型保护边界保持不变。当前状态为 `VERIFYING`，最终实施源码树完成正式 Windows Automated 前不开放 R2-06。\n"
          if entry not in root:
              if marker not in root:
                  raise RuntimeError("README insertion marker missing")
              root = root.replace(marker, entry + marker, 1)
          root = root.replace(
              "R2-04 当前为 `DONE`，R2-05 已开放为 `READY`",
              "R2-04 当前为 `DONE`，R2-05 当前为 `VERIFYING`",
          )
          write(root_path, root)
          '@ | Set-Content finalize_r2_05.py -Encoding utf8
          python finalize_r2_05.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item finalize_r2_05.py -Force
          Remove-Item .github/workflows/r2-05-implement.yml -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @("migrate_r2_05_research.py", "finalize_r2_05.py", ".github/workflows/r2-05-implement.yml")) {
            if (Test-Path $path) { throw "Transient file remains: $path" }
          }

      - name: Commit and push final R2-05 branch tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "rewrite(r2): migrate R2-05 research domain"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $localHead = (git rev-parse HEAD).Trim()
          $status = @(git status --porcelain --untracked-files=all)
          if ($status.Count -ne 0) { throw "Worktree not clean after R2-05 final commit: $($status -join ', ')" }
          git push origin HEAD:rewrite/r2-05-prediction-research
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteHead = (git ls-remote origin refs/heads/rewrite/r2-05-prediction-research).Split("`t")[0]
          if ($remoteHead -ne $localHead) { throw "Remote R2-05 branch did not advance to final commit" }
