name: R6-09 AT1 preflight archive

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-09-at1
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Verify protected baseline
        shell: bash
        run: |
          set -euo pipefail
          base=3bc7ca89ef0341b53985246602218c2ba6fbb094
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base"..HEAD)" = ".github/workflows/r6-09-at1.yml"
          test "$(git hash-object crates/persistence-postgres/src/entity_catalog.rs)" = "fe861d8a1f5b765dcb5baf1e334d44990dd94344"
          test "$(git hash-object crates/persistence-postgres/src/team_catalog.rs)" = "38f48d74709c8a9673bf2ed0ba7649603f223981"
          test "$(git hash-object crates/persistence-postgres/src/player_catalog.rs)" = "ceb8b6ae74769f8d28ca593ea3298efa0ad730c5"
          test "$(git hash-object crates/persistence-postgres/src/team_force_delete.rs)" = "ec0fd77103c90b94a7eeef7e769c5b17b88f6915"
      - name: Implement R6-09 AT1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, textwrap
          root=Path('.')
          def read(p): return (root/p).read_text(encoding='utf-8')
          def write(p,s):
              p=root/p; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(s.replace('\r\n','\n'),encoding='utf-8',newline='\n')
          def need(x,m):
              if not x: raise SystemExit(m)
          def once(t,a,b,m):
              need(t.count(a)==1,f'{m}: {t.count(a)} anchors'); return t.replace(a,b,1)
          def cut(t,a,b,m):
              i=t.find(a); need(i>=0,f'{m}: start missing'); j=t.find(b,i); need(j>=0,f'{m}: end missing'); return t[i:j]
          entity=read(Path('crates/persistence-postgres/src/entity_catalog.rs'))
          # Contract is written before owner switch.
          write(Path('crates/persistence-postgres/tests/entity_deletion_repository_contract.rs'), r'''use chrono::{Duration, Utc};
          use football_domain::{PlayerDraft, PlayerStatus, PlayerTeamPeriodDraft, PreferredFoot, TeamDraft};
          use football_persistence_postgres::{DatabaseOptions, PostgresStore};
          use serde_json::json;
          use sqlx::{postgres::PgPoolOptions, PgPool};
          use uuid::Uuid;

          #[tokio::test]
          #[ignore = "需要专用且可写的 PostgreSQL 测试数据库；设置 FOOTBALL_TEST_DATABASE_URL 后显式运行"]
          async fn deletion_preflight_and_archive_contract_is_preserved() {
              let url=std::env::var("FOOTBALL_TEST_DATABASE_URL").expect("设置 FOOTBALL_TEST_DATABASE_URL");
              let store=PostgresStore::connect(&DatabaseOptions{connection_url:url.clone(),max_connections:4,connect_timeout_seconds:10}).await.expect("connect");
              store.migrate().await.expect("migrate");
              let pool:PgPool=PgPoolOptions::new().max_connections(4).connect(&url).await.expect("pool");
              let token=Uuid::new_v4().simple().to_string();
              let free=store.create_team(&TeamDraft{canonical_name:format!("R6-09 Free {token}"),country_code:Some("ZZ".into()),metadata:json!({})}).await.expect("free team");
              let free_check=store.check_entity_deletion("team",free.id).await.expect("free check");
              assert!(free_check.exists && free_check.can_permanently_delete && !free_check.must_archive);
              assert_eq!(free_check.reason,"没有历史引用，可以永久删除");
              let team=store.create_team(&TeamDraft{canonical_name:format!("R6-09 Archive {token}"),country_code:Some("ZZ".into()),metadata:json!({})}).await.expect("team");
              let player=store.create_player(&PlayerDraft{canonical_name:format!("R6-09 Player {token}"),date_of_birth:None,nationality_code:Some("ZZ".into()),preferred_foot:PreferredFoot::Right,height_cm:Some(180),status:PlayerStatus::Active,metadata:json!({})}).await.expect("player");
              let from=Utc::now().date_naive();
              store.add_player_team_period(&PlayerTeamPeriodDraft{player_id:player.id,team_id:team.id,season_id:None,squad_number:Some(9),valid_from:from,valid_to:Some(from+Duration::days(30)),registration_status:"registered".into(),source_document_id:None}).await.expect("period");
              let check=store.check_entity_deletion("team",team.id).await.expect("protected check");
              assert!(!check.can_permanently_delete && check.must_archive && check.reason.contains("只允许归档"));
              assert!(check.references.iter().any(|x|x.relation=="player_team_periods"));
              let result=store.bulk_archive_entities("team",&[team.id,team.id]).await.expect("archive");
              assert_eq!(result.requested_count,1); assert_eq!(result.archived_ids,vec![team.id]);
              let active:bool=sqlx::query_scalar("SELECT is_active FROM football.teams WHERE id=$1").bind(team.id).fetch_one(&pool).await.expect("active");
              let periods:i64=sqlx::query_scalar("SELECT count(*)::bigint FROM football.player_team_periods WHERE team_id=$1").bind(team.id).fetch_one(&pool).await.expect("periods");
              assert!(!active); assert_eq!(periods,1);
              pool.close().await; store.close().await;
          }
          ''')
          list_method=cut(entity,'    pub(crate) async fn list_team_player_periods(','\n\n    pub async fn check_entity_deletion(','list period').rstrip()
          mapper=cut(entity,'fn team_player_period_from_row(','\n\nfn unique_ids(','period mapper').rstrip()
          write(Path('crates/persistence-postgres/src/entity_catalog.rs'),'use crate::{PersistenceResult, PostgresStore};\nuse football_domain::TeamPlayerPeriodRecord;\nuse sqlx::Row;\nuse uuid::Uuid;\n\nimpl PostgresStore {\n'+list_method+'\n}\n\n'+mapper+'\n')
          d=Path('crates/persistence-postgres/src/adapters/catalog/deletion')
          check=cut(entity,'    pub async fn check_entity_deletion(','\n\n    async fn entity_label(','check')
          check=once(check,'let label = self.entity_label(entity_type, entity_id).await?;','let label = entity_label(&self.pool, entity_type, entity_id).await?;','label call')
          for kind,name in [('team','team_reference_counts'),('player','player_reference_counts'),('coach','coach_reference_counts')]: check=once(check,f'"{kind}" => self.{name}(entity_id).await?,',f'"{kind}" => {name}(&self.pool, entity_id).await?,',kind)
          write(d/'preflight/check.rs','use super::{labels::entity_label,references::{coach_reference_counts,player_reference_counts,team_reference_counts}};\nuse crate::{adapters::catalog::references::validate_entity_type,PersistenceResult,PostgresStore};\nuse football_domain::EntityDeletionCheck;\nuse uuid::Uuid;\n\nimpl PostgresStore {\n'+check.rstrip()+'\n}\n')
          label=textwrap.dedent(cut(entity,'    async fn entity_label(','\n\n    async fn team_reference_counts(','label')).rstrip()+'\n'
          label=once(label,'async fn entity_label(','pub(crate) async fn entity_label(','label vis'); label=once(label,'    &self,\n','    pool: &sqlx::PgPool,\n','label pool').replace('&self.pool','pool')
          write(d/'preflight/labels.rs','use crate::PersistenceResult;\nuse uuid::Uuid;\n\n'+label)
          refs=[]
          for name,nxt,prefix in [('team_reference_counts','player_reference_counts',''),('player_reference_counts','coach_reference_counts',''),('coach_reference_counts','bulk_archive_entities','pub ')]:
              c=textwrap.dedent(cut(entity,f'    async fn {name}(',f'\n\n    {prefix}async fn {nxt}(',name)).rstrip()+'\n'; c=once(c,f'async fn {name}(',f'pub(crate) async fn {name}(',name+' vis'); c=once(c,'    &self,\n','    pool: &sqlx::PgPool,\n',name+' pool').replace('&self.pool','pool'); refs.append(c.rstrip())
          counts=cut(entity,'async fn count_relations(','\n\nfn team_player_period_from_row(','count relations').rstrip()
          write(d/'preflight/references.rs','use crate::PersistenceResult;\nuse football_domain::EntityReferenceCount;\nuse uuid::Uuid;\n\n'+'\n\n'.join(refs)+'\n\n'+counts+'\n')
          write(d/'preflight/mod.rs','mod check;\npub(crate) mod labels;\npub(crate) mod references;\n')
          bulk=cut(entity,'    pub async fn bulk_archive_entities(','\n\n    async fn archive_entity(','archive bulk')
          bulk=once(bulk,'let label = self\n                .entity_label(entity_type, *id)\n                .await?\n                .unwrap_or_else(|| id.to_string());','let label = entity_label(&self.pool, entity_type, *id)\n                .await?\n                .unwrap_or_else(|| id.to_string());','archive label')
          bulk=once(bulk,'match self.archive_entity(entity_type, *id).await {','match archive_entity(&self.pool, entity_type, *id).await {','archive call')
          write(d/'archive/bulk.rs','use super::super::{ids::unique_ids,preflight::labels::entity_label};\nuse super::write::archive_entity;\nuse crate::{adapters::catalog::references::validate_entity_type,PersistenceResult,PostgresStore};\nuse football_domain::{BulkArchiveFailedItem,BulkArchiveResult};\nuse uuid::Uuid;\n\nimpl PostgresStore {\n'+bulk.rstrip()+'\n}\n')
          aw=textwrap.dedent(cut(entity,'    async fn archive_entity(','\n\n    async fn entity_label_in_tx(','archive write')).rstrip()+'\n'
          aw=once(aw,'async fn archive_entity(&self, entity_type: &str, id: Uuid) -> PersistenceResult<bool> {','pub(crate) async fn archive_entity(pool: &sqlx::PgPool, entity_type: &str, id: Uuid) -> PersistenceResult<bool> {','archive sig').replace('self.pool.begin()','pool.begin()')
          aw=once(aw,'} else if self\n        .entity_label_in_tx(&mut tx, entity_type, id)\n        .await?','} else if entity_label_in_tx(&mut tx, entity_type, id).await?','archive label tx')
          alt=textwrap.dedent(cut(entity,'    async fn entity_label_in_tx(','\n}\n\nasync fn count_relations(','archive tx label')).rstrip()+'\n'; alt=once(alt,'    &self,\n','','archive self')
          write(d/'archive/write.rs','use crate::{write_audit_event,PersistenceError,PersistenceResult};\nuse serde_json::json;\nuse sqlx::{Postgres,Transaction};\nuse uuid::Uuid;\n\n'+aw.rstrip()+'\n\n'+alt)
          write(d/'archive/mod.rs','mod bulk;\nmod write;\n')
          unique=entity[entity.index('fn unique_ids('):entity.index('\n\nfn team_player_period_from_row(')].rstrip()+'\n'; unique=unique.replace('fn unique_ids(','pub(crate) fn unique_ids(',1)
          write(d/'ids.rs','use uuid::Uuid;\n\n'+unique)
          write(d/'mod.rs','mod archive;\nmod ids;\nmod preflight;\n')
          catalog=read(Path('crates/persistence-postgres/src/adapters/catalog/mod.rs')); catalog=once(catalog,'mod dynamic_tags;\n','mod dynamic_tags;\nmod deletion;\n','catalog'); write(Path('crates/persistence-postgres/src/adapters/catalog/mod.rs'),catalog)
          # New AT1 owner verifier.
          write(Path('scripts/verify-entity-deletion-persistence.mjs'),'''import fs from "node:fs";\nconst read=(p)=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8").replace(/\\r\\n?/g,"\\n");\nconst exists=(p)=>fs.existsSync(new URL(`../${p}`,import.meta.url));\nconst req=(v,m)=>{if(!v)throw new Error(m)};\nconst root="crates/persistence-postgres/src/adapters/catalog/deletion/";\nfor(const p of ["mod.rs","ids.rs","preflight/mod.rs","preflight/check.rs","preflight/labels.rs","preflight/references.rs","archive/mod.rs","archive/bulk.rs","archive/write.rs"])req(exists(root+p),`R6-09 AT1 owner missing: ${p}`);\nconst entity=read("crates/persistence-postgres/src/entity_catalog.rs"); const check=read(root+"preflight/check.rs"); const refs=read(root+"preflight/references.rs"); const archive=read(root+"archive/bulk.rs")+read(root+"archive/write.rs");\nfor(const n of ["check_entity_deletion","bulk_archive_entities","team_reference_counts","player_reference_counts","coach_reference_counts"])req(!entity.includes(n),`legacy entity owner remains: ${n}`);\nreq(check.includes("pub async fn check_entity_deletion")&&archive.includes("pub async fn bulk_archive_entities"),"AT1 public owners missing");\nfor(const p of ["preflight/check.rs","archive/bulk.rs"]) {const s=read(root+p);req(!s.includes("sqlx::")&&!s.includes("SELECT ")&&!s.includes("UPDATE football"),`coordinator owns SQL: ${p}`)}\nfor(const r of ["matches","lineups","player_team_periods","team_coach_periods","player_availability","formation_usage","team_tactical_observations","team_ability_observations","substitutions","match_events","team_match_reviews","player_match_reviews","player_match_observations"])req(refs.includes(`\\"${r}\\"`),`reference count missing: ${r}`);\nreq(check.includes("can_permanently_delete: total == 0")&&check.includes("只允许归档"),"preflight semantics changed"); req(archive.includes("manual_bulk_archive")&&archive.includes("_archived"),"archive audit semantics changed");\nreq(read("crates/persistence-postgres/src/team_catalog.rs").includes("pub async fn bulk_delete_teams"),"AT2 permanent delete moved early"); req(read("crates/persistence-postgres/src/team_force_delete.rs").includes("pub async fn force_delete_team"),"AT3 force delete moved early");\nconsole.log("R6-09 AT1 deletion preflight/archive ownership verified.");\n''')
          # Retained verifiers follow new AT1 owners without weakening assertions.
          p=Path('scripts/verify-entity-deletion.mjs'); t=read(p); t=once(t,'const entityPersistence = text("crates/persistence-postgres/src/entity_catalog.rs");','const entityPersistence = [text("crates/persistence-postgres/src/adapters/catalog/deletion/preflight/check.rs"), text("crates/persistence-postgres/src/adapters/catalog/deletion/preflight/references.rs"), text("crates/persistence-postgres/src/adapters/catalog/deletion/archive/bulk.rs")].join("\\n");','entity deletion verifier'); write(p,t)
          p=Path('scripts/verify-coach-formation-persistence.mjs'); t=read(p); t=once(t,'req(!entity.includes("pub async fn list_entity_references") && !entity.includes("pub async fn resolve_entity_reference") && entity.includes("pub async fn bulk_archive_entities"), "R6-08 ownership switch incomplete or R6-09 ownership moved early");','const deletionArchive = read("crates/persistence-postgres/src/adapters/catalog/deletion/archive/bulk.rs");\nreq(!entity.includes("pub async fn list_entity_references") && !entity.includes("pub async fn resolve_entity_reference") && !entity.includes("pub async fn bulk_archive_entities") && deletionArchive.includes("pub async fn bulk_archive_entities"), "R6-08 retained ownership or R6-09 AT1 archive owner invalid");','coach retained'); write(p,t)
          p=Path('scripts/verify-entity-matching-references-persistence.mjs'); t=read(p); old='req(entity.includes("pub async fn check_entity_deletion") && entity.includes("pub async fn bulk_archive_entities"), "R6-09 deletion/archive moved early");\nreq(entity.includes("team_reference_counts") && entity.includes("player_reference_counts") && entity.includes("coach_reference_counts"), "R6-09 reference-count owner moved early");'; new='const deletionCheck = read("crates/persistence-postgres/src/adapters/catalog/deletion/preflight/check.rs");\nconst deletionRefs = read("crates/persistence-postgres/src/adapters/catalog/deletion/preflight/references.rs");\nconst deletionArchive = read("crates/persistence-postgres/src/adapters/catalog/deletion/archive/bulk.rs");\nreq(!entity.includes("pub async fn check_entity_deletion") && !entity.includes("pub async fn bulk_archive_entities") && deletionCheck.includes("pub async fn check_entity_deletion") && deletionArchive.includes("pub async fn bulk_archive_entities"), "R6-09 AT1 deletion/archive ownership invalid");\nreq(!entity.includes("team_reference_counts") && deletionRefs.includes("team_reference_counts") && deletionRefs.includes("player_reference_counts") && deletionRefs.includes("coach_reference_counts"), "R6-09 AT1 reference-count ownership invalid");'; t=once(t,old,new,'R6-08 retained'); write(p,t)
          pkg=json.loads(read(Path('package.json'))); pkg['scripts']['verify:entity-deletion-persistence']='node scripts/verify-entity-deletion-persistence.mjs'; pkg['scripts']['verify:architecture'] += ' && node scripts/verify-entity-deletion-persistence.mjs'; write(Path('package.json'),json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          PY
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
      - name: Minimum gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-entity-deletion-persistence.mjs
          node scripts/verify-entity-deletion.mjs
          node scripts/verify-coach-formation-persistence.mjs
          node scripts/verify-entity-matching-references-persistence.mjs
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          cargo fmt --all -- --check
          cargo check --locked -p football-persistence-postgres
          cargo test --locked -p football-persistence-postgres --lib
          cargo test --locked -p football-persistence-postgres --test entity_deletion_repository_contract --no-run
          cargo check --locked -p football-application
          git diff --check
      - name: Record AT1 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('README.md'); t=root.read_text(encoding='utf-8'); anchor='### R6-08 Entity Matching 与 References\n'; assert t.count(anchor)==1; sec='''### R6-09 Archive / Delete / Force Delete\n\n- Atomic Task 1 已将 deletion preflight/reference-count 与 archive persistence 收敛到 `adapters/catalog/deletion/{preflight,archive}/`；协调器 SQL-free，引用统计、标签读取与归档事务由具名 I/O owner 承担。普通永久 Delete 与 Team Force Delete 暂保留原 owner，等待本节点后续 Atomic Task，未提前混改。\n- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、错误语义、历史 P4/运行引用保护、无引用永久删除和 force purge 行为均未改变；无新增生产依赖。AT1 Minimum Gate 已实际通过，R6-09 整体仍为 `IN_PROGRESS`。\n\n'''; root.write_text(t.replace(anchor,sec+anchor,1),encoding='utf-8',newline='\n')
          stage=Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md'); t=stage.read_text(encoding='utf-8'); assert t.count('| R6-09 | Archive / Delete / Force Delete | READY |')==1; t=t.replace('| R6-09 | Archive / Delete / Force Delete | READY |','| R6-09 | Archive / Delete / Force Delete | IN_PROGRESS |',1); t=t.rstrip()+'''\n\n## R6-09 当前事实\n\n- 详细记录：[`R06-09-archive-delete-and-force-delete.md`](R06-09-archive-delete-and-force-delete.md)。\n- Atomic Task 1：Preflight / Reference Counts / Archive owner switch 已完成 Minimum Gate，节点整体继续 `IN_PROGRESS`；普通永久 Delete 与 Team Force Delete 尚未迁移，R6-10 继续 `BLOCKED`。\n'''; stage.write_text(t,encoding='utf-8',newline='\n')
          detail=Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md'); detail.write_text('''# R6-09 Archive / Delete / Force Delete\n\n## 状态\n\n`IN_PROGRESS`\n\n## Atomic Task 1 — Preflight / Reference Counts / Archive\n\n- 基线：`3bc7ca89ef0341b53985246602218c2ba6fbb094`。\n- `check_entity_deletion`、team/player/coach reference counts、entity label 与 `bulk_archive_entities` 已从 `entity_catalog.rs` 迁入 `adapters/catalog/deletion/{preflight,archive}/`；`entity_catalog.rs` 仅保留 team-player-period read。\n- 公共 Port/DTO/Schema/迁移/错误/归档行为/历史 P4 保护均未改变；普通永久 Delete 与 Force Delete 未在 AT1 修改。\n- Minimum Gate：R6-09 AT1 ownership、历史 Entity Deletion、R6-07/R6-08 retained ownership、完整 architecture、protected assets、rustfmt、Persistence check/unit tests、R6-09 contract compile、Application check 与 diff hygiene 全部 PASS。\n- Stage Regression 与 PostgreSQL 16 真实 contract 由本 workflow 后续独立 jobs 执行；在成功前 AT1 不关闭。\n- 新增：`adapters/catalog/deletion/{mod.rs,ids.rs,preflight/*,archive/*}`、`entity_deletion_repository_contract.rs`、`verify-entity-deletion-persistence.mjs`、本记录。\n- 修改：`entity_catalog.rs`、catalog `mod.rs`、相关 retained verifier、`package.json`、Domain inventory、根/阶段 README。\n- 删除/移动：AT1 无。\n- 回退点：上述基线提交。\n''',encoding='utf-8',newline='\n')
          PY
          git rm .github/workflows/r6-09-at1.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(r6-09): modularize deletion preflight and archive"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
      - id: publish
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-stage:
    needs: implement
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.sha }}
          path: 项目源码
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Stage regression
        shell: pwsh
        working-directory: 项目源码
        run: |
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

  postgres-contract:
    needs: implement
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://football:football@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: R6-09 PostgreSQL 16 contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test entity_deletion_repository_contract -- --ignored --nocapture
          git diff --check

  record-result:
    needs: [implement, windows-stage, postgres-contract]
    if: always() && needs.implement.result == 'success' && needs.windows-stage.result == 'success' && needs.postgres-contract.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Close AT1
        shell: bash
        env:
          IMPLEMENT_SHA: ${{ needs.implement.outputs.sha }}
