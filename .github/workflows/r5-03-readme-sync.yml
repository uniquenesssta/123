name: R5-03 Root README Sync

on:
  push:
    branches:
      - agent/r5-03-rule-packages
    paths:
      - ".github/workflows/r5-03-readme-sync.yml"

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record R5-03 current verified facts
        shell: python
        run: |
          from pathlib import Path
          path = Path("README.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          prefix = "- R5-02 Seasons / Stages / Rounds "
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"expected one R5-02 anchor, got {len(matches)}")
          r503_prefix = "- R5-03 Rule Packages "
          if any(line.startswith(r503_prefix) for line in lines):
              raise SystemExit("R5-03 root README entry already exists")
          entry = "- R5-03 Rule Packages 已完成生产 owner 切换并进入 `VERIFYING`：`register/list rule package`、source document upsert 与 RulePackage Row mapping 已从旧 `crates/persistence-postgres/src/routing.rs` 拆入 `adapters/rules/packages/`，事务编排、package INSERT、existing conflict read、profile attach、source upsert、typed `sqlx::FromRow` Row 与 Domain Mapper 均按职责分离；旧文件不保留 R5-03 转发壳，R5-04 Binding、R5-05 Route Resolution、R5-06 Model Run Identity 未提前迁移。Application `RulePackagePort`、Domain DTO/Serde、Tauri、Schema、0001–0046 migration、配置/错误/日志、前端行为、route/model identity、Cargo manifests/Cargo.lock、生产依赖与模型保护资产保持不变。旧 owner PostgreSQL contract run `31810196287` / job `94798701210` 与新 owner run `31811073556` / job `94801559817` 均 `SUCCESS`；官方 inventory run `31811229904` / job `94802081839` 为 `SUCCESS`。第一次 hard gate `31811298187` 在 architecture/model 通过后因新增 contract rustfmt 差异停止；format + inventory run `31811465209` / job `94802847771` 修复后，第二轮 hard gate `31811535324` / job `94803075524` 已通过完整 architecture、模型保护、rustfmt、Persistence/Application check 与单测及同一 PostgreSQL 16 contract。18 个既有 broad PostgreSQL ignored tests 与 destructive reset 未在本节点执行，未触碰用户数据库。当前等待 transient workflow 清理、clean PR canonical CI、固定 HEAD merge、merged stage CI 与最终 closeout；详见 `docs/modular-rewrite/R05-competition-routing-persistence/R05-03-rule-packages.md`。"
          lines.insert(matches[0] + 1, entry)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit root README only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(r5-03): record rule package rewrite status"
          git push origin HEAD:agent/r5-03-rule-packages
