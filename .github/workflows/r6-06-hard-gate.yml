name: R6-06 Windows hard-gate recovery

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
    paths:
      - .github/workflows/r6-06-hard-gate.yml

permissions:
  contents: read

jobs:
  windows-regression:
    name: Windows stage regression recovery
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0

      - name: Verify protected R6-06 product baseline
        shell: pwsh
        run: |
          git merge-base --is-ancestor 1e63e6fa03b4ecfba38552c0f56afad9510a6324 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'R6-06 product baseline is not an ancestor' }
          $changed = @(git diff --name-only 1e63e6fa03b4ecfba38552c0f56afad9510a6324..HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/r6-06-hard-gate.yml') {
            throw "Unexpected hard-gate delta: $($changed -join ', ')"
          }
          if (git status --short) { throw 'Checkout is not clean' }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Rust 1.88 toolchain without third-party action
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust 1.88 toolchain install failed' }
          rustup default 1.88.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust 1.88 toolchain selection failed' }
          rustc --version

      - name: Setup declared Node development dependencies
        shell: pwsh
        run: npm run setup

      - name: Run complete frontend stage regression
        shell: pwsh
        run: npm run verify:frontend

      - name: Verify Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run workspace Clippy hard gate
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        shell: pwsh
        run: cargo test --locked --workspace
