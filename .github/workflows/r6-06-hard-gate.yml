name: R6-06 stage hard gate

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
    paths:
      - .github/workflows/r6-06-hard-gate.yml

permissions:
  contents: read

jobs:
  windows-regression:
    name: Windows stage regression
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0

      - name: Verify protected R6-06 product baseline
        shell: pwsh
        run: |
          git merge-base --is-ancestor 1e63e6fa03b4ecfba38552c0f56afad9510a6324 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'R6-06 product baseline is not an ancestor' }
          $changed = @(git diff --name-only 1e63e6fa03b4ecfba38552c0f56afad9510a6324..HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/r6-06-hard-gate.yml') {
            throw "Unexpected hard-gate delta: $($changed -join ', ')"
          }
          if (git status --short) { throw 'Checkout is not clean' }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Setup declared Node development dependencies
        shell: pwsh
        run: npm run setup

      - name: Run complete frontend stage regression
        shell: pwsh
        run: npm run verify:frontend

      - name: Verify Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run workspace Clippy hard gate
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        shell: pwsh
        run: cargo test --locked --workspace

  postgres-architecture:
    name: PostgreSQL 16 and architecture regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_06_hard_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_06_hard_gate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_06_hard_gate_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0

      - name: Verify protected R6-06 product baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1e63e6fa03b4ecfba38552c0f56afad9510a6324 HEAD
          changed="$(git diff --name-only 1e63e6fa03b4ecfba38552c0f56afad9510a6324..HEAD)"
          test "$changed" = ".github/workflows/r6-06-hard-gate.yml"
          test -z "$(git status --short)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Setup declared Node development dependencies
        shell: bash
        run: npm run setup

      - name: Verify R6 ownership chain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-player-directory-detail.mjs
          node scripts/verify-player-names-positions.mjs
          node scripts/verify-player-team-periods-availability.mjs
          node scripts/verify-player-abilities-dynamic-tags.mjs

      - name: Verify architecture and frozen assets
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify_database_baseline.mjs

      - name: Run retained R6 PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test player_directory_repository_contract -- --ignored --nocapture
          cargo test --locked -p football-persistence-postgres --test player_names_positions_repository_contract -- --ignored --nocapture
          cargo test --locked -p football-persistence-postgres --test player_team_periods_availability_repository_contract -- --ignored --nocapture
          cargo test --locked -p football-persistence-postgres --test player_abilities_dynamic_tags_repository_contract -- --ignored --nocapture
