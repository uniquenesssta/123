name: R6-06 hard-gate cleanup

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
    paths:
      - .github/workflows/r6-06-hard-gate.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify hard-gate baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0dbb54c64220d019e3ebbed6e100f9621152504d HEAD
          changed="$(git diff --name-only 0dbb54c64220d019e3ebbed6e100f9621152504d..HEAD)"
          test "$changed" = ".github/workflows/r6-06-hard-gate.yml"
          test -z "$(git status --short)"

      - name: Record successful stage gate and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_once(
              "README.md",
              "- implementation gate run `32043516067` 已实际通过 R6-06 ownership、retained R6 ownership、完整 architecture、模型保护、数据库基线、rustfmt、Persistence unit tests、Application check 与 PostgreSQL 16 contract；当前保持 `VERIFYING`，等待阶段 hard gate 与 clean canonical CI。",
              "- implementation gate run `32043516067` 已实际通过 R6-06 ownership、retained R6 ownership、完整 architecture、模型保护、数据库基线、rustfmt、Persistence unit tests、Application check 与 PostgreSQL 16 contract；最终阶段 hard gate run `32044944449` 整体 `SUCCESS`：Windows job `95430654653` 已通过完整 frontend、rustfmt、workspace Clippy `-D warnings` 与 workspace tests，PostgreSQL/architecture job `95430654659` 已通过 R6 retained ownership、完整 architecture、模型保护/数据库基线及 R6-03～R6-06 PostgreSQL 16 contracts。历史角色继承 verifier 仅将已删除 `dynamic_tags.rs` 的检查跟随到 `dynamic_tags/contribution/{calculate,scoring}.rs` 权威 owner，原断言未删除或放宽；当前继续 `VERIFYING`，等待无临时 workflow 的 clean canonical CI。",
          )

          replace_once(
              "docs/modular-rewrite/R06-entity-catalog-persistence/R06-06-abilities-and-dynamic-tags.md",
              "- 阶段 hard gate 与 clean canonical Public Platform CI 尚未执行，因此当前保持 `VERIFYING`。",
              "- 阶段 hard-gate 恢复过程中，GitHub codeload `429/503` 曾在第三方 action 下载阶段 fail-fast；改为使用 runner 自带 `rustup` 后，Windows 回归进一步暴露历史 `verify-player-role-inheritance.mjs` 仍读取已删除的 `dynamic_tags.rs`。修复提交 `23a201d28389955747641c12717592b377687251` 仅将原角色继承断言跟随到 `adapters/catalog/dynamic_tags/contribution/{calculate,scoring}.rs` 权威 owner，没有删除、跳过或放宽契约。\n- 最终阶段 hard gate run `32044944449` 整体 `SUCCESS`：Windows job `95430654653` 已通过 `npm run verify:frontend`、`cargo fmt --all -- --check`、workspace Clippy `-D warnings` 与 `cargo test --locked --workspace`；PostgreSQL/architecture job `95430654659` 已通过 R6 retained ownership、完整 architecture、模型保护/数据库基线，以及 R6-03、R6-04、R6-05、R6-06 PostgreSQL 16 contracts。\n- 临时 hard-gate workflow 清理后仍需 clean canonical Public Platform CI，因此当前保持 `VERIFYING`。",
          )

          replace_once(
              "docs/modular-rewrite/R06-entity-catalog-persistence/README.md",
              "- Abilities 与 Dynamic Tags persistence 已按 dimensions / observations / definitions / tags / contribution 职责拆分，旧单文件 owner 删除；当前为 `VERIFYING`，等待阶段 hard gate 与 clean canonical CI。",
              "- Abilities 与 Dynamic Tags persistence 已按 dimensions / observations / definitions / tags / contribution 职责拆分，旧单文件 owner 删除；implementation gate `32043516067` 与最终阶段 hard gate `32044944449` 均已 `SUCCESS`。历史角色继承 verifier 只跟随到新的 contribution owner，未弱化原断言；当前仍为 `VERIFYING`，等待无临时 workflow 的 clean canonical CI。",
          )
          PY

          rm .github/workflows/r6-06-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(r6-06): record successful stage hard gate'
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
