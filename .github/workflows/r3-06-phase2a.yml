name: R3-06 P4 Planning Migration

on:
  push:
    branches:
      - rewrite/r3-06-prediction-service

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-06-prediction-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Generate phase 2A modules
        shell: pwsh
        run: python scripts/r3-06-phase2a.py
      - name: Format and refresh inventory
        shell: pwsh
        run: |
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
      - name: Validate phase 2A
        shell: pwsh
        run: |
          node scripts/verify-application-ports.mjs
          npm run verify:architecture
          cargo fmt --all -- --check
          cargo check --locked -p football-application
          cargo test --locked -p football-application
      - name: Commit clean phase 2A
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r3-06-phase2a.yml
          git rm scripts/r3-06-phase2a.py
          git add -A
          git diff --check
          git commit -m "refactor(r3): migrate P4 planning service"
          git push origin HEAD:rewrite/r3-06-prediction-service
