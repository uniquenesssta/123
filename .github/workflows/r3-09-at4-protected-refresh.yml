name: R3-09 AT4 Protected Refresh

on:
  push:
    branches:
      - agent/r3-09-at4-release

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-09-at4-release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh protected verifier fingerprint
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'architecture/protected-assets.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          def canonical_bytes(path, mode):
              data = path.read_bytes()
              if mode == 'binary':
                  return data
              if mode != 'utf8-lf':
                  raise SystemExit(f'unsupported mode: {mode}')
              text = data.decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
              return text.encode('utf-8')

          def blob_sha(data):
              header = f'blob {len(data)}\0'.encode('utf-8')
              return hashlib.sha1(header + data).hexdigest()

          def fingerprint(blob):
              return hashlib.sha256(f'git-blob-sha1:{blob}'.encode('utf-8')).hexdigest()

          target = 'scripts/verify-public-model-boundary.mjs'
          for entry in manifest['protected_files']:
              if entry['path'] == target:
                  blob = blob_sha(canonical_bytes(root / target, entry['mode']))
                  entry['git_blob_sha1'] = blob
                  entry['fingerprint_sha256'] = fingerprint(blob)
                  break
          else:
              raise SystemExit(f'protected entry not found: {target}')

          rows = []
          for entry in manifest['protected_files']:
              data = canonical_bytes(root / entry['path'], entry['mode'])
              blob = blob_sha(data)
              fp = fingerprint(blob)
              if blob != entry['git_blob_sha1'] or fp != entry['fingerprint_sha256']:
                  raise SystemExit(f'unexpected protected drift outside target: {entry["path"]}')
              rows.append((entry['path'], fp))
          aggregate_input = ''.join(f'{path}\0{fp}\n' for path, fp in sorted(rows)).encode('utf-8')
          manifest['aggregate_sha256'] = hashlib.sha256(aggregate_input).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/protected-assets.json
          git rm .github/workflows/r3-09-at4-protected-refresh.yml
          git commit -m "chore(verify): refresh AT4 public-boundary fingerprint"
          git push origin HEAD:agent/r3-09-at4-release
