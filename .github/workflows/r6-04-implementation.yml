name: R6-04 implementation gate

on:
  push:
    branches:
      - agent/r6-04-player-names-positions

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Apply R6-04 owner migration
        shell: bash
        env:
          R6_BASE: 90f1bb08bf5a7a1580448f791dd241118ea32284
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import os

          root = Path.cwd()
          base = os.environ["R6_BASE"]
          allowed = {".github/workflows/r6-04-implementation.yml"}
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"安全停止：R6-04 基线后存在非临时工作流改动：{sorted(unexpected)}")

          def read(path):
              return (root / path).read_text(encoding="utf-8")

          def write(path, content):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8", newline="\n")

          player_catalog_path = "crates/persistence-postgres/src/player_catalog.rs"
          source = read(player_catalog_path)
          source = source.replace(
              "    adapters::catalog::players::{\n        normalization::normalize_name, value_mapping::availability_status,\n    },\n",
              "    adapters::catalog::players::value_mapping::availability_status,\n",
              1,
          )
          source = source.replace(
              "    PlayerAvailabilityDraft, PlayerAvailabilityRecord, PlayerCatalogReferenceData, PlayerNameDraft,\n    PlayerNameRecord, PlayerPositionDraft, PlayerPositionRecord, PlayerTeamPeriodDraft,\n",
              "    PlayerAvailabilityDraft, PlayerAvailabilityRecord, PlayerCatalogReferenceData,\n    PlayerTeamPeriodDraft,\n",
              1,
          )
          source, count = re.subn(
              r"\n    pub async fn add_player_name\([\s\S]*?\n    pub async fn assign_player_position\(",
              "\n    pub async fn assign_player_position(",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("未能唯一移除 legacy add_player_name owner")
          source, count = re.subn(
              r"\n    pub async fn assign_player_position\([\s\S]*?\n    pub async fn add_player_team_period\(",
              "\n    pub async fn add_player_team_period(",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("未能唯一移除 legacy assign_player_position owner")
          source, count = re.subn(
              r"\nfn player_name_from_row\([\s\S]*?\nfn player_position_from_row\(",
              "\nfn player_position_from_row(",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("未能唯一移除 legacy player_name_from_row")
          source, count = re.subn(
              r"\nfn player_position_from_row\([\s\S]*?\nfn player_team_period_from_row\(",
              "\nfn player_team_period_from_row(",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("未能唯一移除 legacy player_position_from_row")
          source = source.replace(
              "    use crate::adapters::catalog::players::value_mapping::{player_status, preferred_foot};\n",
              "    use crate::adapters::catalog::players::{\n        normalization::normalize_name,\n        value_mapping::{player_status, preferred_foot},\n    };\n",
              1,
          )
          if "pub async fn add_player_name" in source or "pub async fn assign_player_position" in source:
              raise SystemExit("legacy Player Names/Positions write owner 仍残留在 player_catalog.rs")
          write(player_catalog_path, source)

