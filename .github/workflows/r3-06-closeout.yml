name: R3-06 Closeout

on:
  push:
    branches:
      - rewrite/r3-06-prediction-service

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-06-prediction-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize R3-06 records
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rootPath = 'README.md'
          $root = Get-Content -Raw -Encoding UTF8 $rootPath
          $oldSummary = '已创建 `R00-stage-completion.md`、`R01-stage-completion.md` 与 `R02-stage-completion.md`。R1、R2 阶段均已关闭；R3-01 Application Ports、R3-02 Database Service、R3-03 Competition / Rules Services 与 R3-05 Lineups Service 状态为 `DONE`，R3-04 Teams / Players Services 的历史状态仍为 `VERIFYING`，R3-06 Prediction Service 为 `IN_PROGRESS`。详细状态见 `docs/modular-rewrite/R03-application-services/README.md`。'
          $newSummary = '已创建 `R00-stage-completion.md`、`R01-stage-completion.md` 与 `R02-stage-completion.md`。R1、R2 阶段均已关闭；R3-01 Application Ports、R3-02 Database Service、R3-03 Competition / Rules Services、R3-05 Lineups Service 与 R3-06 Prediction Service 状态为 `DONE`，R3-04 Teams / Players Services 的历史状态仍为 `VERIFYING`，R3-07 Research Service 已开放为 `READY`。详细状态见 `docs/modular-rewrite/R03-application-services/README.md`。'
          if (-not $root.Contains($oldSummary)) { throw 'root README R3 status anchor not found' }
          $root = $root.Replace($oldSummary, $newSummary)
          $root = $root.Replace('## R3-06 Prediction Service（IN_PROGRESS）', '## R3-06 Prediction Service（DONE）')
          $old2c = '- Atomic Task 2C 已完成并通过 Windows hard gate run `31292152981`：公开 P4 Snapshot 写入/读取 API 已从旧 `p4_persistence.rs` 迁入 Prediction Service / `use_cases/prediction/p4_snapshot/`，`P4FreezeExecutionPort` 同时承担不可变快照写入与读取，ApplicationService 方法名、参数和返回类型保持兼容；`verify:prediction-service` 已接入 `verify:architecture` 与 `verify:frontend`。专项验证覆盖 Prediction Service、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests。Research schema/prompt/run/evidence/conflict 写入仍保留给 R3-07。当前仅等待 clean 源码树的最终 Public Platform CI，因此 R3-06 继续为 `IN_PROGRESS`、R3-07 继续为 `BLOCKED`。'
          $new2c = '- Atomic Task 2C 已正式关闭为 `DONE`。Windows hard gate run `31292152981` 已通过 Prediction Service、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests；公开 P4 Snapshot 写入/读取 API 已从旧 `p4_persistence.rs` 迁入 Prediction Service / `use_cases/prediction/p4_snapshot/`，`P4FreezeExecutionPort` 同时承担不可变快照写入与读取，ApplicationService 方法名、参数和返回类型保持兼容。clean-tree 验收 HEAD `5e60f0b16c907d38f1a827a8705dde59c626b045` 的 Public Platform CI run `31292509918` / Windows Automated job `93192012861` 已全部通过：完整 frontend、17 个截图回归视口、TypeScript、Vite production build、Rust fmt、workspace Clippy `-D warnings`、workspace tests、Tauri Windows release 构建与 release runtime 日志验收均为 PASS；Application tests 33/33 通过，runtime 自动验收为 7 条日志 / 3 个完成操作。artifact `9032172319` 大小 `14249704` 字节，SHA-256 `8a14b02d4687a75839497ed07b443e92be5960f49c1b98ad9ea5db6d0bae8450`。18 个真实 PostgreSQL 集成测试因未配置专用可写 `FOOTBALL_TEST_DATABASE_URL` 按既有安全设计保持 `ignored`，未记为已执行。终审确认旧 `p4_orchestration.rs` 仅保留 R3-07 Research worker 且 freeze 分支已经委托 Prediction Service，`p4_workbench.rs` 与 `p4_persistence.rs` 剩余公开写职责均属于 Research；2C 临时 workflow / 脚本均已清理。R3-06 已关闭为 `DONE`，R3-07 Research Service 开放为 `READY`。'
          if (-not $root.Contains($old2c)) { throw 'root README 2C anchor not found' }
          $root = $root.Replace($old2c, $new2c)
          Set-Content -Path $rootPath -Value $root -Encoding UTF8 -NoNewline

          $indexPath = 'docs/modular-rewrite/R03-application-services/README.md'
          $index = Get-Content -Raw -Encoding UTF8 $indexPath
          if (-not $index.Contains('| R3-06 | Prediction Service | IN_PROGRESS |')) { throw 'R03 index R3-06 status anchor not found' }
          if (-not $index.Contains('| R3-07 | Research Service | BLOCKED |')) { throw 'R03 index R3-07 status anchor not found' }
          $index = $index.Replace('| R3-06 | Prediction Service | IN_PROGRESS |', '| R3-06 | Prediction Service | DONE |')
          $index = $index.Replace('| R3-07 | Research Service | BLOCKED |', '| R3-07 | Research Service | READY |')
          $oldIndex2c = '- Atomic Task 2C 已完成并通过 Windows hard gate run `31292152981`：公开 P4 Snapshot 写入/读取 API 已从旧 `p4_persistence.rs` 迁入 Prediction Service / `use_cases/prediction/p4_snapshot/`，`P4FreezeExecutionPort` 同时承担不可变快照写入与读取，ApplicationService 方法名、参数和返回类型保持兼容；`verify:prediction-service` 已接入 `verify:architecture` 与 `verify:frontend`。专项验证覆盖 Prediction Service、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests。Research schema/prompt/run/evidence/conflict 写入仍保留给 R3-07。当前仅等待 clean 源码树的最终 Public Platform CI，因此 R3-06 继续为 `IN_PROGRESS`、R3-07 继续为 `BLOCKED`。'
          $newIndex2c = '- Atomic Task 2C 已正式关闭为 `DONE`。Windows hard gate run `31292152981` 已通过 Prediction Service、Application Ports、完整 architecture、rustfmt、Application check/tests、workspace Clippy `-D warnings` 与 workspace tests；公开 P4 Snapshot 写入/读取 API 已迁入 Prediction Service / `use_cases/prediction/p4_snapshot/`，公共 ApplicationService 契约保持兼容。clean-tree HEAD `5e60f0b16c907d38f1a827a8705dde59c626b045` 的 Public Platform CI run `31292509918` / Windows Automated job `93192012861` 已通过完整 frontend、17 个截图回归视口、TypeScript、Vite、Rust fmt、workspace Clippy/tests、Tauri Windows release 与 release runtime smoke；Application tests 33/33，runtime 为 7 条日志 / 3 个完成操作。artifact `9032172319` 大小 `14249704` 字节，SHA-256 `8a14b02d4687a75839497ed07b443e92be5960f49c1b98ad9ea5db6d0bae8450`。18 个 PostgreSQL 集成测试因未配置专用可写 `FOOTBALL_TEST_DATABASE_URL` 保持 `ignored`。终审确认旧 `p4_orchestration.rs` 剩余为 R3-07 Research worker，freeze 路径已委托 Prediction Service；`p4_workbench.rs` / `p4_persistence.rs` 剩余写职责均属于 Research。2C 临时 workflow / 脚本已清理；R3-06 已关闭为 `DONE`，R3-07 已开放为 `READY`。'
          if (-not $index.Contains($oldIndex2c)) { throw 'R03 index 2C anchor not found' }
          $index = $index.Replace($oldIndex2c, $newIndex2c)
          Set-Content -Path $indexPath -Value $index -Encoding UTF8 -NoNewline
      - name: Verify closeout consistency
        shell: pwsh
        run: |
          npm run verify:prediction-service
          npm run verify:architecture
          git diff --check
          Select-String -Path README.md -SimpleMatch '## R3-06 Prediction Service（DONE）' | Out-Null
          Select-String -Path docs/modular-rewrite/R03-application-services/README.md -SimpleMatch '| R3-06 | Prediction Service | DONE |' | Out-Null
          Select-String -Path docs/modular-rewrite/R03-application-services/README.md -SimpleMatch '| R3-07 | Research Service | READY |' | Out-Null
      - name: Commit clean closeout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-06-closeout.yml
          git add README.md docs/modular-rewrite/R03-application-services/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "docs(r3): close R3-06 prediction service"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-06-prediction-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
