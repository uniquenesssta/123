name: R5-04 Competition Bindings Hard Gate

on:
  push:
    branches:
      - agent/r5-04-competition-bindings
    paths:
      - ".github/workflows/r5-04-hard-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Verify full architecture
        run: npm run verify:architecture
      - name: Verify public model boundary
        run: npm run verify:public-model-boundary
      - name: Verify protected model assets
        run: node scripts/verify_protected_assets.mjs
      - name: Verify canonical rustfmt
        run: cargo fmt --all -- --check
      - name: Check Persistence and Application
        run: cargo check --locked -p football-persistence-postgres -p football-application
      - name: Test Persistence
        run: cargo test --locked -p football-persistence-postgres
      - name: Test Application
        run: cargo test --locked -p football-application
      - name: Run Competition Binding PostgreSQL contract
        run: cargo test --locked -p football-persistence-postgres --test competition_bindings_repository_contract -- --ignored --test-threads=1
