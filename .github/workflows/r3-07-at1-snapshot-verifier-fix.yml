name: R3-07 AT1 Snapshot Verifier Repair

on:
  push:
    branches:
      - rewrite/r3-07-at1-staging

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-07-at1-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record third formal CI verifier finding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootPath = 'README.md'
          $root = Get-Content -Raw -Encoding UTF8 $rootPath
          $anchor = '- 第二次正式 Public CI run `31296120912` 已确认 Database verifier 通过，随后 Prediction verifier 因直接读取已删除的 `p4_persistence.rs` 触发 ENOENT。该验证器已改为确认旧 owner 不存在，并直接检查 `use_cases/prediction/p4_snapshot` 继续持有两个快照职责；原 Prediction facade/service/port/adapter 与 Research conflict 边界断言均保留。修复门禁 run `31296198981` 通过后提交本记录。'
          $extra = "- 第三次正式 Public CI run ``31296232974`` 已确认旧文件读取问题消失，但发现 verifier 将 ``p4_snapshot`` 内部 ``freeze/read`` 误按公共 Application 方法名断言。已改为检查真实内部 ``freeze/read`` 入口及 ``P4FreezeExecutionPort`` 调用，同时继续由 facade/service 断言公共 ``freeze_p4_prematch_snapshot/read_p4_prematch_snapshot`` 契约。修复门禁 run ``$env:GITHUB_RUN_ID`` 通过后提交本记录。"
          if (-not $root.Contains($anchor)) { throw 'root README second verifier finding anchor not found' }
          if (-not $root.Contains('第三次正式 Public CI run `31296232974`')) {
            $root = $root.Replace($anchor, "$anchor`n$extra")
          }
          Set-Content -Path $rootPath -Value $root -Encoding UTF8 -NoNewline

          $indexPath = 'docs/modular-rewrite/R03-application-services/README.md'
          $index = Get-Content -Raw -Encoding UTF8 $indexPath
          $indexAnchor = '- 第二次正式 Public CI run `31296120912` 在 Database verifier 通过后暴露 Prediction verifier 仍直接读取已删除 `p4_persistence.rs`；已改为验证旧 owner 缺失并检查 Prediction `p4_snapshot` use case 继续承担公开快照职责，未放宽 Prediction/Research 边界。修复门禁 run `31296198981` 通过后提交。'
          $indexExtra = "- 第三次正式 Public CI run ``31296232974`` 发现 ``p4_snapshot`` 内部职责名为 ``freeze/read``，并非公共 facade 方法名；验证器已改为检查真实内部入口及 Port 委托，公共 Application API 仍由 facade/service 断言。修复门禁 run ``$env:GITHUB_RUN_ID`` 通过后提交。"
          if (-not $index.Contains($indexAnchor)) { throw 'R03 second verifier finding anchor not found' }
          if (-not $index.Contains('第三次正式 Public CI run `31296232974`')) {
            $index = $index.Replace($indexAnchor, "$indexAnchor`n$indexExtra")
          }
          Set-Content -Path $indexPath -Value $index -Encoding UTF8 -NoNewline
      - name: Validate corrected snapshot assertions
        shell: pwsh
        run: |
          npm run verify:database-service
          npm run verify:prediction-service
          npm run verify:research-service
          npm run verify:application-ports
          npm run verify:architecture
          git diff --check
      - name: Commit clean snapshot verifier repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-07-at1-snapshot-verifier-fix.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add scripts/verify-prediction-service.mjs README.md docs/modular-rewrite/R03-application-services/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test(r3): validate actual P4 snapshot use case"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-07-at1-staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
