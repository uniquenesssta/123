name: R4-02 Formal Closeout

on:
  push:
    branches:
      - rewrite/r4-persistence-foundation
    paths:
      - .github/workflows/r4-02-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r4-persistence-foundation
          fetch-depth: 0

      - name: Update canonical README and remove closeout workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '- R4-02 Audit 基础设施已将 AuditEvent/entity ID/payload/SHA-256/审计 SQL writer 收敛到 `crates/persistence-postgres/src/audit/`，并清理 Match Exchange、Player、Spreadsheet、Team Catalog、Team Force Delete 的重复/直写审计路径；`create_team` 的业务行与审计行改为同一事务提交。严格 hard gate run `31629430245` 仅在专项、数据库冻结契约、architecture/frontend 与 Rust 全量回归通过后提交；18 个专用 PostgreSQL 集成测试与 destructive reset 未执行。当前状态为 `VERIFYING`。'
          new = '- R4-02 Audit 基础设施已将 AuditEvent/entity ID/payload/SHA-256/审计 SQL writer 收敛到 `crates/persistence-postgres/src/audit/`，并清理 Match Exchange、Player、Spreadsheet、Team Catalog、Team Force Delete 的重复/直写审计路径；`create_team` 的业务行与审计行改为同一事务提交。strict hard gate run `31629430245` 已通过专项、数据库冻结契约、architecture/frontend 与 Rust 全量回归；最终 clean Public Platform CI run `31630618699` / job `94228122818` 为 `SUCCESS`，artifact `9155761101`，SHA-256 `82dbb88b6dd974ad43c2d86bfb291aca8831faa9d956212bdc04de7110d87dee`。PR #23 已按固定 HEAD `6598065e6edf671e8806fc77901d083bad910542` 合并，merge commit `bc4154044f194e5b1505b4ebb308ba51d6208663`；18 个专用 PostgreSQL 集成测试仍未执行，未执行 destructive reset。R4-02 状态为 `DONE`，R4-03 已开放为 `READY`。'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one R4-02 README record, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/r4-02-closeout.yml
          git diff --check
          git diff -- README.md .github/workflows/r4-02-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/r4-02-closeout.yml
          git commit -m "docs(r4-02): record formal closeout"
          git push origin HEAD:rewrite/r4-persistence-foundation
