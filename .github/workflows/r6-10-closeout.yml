name: R6-10 Closeout

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6-10-closeout-${{ github.ref }}
  cancel-in-progress: false

env:
  R6_BRANCH: rewrite/r6-entity-catalog-persistence
  R6_10_PRODUCTION: fbe013b96f38d3c61e7b536e1ef67a89109c57c4
  R6_10_VERIFY_RUN: '32249902897'
  R6_10_WINDOWS_JOB: '96058363125'
  R6_10_POSTGRES_JOB: '96058363037'

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0

      - name: Confirm verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$R6_10_PRODUCTION" HEAD
          test -f .r6-10-verify-success.txt
          grep -Fx "run_id=$R6_10_VERIFY_RUN" .r6-10-verify-success.txt
          grep -Fx "production=$R6_10_PRODUCTION" .r6-10-verify-success.txt
          grep -Fx "windows_job=$R6_10_WINDOWS_JOB" .r6-10-verify-success.txt
          grep -Fx "postgres_job=$R6_10_POSTGRES_JOB" .r6-10-verify-success.txt
          grep -Fx 'windows=success' .r6-10-verify-success.txt
          grep -Fx 'postgres=success' .r6-10-verify-success.txt
          test ! -e .r6-10-failure.txt

      - name: Finalize R6-10 records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          run = os.environ['R6_10_VERIFY_RUN']
          win = os.environ['R6_10_WINDOWS_JOB']
          pg = os.environ['R6_10_POSTGRES_JOB']
          production = os.environ['R6_10_PRODUCTION']

          record = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md')
          text = record.read_text(encoding='utf-8')
          if '`VERIFYING`' not in text:
              raise SystemExit('R6-10 record no longer VERIFYING')
          text = text.replace('`VERIFYING`', '`DONE`', 1)
          pending = '- production owner-switch 后继续运行完整 Windows stage regression 与 R6-01～R6-10 retained PostgreSQL 16 contracts。'
          verified = f'- stage verification run `{run}` 已通过：Windows job `{win}` 完成 frontend、rustfmt、workspace Clippy `-D warnings`、workspace tests 与 diff hygiene；PostgreSQL 16 job `{pg}` 完成 Global Search / Domain inventory / architecture / protected assets / database baseline 门禁及 R6-01～R6-10 retained contracts。'
          if pending not in text:
              raise SystemExit('R6-10 pending stage line missing')
          text = text.replace(pending, verified, 1)
          text += f'''\n## 完成结论\n\n- 生产 owner-switch 提交：`{production}`。统一名称搜索唯一生产 owner 为 `adapters/catalog/global_search/`，旧 `name_search.rs` 已删除，无双实现或转发壳。\n- implementation/minimum gate `32249610140` 与 stage verification run `{run}` 均已实际通过，R6-10 据此关闭为 `DONE`。\n- 本节点未修改 UI。此前人工验收中，球队目录/详情和球队名称/档案写入回读由用户明确确认通过；球员项仅收到“应该OK了”，不扩大记为完整 Windows Full 人工验收。\n'''
          record.write_text(text, encoding='utf-8')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = stage.read_text(encoding='utf-8')
          if '| R6-10 | Global Name Search | VERIFYING |' not in text:
              raise SystemExit('stage README R6-10 no longer VERIFYING')
          text = text.replace('| R6-10 | Global Name Search | VERIFYING |', '| R6-10 | Global Name Search | DONE |', 1)
          start = text.find('## R6-10 当前事实')
          end = text.find('## R6-01 当前事实')
          if start < 0 or end <= start:
              raise SystemExit('R6-10 stage fact block missing')
          facts = f'''## R6-10 当前事实\n\n- 详细记录：[`R06-10-global-name-search.md`](R06-10-global-name-search.md)。\n- 旧根部 `name_search.rs` 已按 `query / normalization / predicate` 分责迁入 `adapters/catalog/global_search/`；搜索契约与 UI 不变。\n- production owner-switch `{production}` 的 implementation/minimum gate run `32249610140` 已通过；stage verification run `{run}` 的 Windows job `{win}` 与 PostgreSQL 16 job `{pg}` 均 `SUCCESS`，R6-10 正式 `DONE`。\n\n'''
          text = text[:start] + facts + text[end:]
          stage.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          start = text.find('### R6-10 Global Name Search')
          end = text.find('### R6-09 Archive / Delete / Force Delete')
          if start < 0 or end <= start:
              raise SystemExit('root README R6-10 block missing')
          final = f'''### R6-10 Global Name Search\n\n- 统一名称搜索已收敛到 `adapters/catalog/global_search/{{query,normalization,predicate}}`；球队目录、球员目录、球队 selector、教练目录与 Entity Reference 只切换内部 owner，旧 `name_search.rs` 已删除。\n- `football.global-name-search.v1` 的中文/英文/别名/重音/标点与空白无关、多关键词 AND、contains 与分页语义保持不变；公共 DTO、Schema、0001–0046 migrations、配置、UI、错误语义和生产依赖不变。production `{production}` 的 minimum gate run `32249610140` 与 stage verification run `{run}` 均通过；Windows job `{win}`、PostgreSQL 16 job `{pg}` 均 `SUCCESS`，R6-10 正式 `DONE`。\n\n'''
          text = text[:start] + final + text[end:]
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Remove temporary verification assets and commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm .r6-10-verify-success.txt
          git rm .github/workflows/r6-10-stage-verify.yml
          git rm .github/workflows/r6-10-closeout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence
          git diff --cached --check
          git commit -m 'docs(r6-10): close global name search'
          git push origin HEAD:"$R6_BRANCH"
