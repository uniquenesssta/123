name: R5-02 Inventory Refresh

on:
  push:
    branches:
      - agent/r5-02-seasons-stages-rounds
    paths:
      - ".github/workflows/r5-02-inventory-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-domain-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate domain type inventory
        run: node scripts/generate-domain-type-inventory.mjs
      - name: Commit generated inventory when changed
        shell: bash
        run: |
          if git diff --quiet -- architecture/domain-type-inventory.json; then
            echo "Inventory already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/domain-type-inventory.json
          git commit -m "chore(r5-02): refresh domain type inventory"
          git push origin HEAD:agent/r5-02-seasons-stages-rounds

