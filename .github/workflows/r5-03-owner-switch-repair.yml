name: R5-03 Owner Switch Visibility Repair

on:
  push:
    branches:
      - agent/r5-03-rule-packages
    paths:
      - ".github/workflows/r5-03-owner-switch-repair.yml"

permissions:
  contents: write

jobs:
  repair-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Narrowly repair generated helper visibility
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/r5-03-owner-switch.yml')
          source = path.read_text(encoding='utf-8')
          old = "pub(super) async fn upsert_rule_source_document("
          new = "pub(in crate::adapters::rules::packages) async fn upsert_rule_source_document("
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one visibility anchor, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair and remove repair helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/r5-03-owner-switch.yml
          git rm .github/workflows/r5-03-owner-switch-repair.yml
          git commit -m "fix(r5-03): scope source helper visibility to packages"
          git push origin HEAD:agent/r5-03-rule-packages
