name: R1-01 documentation finalization

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-doc-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - name: Record validated R1-01 closure
        shell: pwsh
        run: |
          git config core.quotepath false
          ./scripts/r1-finalize-docs.ps1
