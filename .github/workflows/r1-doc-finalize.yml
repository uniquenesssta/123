          ## 14. 下一步

          当前唯一可执行 Atomic Task：`R1-02 边界验证脚本`。
          '@
          [IO.File]::WriteAllText($taskPath, $task.TrimStart().Replace("`r`n", "`n") + "`n", $utf8NoBom)

          $changed = @(git diff --name-only)
          $expected = @($rootPath, $stagePath, $taskPath)
          if ($changed.Count -ne 3 -or @($changed | Where-Object { $_ -notin $expected }).Count -ne 0) {
            throw "Unexpected documentation scope: $($changed -join ', ')"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $rootPath $stagePath $taskPath
          git commit -m "docs(r1): close R1-01 after Windows gate"
          git push origin HEAD:new-B
