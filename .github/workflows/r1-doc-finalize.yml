name: R1-01 documentation finalization

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-doc-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - name: Record validated R1-01 closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $rootPath = "README.md"
          $root = [IO.File]::ReadAllText($rootPath)
          $oldRootLine = '- `new-B` 已从 `new-A` 提交 `36d34ba1ff73cbec575cf58594aa8c0329669496` 建立；R1-01 已创建模块边界与状态所有权契约，当前因完整工作树门禁未执行保持 `VERIFYING`，未修改业务源码、依赖、迁移、公共命令或模型保护资产。'
          $newRootBlock = @'
          - `new-B` 已从 `new-A` 提交 `36d34ba1ff73cbec575cf58594aa8c0329669496` 建立；R1-01 已创建模块边界与状态所有权契约并完成 Windows 自动化门禁，状态为 `DONE`，R1-02 已开放为 `READY`。
          - `Public Platform CI` 现支持推送到 `main`、`new-*`、`rewrite/**`、Pull Request 和 `workflow_dispatch`，以 `windows-latest` 执行架构契约、前端、Rust、Tauri Windows release、release 客户端启动和运行日志扫描，并上传验证证据。
          - R1-01 最终验证运行 `30989439570`、job `92251837163` 在提交 `fc02ad51d01229cb2ea62fc20f623910ba49de7f` 上通过；artifact `8924033934` 大小 `14115361` 字节，SHA-256 为 `85551aacdd43ba1e3516025ae510aefaaa8e11d61f433a701eaa884e292a47a1`，Automated 报告为 PASS，7 条运行记录、0 条无效记录、0 个运行时错误。
          - 新增 `.gitattributes` 固定文本 LF 和二进制排除规则；相关验证器统一按 LF 规范读取冻结合同，避免 Windows 检出换行导致伪失败。冻结合同、迁移哈希、锁文件、生产依赖、公共命令、数据库结构和模型保护资产均未改变。
          '@.Trim()
          if (-not $root.Contains($oldRootLine)) {
            throw "Root README R1-01 status line was not found."
          }
          $root = $root.Replace($oldRootLine, $newRootBlock)

          $buildMarker = "`n`n## 模块化重写执行记录"
          $ciParagraph = @'

`Public Platform CI` 是 Windows 自动交付门禁：对 `main`、`new-*`、`rewrite/**` 的推送、Pull Request 和手动触发执行 R1 架构契约检查及 `scripts/windows-acceptance.ps1 -Mode Automated`，并保存验收日志和 release bundle 证据。云端 Automated 不替代最终真实 PostgreSQL、Windows Full 交互和用户本机验收。

## 模块化重写执行记录
'@
          if (-not $root.Contains($buildMarker)) {
            throw "Root README modular rewrite marker was not found."
          }
          $root = $root.Replace($buildMarker, $ciParagraph)
          [IO.File]::WriteAllText($rootPath, $root.Replace("`r`n", "`n"), $utf8NoBom)

          $stagePath = "docs/modular-rewrite/R01-architecture-composition/README.md"
          $stage = @'
          # R01 架构契约与空壳组合根：执行记录索引

          ## 阶段状态

          `IN_PROGRESS`

          R00 已按 Windows-only 目标范围完成。R1 只建立可机器验证的架构边界和浏览器、Tauri、Application 组合根空壳，不迁移具体业务实现。

          ## 前置基线

          - R00 阶段完成记录：[`../R00-baseline/R00-stage-completion.md`](../R00-baseline/R00-stage-completion.md)
          - R00 完成前分支提交：`ab812dc2cef126cc46fe9914a63815e047739d75`
          - `new-B` 分支起点：`new-A` 提交 `36d34ba1ff73cbec575cf58594aa8c0329669496`
          - 目标平台：Windows
          - Linux：不属于目标平台、交付或阶段门禁
          - PostgreSQL 实跑、Windows Full、用户本机 Windows 实机验收：保留到最终统一验收

          ## 阶段范围

          - `architecture/module-boundaries.json`
          - `architecture/state-ownership.json`
          - `scripts/architecture/` 边界验证脚本
          - 浏览器 bootstrap 空壳
          - Tauri bootstrap/state/command registry 空壳
          - Application composition/service/model registry 空壳

          ## 禁止范围

          - 不迁移具体 Feature、Domain 或 Repository 实现。
          - 不修改模型保护区。
          - 不改变 Tauri 命令名称、参数、返回类型、启动顺序、窗口行为或默认模型注册语义。
          - 不新增生产依赖。

          ## 任务状态表

          | 任务 ID | 任务名称 | 状态 | 实施记录 | 最小验证 | 阶段回归 |
          |---|---|---|---|---|---|
          | R1-01 | 模块边界契约 | DONE | [`R01-01-模块边界契约.md`](R01-01-模块边界契约.md) | JSON 解析、契约自检、Windows Automated 通过 | workflow run `30989439570` 通过 |
          | R1-02 | 边界验证脚本 | READY | 待创建 | 待执行 | 待执行 |
          | R1-03 | 浏览器组合根 | BLOCKED | 待创建 | 待执行 | 待执行 |
          | R1-04 | Tauri 组合根 | BLOCKED | 待创建 | 待执行 | 待执行 |
          | R1-05 | Application 组合根 | BLOCKED | 待创建 | 待执行 | 待执行 |

          ## R1-01 完成结果

          - 已创建 `architecture/module-boundaries.json`，登记 18 个前端 Feature、11 个 Rust workspace 成员、4 个应用端口、32 个 PostgreSQL 适配模块、15 个 Tauri 命令组及 171 命令的权威契约引用。
          - 已创建 `architecture/state-ownership.json`，登记 17 个共享状态及其唯一当前所有者、读写边界、禁止所有者和计划迁移目标。
          - 已把 `Public Platform CI` 扩展为 Windows 自动交付门禁，覆盖目标分支推送、PR 和手动触发。
          - 已新增仓库级 LF 文本契约并修复 Windows 换行导致的验证器伪失败；没有修改冻结合同、迁移哈希、锁文件、生产依赖、公共接口、数据库结构或模型保护资产。
          - workflow run `30989439570`、job `92251837163` 在提交 `fc02ad51d01229cb2ea62fc20f623910ba49de7f` 上通过；证据 artifact `8924033934` 的 SHA-256 为 `85551aacdd43ba1e3516025ae510aefaaa8e11d61f433a701eaa884e292a47a1`。

          ## 阶段出口

          全部节点完成后必须创建 `R01-stage-completion.md`，并实际通过：

          - 架构边界验证；
          - `npm run verify:frontend`（Windows）；
          - `npm run verify:rust`；
          - 公共命令契约；
          - 模型保护资产指纹。

          ## 当前唯一可执行任务

          `R1-02 边界验证脚本`
          '@
          [IO.File]::WriteAllText($stagePath, $stage.TrimStart().Replace("`r`n", "`n") + "`n", $utf8NoBom)

          $taskPath = "docs/modular-rewrite/R01-architecture-composition/R01-01-模块边界契约.md"
          $task = @'
          # R01-01 模块边界契约：实施记录

          ## 1. 基本信息

          - 所属阶段：R01 架构契约与空壳组合根
          - 任务状态：`DONE`
          - 基线分支：`new-A`
          - 实施分支：`new-B`
          - 分支起点：`36d34ba1ff73cbec575cf58594aa8c0329669496`
          - 完成日期：2026-08-05
          - 对应任务书：`docs/football-model-platform-modular-rewrite-19-docs/01-R1-architecture-composition.md`

          ## 2. 原始问题与本节点目标

          - 原始问题：现有边界分散在 Cargo 清单、前端入口、Tauri 命令、应用服务和人工说明中，缺少一份可供后续脚本验证的模块依赖契约；共享状态虽有实际所有者，但没有统一、机器可读的唯一所有权声明。
          - 本节点目标：建立模块依赖和状态所有权两份权威 JSON 契约，为 R1-02 的自动边界门禁以及 R1-03 至 R1-05 的组合根拆分提供固定输入，并通过 Windows GitHub Actions 形成可重复的自动交付证据。
          - 明确不处理：不迁移 Feature、Domain、Repository 或命令实现，不拆分 `src/main.ts`、`src-tauri/src/lib.rs`、`src-tauri/src/commands.rs` 或 `crates/application/src/lib.rs`，不改变公共接口、运行行为、配置、依赖、数据库、模型或 UI。

          ## 3. 实际变更摘要

          - 新增 `architecture/module-boundaries.json`：登记 18 个前端页面/Feature、11 个 Rust workspace 成员、4 个应用端口、32 个 PostgreSQL 适配模块、15 个 Tauri 命令组，并以 `architecture/command-contract.json` 作为 171 个命令的唯一权威清单。
          - 新增 `architecture/state-ownership.json`：登记 17 个共享状态的唯一当前所有者、写入边界、禁止所有者和计划迁移目标。
          - 更新 `.github/workflows/ci.yml`：对 `main`、`new-*`、`rewrite/**` 推送、Pull Request 和 `workflow_dispatch` 使用 `windows-latest` 执行 R1 JSON smoke check 与既有 Windows Automated 验收器，并上传日志和 release bundle 证据。
          - 新增 `.gitattributes`：文本统一 LF；Windows `.bat`/`.cmd` 保持 CRLF；图片、PDF、Excel 和 ZIP 明确为二进制。
          - 将历史合同和精确文本验证器统一为 LF 规范读取，消除 Windows 检出转换导致的伪失败；冻结合同内容及迁移登记哈希均未更新。
          - 将强制清除专项断言从“必须出现 `drop(state)` 文本”修正为“阻塞闭包只捕获拥有所有权的 service、不得捕获 `State` 借用”，同时保持 `clippy -D warnings` 不放宽。
          - 对 R1-03、R1-04、R1-05 的目标只作非权威过渡声明，当前所有权在对应节点完成前不变化。

          ## 4. 新增文件

          | 文件路径 | 唯一职责 |
          |---|---|
          | `architecture/module-boundaries.json` | 模块、依赖、端口、适配器和 Tauri 命令组边界契约 |
          | `architecture/state-ownership.json` | 共享状态唯一所有权与迁移目标契约 |
          | `.gitattributes` | 跨 Windows/Unix 的文本字节稳定和二进制排除规则 |
          | `docs/modular-rewrite/R01-architecture-composition/R01-01-模块边界契约.md` | R1-01 实施、验证、限制和回退记录 |

          ## 5. 修改文件

          | 文件路径 | 修改内容 | 影响 |
          |---|---|---|
          | `.github/workflows/ci.yml` | 增加目标分支、PR、手动触发和 Windows Automated 交付门禁 | 自动验证与证据留存 |
          | `scripts/verify-inline-workspace-and-resource-scroll.mjs` | 读取时规范 CRLF/LF | 验证器跨平台一致性 |
          | `scripts/verify-api-workspace.mjs` | 合同和迁移按规范 LF 比较、哈希 | 验证器跨平台一致性 |
          | `scripts/verify-team-player-management.mjs` | Cargo.lock 和合同按规范 LF 比较、哈希 | 验证器跨平台一致性 |
          | `scripts/verify-team-package-import-normalization.mjs` | 读取时规范 CRLF/LF | 验证器跨平台一致性 |
          | `scripts/verify-entity-relationships.mjs` | Cargo.lock 和合同按规范 LF 比较、哈希 | 验证器跨平台一致性 |
          | `scripts/verify-formation-usage.mjs` | 合同按规范 LF 哈希 | 验证器跨平台一致性 |
          | `scripts/verify-monthly-workbooks.mjs` | 合同按规范 LF 哈希 | 验证器跨平台一致性 |
          | `scripts/verify-match-lineup-chain.mjs` | 合同按规范 LF 哈希 | 验证器跨平台一致性 |
          | `scripts/verify-force-team-delete.mjs` | 验证实际所有权捕获边界，不要求 Clippy 拒绝的文本形式 | 测试契约与严格 Clippy 一致 |
          | `docs/modular-rewrite/R01-architecture-composition/README.md` | R1-01 标记 DONE，R1-02 标记 READY | 阶段门禁 |
          | `README.md` | 记录 CI 触发、Windows 验证、证据与剩余限制 | 项目交付记录 |

          `src-tauri/src/commands/catalog.rs` 在诊断过程中曾加入后删除显式 `drop(state)`；最终内容保持拥有所有权的 service 克隆写法，没有生产行为变化。

          ## 6. 移动、重命名或删除文件

          无。一次性 CI 修复工作流已在完成定向修复后删除，仓库未遗留临时脚手架。

          ## 7. 边界与所有权决策

          ### 7.1 前端

          - `src/main.ts` 仍是当前浏览器组合和页面编排所有者，仅标记为 R1-03 的待迁移入口。
          - `src/api/client.ts` 是 Tauri transport 唯一所有者；页面、组件和 `src/app` 不得直接导入 `@tauri-apps/api/core`。
          - 18 个现有页面文件分别登记为当前 Feature owner；目标 `src/features/<feature>` 只表示后续迁移位置，本节点不创建空壳或复制实现。
          - `src/app/viewState.ts`、`src/app/navigation.ts` 和 `src/app/modal.ts` 分别继续拥有工作区文档、导航竞态状态和详情面板历史。

          ### 7.2 Rust

          - Cargo 清单中的当前 workspace 依赖作为允许边，未虚构不存在的依赖倒置层。
          - `football-domain` 保持零 workspace 内部依赖。
          - `PredictionModel`、`OpenAiTransport`、`GatewayAttemptSink`、`ApiKeyProvider` 作为现有端口登记。
          - SQLx/PostgreSQL pool 仅由 `football-persistence-postgres` 所有；Tauri command 模块不得复制数据库连接或模型注册状态。
          - `ApplicationService` 继续唯一持有 `ModelRegistry`、活动数据库与 P4 worker guard；R1-05 完成前不改变。

          ### 7.3 Tauri 和命令

          - `src-tauri/src/lib.rs::run` 仍是当前桌面组合入口。
          - `src-tauri/src/commands.rs::AppState` 仍是桌面共享引用容器。
          - 171 个命令不在新契约中复制第二份名称清单；`architecture/command-contract.json` 保持唯一权威来源，新契约只登记数量、注册所有者和 15 个命令组。
          - 命令名称、参数、返回类型、注册顺序、启动行为和窗口行为均未修改。

          ## 8. 状态所有权摘要

          契约覆盖：浏览器生命周期、导航、工作区、弹窗历史和本地偏好；Application 模型注册表、活动数据库和 P4 worker；Persistence SQLx pool；Tauri AppState、配置路径、问题日志、运行日志、OpenAI profiles、工作区状态和 API 请求取消表；Windows Credential Manager 中的 API key。

          每一状态 ID 只有一个当前 owner。计划迁移目标在对应 Atomic Task 完成前不得被视为新所有者。

          ## 9. 保持不变的行为

          - 171 个公共 Tauri 命令的名称、参数、返回值和注册顺序保持不变。
          - 前端页面、导航、状态恢复、弹窗、日志和 API 调用行为保持不变。
          - Application 构造、默认模型 Stub 注册和数据库连接语义保持不变。
          - 数据格式、持久化结构、数据库迁移、历史数据、配置、错误语义和日志等级保持不变。
          - 模型保护资产、生产依赖和锁文件保持不变。

          ## 10. 实际验证记录

          | 验证命令或操作 | 环境 | 结果 |
          |---|---|---|
          | 两份 architecture JSON 解析和结构自检 | Linux 隔离容器 | 通过；18 Feature、11 workspace、32 persistence、15 command groups、171 commands、17 个唯一 state ID |
          | R1 架构契约 smoke check | GitHub Actions `windows-latest` | 通过；合同 ID、引用、数量和状态 ID 唯一性均满足 |
          | `npm ci` | GitHub Actions Windows | 通过 |
          | 前端契约、类型、截图与 Vite 生产构建 | GitHub Actions Windows | 通过 |
          | Rust 格式、`clippy --locked --workspace --all-targets -- -D warnings` 与 workspace tests | GitHub Actions Windows | 通过 |
          | Tauri Windows release 构建 | GitHub Actions Windows | 通过 |
          | release 客户端启动与运行日志扫描 | GitHub Actions Windows | 通过；应用版本 `0.23.0`，7 条记录，0 条无效记录，0 个运行时错误，`bootstrap`、`read_workspace_state`、`save_workspace_state` 完整配对 |
          | workflow run `30989439570` / job `92251837163` | 提交 `fc02ad51d01229cb2ea62fc20f623910ba49de7f` | `success` |
          | artifact `8924033934` | GitHub Actions | `14115361` 字节；SHA-256 `85551aacdd43ba1e3516025ae510aefaaa8e11d61f433a701eaa884e292a47a1`；保留至 2026-08-19 |

          ## 11. 未执行验证与原因

          | 未执行项 | 原因 | 已完成替代验证 | 尚未排除的风险 |
          |---|---|---|---|
