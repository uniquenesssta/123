name: R3-07 OpenAI Research Gateway Migration

on:
  push:
    branches:
      - rewrite/r3-07-at3-staging

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-07-at3-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Generate Atomic Task 3
        shell: pwsh
        run: python scripts/r3-07-at3.py
      - name: Format and refresh inventory
        shell: pwsh
        run: |
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
      - name: Verify Research Service
        shell: pwsh
        run: npm run verify:research-service
      - name: Verify Database compatibility
        shell: pwsh
        run: npm run verify:database-service
      - name: Verify Prediction compatibility
        shell: pwsh
        run: npm run verify:prediction-service
      - name: Verify Application Ports
        shell: pwsh
        run: npm run verify:application-ports
      - name: Verify full architecture
        shell: pwsh
        run: npm run verify:architecture
      - name: Verify rustfmt
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Check Application crate
        shell: pwsh
        run: cargo check --locked -p football-application
      - name: Test Application crate
        shell: pwsh
        run: cargo test --locked -p football-application
      - name: Clippy workspace
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        shell: pwsh
        run: cargo test --locked --workspace
      - name: Commit clean Atomic Task 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-07-at3.yml
          git rm -f scripts/r3-07-at3.py
          git add crates/application scripts/verify-research-service.mjs architecture/domain-type-inventory.json README.md docs/modular-rewrite/R03-application-services/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "refactor(r3): migrate OpenAI research gateway"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-07-at3-staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
