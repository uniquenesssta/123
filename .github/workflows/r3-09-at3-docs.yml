name: R3-09 AT3 Docs

on:
  push:
    branches:
      - agent/r3-09-at3-ai-workspace

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AT3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-09-at3-ai-workspace
          fetch-depth: 0

      - name: Record AT3 VERIFYING
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:160]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          root = 'README.md'
          replace_exact(
              root,
              'AT1 Match Lineup / AI Match Package Exchange 与 AT2 Spreadsheet Exchange 均已关闭为 `DONE`，AT3 AI Workspace 已开放为 `READY`。',
              'AT1 Match Lineup / AI Match Package Exchange 与 AT2 Spreadsheet Exchange 均已关闭为 `DONE`，AT3 AI Workspace 已完成源码迁移并进入 `VERIFYING`。'
          )
          replace_exact(
              root,
              'R3-09 Exchange / AI Workspace / Release Services 为 `IN_PROGRESS`（AT1 Match Lineup / AI Match Package Exchange 与 AT2 Spreadsheet Exchange 均为 `DONE`，AT3 AI Workspace 为 `READY`，AT4 Release 为 `NOT_STARTED`）。',
              'R3-09 Exchange / AI Workspace / Release Services 为 `IN_PROGRESS`（AT1 Match Lineup / AI Match Package Exchange 与 AT2 Spreadsheet Exchange 均为 `DONE`，AT3 AI Workspace 为 `VERIFYING`，AT4 Release 为 `NOT_STARTED`）。'
          )
          replace_exact(
              root,
              '- Windows hard gate run `31512091398` / job `93848182746` 已通过最终 rustfmt、官方 Domain inventory、完整 `verify:architecture`、workspace Clippy `-D warnings` 与 workspace tests；Application tests 35/35、Domain Serde 17/17、Spreadsheet IO 12/12 等均无失败。最终 clean Public Platform CI run `31513432237` / Windows Automated job `93852598090` 在 clean HEAD `8719008ba63241d313fe02ce4328ee8d0a727e9d` 上整体 `SUCCESS`，validation evidence artifact `9110944721` 大小 `14040458` 字节，SHA-256 `f0628be97bbfb13a765da3e4799bd7e8abf549352e391cb79ef1111cb9522a9f`。18 个需要专用 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试按既有安全设计保持 `ignored`，未记为已执行；未执行破坏性数据库验证。AT2 已关闭为 `DONE`，AT3 AI Workspace 开放为 `READY`，AT4 Release 保持 `NOT_STARTED`。',
              '- Windows hard gate run `31512091398` / job `93848182746` 已通过最终 rustfmt、官方 Domain inventory、完整 `verify:architecture`、workspace Clippy `-D warnings` 与 workspace tests；Application tests 35/35、Domain Serde 17/17、Spreadsheet IO 12/12 等均无失败。最终 clean Public Platform CI run `31513432237` / Windows Automated job `93852598090` 在 clean HEAD `8719008ba63241d313fe02ce4328ee8d0a727e9d` 上整体 `SUCCESS`，validation evidence artifact `9110944721` 大小 `14040458` 字节，SHA-256 `f0628be97bbfb13a765da3e4799bd7e8abf549352e391cb79ef1111cb9522a9f`。18 个需要专用 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试按既有安全设计保持 `ignored`，未记为已执行；未执行破坏性数据库验证。AT2 已关闭为 `DONE`。\n- AT3 AI Workspace 已完成 Application 层源码迁移并进入 `VERIFYING`：旧 `crates/application/src/api_workspace.rs` 已删除，不保留转发壳；12 个既有 ApplicationService 公共入口迁入唯一 `AiWorkspaceService` 与独立 `use_cases/ai_workspace/<use-case>/`。Session、Context、Operation、Presets、Attachments 已按职责拆分，Apply Operation 进一步拆为 orchestration / dispatch / payload / metadata；公共导出继续以原名称从 `lib.rs` 暴露。\n- R3-01 `ApiWorkspaceSessionPort` / `ApiWorkspaceOperationPort` 已按真实持久化能力补齐并由 `ActiveDatabase` 适配；第一轮架构门禁发现 Port 暴露裸 `serde_json::Value` 后，改为显式 `SerializedApiWorkspaceOperationResult` 序列化边界，由 adapter 唯一还原 JSON，没有放宽 Ports 禁止裸 JSON 的门禁。两个历史 AI Workspace 相关验证器仅迁移 authoritative owner 读取位置，原断言未删除或弱化。\n- AT3 Windows hard gate run `31553249625` / job `93980269528` 已整体 `SUCCESS`：官方 Domain inventory、完整 `verify:architecture`、37 个最小 Port trait、AI Workspace 专项、`cargo check --locked -p football-application`、Application tests 33/33、`cargo clippy --locked -p football-application --all-targets -- -D warnings` 与 formatter scope 均通过；临时 hard-gate workflow 已自删除。PostgreSQL SQL/migration/Schema、Domain 公共契约、Tauri 产品源码、前端产品源码、Release/AT4、配置与生产依赖未改变。最终 clean Public Platform CI 尚待执行，因此 AT3 当前保持 `VERIFYING`；AT4 Release 保持 `NOT_STARTED`。'
          )

          task = 'docs/modular-rewrite/R03-application-services/R03-09-exchange-ai-workspace-and-release.md'
          task_path = Path(task)
          task_text = task_path.read_text(encoding='utf-8')
          marker = '\n## Atomic Task 3 — AI Workspace\n'
          if marker in task_text:
              raise SystemExit(f'{task}: AT3 section already exists')
          task_text = task_text.replace(
              'AT2 正式关闭为 `DONE`；AT3 AI Workspace 开放为 `READY`，AT4 Release 保持 `NOT_STARTED`。',
              'AT2 正式关闭为 `DONE`；AT3 AI Workspace 后续已完成源码迁移并进入 `VERIFYING`，AT4 Release 保持 `NOT_STARTED`。'
          )
          task_text += '''\n\n## Atomic Task 3 — AI Workspace\n\n状态：`VERIFYING`\n\n### 当前实施范围\n\n- 删除旧 `crates/application/src/api_workspace.rs`，不保留转发壳；12 个既有 ApplicationService AI Workspace 入口保持原名、参数和返回 DTO，并由唯一 `AiWorkspaceService` 编排。\n- 12 个公共职责分别进入 `use_cases/ai_workspace/<use-case>/`；Session、Context、Operation、Presets、Attachments 分责，Apply Operation 再拆为 orchestration、dispatch、payload 与 metadata，避免重新形成职责混合大文件。\n- 最小补齐 R3-01 `ApiWorkspaceSessionPort` / `ApiWorkspaceOperationPort` 的 usage/session/message/generated-file/operation lifecycle 能力；具体 PostgreSQL 调用仅由 `composition/adapters/ai_workspace.rs` 的 `ActiveDatabase` 适配。\n- Ports 禁止裸 JSON 的既有门禁保持不变；Operation 完成结果使用显式 `SerializedApiWorkspaceOperationResult` 穿越 Port，由组合 adapter 唯一反序列化后调用既有 persistence API。\n- `ApiWorkspacePresetSpec`、preset 查询和附件读取公共导出改由新 Use Case 模块提供，原公开名称继续由 `lib.rs` re-export。\n\n### 兼容边界\n\n- 12 个 ApplicationService 方法、preset key、错误文本、200 球员通用上下文上限、Operation claim/apply/failed/reject 生命周期、7 种既有数据库提案类型、metadata 注入字段和附件数量/大小/类型/截断/hash 语义保持不变。\n- Tauri AI Workspace 产品命令与 UI 未重构；当前“不接受新附件的 AI 问答”行为保持不变，已禁用的 apply/reject Tauri 命令没有重新暴露。\n- PostgreSQL SQL/migration/Schema、Domain 公共契约、前端产品源码、模型保护区、Release/AT4、配置、日志等级与生产依赖未改变。\n- `verify-api-workspace.mjs` 与 `verify-team-player-management.mjs` 仅迁移到新 authoritative owner，原业务断言未删除或放宽；新增 `verify-ai-workspace-service.mjs` 并接入完整 architecture/frontend 门禁。\n\n### 验证状态\n\n- Windows hard gate run `31553249625` / job `93980269528` 已整体 `SUCCESS`：Rust 1.88.0 rustfmt、官方 Domain inventory、完整 `verify:architecture`、37-Port 契约、新 AI Workspace 专项、`cargo check --locked -p football-application`、Application tests 33/33、`cargo clippy --locked -p football-application --all-targets -- -D warnings` 与 formatter scope 均通过。\n- 第一轮门禁发现 `ApiWorkspaceOperationPort` 裸 `serde_json::Value` 违反 R3-01 边界，已改用显式序列化结果类型；第二处阻塞为历史验证器仍读取已删除 owner，已只迁移 authoritative source。两项都未通过放宽、跳过或删除门禁处理。\n- 临时 hard-gate workflow 已自删除；最终源码树不保留该诊断入口。\n- 18 个需要专用 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试未在本 hard gate 执行，未记为通过；未执行破坏性数据库验证。\n- PR #19 当前保持 draft 且未合并；最终 clean Public Platform CI / Windows Automated 尚待执行，因此 AT3 当前保持 `VERIFYING`，不得提前关闭为 `DONE`；AT4 Release 保持 `NOT_STARTED`。\n'''
          task_path.write_text(task_text, encoding='utf-8', newline='\n')

          stage = 'docs/modular-rewrite/R03-application-services/README.md'
          replace_exact(
              stage,
              '- Atomic Task 3 — AI Workspace：`READY`。',
              '- Atomic Task 3 — AI Workspace：`VERIFYING`。旧 `crates/application/src/api_workspace.rs` 已删除，12 个既有 ApplicationService 入口迁入唯一 `AiWorkspaceService` 与独立 Use Cases；Session / Context / Operation / Presets / Attachments 已分责，Apply Operation 进一步拆为 orchestration / dispatch / payload / metadata。'
          )
          replace_exact(
              stage,
              '- 最终 clean Public Platform CI run `31513432237` / Windows Automated job `93852598090` 已在正式只读 workflow 与 clean HEAD `8719008ba63241d313fe02ce4328ee8d0a727e9d` 上整体 `SUCCESS`；artifact `9110944721` 大小 `14040458` 字节，SHA-256 `f0628be97bbfb13a765da3e4799bd7e8abf549352e391cb79ef1111cb9522a9f`。AT2 已关闭为 `DONE`，AT3 开放为 `READY`，R3-10 继续 `BLOCKED`。',
              '- 最终 clean Public Platform CI run `31513432237` / Windows Automated job `93852598090` 已在正式只读 workflow 与 clean HEAD `8719008ba63241d313fe02ce4328ee8d0a727e9d` 上整体 `SUCCESS`；artifact `9110944721` 大小 `14040458` 字节，SHA-256 `f0628be97bbfb13a765da3e4799bd7e8abf549352e391cb79ef1111cb9522a9f`。AT2 已关闭为 `DONE`。\n- AT3 hard gate run `31553249625` / job `93980269528` 已通过官方 Domain inventory、完整 architecture、37-Port 契约、新 AI Workspace 专项、Application check、Application tests 33/33、Clippy `-D warnings` 与 formatter scope；临时 workflow 已自删除。Ports 裸 JSON 阻塞通过显式序列化结果边界修复，历史验证器旧 owner 仅迁移读取源，不弱化断言。最终 clean Public Platform CI 尚待执行，因此 AT3 保持 `VERIFYING`，AT4 `NOT_STARTED`，R3-10 继续 `BLOCKED`。'
          )
          PY

      - name: Remove temporary docs workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/r3-09-at3-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R03-application-services/README.md docs/modular-rewrite/R03-application-services/R03-09-exchange-ai-workspace-and-release.md
          git diff --cached --check
          git commit -m "docs(r3-09): record AI workspace AT3 verification"
          git push origin HEAD:agent/r3-09-at3-ai-workspace
