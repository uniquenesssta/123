name: R3-09 Close

on:
  push:
    branches:
      - rewrite/r3-08-review-postmatch-analytics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-08-review-postmatch-analytics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Close R3-09 documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-Utf8([string]$Path, [string]$Content) {
            [System.IO.File]::WriteAllText((Resolve-Path $Path), $Content, [System.Text.UTF8Encoding]::new($false))
          }

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $content = Get-Content -Raw -Encoding UTF8 $Path
            if (-not $content.Contains($Old)) {
              throw "Expected text not found in $Path`: $Old"
            }
            Write-Utf8 $Path ($content.Replace($Old, $New))
          }

          function Replace-FirstRegex([string]$Path, [string]$Pattern, [string]$Replacement) {
            $content = Get-Content -Raw -Encoding UTF8 $Path
            $regex = [regex]::new($Pattern, [System.Text.RegularExpressions.RegexOptions]::Multiline)
            if (-not $regex.IsMatch($content)) {
              throw "Expected regex not found in $Path`: $Pattern"
            }
            Write-Utf8 $Path ($regex.Replace($content, $Replacement, 1))
          }

          Replace-Exact 'README.md' 'R3-09 Exchange / AI Workspace / Release Services 为 `IN_PROGRESS`（AT1 Match Lineup / AI Match Package Exchange、AT2 Spreadsheet Exchange、AT3 AI Workspace 均为 `DONE`；AT4 Release 已完成源码迁移并进入 `VERIFYING`）' 'R3-09 Exchange / AI Workspace / Release Services 为 `DONE`（AT1 Match Lineup / AI Match Package Exchange、AT2 Spreadsheet Exchange、AT3 AI Workspace、AT4 Release 均已关闭）；R3-10 ApplicationService 兼容门面开放为 `READY`'
          Replace-Exact 'README.md' '## R3-09 AT4 Release Service（VERIFYING）' '## R3-09 AT4 Release Service（DONE）'
          Replace-Exact 'README.md' '- PR #20 当前保持 Draft / Open / 未合并；AT4 技术验收已经通过，但正式流程状态继续保持 `VERIFYING`，R3-09 尚未关闭，R3-10 继续 `BLOCKED`。' '- PR #20 已正式合并到阶段分支，merge commit `fd1b8eb2b726338ec588df7c1e8cd87ef202ff51`。AT4 正式关闭为 `DONE`；R3-09 四个 Atomic Task 全部关闭，R3-09 正式为 `DONE`，R3-10 ApplicationService 兼容门面开放为 `READY`。'

          $task = 'docs/modular-rewrite/R03-application-services/R03-09-exchange-ai-workspace-and-release.md'
          Replace-FirstRegex $task '^`IN_PROGRESS`$' '`DONE`'
          Replace-Exact $task '状态：`VERIFYING`' '状态：`DONE`'
          Replace-Exact $task '- PR #20 当前保持 Draft / Open / 未合并；AT4 技术验收已经通过，但在正式合并/收口前仍保持 `VERIFYING`，不得提前关闭为 `DONE`；R3-09 继续 `IN_PROGRESS`，R3-10 继续 `BLOCKED`。' '- PR #20 已正式合并到阶段分支，merge commit `fd1b8eb2b726338ec588df7c1e8cd87ef202ff51`。AT4 正式关闭为 `DONE`；AT1–AT4 全部完成，R3-09 正式关闭为 `DONE`，R3-10 ApplicationService 兼容门面开放为 `READY`。'

          $stage = 'docs/modular-rewrite/R03-application-services/README.md'
          Replace-Exact $stage '| R3-09 | Exchange / AI / Release Services | IN_PROGRESS |' '| R3-09 | Exchange / AI / Release Services | DONE |'
          Replace-Exact $stage '| R3-10 | ApplicationService 兼容门面 | BLOCKED |' '| R3-10 | ApplicationService 兼容门面 | READY |'
          Replace-Exact $stage '- Atomic Task 4 — Release：`READY`。' '- Atomic Task 4 — Release：`DONE`。旧 `release_acceptance.rs` 已删除，3 个 Release Acceptance 公共入口已迁入唯一 `ReleaseService` 与职责拆分 Use Cases；严格 hard gate 与最终 clean Public Platform CI 均通过，PR #20 已合并。`R3-09` 正式关闭，`R3-10` 开放为 `READY`。'

          npm run verify:frontend
          npm run verify:architecture

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md $task $stage .github/workflows/r3-09-close.yml
          git rm .github/workflows/r3-09-close.yml
          git commit -m 'docs(r3-09): close release service task'
          git push origin HEAD:rewrite/r3-08-review-postmatch-analytics
