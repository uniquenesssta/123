name: R3-07 AT1 Prediction Verifier Repair

on:
  push:
    branches:
      - rewrite/r3-07-at1-staging

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-07-at1-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record second formal CI verifier finding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootPath = 'README.md'
          $root = Get-Content -Raw -Encoding UTF8 $rootPath
          $anchor = '- 正式 Public Platform CI run `31295931710` 在 Database Service verifier 检出旧 `p4_persistence.rs` owner 断言；产品源码和 AT1 Rust 门禁未失败。验证器已改为检查 Database facade -> ResearchService -> Artifact Catalog -> ResearchArtifactPort 的完整内置 P4 artifact 注册链，不删除或放宽初始化断言。修复门禁 run `31296085324` 通过后才提交本记录。'
          $extra = "- 第二次正式 Public CI run ``31296120912`` 已确认 Database verifier 通过，随后 Prediction verifier 因直接读取已删除的 ``p4_persistence.rs`` 触发 ENOENT。该验证器已改为确认旧 owner 不存在，并直接检查 ``use_cases/prediction/p4_snapshot`` 继续持有两个快照职责；原 Prediction facade/service/port/adapter 与 Research conflict 边界断言均保留。修复门禁 run ``$env:GITHUB_RUN_ID`` 通过后提交本记录。"
          if (-not $root.Contains($anchor)) { throw 'root README first verifier finding anchor not found' }
          if (-not $root.Contains('第二次正式 Public CI run `31296120912`')) {
            $root = $root.Replace($anchor, "$anchor`n$extra")
          }
          Set-Content -Path $rootPath -Value $root -Encoding UTF8 -NoNewline

          $indexPath = 'docs/modular-rewrite/R03-application-services/README.md'
          $index = Get-Content -Raw -Encoding UTF8 $indexPath
          $indexAnchor = '- 正式 Public CI run `31295931710` 暴露 Database Service 验证器仍追踪旧 `register_p4_persistence_artifacts` owner；已将断言迁移到 ResearchService / Artifact Catalog / ResearchArtifactPort 权威链，保持原初始化语义门禁强度。修复门禁 run `31296085324` 通过后提交。'
          $indexExtra = "- 第二次正式 Public CI run ``31296120912`` 在 Database verifier 通过后暴露 Prediction verifier 仍直接读取已删除 ``p4_persistence.rs``；已改为验证旧 owner 缺失并检查 Prediction ``p4_snapshot`` use case 继续承担公开快照职责，未放宽 Prediction/Research 边界。修复门禁 run ``$env:GITHUB_RUN_ID`` 通过后提交。"
          if (-not $index.Contains($indexAnchor)) { throw 'R03 first verifier finding anchor not found' }
          if (-not $index.Contains('第二次正式 Public CI run `31296120912`')) {
            $index = $index.Replace($indexAnchor, "$indexAnchor`n$indexExtra")
          }
          Set-Content -Path $indexPath -Value $index -Encoding UTF8 -NoNewline
      - name: Validate repaired Prediction owner chain
        shell: pwsh
        run: |
          npm run verify:database-service
          npm run verify:prediction-service
          npm run verify:research-service
          npm run verify:application-ports
          npm run verify:architecture
          git diff --check
      - name: Commit clean Prediction verifier repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-07-at1-prediction-verifier-fix.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add scripts/verify-prediction-service.mjs README.md docs/modular-rewrite/R03-application-services/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test(r3): follow deleted P4 persistence owner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-07-at1-staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
