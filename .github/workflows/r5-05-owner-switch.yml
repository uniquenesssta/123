name: R5-05 Owner Switch

on:
  push:
    branches:
      - agent/r5-05-route-resolution
    paths:
      - ".github/workflows/r5-05-owner-switch.yml"

permissions:
  contents: write

jobs:
  owner-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_r505
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_r505"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://football:football@127.0.0.1:5432/football_r505
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-05-route-resolution
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Build unique R5-05 owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          base = root / 'crates/persistence-postgres/src/adapters/competition/route_resolution'
          (base / 'context').mkdir(parents=True, exist_ok=True)
          (base / 'route').mkdir(parents=True, exist_ok=True)

          files = {
          base / 'mod.rs': '''mod context;
          mod route;
          ''',
          base / 'context/mod.rs': '''mod record_mapper;
          mod record_row;
          mod resolve_context;
          mod season_context;
          mod stage_context;
          mod validate_scope;
          ''',
          base / 'context/record_row.rs': '''use sqlx::FromRow;
          use uuid::Uuid;

          #[derive(Debug, FromRow)]
          pub(super) struct StageContextRow {
              pub(super) competition_id: Uuid,
              pub(super) season_id: Uuid,
              pub(super) stage_id: Uuid,
              pub(super) stage_kind: String,
          }

          #[derive(Debug, FromRow)]
          pub(super) struct SeasonContextRow {
              pub(super) competition_id: Uuid,
              pub(super) season_id: Uuid,
              pub(super) competition_kind: String,
          }
          ''',
          base / 'context/record_mapper.rs': '''use super::record_row::{SeasonContextRow, StageContextRow};
          use crate::{parse_competition_kind, PersistenceResult};
          use football_domain::ResolvedCompetitionContext;

          pub(super) fn map_stage_context(
              row: StageContextRow,
          ) -> PersistenceResult<ResolvedCompetitionContext> {
              Ok(ResolvedCompetitionContext {
                  competition_id: Some(row.competition_id),
                  season_id: Some(row.season_id),
                  stage_id: Some(row.stage_id),
                  competition_kind: parse_competition_kind(&row.stage_kind)?,
              })
          }

          pub(super) fn map_season_context(
              row: SeasonContextRow,
          ) -> PersistenceResult<ResolvedCompetitionContext> {
              Ok(ResolvedCompetitionContext {
                  competition_id: Some(row.competition_id),
                  season_id: Some(row.season_id),
                  stage_id: None,
                  competition_kind: parse_competition_kind(&row.competition_kind)?,
              })
          }
          ''',
          base / 'context/stage_context.rs': '''use super::record_row::StageContextRow;
          use crate::{PersistenceError, PersistenceResult};
          use sqlx::PgPool;
          use uuid::Uuid;

          pub(super) async fn read_stage_context(
              pool: &PgPool,
              stage_id: Uuid,
          ) -> PersistenceResult<StageContextRow> {
              sqlx::query_as::<_, StageContextRow>(
                  r#"
                  SELECT
                      c.id AS competition_id, s.id AS season_id, st.id AS stage_id,
                      st.stage_kind
                  FROM football.competition_stages st
                  JOIN football.seasons s ON s.id = st.season_id
                  JOIN football.competitions c ON c.id = s.competition_id
                  WHERE st.id = $1 AND c.is_active = true
                  "#,
              )
              .bind(stage_id)
              .fetch_optional(pool)
              .await?
              .ok_or_else(|| {
                  PersistenceError::InvalidState(format!(
                      "赛事阶段不存在或所属赛事已停用：{stage_id}"
                  ))
              })
          }
          ''',
          base / 'context/season_context.rs': '''use super::record_row::SeasonContextRow;
          use crate::{PersistenceError, PersistenceResult};
          use sqlx::PgPool;
          use uuid::Uuid;

          pub(super) async fn read_season_context(
              pool: &PgPool,
              season_id: Uuid,
          ) -> PersistenceResult<SeasonContextRow> {
              sqlx::query_as::<_, SeasonContextRow>(
                  r#"
                  SELECT c.id AS competition_id, s.id AS season_id, c.competition_kind
                  FROM football.seasons s
                  JOIN football.competitions c ON c.id = s.competition_id
                  WHERE s.id = $1 AND c.is_active = true
                  "#,
              )
              .bind(season_id)
              .fetch_optional(pool)
              .await?
              .ok_or_else(|| {
                  PersistenceError::InvalidState(format!(
                      "赛季不存在或所属赛事已停用：{season_id}"
                  ))
              })
          }
          ''',
          base / 'context/validate_scope.rs': '''use crate::{PersistenceError, PersistenceResult};
          use uuid::Uuid;

          pub(super) fn ensure_scope_id(
              label: &str,
              supplied: Option<Uuid>,
              resolved: Uuid,
          ) -> PersistenceResult<()> {
              if let Some(supplied_id) = supplied {
                  if supplied_id != resolved {
                      return Err(PersistenceError::InvalidState(format!(
                          "{label}层级不一致：提交 {supplied_id}，实际所属 {resolved}"
                      )));
                  }
              }
              Ok(())
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn rejects_scope_mismatch() {
                  let resolved = Uuid::new_v4();
                  assert!(ensure_scope_id("赛事", Some(resolved), resolved).is_ok());
                  assert!(ensure_scope_id("赛事", Some(Uuid::new_v4()), resolved).is_err());
              }
          }
          ''',
          base / 'context/resolve_context.rs': '''use super::record_mapper::{map_season_context, map_stage_context};
          use super::season_context::read_season_context;
          use super::stage_context::read_stage_context;
          use super::validate_scope::ensure_scope_id;
          use crate::{PersistenceResult, PostgresStore};
          use football_domain::{CompetitionKind, ResolvedCompetitionContext};
          use uuid::Uuid;

          impl PostgresStore {
              pub async fn resolve_competition_context(
                  &self,
                  competition_id: Option<Uuid>,
                  season_id: Option<Uuid>,
                  stage_id: Option<Uuid>,
                  fallback_kind: CompetitionKind,
              ) -> PersistenceResult<ResolvedCompetitionContext> {
                  if let Some(stage_id_value) = stage_id {
                      let row = read_stage_context(&self.pool, stage_id_value).await?;
                      ensure_scope_id("赛事", competition_id, row.competition_id)?;
                      ensure_scope_id("赛季", season_id, row.season_id)?;
                      return map_stage_context(row);
                  }

                  if let Some(season_id_value) = season_id {
                      let row = read_season_context(&self.pool, season_id_value).await?;
                      ensure_scope_id("赛事", competition_id, row.competition_id)?;
                      return map_season_context(row);
                  }

                  if let Some(competition_id_value) = competition_id {
                      let competition = self.read_competition(competition_id_value).await?;
                      return Ok(ResolvedCompetitionContext {
                          competition_id: Some(competition.id),
                          season_id: None,
                          stage_id: None,
                          competition_kind: competition.competition_kind,
                      });
                  }

                  Ok(ResolvedCompetitionContext {
                      competition_id: None,
                      season_id: None,
                      stage_id: None,
                      competition_kind: fallback_kind,
                  })
              }
          }
          ''',
          base / 'route/mod.rs': '''mod binding_candidate;
          mod explicit_rule_package;
          mod record_mapper;
          mod record_row;
          mod resolve_route;
          ''',
          base / 'route/record_row.rs': '''use serde_json::Value;
          use sqlx::FromRow;
          use uuid::Uuid;

          #[derive(Debug, FromRow)]
          pub(super) struct RouteRow {
              pub(super) binding_id: Option<Uuid>,
              pub(super) rule_package_id: Uuid,
              pub(super) package_key: String,
              pub(super) package_version: String,
              pub(super) package_display_name: String,
              pub(super) profile: Value,
              pub(super) competition_profile_id: Uuid,
              pub(super) routing: Value,
              pub(super) feature_requirements: Value,
              pub(super) output_contract: Value,
              pub(super) priority: i32,
              pub(super) model_key: String,
              pub(super) model_version_id: Uuid,
              pub(super) model_version: String,
              pub(super) parameter_set_id: Uuid,
              pub(super) parameter_version: String,
              pub(super) parameters: Value,
              pub(super) competition_id: Option<Uuid>,
              pub(super) season_id: Option<Uuid>,
              pub(super) stage_id: Option<Uuid>,
              pub(super) competition_kind: Option<String>,
          }
          ''',
          base / 'route/explicit_rule_package.rs': '''use super::record_row::RouteRow;
          use crate::{PersistenceError, PersistenceResult};
          use sqlx::PgPool;
          use uuid::Uuid;

          pub(super) async fn read_explicit_rule_package(
              pool: &PgPool,
              package_id: Uuid,
              preferred_model_family: Option<&str>,
              preferred_model_id: Option<&str>,
          ) -> PersistenceResult<RouteRow> {
              sqlx::query_as::<_, RouteRow>(
                  r#"
                  SELECT
                      NULL::uuid AS binding_id,
                      rp.id AS rule_package_id,
                      rp.package_key, rp.version AS package_version,
                      rp.display_name AS package_display_name,
                      rp.profile, rp.competition_profile_id, rp.routing, rp.feature_requirements, rp.output_contract,
                      rp.priority,
                      d.model_key, v.id AS model_version_id,
                      v.version AS model_version,
                      p.id AS parameter_set_id, p.parameter_version, p.definition AS parameters,
                      NULL::uuid AS competition_id, NULL::uuid AS season_id,
                      NULL::uuid AS stage_id, NULL::text AS competition_kind
                  FROM model.rule_packages rp
                  JOIN model.versions v ON v.id = rp.model_version_id
                  JOIN model.definitions d ON d.id = v.model_id
                  JOIN model.parameter_sets p ON p.id = rp.parameter_set_id
                  WHERE rp.id = $1 AND rp.status = 'active'
                    AND ($2::text IS NULL OR split_part(d.model_key, '_', 1) = $2)
                    AND ($3::text IS NULL OR d.model_key = $3)
                  "#,
              )
              .bind(package_id)
              .bind(preferred_model_family)
              .bind(preferred_model_id)
              .fetch_optional(pool)
              .await?
              .ok_or(PersistenceError::RouteNotFound)
          }
          ''',
          base / 'route/binding_candidate.rs': '''use super::record_row::RouteRow;
          use crate::{PersistenceError, PersistenceResult};
          use football_domain::RouteRequest;
          use sqlx::PgPool;

          pub(super) async fn read_binding_candidate(
              pool: &PgPool,
              request: &RouteRequest,
          ) -> PersistenceResult<RouteRow> {
              sqlx::query_as::<_, RouteRow>(
                  r#"
                  SELECT
                      b.id AS binding_id,
                      rp.id AS rule_package_id,
                      rp.package_key, rp.version AS package_version,
                      rp.display_name AS package_display_name,
                      rp.profile, rp.competition_profile_id, rp.routing, rp.feature_requirements, rp.output_contract,
                      b.priority,
                      d.model_key, v.id AS model_version_id,
                      v.version AS model_version,
                      p.id AS parameter_set_id, p.parameter_version, p.definition AS parameters,
                      b.competition_id, b.season_id, b.stage_id, b.competition_kind
                  FROM model.competition_bindings b
                  JOIN model.rule_packages rp ON rp.id = b.rule_package_id
                  JOIN model.versions v ON v.id = b.model_version_id
                  JOIN model.definitions d ON d.id = v.model_id
                  JOIN model.parameter_sets p ON p.id = b.parameter_set_id
                  WHERE b.is_active = true
                    AND rp.status = 'active'
                    AND (b.valid_from IS NULL OR b.valid_from <= $5)
                    AND (b.valid_to IS NULL OR b.valid_to >= $5)
                    AND (b.competition_id IS NULL OR b.competition_id = $1)
                    AND (b.season_id IS NULL OR b.season_id = $2)
                    AND (b.stage_id IS NULL OR b.stage_id = $3)
                    AND (b.competition_kind IS NULL OR b.competition_kind = $4)
                    AND ($6::text IS NULL OR split_part(d.model_key, '_', 1) = $6)
                    AND ($7::text IS NULL OR d.model_key = $7)
                  ORDER BY
                      (b.stage_id IS NOT NULL) DESC,
                      (b.season_id IS NOT NULL) DESC,
                      (b.competition_id IS NOT NULL) DESC,
                      b.priority DESC,
                      b.created_at DESC,
                      b.id DESC
                  LIMIT 1
                  "#,
              )
              .bind(request.competition_id)
              .bind(request.season_id)
              .bind(request.stage_id)
              .bind(request.competition_kind.as_str())
              .bind(request.kickoff_time)
              .bind(request.preferred_model_family.as_deref())
              .bind(request.preferred_model_id.as_deref())
              .fetch_optional(pool)
              .await?
              .ok_or(PersistenceError::RouteNotFound)
          }
          ''',
          base / 'route/record_mapper.rs': '''use super::record_row::RouteRow;
          use crate::PersistenceResult;
          use football_domain::{CompetitionProfile, RouteDecision, RouteRequest, RouteSource};
          use serde_json::json;

          pub(super) fn binding_source(row: &RouteRow) -> RouteSource {
              if row.stage_id.is_some() {
                  RouteSource::StageBinding
              } else if row.season_id.is_some() {
                  RouteSource::SeasonBinding
              } else if row.competition_id.is_some() {
                  RouteSource::CompetitionBinding
              } else {
                  RouteSource::CompetitionKindDefault
              }
          }

          pub(super) fn map_route_row(
              row: RouteRow,
              source: RouteSource,
              request: &RouteRequest,
          ) -> PersistenceResult<RouteDecision> {
              let competition_profile: CompetitionProfile = serde_json::from_value(row.profile)?;
              let routing = serde_json::from_value(row.routing)?;
              let reason = json!({
                  "source": &source,
                  "binding_id": row.binding_id,
                  "rule_package_id": row.rule_package_id,
                  "package_key": &row.package_key,
                  "package_version": &row.package_version,
                  "preferred_model_family": request.preferred_model_family.as_deref(),
                  "preferred_model_id": request.preferred_model_id.as_deref(),
                  "competition_id": request.competition_id,
                  "season_id": request.season_id,
                  "stage_id": request.stage_id,
                  "competition_kind": request.competition_kind,
                  "priority": row.priority,
              });
              Ok(RouteDecision {
                  source,
                  binding_id: row.binding_id,
                  rule_package_id: row.rule_package_id,
                  package_key: row.package_key,
                  package_version: row.package_version,
                  package_display_name: row.package_display_name,
                  model_id: row.model_key,
                  model_version_id: row.model_version_id,
                  model_version: row.model_version,
                  parameter_set_id: row.parameter_set_id,
                  parameter_version: row.parameter_version,
                  competition_profile_id: row.competition_profile_id,
                  parameters: row.parameters,
                  routing,
                  competition_profile,
                  feature_requirements: row.feature_requirements,
                  output_contract: row.output_contract,
                  priority: row.priority,
                  reason,
              })
          }
          ''',
          base / 'route/resolve_route.rs': '''use super::binding_candidate::read_binding_candidate;
          use super::explicit_rule_package::read_explicit_rule_package;
          use super::record_mapper::{binding_source, map_route_row};
          use crate::{PersistenceResult, PostgresStore};
          use football_domain::{RouteDecision, RouteRequest, RouteSource};

          impl PostgresStore {
              pub async fn resolve_route(
                  &self,
                  request: &RouteRequest,
              ) -> PersistenceResult<RouteDecision> {
                  if let Some(package_id) = request.explicit_rule_package_id {
                      let row = read_explicit_rule_package(
                          &self.pool,
                          package_id,
                          request.preferred_model_family.as_deref(),
                          request.preferred_model_id.as_deref(),
                      )
                      .await?;
                      return map_route_row(row, RouteSource::ExplicitRulePackage, request);
                  }

                  let row = read_binding_candidate(&self.pool, request).await?;
                  let source = binding_source(&row);
                  map_route_row(row, source, request)
              }
          }
          ''',
          }

          for path, content in files.items():
              path.write_text(content, encoding='utf-8')

          competition_mod = root / 'crates/persistence-postgres/src/adapters/competition/mod.rs'
          text = competition_mod.read_text(encoding='utf-8')
          if 'mod route_resolution;' not in text:
              text += 'mod route_resolution;\n'
          competition_mod.write_text(text, encoding='utf-8')

          lib = root / 'crates/persistence-postgres/src/lib.rs'
          text = lib.read_text(encoding='utf-8')
          if 'mod competitions;\n' not in text:
              raise SystemExit('lib.rs competition legacy module registration missing')
          text = text.replace('mod competitions;\n', '', 1)
          lib.write_text(text, encoding='utf-8')

          competitions = root / 'crates/persistence-postgres/src/competitions.rs'
          if not competitions.exists():
              raise SystemExit('legacy competitions.rs missing before R5-05 switch')
          competitions.unlink()

          routing = root / 'crates/persistence-postgres/src/routing.rs'
          text = routing.read_text(encoding='utf-8')
          mapper_marker = '\nfn route_decision_from_row('
          if mapper_marker not in text:
              raise SystemExit('legacy route mapper marker missing')
          text = text[:text.index(mapper_marker)].rstrip() + '\n'
          start = text.find('    pub async fn resolve_route(')
          tail = text.find('pub(crate) async fn register_model_in_tx')
          if start < 0 or tail < 0 or start >= tail:
              raise SystemExit('legacy resolve_route/register_model markers missing')
          text = text[:start] + '}\n\n' + text[tail:]
          text = text.replace(
              'use football_domain::{CompetitionProfile, RouteDecision, RouteRequest, RouteSource};\n',
              '',
              1,
          )
          text = text.replace('use serde_json::{json, Value};\n', 'use serde_json::Value;\n', 1)
          routing.write_text(text, encoding='utf-8')

          assert 'pub async fn resolve_route' not in routing.read_text(encoding='utf-8')
          assert 'route_decision_from_row' not in routing.read_text(encoding='utf-8')
          assert 'pub async fn register_model' in routing.read_text(encoding='utf-8')
          assert 'pub(crate) async fn register_model_in_tx' in routing.read_text(encoding='utf-8')
          assert not competitions.exists()
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Compile affected crates
        run: cargo check --locked -p football-persistence-postgres -p football-application
      - name: New owner PostgreSQL contract
        run: >-
          cargo test --locked -p football-persistence-postgres
          --test route_resolution_repository_contract
          route_resolution_repository_contract_is_preserved
          -- --ignored --exact --nocapture
      - name: Commit owner switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/persistence-postgres/src/lib.rs crates/persistence-postgres/src/routing.rs crates/persistence-postgres/src/adapters/competition/mod.rs crates/persistence-postgres/src/adapters/competition/route_resolution
          git add -u crates/persistence-postgres/src/competitions.rs
          git commit -m "refactor(r5-05): split route resolution persistence"
          git push origin HEAD:agent/r5-05-route-resolution
