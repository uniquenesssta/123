name: Temporary R3 Port Scan

on:
  push:
    branches:
      - new-C

permissions:
  contents: read

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-C
          fetch-depth: 1

      - name: Scan Application to PostgresStore call surface
        shell: pwsh
        run: |
          @'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          persistence_root = root / 'crates' / 'persistence-postgres' / 'src'
          application_root = root / 'crates' / 'application' / 'src'

          methods = {}
          method_pattern = re.compile(r'\bpub\s+async\s+fn\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(')
          for path in sorted(persistence_root.rglob('*.rs')):
              text = path.read_text(encoding='utf-8')
              for match in method_pattern.finditer(text):
                  name = match.group(1)
                  line = text.count('\n', 0, match.start()) + 1
                  methods.setdefault(name, []).append({
                      'source': path.as_posix(),
                      'line': line,
                  })

          callers = {name: [] for name in methods}
          for path in sorted(application_root.rglob('*.rs')):
              text = path.read_text(encoding='utf-8')
              for name in methods:
                  pattern = re.compile(r'\.\s*' + re.escape(name) + r'\s*\(')
                  for match in pattern.finditer(text):
                      callers[name].append({
                          'path': path.as_posix(),
                          'line': text.count('\n', 0, match.start()) + 1,
                      })

          used = []
          for name in sorted(methods):
              if callers[name]:
                  used.append({
                      'method': name,
                      'definitions': methods[name],
                      'callers': callers[name],
                  })

          direct_imports = []
          for path in sorted(application_root.rglob('*.rs')):
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'football_persistence_postgres' in line:
                      direct_imports.append({
                          'path': path.as_posix(),
                          'line': line_no,
                          'text': line.strip(),
                      })

          print(json.dumps({
              'persistencePublicAsyncMethodCount': len(methods),
              'usedByApplicationMethodCount': len(used),
              'usedMethods': used,
              'directPersistenceImports': direct_imports,
          }, ensure_ascii=False, indent=2))
          '@ | python -
