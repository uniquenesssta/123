name: R2-05 Prediction Inventory Refresh

on:
  push:
    branches:
      - "rewrite/r2-05-prediction-research"

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message == 'chore(r2): refresh R2-05 prediction inventory' }}"
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rewrite/r2-05-prediction-research

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate and verify inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne "architecture/domain-type-inventory.json") {
            throw "Inventory refresh changed unexpected paths: $($changed -join ', ')"
          }
          Remove-Item .github/workflows/r2-05-refresh-inventory.yml -Force
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "chore(r2): sync R2-05 prediction inventory"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r2-05-prediction-research
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
