name: R5-05 Documentation Refresh

on:
  push:
    branches:
      - agent/r5-05-route-resolution
    paths:
      - ".github/r5-05-doc-refresh.py"
      - ".github/workflows/r5-05-doc-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh R5-05 documentation
        run: python .github/r5-05-doc-refresh.py
      - name: Remove transient helpers and commit documentation
        shell: bash
        run: |
          rm .github/r5-05-doc-refresh.py
          rm .github/workflows/r5-05-doc-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(r5-05): record PR validation repair"
          git push origin HEAD:agent/r5-05-route-resolution
