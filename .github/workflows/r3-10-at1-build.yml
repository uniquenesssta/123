          write('crates/application/src/services/p4_orchestration/service.rs', '''use crate::model_registry::ModelRegistry;
use crate::services::{prediction::PredictionService, research::ResearchService};
use crate::use_cases::p4_orchestration::{process_next, P4OrchestrationAccess};
use crate::ApplicationResult;
use serde_json::Value;
use std::sync::{
    atomic::{AtomicBool, Ordering},
    Arc,
};

pub(crate) struct P4OrchestrationService {
    running: AtomicBool,
}

impl P4OrchestrationService {
    pub(crate) fn new() -> Self {
        Self {
            running: AtomicBool::new(false),
        }
    }

    pub(crate) async fn process_next<P: P4OrchestrationAccess + ?Sized>(
        &self,
        port: &P,
        registry: &ModelRegistry,
        research: &ResearchService,
        prediction: &PredictionService,
    ) -> ApplicationResult<Option<Value>> {
        process_next::execute(port, registry, research, prediction).await
    }

    pub(crate) fn start(&self, application: Arc<crate::ApplicationService>) {
        super::worker::spawn(application);
    }

    pub(super) fn try_mark_running(&self) -> bool {
        !self.running.swap(true, Ordering::SeqCst)
    }

    pub(super) fn mark_stopped(&self) {
        self.running.store(false, Ordering::SeqCst);
    }
}
''')
          write('crates/application/src/services/p4_orchestration/worker.rs', '''use crate::{ApplicationError, ApplicationService};
use std::sync::Arc;
use tokio::time::{sleep, Duration};

const P4_WORKER_POLL_SECONDS: u64 = 30;

pub(super) fn spawn(application: Arc<ApplicationService>) {
    if !application.p4_orchestration.try_mark_running() {
        return;
    }
    tokio::spawn(async move {
        loop {
            match application.process_next_p4_orchestration_job().await {
                Ok(Some(_)) => continue,
                Ok(None) => sleep(Duration::from_secs(P4_WORKER_POLL_SECONDS)).await,
                Err(ApplicationError::DatabaseNotConnected) => break,
                Err(_) => sleep(Duration::from_secs(P4_WORKER_POLL_SECONDS)).await,
            }
        }
        application.p4_orchestration.mark_stopped();
    });
}
''')
          write('crates/application/src/services/p4_orchestration/facade.rs', '''use crate::{ApplicationError, ApplicationResult, ApplicationService};
use serde_json::Value;
use std::sync::Arc;

impl ApplicationService {
    pub async fn process_next_p4_orchestration_job(
        self: &Arc<Self>,
    ) -> ApplicationResult<Option<Value>> {
        let session = self
            .database
            .active_session()
            .await
            .ok_or(ApplicationError::DatabaseNotConnected)?;
        self.p4_orchestration
            .process_next(&session, &self.registry, &self.research, &self.prediction)
            .await
    }

    pub fn ensure_p4_orchestration_worker(self: &Arc<Self>) {
        self.p4_orchestration.start(Arc::clone(self));
    }
}
''')
