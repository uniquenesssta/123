name: R4-02 Audit Recovery V3

on:
  push:
    branches:
      - agent/r4-02-audit-foundation
    paths:
      - .github/workflows/r4-02-recovery-v3.yml

permissions:
  contents: write

jobs:
  recovery:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout R4-02 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4-02-audit-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Replay R4-02 transform and fix Clippy hygiene
        shell: pwsh
        env:
          R4_02_BASE: e3a1e2e082e82fcb82899abfd5e8646466fcad97
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -Raw -Encoding UTF8 '.github/workflows/r4-02-hard-gate.yml'
          $pattern = "(?s)\`$script = @'\r?\n(?<script>.*?)\r?\n\s*'@\r?\n\s*Set-Content -Path \.tmp-r4-02-transform\.py"
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'Unable to extract R4-02 transform script' }
          $lines = $match.Groups['script'].Value -split "\r?\n"
          $dedented = ($lines | ForEach-Object { if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ } }) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD '.tmp-r4-02-transform.py'), $dedented, [System.Text.UTF8Encoding]::new($false))
          python .tmp-r4-02-transform.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $player = 'crates/persistence-postgres/src/player_catalog.rs'
          $playerText = Get-Content -Raw -Encoding UTF8 $player
          if (($playerText -split 'use serde_json::\{json, Value\};').Count -ne 2) { throw 'Expected exactly one serde_json Value import in player_catalog.rs' }
          $playerText = $playerText.Replace('use serde_json::{json, Value};', 'use serde_json::json;')
          [System.IO.File]::WriteAllText((Join-Path $PWD $player), $playerText, [System.Text.UTF8Encoding]::new($false))

          $event = 'crates/persistence-postgres/src/audit/audit_event.rs'
          $eventText = Get-Content -Raw -Encoding UTF8 $event
          if (($eventText -split 'pub\(super\) struct AuditEntityId').Count -ne 2) { throw 'Expected exactly one AuditEntityId visibility declaration' }
          $eventText = $eventText.Replace('pub(super) struct AuditEntityId', 'pub(crate) struct AuditEntityId')
          [System.IO.File]::WriteAllText((Join-Path $PWD $event), $eventText, [System.Text.UTF8Encoding]::new($false))

      - name: Freeze migrations dependencies protected sources
        shell: pwsh
        run: |
          git diff --exit-code e3a1e2e082e82fcb82899abfd5e8646466fcad97 -- crates/persistence-postgres/migrations crates/persistence-postgres/Cargo.toml crates/persistence-postgres/build.rs crates/persistence-postgres/tests/postgres_integration.rs Cargo.toml Cargo.lock crates/domain crates/model-api crates/model-p4 crates/model-p7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run minimum contracts before formatting
        shell: pwsh
        run: |
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-persistence-audit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:persistence-foundation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-database-migration-compatibility.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-force-team-delete.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-global-name-search.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify_database_baseline.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rustfmt and refresh official Domain inventory
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $allowed = @(
            'crates/persistence-postgres/src/lib.rs',
            'crates/persistence-postgres/src/audit/mod.rs',
            'crates/persistence-postgres/src/audit/audit_event.rs',
            'crates/persistence-postgres/src/audit/audit_payload.rs',
            'crates/persistence-postgres/src/audit/audit_hash.rs',
            'crates/persistence-postgres/src/audit/write_audit_event.rs',
            'crates/persistence-postgres/src/match_exchange.rs',
            'crates/persistence-postgres/src/player_catalog.rs',
            'crates/persistence-postgres/src/spreadsheet_exchange.rs',
            'crates/persistence-postgres/src/team_catalog.rs',
            'crates/persistence-postgres/src/team_force_delete.rs'
          )
          $rustChanged = git diff --name-only e3a1e2e082e82fcb82899abfd5e8646466fcad97 -- '*.rs'
          foreach ($path in $rustChanged) {
            if ($allowed -notcontains $path) { throw "rustfmt touched out-of-scope Rust file: $path" }
          }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify architecture and Persistence crate
        shell: pwsh
        run: |
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked -p football-persistence-postgres
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p football-persistence-postgres
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Node dependencies and verify full frontend
        shell: pwsh
        run: |
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify workspace Clippy and tests
        shell: pwsh
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recheck final contracts and frozen scope
        shell: pwsh
        run: |
          node scripts/verify-persistence-audit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code e3a1e2e082e82fcb82899abfd5e8646466fcad97 -- crates/persistence-postgres/migrations crates/persistence-postgres/Cargo.toml crates/persistence-postgres/build.rs crates/persistence-postgres/tests/postgres_integration.rs Cargo.toml Cargo.lock crates/domain crates/model-api crates/model-p4 crates/model-p7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified R4-02 tree and remove temporary workflows
        shell: pwsh
        run: |
          Remove-Item .tmp-r4-02-transform.py -ErrorAction SilentlyContinue
          git rm .github/workflows/r4-02-audit-detail.yml .github/workflows/r4-02-hard-gate.yml .github/workflows/r4-02-recovery.yml .github/workflows/r4-02-recovery-v2.yml .github/workflows/r4-02-recovery-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md package.json architecture/domain-type-inventory.json scripts/verify-persistence-audit.mjs crates/persistence-postgres/src docs/modular-rewrite/R04-persistence-foundation .github/workflows
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'refactor(r4-02): centralize audit infrastructure'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/r4-02-audit-foundation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
