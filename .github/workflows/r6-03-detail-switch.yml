name: R6-03 Detail Owner Switch

on:
  push:
    branches:
      - agent/r6-03-player-directory-detail
    paths:
      - .github/workflows/r6-03-detail-switch.yml

permissions:
  contents: write

# Rerun after narrowing reader visibility to the Detail coordinator and retaining later-node owners.
jobs:
  switch-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_03
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r6-03-player-directory-detail
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Apply Detail owner switch
        run: python .github/scripts/r6_03_detail_switch.py
      - name: Repair generated internal visibility
        shell: python
        run: |
          from pathlib import Path
          root = Path.cwd()
          readers = [
              "crates/persistence-postgres/src/adapters/catalog/players/detail/abilities/profile/read.rs",
              "crates/persistence-postgres/src/adapters/catalog/players/detail/abilities/observations/read.rs",
              "crates/persistence-postgres/src/adapters/catalog/players/detail/external_ids/read.rs",
          ]
          for relative in readers:
              path = root / relative
              text = path.read_text(encoding="utf-8")
              if text.count("pub(super) async fn ") != 1:
                  raise SystemExit(f"unexpected reader visibility in {relative}")
              path.write_text(
                  text.replace(
                      "pub(super) async fn ",
                      "pub(in crate::adapters::catalog::players::detail) async fn ",
                      1,
                  ),
                  encoding="utf-8",
              )
          player = root / "crates/persistence-postgres/src/player_catalog.rs"
          text = player.read_text(encoding="utf-8")
          text = text.replace(
              "use chrono::{Datelike, NaiveDate, Utc};",
              "use chrono::{Datelike, NaiveDate};",
              1,
          )
          player.write_text(text, encoding="utf-8")
      - name: Format switched Rust sources
        run: cargo fmt --all
      - name: Verify diff integrity
        run: git diff --check
      - name: Check persistence crate
        run: cargo check --locked -p football-persistence-postgres --all-targets
      - name: Check application crate
        run: cargo check --locked -p football-application --all-targets
      - name: Run persistence unit tests
        run: cargo test --locked -p football-persistence-postgres --lib
      - name: Run frozen PostgreSQL 16 contract
        run: cargo test --locked -p football-persistence-postgres --test player_directory_detail_repository_contract -- --ignored --nocapture
      - name: Remove transient Detail switch tooling
        run: |
          rm .github/scripts/r6_03_detail_switch.py
          rm .github/workflows/r6-03-detail-switch.yml
      - name: Commit verified Detail owner switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "refactor(r6-03): switch player detail owner"
          git push origin HEAD:agent/r6-03-player-directory-detail
