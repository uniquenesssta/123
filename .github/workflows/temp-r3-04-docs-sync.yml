name: Temporary R3-04 Docs Sync

on:
  push:
    branches:
      - rewrite/r3-04-teams-players
    paths:
      - .github/workflows/temp-r3-04-docs-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-04-teams-players
          fetch-depth: 0
      - name: Synchronize stage and root README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stage = Path('docs/modular-rewrite/R03-application-services/README.md')
          text = stage.read_text(encoding='utf-8')
          text = text.replace('| R3-04 | Teams / Players Services | READY |', '| R3-04 | Teams / Players Services | VERIFYING |')
          marker = '\n详细记录见 [`R03-03-competition-rules-services.md`](./R03-03-competition-rules-services.md)。\n'
          section = '''\n详细记录见 [`R03-03-competition-rules-services.md`](./R03-03-competition-rules-services.md)。\n\n## R3-04 当前结果\n\n- 已将旧 `player_catalog.rs` 中 35 个球队、球员、教练与实体引用 Application 职责迁入 `services/teams/`、`services/players/` 与对应 `use_cases/`；共 43 个 Service / Use Case Rust 文件。原文件只保留 R3-05 的 19 个阵型、比赛、阵容与预设职责。\n- `ApplicationService` / `ApplicationComposition` 已聚合 `TeamService` 与 `PlayerService`；公共方法、Tauri 命令、DTO、SQL、迁移、生产依赖和模型边界保持兼容。\n- 6 个 Team / Player Ports 的具体适配按职责拆到 `composition/adapters/teams.rs` 与 `players.rs`；`port_registry.rs` 继续作为 Application 唯一直接导入 PostgreSQL crate 的组合根所有者。\n- 首轮 Windows 编译真实暴露球队强制删除 SQLx transaction 的 non-Send 边界；现仅在组合适配器对 preview/force-delete 使用 `spawn_blocking + Handle::block_on`，保持既有 Tauri 隔离和事务语义，没有修改 SQL 或弱化强确认。\n- Windows 2025 run `31258038424` / job `93104371481` 已通过 R3-04 专项、实体关系、球队强制清除、球队/球员管理、完整 architecture、保护资产、Application check、Application tests 33/33、workspace Clippy `-D warnings` 与 diff hygiene。\n- R3-04 当前为 `VERIFYING`，等待用户 Windows 本机完整阶段回归与非破坏性 runtime 烟测；R3-05 继续 `BLOCKED`。\n\n详细记录见 [`R03-04-teams-players-services.md`](./R03-04-teams-players-services.md)。\n'''
          if '## R3-04 当前结果' not in text:
              if marker not in text:
                  raise SystemExit('stage README R3-03 marker missing')
              text = text.replace(marker, section)
          stage.write_text(text, encoding='utf-8', newline='\n')

          readme = Path('README.md')
          lines = readme.read_text(encoding='utf-8').splitlines()
          prefix = '- R3 已从 R2 完成提交 `7cf906b8f98ab0fdcf89f80952bc8fb9cf21801f` 建立独立分支 `new-C`。'
          replacement = '- R3 已从 R2 完成提交 `7cf906b8f98ab0fdcf89f80952bc8fb9cf21801f` 建立独立分支 `new-C`。R3-01 Application Ports、R3-02 Database Service、R3-03 Competition / Rules Services 均已完成。R3-04 已将 `player_catalog.rs` 中 35 个球队/球员/教练/实体引用职责重写到 `services/teams/`、`services/players/` 与对应 `use_cases/`，并将 6 个 Ports 的具体适配按 Teams / Players 拆到组合根职责适配器；原文件只保留 R3-05 的阵型/比赛/阵容职责。球队强制删除的 SQLx non-Send transaction 通过组合适配器的 `spawn_blocking + Handle::block_on` 保留原有事务和 Tauri 隔离语义，未修改 SQL、DTO、生产依赖或模型边界。Windows 实施侧 R3-04 专项、architecture、保护资产、Application check/tests 33/33、workspace Clippy `-D warnings` 已通过；R3-04 状态为 `VERIFYING`，等待用户 Windows 本机完整回归与非破坏性运行时烟测，R3-05 继续 `BLOCKED`。'
          for index, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[index] = replacement
                  break
          else:
              raise SystemExit('root README R3 summary missing')
          readme.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -F '| R3-04 | Teams / Players Services | VERIFYING |' docs/modular-rewrite/R03-application-services/README.md
          grep -F '## R3-04 当前结果' docs/modular-rewrite/R03-application-services/README.md
          grep -F 'R3-04 状态为 `VERIFYING`' README.md
      - name: Commit docs and remove temporary workflow
        shell: bash
        run: |
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add README.md docs/modular-rewrite/R03-application-services/README.md
          git commit -m "docs(r3): mark R3-04 verifying"
          git rm .github/workflows/temp-r3-04-docs-sync.yml
          git commit -m "chore(r3): remove temporary R3-04 docs workflow"
          git push origin HEAD:rewrite/r3-04-teams-players
