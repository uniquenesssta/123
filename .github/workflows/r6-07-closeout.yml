name: R6-07 closeout

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify closeout baseline
        shell: bash
        run: |
          set -euo pipefail
          base="c74ffcd887ed29e41c3b2570fb818ae71680c609"
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/r6-07-closeout.yml"
          test ! -e .github/workflows/r6-07-hard-gate.yml
          test ! -e .github/workflows/r6-07-final-pg-gate.yml
          test ! -e .github/workflows/r6-07-db-diagnostic.yml
          test ! -e .r6-07-hard-gate-result.json
          test ! -e .r6-07-final-pg-result.json
          test ! -e .r6-07-db-diagnostic-tail.txt
          test ! -e .r6-07-db-reference-tail.txt
          test ! -d .r6-07

      - name: Record final R6-07 state
        shell: bash
        env:
          DETAIL_B64: 
          ROOT_SECTION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          detail_path = Path("docs/modular-rewrite/R06-entity-catalog-persistence/R06-07-coaches-and-formation-usage.md")
          detail_text = base64.b64decode(os.environ["DETAIL_B64"]).decode("utf-8")
          detail_path.write_text(detail_text, encoding="utf-8", newline="\n")

          stage_path = Path("docs/modular-rewrite/R06-entity-catalog-persistence/README.md")
          stage = stage_path.read_text(encoding="utf-8")
          stage = replace_once(stage, "| R6-07 | Coaches 与 Formation Usage | VERIFYING |", "| R6-07 | Coaches 与 Formation Usage | DONE |", "R6-07 table")
          stage = replace_once(stage, "| R6-08 | Entity Matching 与 References | BLOCKED |", "| R6-08 | Entity Matching 与 References | READY |", "R6-08 table")
          stage, n = re.subn(r"(?m)^- R6-01～R6-06 均已 .*?$", "- R6-01～R6-07 均已 `DONE`；R6-08 Entity Matching 与 References 为当前唯一 `READY` 节点，R6-09～R6-10 继续 `BLOCKED`。", stage, count=1)
          if n != 1:
              raise SystemExit("stage current-boundary anchor mismatch")
          stage, n = re.subn(r"(?m)^- R6-07 Coaches / Formation Usage owner switch .*?$", "- R6-07 Coaches / Formation Usage 已完成唯一 owner 切换；hard-gate run `32125684434` 的 R6-07/retained contracts、Clippy/tests 均通过，focused PostgreSQL final gate run `32128507369` / job `95684279881` 为 `SUCCESS`。额外 full PostgreSQL baseline 在当前 tree 与节点起点均为相同 14/18 PASS、4 FAIL，确认不是 R6-07 回归且未放宽测试。R6-07 正式 `DONE`，R6-08 开放为 `READY`。", stage, count=1)
          if n != 1:
              raise SystemExit("stage R6-07 fact anchor mismatch")
          stage_path.write_text(stage, encoding="utf-8", newline="\n")

          root_path = Path("README.md")
          root = root_path.read_text(encoding="utf-8")
          root_section = base64.b64decode(os.environ["ROOT_SECTION_B64"]).decode("utf-8")
          pattern = re.compile(r"### R6-07 Coaches 与 Formation Usage\n.*?(?=### R6-06 Abilities 与 Dynamic Tags)", re.S)
          matches = pattern.findall(root)
          if len(matches) != 1:
              raise SystemExit(f"root R6-07 section anchor mismatch: {len(matches)}")
          root = pattern.sub(lambda _: root_section, root, count=1)
          root_path.write_text(root, encoding="utf-8", newline="\n")
          PY

          rm .github/workflows/r6-07-closeout.yml
          git diff --check

      - name: Verify final node boundaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-coach-formation-persistence.mjs
          node scripts/verify-formation-usage.mjs
          node scripts/verify-global-name-search.mjs
          node scripts/verify-entity-relationships.mjs
          npm run verify:architecture
          node scripts/verify-protected-assets-deterministic.mjs
          grep -q '^`DONE`$' docs/modular-rewrite/R06-entity-catalog-persistence/R06-07-coaches-and-formation-usage.md
          grep -Fq '| R6-07 | Coaches 与 Formation Usage | DONE |' docs/modular-rewrite/R06-entity-catalog-persistence/README.md
          grep -Fq '| R6-08 | Entity Matching 与 References | READY |' docs/modular-rewrite/R06-entity-catalog-persistence/README.md
          test ! -e .github/workflows/r6-07-closeout.yml
          test ! -e .github/workflows/r6-07-hard-gate.yml
          test ! -e .github/workflows/r6-07-final-pg-gate.yml
          test ! -e .github/workflows/r6-07-db-diagnostic.yml
          test ! -e .r6-07-hard-gate-result.json
          test ! -e .r6-07-final-pg-result.json
          test ! -e .r6-07-db-diagnostic-tail.txt
          test ! -e .r6-07-db-reference-tail.txt
          test ! -d .r6-07
          git diff --check

      - name: Commit R6-07 closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(r6-07): close node and open r6-08'
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
