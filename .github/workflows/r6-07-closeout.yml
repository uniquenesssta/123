## 验证

- Windows 本地 minimum gate：official Domain inventory 365 types / 299 PostgreSQL mapped types、完整 architecture、Persistence `cargo check`、95/95 unit tests、R6-07 PostgreSQL contract 编译、Application check、rustfmt 均实际通过。
- Windows 本地阶段回归：`npm run verify:frontend`、TypeScript、Vite build、`cargo fmt --all -- --check`、workspace Clippy `-D warnings`、`cargo test --locked --workspace` 均实际通过；保护资产 18 个指纹一致，聚合 SHA-256 `d74e0936b60c69f444a498405fed3e704b8db63b81f26b40036f772b4b6eac57`。
- PostgreSQL 16 final gate run `32128507369` / job `95684279881` 为 `SUCCESS`：R6-07 ownership、Formation Usage、Global Name Search、Entity Relationships、完整 architecture、模型保护、database static baseline、Persistence/Application compile、R6-03～R6-07 PostgreSQL contracts 与 `formation_catalog_usage_history_and_resolution_are_consistent` 真实执行全部通过。
- 额外执行了超出 R6-07 完成门禁的全量 `run_database_baseline.mjs` 诊断：R6-07 tree run `32127380673` 与 R6-07 起点 `7bf9b90bc235bdb397d003bdd6e61458e2e425c9` reference run `32127587771` 均为相同的 14/18 PASS、4 FAIL；失败项为 `match_lineup_chain_versions_model_selection_and_freeze_gate_are_consistent`、`match_scope_inference_and_lineup_pair_transaction_are_atomic`、`p4_stage_c_writes_are_idempotent_and_frozen_history_is_immutable`、`structured_match_events_are_queryable_and_revision_aware`。四项在 R6-07 开始前已同样失败，且本节点未修改对应测试或其 owner，因此记录为既有、非 R6-07 回归，不通过修改/跳过/弱化测试掩盖。

## 未执行与剩余风险

- 用户现有 PostgreSQL 数据库真实数据 sample/write 验收未执行；继续留到最终统一验收。
- Windows Full 人工交互验收未执行；继续留到最终统一验收。
- 上述四个全量 PostgreSQL 历史集成测试的既有失败仍存在，未在 R6-07 越界修复；后续应在对应 Lineup/P4/Review owner 任务中处理。

## 计划偏差与设计决策

- 初始迁移产物曾把 Formation resolution/window/save 的 SQL 与协调编排放在同一文件；最终在收口前继续拆出 `resolution/read.rs`、`usage/window/read.rs`、`usage/preparation.rs`、`usage/write.rs`，并由 ownership verifier 明确禁止 coordinator 重新直接持有 `sqlx::`。
- 历史 Global Name Search 与 Entity Relationships verifier 只跟随到新的 Coach owner；原数量阈值、契约断言和失败语义未降低。
- 临时 payload/bootstrap、诊断和 hard-gate workflow/result 均已清理，不进入最终 tree。

