name: R6-07 closeout

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify closeout baseline
        shell: bash
        run: |
          set -euo pipefail
          base="c74ffcd887ed29e41c3b2570fb818ae71680c609"
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/r6-07-closeout.yml"
          test ! -e .github/workflows/r6-07-hard-gate.yml
          test ! -e .github/workflows/r6-07-final-pg-gate.yml
          test ! -e .github/workflows/r6-07-db-diagnostic.yml
          test ! -e .r6-07-hard-gate-result.json
          test ! -e .r6-07-final-pg-result.json
          test ! -e .r6-07-db-diagnostic-tail.txt
          test ! -e .r6-07-db-reference-tail.txt
          test ! -d .r6-07

      - name: Record final R6-07 state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          detail = Path("docs/modular-rewrite/R06-entity-catalog-persistence/R06-07-coaches-and-formation-usage.md")
          detail.write_text(r'''# R6-07 Coaches 与 Formation Usage

## 状态

`DONE`

## 进入基线

- 唯一阶段分支：`rewrite/r6-entity-catalog-persistence`。
- 节点起点：`7bf9b90bc235bdb397d003bdd6e61458e2e425c9`（R6-06 已关闭，R6-07 为唯一 READY 节点）。
- 本节点只重写 Coaches 与 Formation Usage persistence；R6-08 Entity Matching/References 与 R6-09 Archive/Delete/Force Delete 未提前迁移。

## 实际职责边界

- `adapters/catalog/coaches/directory/`：Coach 创建与目录查询；目录查询继续复用统一 `NameSearch`，保持中文、英文、别名、重音与多关键词匹配。
- `adapters/catalog/coaches/detail/`：Coach Detail 读取聚合。
- `adapters/catalog/coaches/names/`：Coach 名称追加事务。
- `adapters/catalog/coaches/team_periods/`：球队-教练任期写入及双向读取。
- `adapters/catalog/coaches/{existence,validation,normalization,mapping}/`：存在性检查、输入验证、名称规范化和 typed Row → Domain 映射。
- `adapters/catalog/formations/directory/`：Formation 目录 SQL 与 mapper。
- `adapters/catalog/formations/usage/`：Usage 输入验证、计数准备、概率计算、窗口策略、SQL read/write、分组与保存编排分责；`save.rs` 与 `window.rs` 不直接执行 SQL，append-only `feature.formation_usage_observations` 写入集中在 `write.rs`。
- `adapters/catalog/formations/resolution/`：`resolve.rs` 只执行 actual/confirmed → team_coach → team → coach → competition_default → system_default → unknown 编排；SQL 读取集中在 `read.rs`。
- 旧 `formation_catalog.rs` 已删除；`entity_catalog.rs` 已移除 Coach owner，但继续保留 R6-08/R6-09 的 matching/reference/archive/delete 职责，未形成双 owner 或临时转发层。

## 契约与兼容性

- `CoachCatalogPort`、`FormationPort` 方法签名与调用语义不变。
- Domain DTO、Schema、0001–0046 migrations、配置项、默认值、错误类型/文案、日志等级、安全策略、默认战术角色/位置映射和用户可观察 UI 行为均未修改。
- Formation Usage 继续 append-only；smoothing、UNKNOWN fallback、actual/confirmed 优先级及当前教练角色优先级保持原语义。
- 历史 P4/运行引用未删除或级联改写。
- 无新增生产依赖。

