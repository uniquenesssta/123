name: Temporary R2-08 Root Export Generation

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

concurrency:
  group: temp-r2-08-root-exports-new-B
  cancel-in-progress: false

jobs:
  generate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout new-B
        uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Generate explicit Domain root exports
        shell: pwsh
        run: |
          node scripts/generate-domain-root-exports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-root-exports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item '.github/workflows/temp-r2-08-root-exports.yml' -Force

      - name: Commit generated root exports
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/domain/src/lib.rs crates/domain/src/shared/defaults.rs crates/domain/src/shared/mod.rs architecture/domain-type-inventory.json scripts/domain-inventory/root-export-policy.mjs scripts/generate-domain-root-exports.mjs scripts/verify-domain-root-exports.mjs package.json .github/workflows/temp-r2-08-root-exports.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'R2-08 generation produced no staged changes' }
          git commit -m 'refactor(domain): converge root exports explicitly'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
