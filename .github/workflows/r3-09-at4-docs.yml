name: R3-09 AT4 Docs

on:
  push:
    branches:
      - agent/r3-09-at4-release

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-09-at4-release
      - name: Record AT4 verification facts
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path('.')
          readme = root / 'README.md'
          task = root / 'docs/modular-rewrite/R03-application-services/R03-09-exchange-ai-workspace-and-release.md'
          stage = root / 'docs/modular-rewrite/R03-application-services/README.md'

          text = readme.read_text(encoding='utf-8')
          old = 'R3-09 Exchange / AI Workspace / Release Services 为 `IN_PROGRESS`（AT1 Match Lineup / AI Match Package Exchange 与 AT2 Spreadsheet Exchange 均为 `DONE`，AT3 AI Workspace 为 `DONE`，AT4 Release 为 `READY`）。'
          new = 'R3-09 Exchange / AI Workspace / Release Services 为 `IN_PROGRESS`（AT1 Match Lineup / AI Match Package Exchange、AT2 Spreadsheet Exchange、AT3 AI Workspace 均为 `DONE`；AT4 Release 已完成源码迁移并进入 `VERIFYING`）。'
          if old not in text:
              raise SystemExit('README R3-09 status anchor not found')
          text = text.replace(old, new, 1)
          marker = '\n## R3-09 AT4 Release Service（VERIFYING）\n'
          if marker not in text:
              text += '''\n\n## R3-09 AT4 Release Service（VERIFYING）\n\n- 已删除旧 `crates/application/src/release_acceptance.rs`，不保留转发壳；3 个既有 Release Acceptance ApplicationService/Tauri 入口继续保持原名、参数和返回 DTO，由唯一 `ReleaseService` 编排。\n- `run_release_acceptance`、`list_release_acceptance_runs`、`read_release_acceptance_run` 已迁入 `services/release/` 与 `use_cases/release/`；运行验收进一步按请求校验、chain/performance/security/cost/release 检查、汇总和报告 SHA-256 哈希拆分职责。\n- R3-01 既有 `ReleaseAcceptancePort` 已最小对齐真实 runtime-facts/persist/list/read 能力，具体 PostgreSQL 调用仅由 `composition/adapters/release.rs` 的 `ActiveDatabase` 适配；SQL、migration、Schema、Tauri 产品命令、前端产品行为、0.23.0 发布契约和生产依赖均未改变。\n- 既有窗口 clamp、预算 Validation 文案、A–I/J 门禁、27 条迁移门槛、性能阈值、8 个不可变触发器门槛、成本预算语义、检查顺序、汇总字段和报告哈希字段保持不变；历史 `verify-release-acceptance.mjs` 与公开模型边界验证器仅迁移 authoritative owner 路径，原业务/保护断言未删除或放宽。\n- 最终严格 hard gate run `31568170298` / job `94024298468` 已整体 `SUCCESS`：Release Service 专项、历史发布验收契约、完整 `verify:architecture`、官方 Domain inventory、rustfmt、`cargo check --locked -p football-application`、Application tests 33/33、`cargo clippy --locked -p football-application --all-targets -- -D warnings` 全部通过。\n- 18 个需要专用可写 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试未在本 hard gate 执行，未记为通过；本 AT 未执行破坏性数据库验证。临时 hard-gate / inventory-refresh workflow 已清理。\n- PR #20 当前保持 Draft / Open / 未合并；最终 clean Public Platform CI 尚待执行，因此 AT4 当前保持 `VERIFYING`，R3-09 尚未关闭，R3-10 继续 `BLOCKED`。\n'''
          readme.write_text(text, encoding='utf-8')

          text = task.read_text(encoding='utf-8')
          if '## Atomic Task 4 — Release' not in text:
              text += '''\n\n## Atomic Task 4 — Release\n\n状态：`VERIFYING`\n\n### 当前实施范围\n\n- 删除旧 `crates/application/src/release_acceptance.rs`，不保留转发壳；`run_release_acceptance`、`list_release_acceptance_runs`、`read_release_acceptance_run` 3 个既有 ApplicationService/Tauri 入口保持原名、参数和返回 DTO。\n- 建立唯一 `ReleaseService`；3 个公共职责分别进入 `use_cases/release/`，运行验收再按 request validation、chain/performance/security/cost/release checks、summary 与 report hash 拆分，避免重新形成职责混合大文件。\n- 最小补齐 R3-01 既有 `ReleaseAcceptancePort` 的 runtime-facts / persist / list / read 真实能力；具体 PostgreSQL 调用仅由 `composition/adapters/release.rs` 的 `ActiveDatabase` 适配。\n- `run_acceptance` 保持原有“规范请求 → 获取运行时事实 → 生成固定顺序检查 → 汇总 → SHA-256 报告哈希 → 持久化”的编排顺序；Service / Use Case 不直接依赖 PostgreSQL、SQLx 或具体 Store。\n\n### 兼容边界\n\n- performance/cost window 继续 clamp 到 1..=365；非法预算的 Validation 文案保持不变。\n- A–I 接入契约、外部模型边界、最低 27 条迁移、真实闭环样本、公开模型/外部 runtime、数据库延迟、模型运行 P95、查询健康、不可变账本触发器、凭据边界、OpenAI 成本预算和 0.23.0 + J 发布契约的状态判定、阈值、remediation 与检查顺序保持不变。\n- overall/category/performance/cost 汇总和 report SHA-256 输入字段保持不变；Release Acceptance contract/schema、Persistence SQL/migration、Tauri 命令、前端产品源码、模型保护资产、配置、日志等级和生产依赖均未改变。\n- 历史 `verify-release-acceptance.mjs` 与 `verify-public-model-boundary.mjs` 只迁移 authoritative owner 路径；原发布/保护断言未删除、跳过或放宽。\n\n### 验证状态\n\n- 最终严格 Windows hard gate run `31568170298` / job `94024298468` 已整体 `SUCCESS`：Release Service 专项、历史 Release Acceptance 契约、完整 `verify:architecture`、37-Port 契约、官方 Domain inventory、rustfmt、Application check、Application tests 33/33、Application Clippy `-D warnings` 均通过。\n- 第一轮门禁实际发现历史公开模型边界验证器仍读取已删除 owner，以及源码迁移导致 Domain inventory 漂移；前者只迁移权威读取位置，后者两次均使用官方 `generate-domain-type-inventory.mjs` 重新生成。严格分步门禁随后发现唯一 rustfmt 差异并按 rustfmt 修正；没有使用 lint 抑制、跳过测试或手工篡改 inventory。\n- 临时 hard-gate / inventory-refresh workflows 已清理；最终源码树不保留诊断入口。\n- 18 个需要专用可写 `FOOTBALL_TEST_DATABASE_URL` 的 PostgreSQL 集成测试未在本 hard gate 执行，未记为通过；未执行破坏性数据库验证。\n- PR #20 当前保持 Draft / Open / 未合并；最终 clean Public Platform CI 尚待执行，因此 AT4 当前保持 `VERIFYING`，不得提前关闭为 `DONE`；R3-09 继续 `IN_PROGRESS`，R3-10 继续 `BLOCKED`。\n'''
          task.write_text(text, encoding='utf-8')

          text = stage.read_text(encoding='utf-8')
          marker = '\n## R3-09 AT4 执行记录\n'
          if marker not in text:
              text += '''\n\n## R3-09 AT4 执行记录\n\n- AT4 Release 已完成源码迁移并进入 `VERIFYING`：旧 `release_acceptance.rs` owner 已删除，3 个公共入口由唯一 `ReleaseService` 编排，运行验收按校验、五组运行事实检查模块、汇总和报告哈希拆分。\n- `ReleaseAcceptancePort` 已对齐 runtime-facts / persist / list / read 真实能力并由 `ActiveDatabase` 适配；公共 ApplicationService/Tauri 契约、Persistence SQL/migration、前端产品行为、模型边界和依赖保持不变。\n- 最终严格 hard gate run `31568170298` / job `94024298468` 已 `SUCCESS`：Release 专项、历史发布契约、完整 architecture、官方 inventory、rustfmt、Application check、33/33 tests 与 Clippy `-D warnings` 全部通过。18 个专用 PostgreSQL 集成测试未执行且未记为通过。\n- 临时验证 workflow 已清理；PR #20 保持 Draft / Open / 未合并，等待最终 clean Public Platform CI 后再决定正式关闭。R3-09 继续 `IN_PROGRESS`，R3-10 继续 `BLOCKED`。\n'''
          stage.write_text(text, encoding='utf-8')
          '@ | python -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R03-application-services/R03-09-exchange-ai-workspace-and-release.md docs/modular-rewrite/R03-application-services/README.md
          git rm .github/workflows/r3-09-at4-docs.yml
          git commit -m "docs(r3-09): record AT4 verification"
          git push origin HEAD:agent/r3-09-at4-release
