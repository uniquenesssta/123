name: R6-01 Stage Hard Gate

# Retry after advancing team-management detail checks to the R6-01 detail owners.
on:
  push:
    branches:
      - agent/r6-01-team-directory-detail
    paths:
      - .github/workflows/r6-01-hard-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stage-regression:
    runs-on: windows-2025
    steps:
      - name: Checkout clean R6-01 tree
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Setup project dependencies
        shell: pwsh
        run: npm run setup
      - name: Run frontend stage regression
        shell: pwsh
        run: npm run verify:frontend
      - name: Verify rustfmt
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Run workspace Clippy with warnings denied
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        shell: pwsh
        run: cargo test --locked --workspace

  postgres-contract-and-architecture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_01_hard_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_01_hard_gate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_01_hard_gate_test
    steps:
      - name: Checkout clean R6-01 tree
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Verify R6-01 ownership
        run: node scripts/verify-team-directory-detail.mjs
      - name: Verify complete architecture
        run: npm run verify:architecture
      - name: Verify protected assets
        run: node scripts/verify_protected_assets.mjs
      - name: Verify database baseline freeze
        run: node scripts/verify_database_baseline.mjs
      - name: Run R6-01 PostgreSQL 16 contract
        run: cargo test --locked -p football-persistence-postgres --test team_directory_detail_repository_contract -- --ignored --nocapture
