name: R4-01 Closeout

on:
  push:
    branches:
      - rewrite/r4-persistence-foundation
    paths:
      - .github/workflows/r4-01-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/r4-persistence-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply exact R4-01 closeout records
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-ExactlyOnce([string]$Path, [string]$Pattern, [string]$Replacement) {
            $text = Get-Content -Raw -Encoding UTF8 $Path
            $matches = [regex]::Matches($text, $Pattern)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one match in $Path for pattern: $Pattern; found $($matches.Count)"
            }
            $next = [regex]::Replace($text, $Pattern, $Replacement, 1)
            Set-Content -Encoding UTF8 -NoNewline $Path $next
          }

          $index = 'docs/modular-rewrite/R04-persistence-foundation/README.md'
          Replace-ExactlyOnce $index '\| R4-01 \| Store / Error / Pool / migration / health / statistics \| VERIFYING \|' '| R4-01 | Store / Error / Pool / migration / health / statistics | DONE |'
          Replace-ExactlyOnce $index '\| R4-02 \| Audit 基础设施 \| BLOCKED \|' '| R4-02 | Audit 基础设施 | READY |'
          Add-Content -Encoding UTF8 $index "`n## R4-01 收口`n`n- PR #22 已合并到 ``rewrite/r4-persistence-foundation``，merge commit ``ed99ce3bc21da76a55de526a7f912fa363bb84a5``。`n- 最终 clean Public Platform CI run ``31615930113`` / job ``94178594481``：``SUCCESS``；artifact ``9150134498``，13,909,168 bytes，SHA-256 ``6da5f1750feef5f7fc00233165dea7f7563fefa96d08f8e515a22e16fa4dd5e1``。`n- R4-01 正式关闭为 ``DONE``；R4-02 开放为 ``READY``，R4-03/R4-04 继续 ``BLOCKED``。`n"

          $node = 'docs/modular-rewrite/R04-persistence-foundation/R04-01-store-error-and-pool.md'
          Replace-ExactlyOnce $node '(?m)^`VERIFYING`$' '`DONE`'
          Replace-ExactlyOnce $node '(?m)^- R4-02/R4-03/R4-04 未开始。最终 clean Public Platform CI 与正式合并/收口前，本节点保持 `VERIFYING`。$' '- R4-01 已正式关闭为 `DONE`；R4-02 开放为 `READY`，R4-03/R4-04 继续 `BLOCKED`。'
          Add-Content -Encoding UTF8 $node "`n## 正式收口`n`n- clean Public Platform CI run ``31615930113`` / Windows Automated job ``94178594481``：``SUCCESS``，architecture、完整 Windows Automated acceptance 与 evidence upload 全部通过。`n- evidence artifact ``9150134498``，13,909,168 bytes，SHA-256 ``6da5f1750feef5f7fc00233165dea7f7563fefa96d08f8e515a22e16fa4dd5e1``。`n- PR #22 已由 Draft 转 Ready 并按固定 HEAD ``9ace623684afe1b7b2bbe7f65afbaae66656ce97`` 合并；merge commit ``ed99ce3bc21da76a55de526a7f912fa363bb84a5``。`n- 18 个要求专用可写 ``FOOTBALL_TEST_DATABASE_URL`` 的 PostgreSQL 集成测试仍未执行；未执行 destructive database reset。`n"

          $readme = 'README.md'
          Replace-ExactlyOnce $readme '(?m)^- R4-01 已将 Persistence Store/Error/Pool/Migration/Health/Statistics.*状态为 `VERIFYING`。$' '- R4-01 已将 Persistence Store/Error/Pool/Migration/Health/Statistics 从旧 `lib.rs`/`connection.rs` 拆入职责目录；历史 0001–0046 migration SQL、公共 Persistence API、DatabaseOptions Serde、错误语义与生产依赖保持不变。严格 hard gate run `31615481637` 已通过专项、数据库基线、architecture、persistence crate check/tests/Clippy；最终 clean Public Platform CI run `31615930113` / job `94178594481` 亦为 `SUCCESS`，artifact `9150134498`，SHA-256 `6da5f1750feef5f7fc00233165dea7f7563fefa96d08f8e515a22e16fa4dd5e1`。PR #22 merge commit 为 `ed99ce3bc21da76a55de526a7f912fa363bb84a5`；18 个专用 PostgreSQL 集成测试仍未执行，未执行 destructive reset。R4-01 状态为 `DONE`，R4-02 已开放为 `READY`。'

      - name: Install repository dependencies
        shell: pwsh
        run: npm run setup

      - name: Verify frontend and architecture after closeout docs
        shell: pwsh
        run: |
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified closeout and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/r4-01-closeout.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/modular-rewrite/R04-persistence-foundation/README.md docs/modular-rewrite/R04-persistence-foundation/R04-01-store-error-and-pool.md .github/workflows/r4-01-closeout.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'docs(r4-01): close persistence foundation task'
          git push origin HEAD:rewrite/r4-persistence-foundation
