name: R5-04 Legacy Binding Contract

on:
  push:
    branches:
      - agent/r5-04-competition-bindings
    paths:
      - "crates/persistence-postgres/tests/competition_bindings_repository_contract.rs"
      - ".github/workflows/r5-04-old-owner-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-binding-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Verify contract formatting
        run: cargo fmt --all -- --check
      - name: Run legacy Competition Binding PostgreSQL contract
        run: cargo test --locked -p football-persistence-postgres --test competition_bindings_repository_contract -- --ignored --test-threads=1

# rerun after canonical rustfmt
