name: R3-09 AT4 Final Docs

on:
  push:
    branches:
      - agent/r3-09-at4-release

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-09-at4-release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record final clean CI success
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          files = [
              Path('README.md'),
              Path('docs/modular-rewrite/R03-application-services/R03-09-exchange-ai-workspace-and-release.md'),
              Path('docs/modular-rewrite/R03-application-services/README.md'),
          ]
          final_note = ('- 恢复后的最终 clean Public Platform CI run `31569072962` / Windows Automated job `94027017727` '
                        '已在无临时 workflow 的 HEAD `316f7b055817f85e086090bebc3613c577ceae9a` 上整体 `SUCCESS`；'
                        'architecture、完整 Windows automated acceptance 与 validation evidence upload 均成功。artifact `9131083580` '
                        '大小 `13994757` 字节，SHA-256 `03b34d9ba85f0cd82b2a90f6b8cd2a5db3d8a59cb323b0439a7886c2cb6a0f87`。\n')

          for path in files:
              text = path.read_text(encoding='utf-8')
              if '9131083580' in text:
                  continue
              if path.name == 'README.md':
                  anchor = '- PR #20 当前保持 Draft / Open / 未合并；最终 clean Public Platform CI 尚待执行，因此 AT4 当前保持 `VERIFYING`，R3-09 尚未关闭，R3-10 继续 `BLOCKED`.\n'
                  alt = '- PR #20 当前保持 Draft / Open / 未合并；最终 clean Public Platform CI 尚待执行，因此 AT4 当前保持 `VERIFYING`，R3-09 尚未关闭，R3-10 继续 `BLOCKED`。\n'
              elif path.name == 'R03-09-exchange-ai-workspace-and-release.md':
                  anchor = '- PR #20 当前保持 Draft / Open / 未合并；最终 clean Public Platform CI 尚待执行，因此 AT4 当前保持 `VERIFYING`，不得提前关闭为 `DONE`；R3-09 继续 `IN_PROGRESS`，R3-10 继续 `BLOCKED`。\n'
                  alt = anchor
              else:
                  anchor = '- 临时验证 workflow 已清理；PR #20 保持 Draft / Open / 未合并，等待最终 clean Public Platform CI 后再决定正式关闭。R3-09 继续 `IN_PROGRESS`，R3-10 继续 `BLOCKED`。\n'
                  alt = anchor
              actual = anchor if anchor in text else alt
              if actual not in text:
                  raise SystemExit(f'final status anchor not found: {path}')
              if path.name == 'README.md':
                  replacement = final_note + '- PR #20 当前保持 Draft / Open / 未合并；AT4 技术验收已经通过，但正式流程状态继续保持 `VERIFYING`，R3-09 尚未关闭，R3-10 继续 `BLOCKED`。\n'
              elif path.name == 'R03-09-exchange-ai-workspace-and-release.md':
                  replacement = final_note + '- PR #20 当前保持 Draft / Open / 未合并；AT4 技术验收已经通过，但在正式合并/收口前仍保持 `VERIFYING`，不得提前关闭为 `DONE`；R3-09 继续 `IN_PROGRESS`，R3-10 继续 `BLOCKED`。\n'
              else:
                  replacement = final_note + '- 临时验证 workflow 已清理；PR #20 保持 Draft / Open / 未合并。AT4 技术验收已通过，但正式状态继续为 `VERIFYING`；R3-09 继续 `IN_PROGRESS`，R3-10 继续 `BLOCKED`。\n'
              text = text.replace(actual, replacement, 1)
              path.write_text(text, encoding='utf-8')
          '@ | python -
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R03-application-services/R03-09-exchange-ai-workspace-and-release.md docs/modular-rewrite/R03-application-services/README.md
          git rm .github/workflows/r3-09-at4-final-docs.yml
          git commit -m "docs(r3-09): record final AT4 clean CI"
          git push origin HEAD:agent/r3-09-at4-release
