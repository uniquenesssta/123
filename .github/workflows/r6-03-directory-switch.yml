name: R6-03 Directory Owner Switch

on:
  push:
    branches:
      - agent/r6-03-player-directory-detail
    paths:
      - .github/workflows/r6-03-directory-switch.yml

permissions:
  contents: write

# Rerun after retaining the PlayerRecord mapper required by the not-yet-migrated Detail path.
jobs:
  switch-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_03
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r6-03-player-directory-detail
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Apply Directory owner switch
        run: python .github/scripts/r6_03_directory_switch.py
      - name: Format switched Rust sources
        run: cargo fmt --all
      - name: Verify diff integrity
        run: git diff --check
      - name: Check persistence crate
        run: cargo check --locked -p football-persistence-postgres --all-targets
      - name: Check application crate
        run: cargo check --locked -p football-application --all-targets
      - name: Run persistence unit tests
        run: cargo test --locked -p football-persistence-postgres --lib
      - name: Run frozen PostgreSQL 16 contract
        run: cargo test --locked -p football-persistence-postgres --test player_directory_detail_repository_contract -- --ignored --nocapture
      - name: Remove transient Directory switch tooling
        run: |
          rm .github/scripts/r6_03_directory_switch.py
          rm .github/workflows/r6-03-directory-switch.yml
      - name: Commit verified Directory owner switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "refactor(r6-03): switch player directory owner"
          git push origin HEAD:agent/r6-03-player-directory-detail
