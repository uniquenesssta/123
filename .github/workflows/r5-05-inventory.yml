name: R5-05 Domain Inventory

on:
  push:
    branches:
      - agent/r5-05-route-resolution
    paths:
      - ".github/workflows/r5-05-inventory.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-05-route-resolution
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and verify official domain inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-domain-type-inventory.mjs
          node scripts/verify-domain-type-inventory.mjs
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "architecture/domain-type-inventory.json"
      - name: Commit generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/domain-type-inventory.json
          git commit -m "arch(r5-05): refresh domain type inventory"
          git push origin HEAD:agent/r5-05-route-resolution
