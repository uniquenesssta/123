name: R4-03 Formal Closeout

on:
  push:
    branches:
      - rewrite/r4-persistence-foundation
    paths:
      - .github/workflows/r4-03-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOSEOUT_REVISION: "2"
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/r4-persistence-foundation
          fetch-depth: 0

      - name: Record R4-03 formal closeout
        shell: bash
        run: |
          set -euo pipefail
          BASE='0e5a68e09c6c06204b926f4d30c45262740d983b'
          changed="$(git -c core.quotePath=false diff --name-only "$BASE...HEAD" | sort)"
          expected=$'.github/r4-03-closeout.py\n.github/workflows/r4-03-closeout.yml'
          test "$changed" = "$expected"

          python .github/r4-03-closeout.py
          git diff --check
          git rm .github/workflows/r4-03-closeout.yml .github/r4-03-closeout.py
          git add README.md docs/modular-rewrite/R04-persistence-foundation/README.md docs/modular-rewrite/R04-persistence-foundation/R04-03-row-映射基础规范.md
          git diff --check --cached

          expected_final=$'README.md\ndocs/modular-rewrite/R04-persistence-foundation/R04-03-row-映射基础规范.md\ndocs/modular-rewrite/R04-persistence-foundation/README.md'
          actual="$(git -c core.quotePath=false diff --cached --name-only "$BASE" | sort)"
          test "$actual" = "$expected_final"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --exit-code "$BASE" -- .github/workflows/r4-03-closeout.yml .github/r4-03-closeout.py
          git diff --cached --exit-code "$BASE" -- .github/workflows/r4-03-closeout.yml .github/r4-03-closeout.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(r4-03): record formal closeout'
          test -z "$(git status --porcelain)"
          git push origin HEAD:rewrite/r4-persistence-foundation