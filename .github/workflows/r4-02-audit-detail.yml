name: R4-02 Audit Detail

on:
  push:
    branches:
      - agent/r4-02-audit-foundation
    paths:
      - .github/workflows/r4-02-audit-detail.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Print audit helper callers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem crates/persistence-postgres/src -Recurse -File -Filter *.rs | Select-String -Pattern 'self\.audit\(|audit_in_tx\(' | ForEach-Object {
            Write-Host ("{0}:{1}:{2}" -f $_.Path.Replace($PWD.Path + '\',''), $_.LineNumber, $_.Line.Trim())
          }
