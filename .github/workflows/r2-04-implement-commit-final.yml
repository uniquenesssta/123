name: R2-04 Final Implementation Commit

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  implement:
    if: "${{ github.event.head_commit.message == 'chore(r2): finalize R2-04 implementation commit' }}"
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Manual checkout
        shell: pwsh
        env:
          GH_TOKEN_VALUE: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN_VALUE"))
          git init .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git remote add origin https://github.com/uniquenesssta/123.git
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic $basic" fetch --no-tags origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -B new-B FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: Basic $basic"
          git config --local gc.auto 0

      - name: Prepare fixed toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          npm --version
          rustup toolchain install 1.88.0 --component rustfmt --component clippy --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.88.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Apply canonical R2-04 migration
        shell: pwsh
        env:
          BASE_SHA: 3256454e9d76b7b442a83f25964363256257cbcc
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/r2-04-implement-no-actions.yml").read_text(encoding="utf-8").replace("\r\n", "\n")
          marker = "      - name: Execute canonical V3 migration\n"
          boundary = "\n      - name: Install dependencies and verify R2-04\n"
          if source.count(marker) != 1:
              raise RuntimeError("Canonical no-actions apply step not found exactly once")
          block = source.split(marker, 1)[1]
          if block.count("        run: |\n") < 1 or block.count(boundary) != 1:
              raise RuntimeError("Canonical no-actions apply boundary mismatch")
          script = textwrap.dedent(block.split("        run: |\n", 1)[1].split(boundary, 1)[0])
          Path("execute_r2_04_apply.ps1").write_text(script, encoding="utf-8", newline="\n")
          '@ | Set-Content extract_r2_04_apply.py -Encoding utf8
          python extract_r2_04_apply.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item extract_r2_04_apply.py -Force
          & pwsh -NoProfile -File execute_r2_04_apply.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item execute_r2_04_apply.ps1 -Force

          @'
          from pathlib import Path

          docs = Path("docs/README.md")
          root = Path("README.md")
          if not docs.exists():
              raise RuntimeError("Canonical migration did not create the temporary docs README")
          text = docs.read_text(encoding="utf-8").replace("\r\n", "\n")
          marker = "\n## 记录位置\n"
          r2_marker = "\n## R2-04 Lineup 与 Match\n"
          if marker not in text or r2_marker not in text:
              raise RuntimeError("Temporary README migration block mismatch")
          start = text.index(marker)
          r2_start = text.index(r2_marker, start)
          text = text[:start] + text[r2_start:]
          text = text.replace(
              "\n- 所有读取变更记录的仓库验证器已同步使用 `docs/README.md`；根 README 不再承担验证记录职责。\n",
              "\n",
          )
          root.write_text(text.lstrip(), encoding="utf-8", newline="\n")
          docs.unlink()

          root_read = 'read("crates/domain/src/lib.rs")'
          domain_read = (
              '(read("crates/domain/src/lib.rs")'
              ' + read("crates/domain/src/lineup/kind.rs")'
              ' + read("crates/domain/src/lineup/player.rs")'
              ' + read("crates/domain/src/lineup/snapshot.rs")'
              ' + read("crates/domain/src/lineup/preset.rs")'
              ' + read("crates/domain/src/lineup/chain.rs")'
              ' + read("crates/domain/src/match_record/status.rs")'
              ' + read("crates/domain/src/match_record/catalog.rs"))'
          )
          for path in sorted(Path("scripts").rglob("*.mjs")):
              original = path.read_text(encoding="utf-8").replace("\r\n", "\n")
              updated = original.replace('"docs/README.md"', '"README.md"')
              updated = updated.replace("'docs/README.md'", "'README.md'")
              updated = updated.replace("../docs/README.md", "../README.md")
              updated = updated.replace("docs README 没有本次完整变更记录", "根 README 没有本次完整变更记录")
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="\n")

          task = Path("docs/modular-rewrite/R02-domain-rewrite/R02-04-lineup-and-match.md")
          task_text = task.read_text(encoding="utf-8").replace("\r\n", "\n")
          task_text = task_text.replace(
              "- 将根目录 README 原内容迁移至 `docs/README.md`，根 `README.md` 置为空白；后续统一在 `docs/README.md` 记录项目变更。",
              "- 根目录 `README.md` 继续作为唯一项目变更记录；R2-04 不迁移或替换 README 记录职责。",
          )
          task_text = task_text.replace(
              "- 同步更新仓库验证器的记录读取路径，并让旧根 Domain 聚合检查覆盖新的 Lineup 与 Match 职责模块。",
              "- 旧根 Domain 聚合检查已扩展覆盖新的 Lineup 与 Match 职责模块。",
          )
          task.write_text(task_text, encoding="utf-8", newline="\n")
          '@ | Set-Content reconcile_r2_04_contracts.py -Encoding utf8
          python reconcile_r2_04_contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item reconcile_r2_04_contracts.py -Force

      - name: Verify targeted and full gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p football-domain --test serde_contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and commit final tree
        shell: pwsh
        env:
          BASE_SHA: 3256454e9d76b7b442a83f25964363256257cbcc
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $remoteHead = (git ls-remote origin refs/heads/new-B).Split("`t")[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteHead -ne $env:GITHUB_SHA) { throw "new-B changed during R2-04 implementation" }

          $temporaryWorkflows = @(
            ".github/workflows/r2-04-implement.yml",
            ".github/workflows/r2-04-implement-retry.yml",
            ".github/workflows/r2-04-implement-final.yml",
            ".github/workflows/r2-04-implement-final-v2.yml",
            ".github/workflows/r2-04-implement-final-v3.yml",
            ".github/workflows/r2-04-implement-windows-2022.yml",
            ".github/workflows/r2-04-implement-no-actions.yml",
            ".github/workflows/r2-04-implement-no-actions-fixed.yml",
            ".github/workflows/r2-04-implement-commit-final.yml",
            ".github/workflows/r2-04-fix-validator.yml",
            ".github/r2-04-trigger"
          )
          foreach ($path in $temporaryWorkflows) {
            if (Test-Path $path) {
              git rm $path
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          git add -A
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          import subprocess
          from pathlib import Path

          base = "3256454e9d76b7b442a83f25964363256257cbcc"
          required = {
              ".github/workflows/ci.yml",
              "README.md",
              "architecture/domain-migration-progress.json",
              "architecture/domain-type-inventory.json",
              "crates/domain/src/lib.rs",
              "crates/domain/src/lineup/chain.rs",
              "crates/domain/src/lineup/kind.rs",
              "crates/domain/src/lineup/mod.rs",
              "crates/domain/src/lineup/player.rs",
              "crates/domain/src/lineup/preset.rs",
              "crates/domain/src/lineup/snapshot.rs",
              "crates/domain/src/lineup_chain.rs",
              "crates/domain/src/match_record/catalog.rs",
              "crates/domain/src/match_record/mod.rs",
              "crates/domain/src/match_record/status.rs",
              "crates/domain/tests/serde_contracts/module_paths.rs",
              "docs/modular-rewrite/R02-domain-rewrite/R02-04-lineup-and-match.md",
              "docs/modular-rewrite/R02-domain-rewrite/README.md",
              "scripts/domain-inventory/target-module-policy.mjs",
          }

          def git(*args):
              return subprocess.check_output(["git", *args], text=True, encoding="utf-8").replace("\r\n", "\n")

          root_read = 'read("crates/domain/src/lib.rs")'
          domain_read = (
              '(read("crates/domain/src/lib.rs")'
              ' + read("crates/domain/src/lineup/kind.rs")'
              ' + read("crates/domain/src/lineup/player.rs")'
              ' + read("crates/domain/src/lineup/snapshot.rs")'
              ' + read("crates/domain/src/lineup/preset.rs")'
              ' + read("crates/domain/src/lineup/chain.rs")'
              ' + read("crates/domain/src/match_record/status.rs")'
              ' + read("crates/domain/src/match_record/catalog.rs"))'
          )
          expected = set(required)
          scripts = [
              p for p in git("ls-tree", "-r", "--name-only", base, "scripts").splitlines()
              if p.endswith(".mjs")
          ]
          for path in scripts:
              original = git("show", f"{base}:{path}")
              transformed = original.replace(
                  "crates/domain/src/lineup_chain.rs",
                  "crates/domain/src/lineup/chain.rs",
              )
              transformed = transformed.replace(root_read, domain_read)
              if path == "scripts/verify-player-role-inheritance.mjs":
                  transformed = transformed.replace(
                      'requireTokens("crates/domain/src/lib.rs", [\n  "pub role_origin: String",\n], "阵容领域模型");',
                      'requireTokens("crates/domain/src/lineup/player.rs", [\n  "pub role_origin: String",\n], "阵容领域模型");',
                  )
              if transformed != original:
                  expected.add(path)
                  current = Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")
                  if current != transformed:
                      raise RuntimeError(f"Unexpected validator change: {path}")

          output = git("diff", "--cached", "--no-renames", "--name-only", base)
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              print("Missing:", sorted(expected - actual))
              print("Unexpected:", sorted(actual - expected))
              raise RuntimeError("Unexpected R2-04 staged change set")

          status = git("diff", "--cached", "--no-renames", "--name-status", base)
          deleted = {
              line.split("\t", 1)[1]
              for line in status.splitlines()
              if line.startswith("D\t")
          }
          if "crates/domain/src/lineup_chain.rs" not in deleted:
              raise RuntimeError("Legacy lineup_chain.rs is not staged as deleted")

          root_readme = Path("README.md").read_text(encoding="utf-8")
          if "## R2-04 Lineup 与 Match" not in root_readme:
              raise RuntimeError("Root README does not contain the R2-04 change record")
          if Path("docs/README.md").exists():
              raise RuntimeError("docs/README.md must not replace the canonical root README")
          ci = Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          if "runs-on: windows-2025" not in ci:
              raise RuntimeError("Public Platform CI is not pinned to windows-2025")
          if any(Path(".github/workflows").glob("r2-04-implement*.yml")):
              raise RuntimeError("Temporary R2-04 implementation workflow remains")
          if Path(".github/workflows/r2-04-fix-validator.yml").exists():
              raise RuntimeError("Temporary R2-04 validator repair workflow remains")
          if Path(".github/r2-04-trigger").exists():
              raise RuntimeError("Temporary R2-04 trigger remains")
          for transient in (
              "execute_r2_04_apply.ps1",
              "extract_r2_04_apply.py",
              "reconcile_r2_04_contracts.py",
          ):
              if Path(transient).exists():
                  raise RuntimeError(f"Transient file remains before validator cleanup: {transient}")
          '@ | Set-Content verify_r2_04_final_tree.py -Encoding utf8
          python verify_r2_04_final_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item verify_r2_04_final_tree.py -Force

          $transientFiles = @(
            "execute_r2_04_apply.ps1",
            "extract_r2_04_apply.py",
            "reconcile_r2_04_contracts.py",
            "verify_r2_04_final_tree.py"
          )
          foreach ($path in $transientFiles) {
            if (Test-Path $path) {
              throw "Transient file remains after final validation: $path"
            }
          }

          $statusLines = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untrackedLines = @($statusLines | Where-Object { $_.StartsWith("?? ") })
          if ($untrackedLines.Count -gt 0) {
            throw "Unexpected untracked files remain after final validation: $($untrackedLines -join ', ')"
          }
          $statusLines | ForEach-Object { Write-Host $_ }

          git commit -m "rewrite(r2): implement R2-04 lineup and match domains"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $localHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commitMessage = (git log -1 --pretty=%s).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($commitMessage -ne "rewrite(r2): implement R2-04 lineup and match domains") {
            throw "Unexpected final commit message: $commitMessage"
          }
          $postCommitStatus = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($postCommitStatus.Count -ne 0) {
            throw "Worktree is not clean after final commit: $($postCommitStatus -join ', ')"
          }

          git push origin HEAD:new-B
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteAfterPush = (git ls-remote origin refs/heads/new-B).Split("`t")[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteAfterPush -ne $localHead) {
            throw "new-B did not advance to the final R2-04 commit"
          }
