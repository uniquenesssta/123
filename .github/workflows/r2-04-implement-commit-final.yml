name: R2-04 Final Implementation Commit

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  implement:
    if: "${{ github.event.head_commit.message == 'chore(r2): finalize R2-04 implementation commit' }}"
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Manual checkout
        shell: pwsh
        env:
          GH_TOKEN_VALUE: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN_VALUE"))
          git init .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git remote add origin https://github.com/uniquenesssta/123.git
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic $basic" fetch --no-tags origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -B new-B FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: Basic $basic"
          git config --local gc.auto 0

      - name: Prepare fixed toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          npm --version
          rustup toolchain install 1.88.0 --component rustfmt --component clippy --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.88.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Apply canonical R2-04 migration
        shell: pwsh
        env:
          BASE_SHA: 3256454e9d76b7b442a83f25964363256257cbcc
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/r2-04-implement-no-actions.yml").read_text(encoding="utf-8").replace("\r\n", "\n")
          marker = "      - name: Execute canonical V3 migration\n"
          boundary = "\n      - name: Install dependencies and verify R2-04\n"
          if source.count(marker) != 1:
              raise RuntimeError("Canonical no-actions apply step not found exactly once")
          block = source.split(marker, 1)[1]
          if block.count("        run: |\n") < 1 or block.count(boundary) != 1:
              raise RuntimeError("Canonical no-actions apply boundary mismatch")
          script = textwrap.dedent(block.split("        run: |\n", 1)[1].split(boundary, 1)[0])
          Path("execute_r2_04_apply.ps1").write_text(script, encoding="utf-8", newline="\n")
          '@ | Set-Content extract_r2_04_apply.py -Encoding utf8
          python extract_r2_04_apply.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item extract_r2_04_apply.py -Force
          & pwsh -NoProfile -File execute_r2_04_apply.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item execute_r2_04_apply.ps1 -Force

      - name: Verify targeted and full gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p football-domain --test serde_contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and commit final tree
        shell: pwsh
        env:
          BASE_SHA: 3256454e9d76b7b442a83f25964363256257cbcc
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $remoteHead = (git ls-remote origin refs/heads/new-B).Split("`t")[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteHead -ne $env:GITHUB_SHA) { throw "new-B changed during R2-04 implementation" }

          $temporaryWorkflows = @(
            ".github/workflows/r2-04-implement.yml",
            ".github/workflows/r2-04-implement-retry.yml",
            ".github/workflows/r2-04-implement-final.yml",
            ".github/workflows/r2-04-implement-final-v2.yml",
            ".github/workflows/r2-04-implement-final-v3.yml",
            ".github/workflows/r2-04-implement-windows-2022.yml",
            ".github/workflows/r2-04-implement-no-actions.yml",
            ".github/workflows/r2-04-implement-no-actions-fixed.yml",
            ".github/workflows/r2-04-implement-commit-final.yml"
          )
          foreach ($path in $temporaryWorkflows) {
            if (Test-Path $path) {
              git rm $path
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          git add -A
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          import subprocess
          from pathlib import Path

          base = "3256454e9d76b7b442a83f25964363256257cbcc"
          expected = {
              "README.md",
              "architecture/domain-migration-progress.json",
              "architecture/domain-type-inventory.json",
              "crates/domain/src/lib.rs",
              "crates/domain/src/lineup/chain.rs",
              "crates/domain/src/lineup/kind.rs",
              "crates/domain/src/lineup/mod.rs",
              "crates/domain/src/lineup/player.rs",
              "crates/domain/src/lineup/preset.rs",
              "crates/domain/src/lineup/snapshot.rs",
              "crates/domain/src/lineup_chain.rs",
              "crates/domain/src/match_record/catalog.rs",
              "crates/domain/src/match_record/mod.rs",
              "crates/domain/src/match_record/status.rs",
              "crates/domain/tests/serde_contracts/module_paths.rs",
              "docs/README.md",
              "docs/modular-rewrite/R02-domain-rewrite/R02-04-lineup-and-match.md",
              "docs/modular-rewrite/R02-domain-rewrite/README.md",
              "scripts/domain-inventory/target-module-policy.mjs",
              "scripts/verify-api-workspace.mjs",
              "scripts/verify-database-reset.mjs",
              "scripts/verify-entity-deletion.mjs",
              "scripts/verify-entity-relationships.mjs",
              "scripts/verify-force-team-delete.mjs",
              "scripts/verify-import-row-identity.mjs",
              "scripts/verify-match-lineup-chain.mjs",
              "scripts/verify-match-workflow-ui.mjs",
              "scripts/verify-openai-profile-ui.mjs",
              "scripts/verify-player-role-inheritance.mjs",
              "scripts/verify-release-package.mjs",
              "scripts/verify-release-readiness.mjs",
              "scripts/verify-stage-e1-followup.mjs",
              "scripts/verify-stage-e2-lineup-presets.mjs",
              "scripts/verify-team-package.mjs",
              "scripts/verify-team-player-management.mjs",
              "scripts/verify-windows-acceptance.mjs",
              "scripts/verify-workspace-ui.mjs",
          }

          output = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", base],
              text=True,
              encoding="utf-8",
          ).replace("\r\n", "\n")
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              print("Missing:", sorted(expected - actual))
              print("Unexpected:", sorted(actual - expected))
              raise RuntimeError("Unexpected R2-04 staged change set")

          status = subprocess.check_output(
              ["git", "diff", "--cached", "--name-status", base],
              text=True,
              encoding="utf-8",
          ).replace("\r\n", "\n")
          deleted = {line.split("\t", 1)[1] for line in status.splitlines() if line.startswith("D\t")}
          if "crates/domain/src/lineup_chain.rs" not in deleted:
              raise RuntimeError("Legacy lineup_chain.rs is not staged as deleted")

          if Path("README.md").read_bytes() != b"":
              raise RuntimeError("Root README must be exactly empty")
          docs = Path("docs/README.md").read_text(encoding="utf-8")
          if not docs.strip() or "R2-04 Lineup 与 Match" not in docs:
              raise RuntimeError("docs/README.md is not the populated canonical record")
          if any(Path(".github/workflows").glob("r2-04-implement*.yml")):
              raise RuntimeError("Temporary R2-04 implementation workflow remains")
          for transient in ("execute_r2_04_apply.ps1", "extract_r2_04_apply.py"):
              if Path(transient).exists():
                  raise RuntimeError(f"Transient file remains: {transient}")
          '@ | Set-Content verify_r2_04_final_tree.py -Encoding utf8
          python verify_r2_04_final_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item verify_r2_04_final_tree.py -Force

          git status --short
          git commit -m "rewrite(r2): implement R2-04 lineup and match domains"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
