name: R6-09 AT2 helper stale-verifier repair

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-09-at2-helper-fix
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair complete stale-verifier transform set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/r6-09-at2-apply.py')
          text=p.read_text(encoding='utf-8')
          anchor='''write(path, text)\n\n# Stop before any build if another historical verifier still depends on the deleted owner.\nstale = []'''
          insert='''write(path, text)\n\npath = "scripts/verify-entity-relationships.mjs"\ntext = read(path)\ntext = once(\n    text,\n    'const teamPersistence = text("crates/persistence-postgres/src/team_catalog.rs");',\n    'const deletionPersistence = [\\n  text("crates/persistence-postgres/src/adapters/catalog/deletion/safe_delete.rs"),\\n  text("crates/persistence-postgres/src/adapters/catalog/deletion/delete_write.rs"),\\n].join("\\\\n");\\nconst teamPersistence = deletionPersistence;',\n    "entity relationships team deletion owner",\n)\ntext = once(\n    text,\n    'const playerPersistence = text("crates/persistence-postgres/src/player_catalog.rs");',\n    'const playerPersistence = deletionPersistence;',\n    "entity relationships player deletion owner",\n)\nwrite(path, text)\n\npath = "scripts/verify-global-name-search.mjs"\ntext = read(path)\ntext = once(\n    text,\n    'const teamCatalog = read("crates/persistence-postgres/src/team_catalog.rs");\\n',\n    '',\n    "global search unused deletion owner",\n)\ntext = once(\n    text,\n    'const searchOwners = [playerCatalog, playerDirectoryList, teamCatalog, teamDirectoryList, teamOptionList, referenceDirectoryRead, coachDirectoryList];',\n    'const searchOwners = [playerCatalog, playerDirectoryList, teamDirectoryList, teamOptionList, referenceDirectoryRead, coachDirectoryList];',\n    "global search owner list",\n)\nwrite(path, text)\n\n# Stop before any build if another historical verifier still depends on the deleted owner.\nstale = []'''
          if text.count(anchor)!=1:
              raise SystemExit(f'insert anchor count={text.count(anchor)}')
          text=text.replace(anchor,insert,1)
          old='''allowed_team_catalog = {\n    "scripts/verify-team-directory-detail.mjs",\n    "scripts/verify-team-names-profiles.mjs",\n}'''
          new='''allowed_team_catalog = {\n    "scripts/verify-entity-deletion-persistence.mjs",\n    "scripts/verify-team-directory-detail.mjs",\n    "scripts/verify-team-names-profiles.mjs",\n}'''
          if text.count(old)!=1:
              raise SystemExit(f'allowlist anchor count={text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
          python3 -m py_compile scripts/r6-09-at2-apply.py
          git diff --check
          rm -f .github/workflows/r6-09-at2-helper-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/r6-09-at2-apply.py .github/workflows/r6-09-at2-helper-fix.yml
          git commit -m "fix(r6-09): cover all AT2 stale verifier owners"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
