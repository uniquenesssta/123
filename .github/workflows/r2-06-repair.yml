name: R2-06 Compatibility Repair

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r2-06-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    steps:
      - name: Checkout new-B
        uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - name: Restore canonical migrations and offline lineups guard
        shell: pwsh
        run: |
          $repair = @'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";

          const canonical = new Map([
            ["0012_p4_integration_contract.sql", "9d4c6609b335146f3983b6b72ee08385b57020410e78640910f2912d54bf2d5e"],
            ["0013_p4_engine_artifacts.sql", "4d71ba851680f1477c15cbe81b67a27fa025212f8dc3b4b5c8d26bed905ee6b5"],
            ["0014_p4_evidence_and_snapshots.sql", "39a12a11da2018f3f8e92c134797dd13f24afb50908359d2164c7e98b91b60ed"],
            ["0015_p4_openai_research_gateway.sql", "7704536c3604e6d634a608ba9f656661840c9016a9141e0d76626e23f0bd1cfe"],
            ["0016_p4_fact_pipeline.sql", "2fa7f376fd7743e62613af797e3fc634daca1d02b9ccf3343df4cd578fc7ba4e"],
            ["0017_p4_horizon_orchestration.sql", "4dbe74a98934373ad25b4e3914075b86764190a5c3baae6da9b166b054223963"],
            ["0018_p4_single_match_workbench.sql", "8f79a4305df43e80ca72a52bcbea85d2f4a71912117ea6178b8831d72d8a3bfc"],
            ["0025_parameter_lifecycle.sql", "4a9df04c86c9c88f86635882166e7f9a11b1bdadcb21becbab9dfa0725ee2967"],
            ["0026_postmatch_settlement.sql", "f5c294c0a19d762caae4ab5dac88b6a438f41c73336d67302dc2d18ff4e767cd"],
          ]);

          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const migrationRoot = "crates/persistence-postgres/migrations";
          for (const [file, expected] of canonical) {
            const url = `https://raw.githubusercontent.com/uniquenesssta/football-model-platform/master/${migrationRoot}/${file}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`无法读取历史迁移 ${file}: HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const actual = sha256(bytes);
            if (actual !== expected) throw new Error(`历史迁移 ${file} 指纹不匹配: ${actual}`);
            await writeFile(`${migrationRoot}/${file}`, bytes);
          }

          const contractPath = "contracts/release-readiness-contract.json";
          const contract = JSON.parse(await readFile(contractPath, "utf8"));
          for (const item of contract.migrations) {
            if (canonical.has(item.file)) item.sha256 = canonical.get(item.file);
            const bytes = await readFile(`${migrationRoot}/${item.file}`);
            const actual = sha256(bytes);
            if (actual !== item.sha256) throw new Error(`迁移冻结清单不匹配: ${item.file} -> ${actual}`);
          }
          await writeFile(contractPath, `${JSON.stringify(contract, null, 2)}\n`, "utf8");

          const mainPath = "src/main.ts";
          let main = await readFile(mainPath, "utf8");
          const oldBlock = `  if (page === "lineups") {
            queueMicrotask(() => {
              updateCompetitionHierarchy("init");
              autoSelectMatchSeason();
              filterMatchTeamOptions();
              updateFormationHierarchy("home", "init");
              updateFormationHierarchy("away", "init");
              enhanceSearchableSelects(currentPageRoot);
              refreshSearchableSelects(currentPageRoot);
            });
          }`;
          const newBlock = `  if (page === "lineups") {
            queueMicrotask(() => {
              const matchCompetition = currentPageRoot.querySelector<HTMLSelectElement>("#new-match-competition");
              if (matchCompetition) {
                updateCompetitionHierarchy("init");
                autoSelectMatchSeason();
                filterMatchTeamOptions();
                updateFormationHierarchy("home", "init");
                updateFormationHierarchy("away", "init");
              }
              enhanceSearchableSelects(currentPageRoot);
              refreshSearchableSelects(currentPageRoot);
            });
          }`;
          if (!main.includes(oldBlock)) throw new Error("未找到比赛页初始化块，拒绝模糊修改 src/main.ts");
          main = main.replace(oldBlock, newBlock);
          await writeFile(mainPath, main, "utf8");

          const verifierPath = "scripts/verify-match-workflow-ui.mjs";
          let verifier = await readFile(verifierPath, "utf8");
          const verifierAnchor = `requireTrue(main.includes("filterMatchTeamOptions") && types.includes("season_team_memberships"), "赛事/赛季参赛队过滤链缺失");`;
          const verifierAddition = `${verifierAnchor}\nrequireTrue(main.includes('const matchCompetition = currentPageRoot.querySelector<HTMLSelectElement>("#new-match-competition");') && main.includes("if (matchCompetition) {"), "数据库未连接时比赛页仍会初始化不存在的赛事控件");`;
          if (!verifier.includes(verifierAnchor)) throw new Error("未找到比赛工作流验证锚点");
          verifier = verifier.replace(verifierAnchor, verifierAddition);
          await writeFile(verifierPath, verifier, "utf8");
          '@
          $repairPath = Join-Path $env:RUNNER_TEMP 'r2-06-repair.mjs'
          Set-Content -Path $repairPath -Value $repair -Encoding utf8NoBOM
          node $repairPath

      - name: Commit repair to new-B
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/persistence-postgres/migrations contracts/release-readiness-contract.json src/main.ts scripts/verify-match-workflow-ui.mjs
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix(r2-06): restore migration compatibility and offline lineups"
            git push origin HEAD:new-B
          }
