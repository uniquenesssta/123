name: R4-04 Final Port Adapter Implementation

on:
  push:
    branches:
      - agent/r4-04-port-adapter-registration
    paths:
      - .github/workflows/r4-04-final-implementation.yml

permissions:
  contents: write

jobs:
  implement-verify-publish:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      R4_04_BASE: b508d1ff7808b8735694cf1e57a4d603f2e973e3
      npm_config_cache: ${{ github.workspace }}/../.npm-cache
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout R4-04 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4-04-port-adapter-registration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Verify protected starting scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $allowed = @(
            '.github/r4-04-apply.py',
            '.github/r4-04-run.py',
            '.github/r4-04-record-fix.py',
            '.github/r4-04-record-latest.py',
            '.github/r4-04-sync-db-baseline.py',
            '.github/r4-04-migrate-verifiers.py',
            '.github/r4-04-session-boundary.py',
            '.github/workflows/r4-04-audit.yml',
            '.github/workflows/r4-04-implementation.yml',
            '.github/workflows/r4-04-frontend-diagnostic.yml',
            '.github/workflows/r4-04-final-implementation.yml'
          )
          $changed = @(git -c core.quotePath=false diff --name-only "$env:R4_04_BASE...HEAD")
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
            throw "R4-04 branch contains unexpected pre-existing changes: $($unexpected -join ', ')"
          }

      - name: Build R4-04 candidate tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/r4-04-run.py
          python .github/r4-04-migrate-verifiers.py
          python .github/r4-04-session-boundary.py
          cargo fmt --all
          python .github/r4-04-sync-db-baseline.py
          node scripts/generate-domain-type-inventory.mjs

      - name: Run R4-04 minimum gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run verify:persistence-adapters
          npm run verify:persistence-foundation
          npm run verify:persistence-audit
          npm run verify:persistence-mapping
          node scripts/verify_database_baseline.mjs
          node scripts/verify_protected_assets.mjs
          cargo fmt --all -- --check
          node scripts/prepare-cargo-target.mjs
          cargo check --locked -p football-persistence-postgres -p football-application
          cargo test --locked -p football-persistence-postgres
          cargo test --locked -p football-application

      - name: Run R4-04 stage regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run setup
          npm run verify:architecture
          npm run verify:frontend
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Enforce frozen boundaries and exact scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --exit-code "$env:R4_04_BASE" -- Cargo.toml Cargo.lock crates/application/Cargo.toml crates/persistence-postgres/Cargo.toml
          git diff --exit-code "$env:R4_04_BASE" -- crates/persistence-postgres/migrations
          git diff --exit-code "$env:R4_04_BASE" -- crates/model-api crates/model-p4 crates/model-p7
          git diff --exit-code "$env:R4_04_BASE" -- src src-tauri

          $allowedScripts = @(
            'scripts/verify-ai-workspace-service.mjs',
            'scripts/verify-analytics-service.mjs',
            'scripts/verify-application-composition.mjs',
            'scripts/verify-competition-rules-service.mjs',
            'scripts/verify-database-service.mjs',
            'scripts/verify-exchange-service.mjs',
            'scripts/verify-lineups-service.mjs',
            'scripts/verify-prediction-service.mjs',
            'scripts/verify-release-service.mjs',
            'scripts/verify-research-service.mjs',
            'scripts/verify-review-service.mjs',
            'scripts/verify-teams-players-service.mjs',
            'scripts/verify-persistence-adapters.mjs'
          )
          $transients = @(
            '.github/r4-04-apply.py',
            '.github/r4-04-run.py',
            '.github/r4-04-record-fix.py',
            '.github/r4-04-record-latest.py',
            '.github/r4-04-sync-db-baseline.py',
            '.github/r4-04-migrate-verifiers.py',
            '.github/r4-04-session-boundary.py',
            '.github/workflows/r4-04-audit.yml',
            '.github/workflows/r4-04-implementation.yml',
            '.github/workflows/r4-04-frontend-diagnostic.yml',
            '.github/workflows/r4-04-final-implementation.yml'
          )
          $fixed = @(
            'README.md',
            'architecture/database-baseline.json',
            'architecture/domain-type-inventory.json',
            'package.json',
            'docs/modular-rewrite/R04-persistence-foundation/R04-04-port-adapter-注册.md',
            'docs/modular-rewrite/R04-persistence-foundation/README.md'
          )
          $changed = @(git -c core.quotePath=false diff --name-only "$env:R4_04_BASE")
          $unexpected = @()
          foreach ($file in $changed) {
            $ok = $file -in $transients -or $file -in $fixed -or $file -in $allowedScripts
            if ($file.StartsWith('crates/persistence-postgres/src/')) { $ok = $true }
            if ($file.StartsWith('crates/application/src/composition/')) { $ok = $true }
            if ($file -match '^crates/application/src/services/(analytics|prediction|release|teams|lineups|exchange|postmatch|ai_workspace|review|research|players)/') { $ok = $true }
            if ($file -eq 'crates/application/src/services/database/service.rs') { $ok = $true }
            if ($file -eq 'crates/application/src/use_cases/application_facade/database_lifecycle/initialize.rs') { $ok = $true }
            if (-not $ok) { $unexpected += $file }
          }
          if ($unexpected.Count -ne 0) {
            throw "R4-04 unexpected scope: $($unexpected -join ', ')"
          }

      - name: Write verification records
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/r4-04-apply.py record
          python .github/r4-04-record-fix.py
          python .github/r4-04-record-latest.py
          npm run verify:persistence-adapters
          npm run verify:database-service
          npm run verify:competition-rules-service
          node scripts/verify_database_baseline.mjs
          git diff --check

      - name: Remove all transient R4-04 execution files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path .github/__pycache__) {
            Remove-Item -Recurse -Force .github/__pycache__
          }
          git rm `
            .github/r4-04-apply.py `
            .github/r4-04-run.py `
            .github/r4-04-record-fix.py `
            .github/r4-04-record-latest.py `
            .github/r4-04-sync-db-baseline.py `
            .github/r4-04-migrate-verifiers.py `
            .github/r4-04-session-boundary.py `
            .github/workflows/r4-04-audit.yml `
            .github/workflows/r4-04-implementation.yml `
            .github/workflows/r4-04-frontend-diagnostic.yml `
            .github/workflows/r4-04-final-implementation.yml

          git add README.md architecture/database-baseline.json architecture/domain-type-inventory.json package.json scripts crates/persistence-postgres/src crates/application/src docs/modular-rewrite/R04-persistence-foundation
          git diff --check --cached
          $untracked = @(git ls-files --others --exclude-standard)
          if ($untracked.Count -ne 0) {
            throw "R4-04 untracked files remain: $($untracked -join ', ')"
          }
          $githubDiff = @(git -c core.quotePath=false diff --cached --name-only "$env:R4_04_BASE" -- .github)
          if ($githubDiff.Count -ne 0) {
            throw "R4-04 transient .github diff remains: $($githubDiff -join ', ')"
          }
          git diff --exit-code "$env:R4_04_BASE" -- .github
          git diff --cached --exit-code "$env:R4_04_BASE" -- .github

      - name: Commit and publish verified R4-04 implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Write-Host '=== final R4-04 staged files ==='
          git -c core.quotePath=false diff --cached --name-status "$env:R4_04_BASE"
          git commit -m "refactor(r4-04): register postgres port adapters"
          if (git status --porcelain) {
            throw 'R4-04 worktree not clean after final implementation commit'
          }
          git push origin HEAD:agent/r4-04-port-adapter-registration
