name: R5-04 New Binding Owner Minimum Gate

on:
  push:
    branches:
      - agent/r5-04-competition-bindings
    paths:
      - ".github/workflows/r5-04-new-owner-minimum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-owner-minimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Verify R5 competition ownership chain
        run: node scripts/verify-competition-repository.mjs
      - name: Verify canonical rustfmt
        run: cargo fmt --all -- --check
      - name: Check Persistence and Application
        run: cargo check --locked -p football-persistence-postgres -p football-application
      - name: Test Persistence
        run: cargo test --locked -p football-persistence-postgres
      - name: Test Application
        run: cargo test --locked -p football-application
      - name: Run new Competition Binding PostgreSQL contract
        run: cargo test --locked -p football-persistence-postgres --test competition_bindings_repository_contract -- --ignored --test-threads=1

# rerun after advancing the R5-03 boundary assertions for R5-04
