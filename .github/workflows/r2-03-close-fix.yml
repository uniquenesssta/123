name: R2-03 Acceptance Closure Retry

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  close:
    if: "${{ github.event.head_commit.message == 'chore(r2): retry R2-03 acceptance closure' }}"
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record formal acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Replace-ExactlyOnce([string]$Path, [string]$Old, [string]$New, [string]$Label) {
            $text = [System.IO.File]::ReadAllText($Path).Replace("`r`n", "`n")
            $count = ([regex]::Matches($text, [regex]::Escape($Old))).Count
            if ($count -ne 1) { throw "$Label matched $count times" }
            [System.IO.File]::WriteAllText($Path, $text.Replace($Old, $New), [System.Text.UTF8Encoding]::new($false))
          }

          $rootOld = '- R2-03 已将 Team 17、Player 21、Coach 9、Formation 8、Shared 17 共 72 个类型从 Domain 根文件迁移到职责目录；根级类型名、Serde、数据库映射、Application、Tauri DTO、模型边界和生产依赖保持不变。实施 run `31100515822` 已通过，状态为 `VERIFYING`；正式 Windows Automated 通过前 R2-04 保持 `BLOCKED`。'
          $rootNew = '- R2-03 已将 Team 17、Player 21、Coach 9、Formation 8、Shared 17 共 72 个类型从 Domain 根文件迁移到职责目录；根级类型名、Serde、数据库映射、Application、Tauri DTO、模型边界和生产依赖保持不变。实施 run `31100515822` 已通过；正式 Windows Automated run `31110013068`、job `92645025258` 在与实施提交 `038ebd7096a78f7202d9c98e66e17d32701d343c` 同源码树的触发提交 `594940dca4c57aabfebdd768755ec27006ecaeb5` 上通过，artifact `8972168972` 大小 `14119500` 字节，SHA-256 为 `6ef2e064638cd17b214c66bbdea5ed752a08a1f0dc32002940e0f97d094cae5f`；运行报告为 PASS，7 条记录、3 个完成操作。状态为 `DONE`，R2-04 已开放为 `READY`。'
          Replace-ExactlyOnce "README.md" $rootOld $rootNew "root README R2-03 record"

          $r203Old = '| R2-03 | Team / Player / Coach / Formation | VERIFYING | [`R02-03-team-player-coach-and-formation.md`](R02-03-team-player-coach-and-formation.md) | 实施 run `31100515822` 已通过；正式 Windows Automated 待确认 |'
          $r203New = '| R2-03 | Team / Player / Coach / Formation | DONE | [`R02-03-team-player-coach-and-formation.md`](R02-03-team-player-coach-and-formation.md) | workflow run `31110013068`、job `92645025258` 通过 |'
          Replace-ExactlyOnce "docs/modular-rewrite/R02-domain-rewrite/README.md" $r203Old $r203New "R2-03 task table row"

          $r204Old = '| R2-04 | Lineup 与 Match | BLOCKED | `R02-04-lineup-and-match.md` | 等待前置节点 |'
          $r204New = '| R2-04 | Lineup 与 Match | READY | `R02-04-lineup-and-match.md` | 前置节点已完成，待开始 |'
          Replace-ExactlyOnce "docs/modular-rewrite/R02-domain-rewrite/README.md" $r204Old $r204New "R2-04 task table row"

          $stageOld = '`R2-02 DONE`；`R2-03 VERIFYING`。72 个 Team、Player、Coach、Formation 与 Shared 类型已迁移，正式 Windows Automated 通过前不开放 R2-04。'
          $stageNew = '`R2-03 DONE`；`R2-04 READY`。72 个 Team、Player、Coach、Formation 与 Shared 类型已迁移并通过正式 Windows Automated；尚未开始 R2-04。'
          Replace-ExactlyOnce "docs/modular-rewrite/R02-domain-rewrite/README.md" $stageOld $stageNew "R2 current stage status"

          $resultOld = '- 实施 workflow run `31100515822` 的专项、架构、前端和 Rust 门禁已通过；正式 Windows Automated 待确认。'
          $resultNew = "- 实施 workflow run ``31100515822`` 的专项、架构、前端和 Rust 门禁已通过。`n- 正式 Windows Automated run ``31110013068``、job ``92645025258`` 在同源码树触发提交 ``594940dca4c57aabfebdd768755ec27006ecaeb5`` 上通过；artifact ``8972168972`` 大小 ``14119500`` 字节，SHA-256 为 ``6ef2e064638cd17b214c66bbdea5ed752a08a1f0dc32002940e0f97d094cae5f``，运行报告为 PASS，7 条记录、3 个完成操作。"
          Replace-ExactlyOnce "docs/modular-rewrite/R02-domain-rewrite/README.md" $resultOld $resultNew "R2-03 result evidence"

          Replace-ExactlyOnce "docs/modular-rewrite/R02-domain-rewrite/R02-03-team-player-coach-and-formation.md" '- 任务状态：`VERIFYING`' '- 任务状态：`DONE`' "R2-03 task status"

          $taskOld = '最终实施提交上的正式 `Public Platform CI` Windows Automated 尚待确认；完成前保持 `VERIFYING`，R2-04 保持 `BLOCKED`。'
          $taskNew = "最终实施提交 ``038ebd7096a78f7202d9c98e66e17d32701d343c`` 的同源码树触发提交 ``594940dca4c57aabfebdd768755ec27006ecaeb5`` 已通过正式 ``Public Platform CI``：workflow run ``31110013068``、job ``92645025258``。Automated 报告为 PASS，release 客户端启动和状态载入通过，运行日志共 7 条记录、3 个完成操作；MSI 与 NSIS 均成功生成。artifact ``8972168972`` 名称为 ``windows-automated-delivery-evidence-594940dca4c57aabfebdd768755ec27006ecaeb5``，大小 ``14119500`` 字节，ZIP SHA-256 为 ``6ef2e064638cd17b214c66bbdea5ed752a08a1f0dc32002940e0f97d094cae5f``。`n`nR2-03 状态已关闭为 ``DONE``，R2-04 开放为 ``READY``；本次收口没有修改源码、配置、依赖、数据库或模型资产。"
          Replace-ExactlyOnce "docs/modular-rewrite/R02-domain-rewrite/R02-03-team-player-coach-and-formation.md" $taskOld $taskNew "R2-03 formal acceptance"

      - name: Commit documentation closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $remoteHead = (git ls-remote origin refs/heads/new-B).Split("`t")[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteHead -ne $env:GITHUB_SHA) { throw "new-B changed during R2-03 documentation closure" }

          git rm .github/workflows/r2-03-close.yml .github/workflows/r2-03-close-fix.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add README.md docs/modular-rewrite/R02-domain-rewrite/README.md docs/modular-rewrite/R02-domain-rewrite/R02-03-team-player-coach-and-formation.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $base = "594940dca4c57aabfebdd768755ec27006ecaeb5"
          $expected = @(
            "README.md",
            "docs/modular-rewrite/R02-domain-rewrite/R02-03-team-player-coach-and-formation.md",
            "docs/modular-rewrite/R02-domain-rewrite/README.md"
          ) | Sort-Object
          $actual = @(git diff --name-only $base | Sort-Object)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $difference = Compare-Object $expected $actual
          if ($difference) { $difference | Format-Table | Out-String | Write-Host; throw "Unexpected R2-03 documentation closure change set" }

          git commit -m "docs(r2): close R2-03 Windows acceptance"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
