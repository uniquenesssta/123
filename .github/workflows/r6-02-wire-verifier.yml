name: R6-02 Wire Verifier

on:
  push:
    branches:
      - agent/r6-02-team-names-profiles
    paths:
      - .github/workflows/r6-02-wire-verifier.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r6-02-team-names-profiles
          fetch-depth: 0
      - name: Wire R6-02 verifier
        run: python scripts/r6-02-wire-verifier.py
      - name: Commit verifier wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(r6-02): wire team names profiles gate"
          git push origin HEAD:agent/r6-02-team-names-profiles
