name: R6-05 implementation recovery

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
    paths:
      - .github/workflows/r6-05-implementation-recovery.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r605_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r605_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r605_test
      R605_BASE_SHA: 702a84dd8d702d272e0c69ff3399fce20a7e8a4b

    steps:
      - name: Checkout exact stage branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0

      - name: Preflight protected baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$R605_BASE_SHA" HEAD
          test -z "$(git status --porcelain)"
          test ! -e crates/persistence-postgres/src/adapters/catalog/players/team_periods
          test ! -e crates/persistence-postgres/src/adapters/catalog/availability
          grep -q "pub async fn add_player_team_period" crates/persistence-postgres/src/player_catalog.rs
          grep -q "pub async fn add_player_availability" crates/persistence-postgres/src/player_catalog.rs
          unexpected="$(git diff --name-only "$R605_BASE_SHA"..HEAD | grep -v '^\.github/workflows/r6-05-implementation\(-recovery\)\?\.yml$' || true)"
          test -z "$unexpected" || { echo "Unexpected post-baseline files:"; echo "$unexpected"; exit 1; }
          echo "R6-05 recovery preflight: PASS"

      - name: Reuse reviewed R6-05 transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/r6-05-implementation.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          lines = body.splitlines()
          stripped = []
          for line in lines:
              if line.startswith('          '):
                  stripped.append(line[10:])
              else:
                  stripped.append(line)
          script = '\n'.join(stripped) + '\n'
          compile(script, '<r6-05-transformation>', 'exec')
          exec(script, {'__name__': '__main__'})
          PY

      - name: Format refresh inventory and freeze file list
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
          git add -A
          git diff --cached --name-status > /tmp/r605-name-status.txt
          python - <<'PY'
          from pathlib import Path
          record = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-05-team-periods-and-availability.md')
          content = record.read_text(encoding='utf-8')
          inventory = Path('/tmp/r605-name-status.txt').read_text(encoding='utf-8').rstrip()
          if '{{NAME_STATUS}}' not in content:
              raise SystemExit('R6-05 task record inventory placeholder missing')
          record.write_text(content.replace('{{NAME_STATUS}}', inventory), encoding='utf-8')
          PY
          git add docs/modular-rewrite/R06-entity-catalog-persistence/R06-05-team-periods-and-availability.md
          git diff --cached --check
          git diff --cached --name-status

      - name: R6-05 targeted ownership and architecture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-player-team-periods-availability.mjs
          node scripts/verify-player-directory-detail.mjs
          node scripts/verify-domain-type-inventory.mjs
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify_database_baseline.mjs
          cargo fmt --all -- --check

      - name: Persistence and application validation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --lib
          cargo test --locked -p football-persistence-postgres --test player_team_periods_availability_repository_contract --no-run
          cargo test --locked -p football-persistence-postgres --test player_team_periods_availability_repository_contract -- --ignored --nocapture --test-threads=1
          cargo check --locked -p football-application

      - name: Commit verified R6-05 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(r6-05): modularize team periods and availability"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
