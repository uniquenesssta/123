name: Temporary R2-08 README Sync

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - name: Patch README factual status
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '- R2-07 已将 Analytics 39、Exchange 54、AI Workspace 16、Release 9 共 118 个公共兼容类型迁移到 `analytics/`、`exchange/`、`ai_workspace/`、`release/` 职责目录，并删除 7 个旧职责混合根文件；根级兼容导出暂保留到 R2-08。新增 118 类型模块路径身份契约并登记 R2-07 目录归属；当前状态为 `VERIFYING`，等待 Windows 本机最小门禁与阶段回归。',
                  '- R2-07 已将 Analytics 39、Exchange 54、AI Workspace 16、Release 9 共 118 个公共兼容类型迁移到职责目录，并删除 7 个旧职责混合根文件；Windows 本机格式、17/17 Serde、365 类型清单与架构门禁通过，用户确认状态为 `DONE`。\n- R2-08 已将 `crates/domain/src/lib.rs` 收敛为 17 个模块声明和 365 个显式公共兼容类型 re-export，根级 glob export 已清零；三个私有默认值实现迁入 `shared/defaults.rs`，新增确定性根出口生成/验证门禁并接入 `verify:architecture`。当前状态为 `VERIFYING`，等待 Windows 本机阶段回归。'
              ),
              (
                  '已创建 `R00-stage-completion.md` 和 `R01-stage-completion.md`。R1-01 至 R1-05、R2-01 至 R2-06 状态均为 `DONE`；R2-07 当前为 `VERIFYING`。R2-07 已完成 118 个 Domain 类型的职责迁移，等待 Windows 本机门禁与阶段回归。详细状态见 `docs/modular-rewrite/R02-domain-rewrite/README.md`。',
                  '已创建 `R00-stage-completion.md` 和 `R01-stage-completion.md`。R1-01 至 R1-05、R2-01 至 R2-07 状态均为 `DONE`；R2-08 当前为 `VERIFYING`。Domain 根出口已切换为 365 个显式公共兼容类型 re-export，等待 Windows 本机阶段回归后关闭 R2。详细状态见 `docs/modular-rewrite/R02-domain-rewrite/README.md`。'
              ),
              (
                  '## R2-07 Analytics、Exchange、AI 与 Release\n\n- Analytics 39、Exchange 54、AI Workspace 16、Release 9 共 118 个公共兼容类型已迁移到职责目录，旧 7 个职责混合根文件已删除。\n- 根级公共类型路径继续通过兼容 re-export 保留；新增四个业务语义模块出口和 118 类型模块路径身份契约，R2-08 前不提前收敛根出口。\n- 当前状态为 `VERIFYING`；等待 Windows 本机格式、类型清单、Serde、架构、frontend、Rust 与启动 smoke 验证，通过前 R2-08 保持阻塞。',
                  '## R2-07 Analytics、Exchange、AI 与 Release\n\n- Analytics 39、Exchange 54、AI Workspace 16、Release 9 共 118 个公共兼容类型已迁移到职责目录，旧 7 个职责混合根文件已删除。\n- Windows 本机格式、Serde 17/17、365 类型清单与架构门禁已通过；用户确认 R2-07 状态为 `DONE`。\n\n## R2-08 Domain 根出口收敛\n\n- `crates/domain/src/lib.rs` 仅保留 17 个业务模块声明、365 个显式公共兼容类型 re-export 与 crate 内默认值兼容转发，不再承载领域定义或默认值实现。\n- 根级 `pub use module::*` 已全部删除；新增确定性生成器和静态验证器，`verify:architecture` 会拒绝 glob 回归、遗漏/重复出口和根文件业务实现。\n- 现有 `football_domain::TypeName`、Serde、数据库映射、DTO、模型保护边界和生产依赖未改变。当前状态为 `VERIFYING`，等待 Windows 本机完整阶段回归。'
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'README replacement match count != 1: {old[:80]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          Path('.github/workflows/temp-r2-08-readme-sync.yml').unlink()
          '@ | python -

      - name: Commit README sync
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/temp-r2-08-readme-sync.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'docs(r2): record R2-08 root export convergence'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
