name: R6-09 AT2 run locator

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write
  actions: read

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate AT2 run and publish marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in 1 2 3 4 5 6; do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/r6-09-at2.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=5" --jq '.workflow_runs[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          printf 'run_id=%s\ntrigger_sha=%s\n' "$run_id" "$GITHUB_SHA" > .r6-09-at2-anchor-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .r6-09-at2-anchor-trigger.txt
          git commit -m "ci(r6-09): record controlled AT2 run"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
