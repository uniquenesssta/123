name: R2-06 Domain Inventory Sync

on:
  push:
    branches: [new-B]
    paths: [.github/workflows/r2-06-inventory-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0
      - name: Regenerate and verify domain inventory
        shell: pwsh
        run: |
          node scripts/generate-domain-type-inventory.mjs
          node scripts/verify-domain-type-inventory.mjs
          git diff -- architecture/domain-type-inventory.json
      - name: Commit canonical inventory
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architecture/domain-type-inventory.json
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore(r2-06): refresh domain inventory after compatibility module'
            git push origin HEAD:new-B
          }
