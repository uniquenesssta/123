name: R6-09 AT1 Windows stage retry

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-09-at1-windows-retry
  cancel-in-progress: true

jobs:
  marker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish run marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id=%s\ntrigger_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .r6-09-at1-windows-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .r6-09-at1-windows-run.txt
          git commit -m "ci(r6-09): record AT1 Windows retry run"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence

  windows-stage:
    needs: marker
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Verify AT1 current head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'crates/persistence-postgres/src/adapters/catalog/deletion/preflight/references.rs')) { throw 'R6-09 AT1 preflight owner missing' }
          if (-not (Test-Path 'crates/persistence-postgres/src/adapters/catalog/deletion/archive/bulk.rs')) { throw 'R6-09 AT1 archive owner missing' }
          if (Test-Path 'crates/persistence-postgres/src/adapters/catalog/deletion/force_delete') { throw 'R6-09 AT3 moved early' }
          node scripts/verify-match-review-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-entity-deletion-persistence.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove temporary AT1 evidence files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/r6-09-at1-windows-retry.yml' -Force
          foreach ($path in @('.r6-09-at1-stage-failure.txt', '.r6-09-at1-windows-run.txt')) {
            if (Test-Path $path) { Remove-Item $path -Force }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '.github/workflows/r6-09-at1-windows-retry.yml' '.r6-09-at1-stage-failure.txt' '.r6-09-at1-windows-run.txt'
          git commit -m 'chore(r6-09): clean AT1 stage evidence'
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
