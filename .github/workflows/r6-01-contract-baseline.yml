name: R6-01 Team Directory Detail Contract Baseline

on:
  push:
    branches:
      - agent/r6-01-team-directory-detail
    paths:
      - .github/workflows/r6-01-contract-baseline.yml
      - crates/persistence-postgres/tests/team_directory_detail_repository_contract.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_01_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_01_test
    steps:
      - name: Checkout baseline owner
        uses: actions/checkout@v4
      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Run frozen R6-01 PostgreSQL contract on old owner
        run: cargo test --locked -p football-persistence-postgres --test team_directory_detail_repository_contract -- --ignored --nocapture
