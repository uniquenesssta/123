name: R4-04 Frontend Diagnostic

on:
  push:
    branches:
      - agent/r4-04-port-adapter-registration
    paths:
      - .github/workflows/r4-04-frontend-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      npm_config_cache: ${{ github.workspace }}/../.npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-04-port-adapter-registration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Recreate R4-04 candidate tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/r4-04-run.py
          python .github/r4-04-migrate-verifiers.py
          python .github/r4-04-session-boundary.py
          cargo fmt --all
          python .github/r4-04-sync-db-baseline.py
          node scripts/generate-domain-type-inventory.mjs
          npm run setup
          npm run verify:persistence-adapters
      - name: Diagnose full frontend gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(& npm run verify:frontend 2>&1)
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = @($output | Select-Object -Last 80) -join ' | '
            $escaped = $tail.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=R4-04 full frontend diagnostic::$escaped"
            exit $code
          }
          $output | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
          Write-Host 'R4-04 full frontend diagnostic passed.'
