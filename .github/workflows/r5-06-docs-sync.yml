name: R5-06 Docs Sync

on:
  push:
    branches:
      - rewrite/r5-06-model-run-identity-reads
    paths:
      - .github/workflows/r5-06-docs-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update root and stage README
        shell: python
        run: |
          from pathlib import Path

          root = Path("README.md")
          root_text = root.read_text(encoding="utf-8")
          marker = "### R5-06 Model Run Identity Reads"
          block = """### R5-06 Model Run Identity Reads\n\n- Model Run identity read 已收敛到 `crates/persistence-postgres/src/adapters/competition/model_run_identity/`，并按 typed Row、record mapper、单次 identity SELECT 拆分；`model_runs.rs::read_run` 不再直接拥有模型版本、参数版本、规则包与 binding identity JOIN。\n- R5-05 后残留在 legacy `routing.rs` 的 `ModelRegistration`、`register_model` / `register_model_in_tx` 及 definition/version/parameter-set SQL 已同步迁入 `model_run_identity/registration/`；Rule Package registration 已切换到新唯一 owner，`routing.rs` 已删除且不保留转发壳。\n- 公共 `ModelRegistration`、`PostgresStore::register_model`、`read_run` JSON identity 字段、错误语义、migration/Schema、配置、模型与路由算法均保持不变；未修改 `list_recent_runs`。\n- PostgreSQL 16 专项 run `31881761988`：Model Run Identity contract job `95005200186` 与 Rule Package registration regression job `95005200191` 均 `SUCCESS`。\n- clean source HEAD `dc6d2baf0f6092f67200214b5b45e37c528394ad` 的 canonical Public Platform CI run `31881842368` / Windows job `95005434692` 为 `SUCCESS`；artifact `9246499189`，SHA-256 `74bc2a687b8499f798c0a91a28522fa74df0237ee24d005197067b1c97a1e452`。\n- 当前节点状态为 `VERIFYING`；详细记录见 `docs/modular-rewrite/R05-competition-routing-persistence/R05-06-model-run-identity-reads.md`，待文档 clean HEAD、PR/merge 与 merged-stage canonical gate 通过后关闭为 `DONE`。\n\n"""
          if marker not in root_text:
              heading = "## 模块化重写执行记录"
              if heading not in root_text:
                  raise SystemExit("README missing modular rewrite record heading")
              root_text = root_text.replace(heading, heading + "\n\n" + block, 1)
              root.write_text(root_text, encoding="utf-8")

          stage = Path("docs/modular-rewrite/R05-competition-routing-persistence/README.md")
          stage_text = stage.read_text(encoding="utf-8")
          old_row = "| R5-06 | Model Run Identity Reads | READY |"
          new_row = "| R5-06 | Model Run Identity Reads | VERIFYING |"
          if old_row in stage_text:
              stage_text = stage_text.replace(old_row, new_row, 1)
          elif new_row not in stage_text:
              raise SystemExit("R5-06 task row not found in expected state")

          stage_marker = "## R5-06 当前事实"
          stage_block = """\n\n## R5-06 当前事实\n\n- 详细记录：[`R05-06-model-run-identity-reads.md`](R05-06-model-run-identity-reads.md)。\n- Model Run identity read 与模型注册已统一收敛到 `adapters/competition/model_run_identity/`；读取采用 typed `FromRow` 与独立 mapper，registration 按 definition/version/parameter-set/transaction 拆分。\n- `model_runs.rs::read_run` 已切换到新 identity read owner；Rule Package registration 已切换到新 registration boundary；legacy `routing.rs` 已删除且没有转发壳。\n- PostgreSQL 16 专项 run `31881761988` 的 identity contract job `95005200186` 与 Rule Package regression job `95005200191` 均 `SUCCESS`。\n- clean source HEAD `dc6d2baf0f6092f67200214b5b45e37c528394ad` 的 canonical run `31881842368` / Windows job `95005434692` 为 `SUCCESS`；artifact `9246499189`，SHA-256 `74bc2a687b8499f798c0a91a28522fa74df0237ee24d005197067b1c97a1e452`。\n- 当前仅剩文档 clean HEAD、PR/merge、merged-stage canonical CI 与 R5 阶段 closeout，因此状态保持 `VERIFYING`。\n"""
          if stage_marker not in stage_text:
              stage_text = stage_text.rstrip() + stage_block + "\n"
          stage.write_text(stage_text, encoding="utf-8")

      - name: Remove temporary workflow and commit docs
        shell: bash
        run: |
          git rm .github/workflows/r5-06-docs-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R05-competition-routing-persistence/README.md
          git commit -m "docs(r5-06): sync verification records"
          git push origin "HEAD:${GITHUB_REF_NAME}"
