name: R1-04 startup probe

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Install and build frontend
        shell: pwsh
        run: |
          npm ci
          node node_modules/vite/bin/vite.js build
          node scripts/prepare-cargo-target.mjs

      - name: Inject startup probes
        shell: pwsh
        run: |
          function Insert-AfterLine([string]$Path, [string]$Needle, [string]$Insert) {
            $source = [System.IO.File]::ReadAllText($Path, [System.Text.Encoding]::UTF8).Replace("`r`n", "`n")
            $count = ([regex]::Matches($source, [regex]::Escape($Needle))).Count
            if ($count -ne 1) { throw "$Path expected one probe line [$Needle], got $count" }
            [System.IO.File]::WriteAllText($Path, $source.Replace($Needle, "$Needle`n$Insert"), [System.Text.UTF8Encoding]::new($false))
          }
          function Insert-BeforeLine([string]$Path, [string]$Needle, [string]$Insert) {
            $source = [System.IO.File]::ReadAllText($Path, [System.Text.Encoding]::UTF8).Replace("`r`n", "`n")
            $count = ([regex]::Matches($source, [regex]::Escape($Needle))).Count
            if ($count -ne 1) { throw "$Path expected one probe line [$Needle], got $count" }
            [System.IO.File]::WriteAllText($Path, $source.Replace($Needle, "$Insert`n$Needle"), [System.Text.UTF8Encoding]::new($false))
          }
          function Marker([string]$Name) {
            return @"
          if let Ok(root) = std::env::var("R104_PROBE_ROOT") {
              let _ = std::fs::write(std::path::Path::new(&root).join("$Name"), "ok");
          }
          "@.Trim()
          }

          Insert-AfterLine 'src-tauri/src/lib.rs' 'pub fn run() {' (Marker '01-lib.txt')
          Insert-AfterLine 'src-tauri/src/bootstrap/mod.rs' 'pub(crate) fn run() {' (Marker '02-bootstrap.txt')
          Insert-AfterLine 'src-tauri/src/bootstrap/application.rs' 'pub(crate) fn run() {' (Marker '03-application.txt')
          Insert-BeforeLine 'src-tauri/src/bootstrap/application.rs' '    error::expect_startup(command_registry::register(builder).run(tauri::generate_context!()));' (Marker '04-before-run.txt')
          Insert-AfterLine 'src-tauri/src/bootstrap/application.rs' '        .setup(|app| -> Result<(), Box<dyn std::error::Error>> {' (Marker '05-setup-entered.txt')
          Insert-AfterLine 'src-tauri/src/bootstrap/state.rs' 'pub(crate) fn install<R: tauri::Runtime>(app: &mut tauri::App<R>) -> Result<(), std::io::Error> {' (Marker '06-state-entered.txt')
          Insert-AfterLine 'src-tauri/src/bootstrap/state.rs' '    let config_dir = app.path().app_config_dir().map_err(error::io_error)?;' (Marker '07-config-dir.txt')
          Insert-AfterLine 'src-tauri/src/bootstrap/state.rs' '    let runtime_log = Arc::new(RuntimeLogStore::discover(&config_dir));' (Marker '08-log-store.txt')
          Insert-BeforeLine 'src-tauri/src/bootstrap/state.rs' '    app.manage(AppState {' (Marker '09-log-recorded.txt')
          Insert-BeforeLine 'src-tauri/src/bootstrap/state.rs' '    Ok(())' (Marker '10-state-managed.txt')

          rustfmt --edition 2021 --config skip_children=true src-tauri/src/lib.rs src-tauri/src/bootstrap/mod.rs src-tauri/src/bootstrap/application.rs src-tauri/src/bootstrap/state.rs

      - name: Build release probe
        shell: pwsh
        run: cargo build --locked --release -p football-match-model-desktop

      - name: Run and inspect startup probe
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'r104-probe'
          New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
          $env:R104_PROBE_ROOT = $probeRoot
          $env:FOOTBALL_RUNTIME_ROOT = $env:GITHUB_WORKSPACE
          $env:FOOTBALL_PROJECT_ROOT = $env:GITHUB_WORKSPACE
          $exe = Join-Path (Resolve-Path '..\.cargo-target\release') 'football-match-model-desktop.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "release executable not found: $exe" }
          $stdout = Join-Path $probeRoot 'stdout.txt'
          $stderr = Join-Path $probeRoot 'stderr.txt'
          Write-Host "Launching $exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 60
          $process.Refresh()
          Write-Host "HasExited=$($process.HasExited)"
          if ($process.HasExited) { Write-Host "ExitCode=$($process.ExitCode)" }
          Write-Host '--- probe markers ---'
          Get-ChildItem -Path $probeRoot -File | Sort-Object Name | ForEach-Object { Write-Host $_.Name }
          Write-Host '--- stdout ---'
          if (Test-Path $stdout) { Get-Content -Raw -Encoding UTF8 $stdout }
          Write-Host '--- stderr ---'
          if (Test-Path $stderr) { Get-Content -Raw -Encoding UTF8 $stderr }
          Write-Host '--- workspace runtime logs ---'
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'football-runtime-*.jsonl' -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host '--- appdata runtime logs ---'
          Get-ChildItem -Path $env:APPDATA -Recurse -Filter 'football-runtime-*.jsonl' -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-04-startup-probe-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/r104-probe/**
            **/football-runtime-*.jsonl
