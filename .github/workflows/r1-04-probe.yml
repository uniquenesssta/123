name: R1-04 startup probe

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Install and build frontend
        shell: pwsh
        run: |
          npm ci
          node node_modules/vite/bin/vite.js build
          node scripts/prepare-cargo-target.mjs

      - name: Inject startup probes
        shell: pwsh
        run: |
          function Replace-ExactlyOnce([string]$Path, [string]$Old, [string]$New) {
            $source = [System.IO.File]::ReadAllText($Path, [System.Text.Encoding]::UTF8)
            $count = ([regex]::Matches($source, [regex]::Escape($Old))).Count
            if ($count -ne 1) { throw "$Path expected one probe anchor, got $count" }
            [System.IO.File]::WriteAllText($Path, $source.Replace($Old, $New), [System.Text.UTF8Encoding]::new($false))
          }

          $mark = @'
          if let Ok(root) = std::env::var("R104_PROBE_ROOT") {
              let _ = std::fs::write(std::path::Path::new(&root).join("__FILE__"), "ok");
          }
          '@

          Replace-ExactlyOnce 'src-tauri/src/lib.rs' @'
          pub fn run() {
              bootstrap::run();
          }
          '@ @"
          pub fn run() {
          $($mark.Replace('__FILE__', '01-lib.txt'))
              bootstrap::run();
          }
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/mod.rs' @'
          pub(crate) fn run() {
              application::run();
          }
          '@ @"
          pub(crate) fn run() {
          $($mark.Replace('__FILE__', '02-bootstrap.txt'))
              application::run();
          }
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/application.rs' @'
          pub(crate) fn run() {
              let builder = tauri::Builder::default()
          '@ @"
          pub(crate) fn run() {
          $($mark.Replace('__FILE__', '03-application.txt'))
              let builder = tauri::Builder::default()
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/application.rs' @'
                  .setup(|app| -> Result<(), Box<dyn std::error::Error>> {
                      state::install(app)?;
          '@ @"
                  .setup(|app| -> Result<(), Box<dyn std::error::Error>> {
          $($mark.Replace('__FILE__', '05-setup-entered.txt'))
                      state::install(app)?;
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/application.rs' @'
              error::expect_startup(command_registry::register(builder).run(tauri::generate_context!()));
          '@ @"
          $($mark.Replace('__FILE__', '04-before-run.txt'))
              error::expect_startup(command_registry::register(builder).run(tauri::generate_context!()));
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/state.rs' @'
          pub(crate) fn install<R: tauri::Runtime>(app: &mut tauri::App<R>) -> Result<(), std::io::Error> {
              let config_dir = app.path().app_config_dir().map_err(error::io_error)?;
          '@ @"
          pub(crate) fn install<R: tauri::Runtime>(app: &mut tauri::App<R>) -> Result<(), std::io::Error> {
          $($mark.Replace('__FILE__', '06-state-entered.txt'))
              let config_dir = app.path().app_config_dir().map_err(error::io_error)?;
          $($mark.Replace('__FILE__', '07-config-dir.txt'))
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/state.rs' @'
              let runtime_log = Arc::new(RuntimeLogStore::discover(&config_dir));
              let _ = runtime_log.record(
          '@ @"
              let runtime_log = Arc::new(RuntimeLogStore::discover(&config_dir));
          $($mark.Replace('__FILE__', '08-log-store.txt'))
              let _ = runtime_log.record(
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/state.rs' @'
              app.manage(AppState {
          '@ @"
          $($mark.Replace('__FILE__', '09-log-recorded.txt'))
              app.manage(AppState {
          "@

          Replace-ExactlyOnce 'src-tauri/src/bootstrap/state.rs' @'
              });
              Ok(())
          '@ @"
              });
          $($mark.Replace('__FILE__', '10-state-managed.txt'))
              Ok(())
          "@

          rustfmt --edition 2021 --config skip_children=true src-tauri/src/lib.rs src-tauri/src/bootstrap/mod.rs src-tauri/src/bootstrap/application.rs src-tauri/src/bootstrap/state.rs

      - name: Build release probe
        shell: pwsh
        run: cargo build --locked --release -p football-match-model-desktop

      - name: Run and inspect startup probe
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'r104-probe'
          New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
          $env:R104_PROBE_ROOT = $probeRoot
          $env:FOOTBALL_RUNTIME_ROOT = $env:GITHUB_WORKSPACE
          $env:FOOTBALL_PROJECT_ROOT = $env:GITHUB_WORKSPACE
          $exe = Get-ChildItem -Path (Resolve-Path '..\.cargo-target') -Recurse -Filter 'football-match-model-desktop.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'release executable not found' }
          $stdout = Join-Path $probeRoot 'stdout.txt'
          $stderr = Join-Path $probeRoot 'stderr.txt'
          Write-Host "Launching $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 60
          $process.Refresh()
          Write-Host "HasExited=$($process.HasExited)"
          if ($process.HasExited) { Write-Host "ExitCode=$($process.ExitCode)" }
          Write-Host '--- probe markers ---'
          Get-ChildItem -Path $probeRoot -File | Sort-Object Name | ForEach-Object { Write-Host $_.Name }
          Write-Host '--- stdout ---'
          if (Test-Path $stdout) { Get-Content -Raw -Encoding UTF8 $stdout }
          Write-Host '--- stderr ---'
          if (Test-Path $stderr) { Get-Content -Raw -Encoding UTF8 $stderr }
          Write-Host '--- workspace runtime logs ---'
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'football-runtime-*.jsonl' -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host '--- appdata runtime logs ---'
          Get-ChildItem -Path $env:APPDATA -Recurse -Filter 'football-runtime-*.jsonl' -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-04-startup-probe-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/r104-probe/**
            **/football-runtime-*.jsonl
