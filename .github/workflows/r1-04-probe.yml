name: R1-04 release startup comparison

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: 项目源码

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 项目源码 -> ../.cargo-target

      - name: Build plain release and preserve executable
        shell: pwsh
        working-directory: 项目源码
        run: |
          npm ci
          node node_modules/vite/bin/vite.js build
          node scripts/prepare-cargo-target.mjs
          cargo build --locked --release -p football-match-model-desktop
          $evidence = Join-Path $env:RUNNER_TEMP 'r104-ab'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Copy-Item '..\.cargo-target\release\football-match-model-desktop.exe' (Join-Path $evidence 'pre-bundle.exe') -Force

      - name: Build Tauri bundles
        shell: pwsh
        working-directory: 项目源码
        run: npm run tauri:build

      - name: Compare startup behavior
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE '项目源码'
          $targetRoot = Join-Path $env:GITHUB_WORKSPACE '.cargo-target'
          $evidence = Join-Path $env:RUNNER_TEMP 'r104-ab'
          $preBundle = Join-Path $evidence 'pre-bundle.exe'
          $postBundle = Join-Path $targetRoot 'release\football-match-model-desktop.exe'

          function Test-ReleaseExecutable([string]$Label, [string]$Executable) {
            $runtimeRoot = Join-Path $evidence $Label
            Remove-Item $runtimeRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
            $env:FOOTBALL_RUNTIME_ROOT = $runtimeRoot
            $env:FOOTBALL_PROJECT_ROOT = $runtimeRoot
            $stdout = Join-Path $runtimeRoot 'stdout.txt'
            $stderr = Join-Path $runtimeRoot 'stderr.txt'
            $startedAt = Get-Date
            $process = Start-Process -FilePath $Executable -WorkingDirectory $sourceRoot -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $deadline = (Get-Date).AddSeconds(45)
            $logPath = $null
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) { break }
              $candidate = Get-ChildItem (Join-Path $runtimeRoot 'logs') -Filter 'football-runtime-*.jsonl' -File -ErrorAction SilentlyContinue |
                Where-Object { $_.CreationTime -ge $startedAt.AddSeconds(-2) -and $_.Length -gt 0 } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($candidate) {
                $logPath = $candidate.FullName
                break
              }
              Start-Sleep -Milliseconds 500
            }
            $process.Refresh()
            $result = [ordered]@{
              label = $Label
              executable = $Executable
              sha256 = (Get-FileHash $Executable -Algorithm SHA256).Hash.ToLowerInvariant()
              size_bytes = (Get-Item $Executable).Length
              process_exited = $process.HasExited
              exit_code = if ($process.HasExited) { $process.ExitCode } else { $null }
              runtime_log_created = [bool]$logPath
              runtime_log = $logPath
            }
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            $result | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $evidence "$Label.json") -Encoding UTF8
            Write-Host ($result | ConvertTo-Json -Depth 4)
          }

          Test-ReleaseExecutable 'pre-bundle' $preBundle
          Test-ReleaseExecutable 'post-bundle' $postBundle

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-04-release-startup-comparison-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/r104-ab/**
