name: R1-04 startup observation hardening

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Apply bounded startup observation hardening
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'apply-r1-04-fix.mjs'
          @'
          import { readFileSync, writeFileSync } from "node:fs";

          function read(path) {
            const raw = readFileSync(path);
            const hasBom = raw.length >= 3 && raw[0] === 0xef && raw[1] === 0xbb && raw[2] === 0xbf;
            return { text: raw.toString("utf8").replace(/^\uFEFF/, ""), hasBom };
          }
          function write(path, text, hasBom) {
            const body = Buffer.from(text, "utf8");
            writeFileSync(path, hasBom ? Buffer.concat([Buffer.from([0xef, 0xbb, 0xbf]), body]) : body);
          }
          function replaceOnce(path, oldText, newText) {
            const file = read(path);
            const count = file.text.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one replacement anchor, got ${count}`);
            write(path, file.text.replace(oldText, newText), file.hasBom);
          }
          function appendOnce(path, marker, addition) {
            const file = read(path);
            if (!file.text.includes(marker)) throw new Error(`${path}: missing append marker`);
            if (file.text.includes(addition.trim())) throw new Error(`${path}: addition already present`);
            write(path, file.text.replace(marker, `${marker}${addition}`), file.hasBom);
          }

          replaceOnce(
            "scripts/windows-acceptance.ps1",
            `function Wait-NewRuntimeLog([datetime]$StartedAt) {\n  $deadline = (Get-Date).AddSeconds(45)\n  while ((Get-Date) -lt $deadline) {\n    if ($script:AppProcess.HasExited) { throw "客户端启动后提前退出，退出码：$($script:AppProcess.ExitCode)" }\n    $candidate = Get-ChildItem $RuntimeLogRoot -Filter "football-runtime-*.jsonl" -File -ErrorAction SilentlyContinue |\n      Where-Object { $_.CreationTime -ge $StartedAt.AddSeconds(-2) } | Sort-Object LastWriteTime -Descending | Select-Object -First 1\n    if ($candidate -and $candidate.Length -gt 0) { return $candidate.FullName }\n    Start-Sleep -Milliseconds 500\n  }\n  throw "客户端启动后 45 秒内没有生成新的运行日志。"\n}\n`,
            `function Get-RuntimeLogPaths {\n  return @(Get-ChildItem $RuntimeLogRoot -Filter "football-runtime-*.jsonl" -File -ErrorAction SilentlyContinue |\n    ForEach-Object { $_.FullName })\n}\nfunction Wait-NewRuntimeLog([string[]]$ExistingPaths, [int]$TimeoutSeconds = 45) {\n  $deadline = (Get-Date).AddSeconds($TimeoutSeconds)\n  while ((Get-Date) -lt $deadline) {\n    $script:AppProcess.Refresh()\n    if ($script:AppProcess.HasExited) { throw "客户端启动后提前退出，退出码：$($script:AppProcess.ExitCode)" }\n    $candidate = Get-ChildItem $RuntimeLogRoot -Filter "football-runtime-*.jsonl" -File -ErrorAction SilentlyContinue |\n      Where-Object { $_.FullName -notin $ExistingPaths -and $_.Length -gt 0 } |\n      Sort-Object LastWriteTime -Descending |\n      Select-Object -First 1\n    if ($candidate) { return $candidate.FullName }\n    Start-Sleep -Milliseconds 500\n  }\n  return $null\n}\nfunction Stop-ReleaseClient {\n  if ($script:AppProcess -and -not $script:AppProcess.HasExited) {\n    Stop-Process -Id $script:AppProcess.Id -Force -ErrorAction SilentlyContinue\n    $script:AppProcess.WaitForExit()\n  }\n}\nfunction Start-ReleaseClient([string]$Executable) {\n  for ($attempt = 1; $attempt -le 2; $attempt++) {\n    $existingPaths = @(Get-RuntimeLogPaths)\n    $diagnosticPrefix = "release-startup-attempt-$attempt-$(Get-Date -Format 'yyyyMMdd-HHmmssfff')"\n    $stdout = Join-Path $LogRoot "$diagnosticPrefix.stdout.txt"\n    $stderr = Join-Path $LogRoot "$diagnosticPrefix.stderr.txt"\n    Write-AcceptanceLog "启动 release 客户端（尝试 $attempt/2）：$Executable"\n    $script:AppProcess = Start-Process -FilePath $Executable -WorkingDirectory $SourceRoot -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru\n    $runtimeLog = Wait-NewRuntimeLog -ExistingPaths $existingPaths -TimeoutSeconds 45\n    if ($runtimeLog) { return $runtimeLog }\n    Write-AcceptanceLog "release 客户端尝试 $attempt/2 在 45 秒内未建立运行日志，准备执行有界重试。"\n    Stop-ReleaseClient\n  }\n  throw "客户端连续两次启动均未在 45 秒内生成新的运行日志。"\n}\n`,
          );
          replaceOnce(
            "scripts/windows-acceptance.ps1",
            `  $env:FOOTBALL_RUNTIME_ROOT = $ProjectRoot\n  $env:FOOTBALL_PROJECT_ROOT = $ProjectRoot\n  $runtimeStartedAt = Get-Date\n  Write-AcceptanceLog "启动 release 客户端：$exe"\n  $script:AppProcess = Start-Process -FilePath $exe -WorkingDirectory $SourceRoot -PassThru\n  $runtimeLog = Wait-NewRuntimeLog $runtimeStartedAt\n`,
            `  $env:FOOTBALL_RUNTIME_ROOT = $ProjectRoot\n  $env:FOOTBALL_PROJECT_ROOT = $ProjectRoot\n  $runtimeLog = Start-ReleaseClient -Executable $exe\n`,
          );

          replaceOnce(
            "scripts/verify-windows-path-contract.mjs",
            `check(!runner.includes('Join-Path $SourceRoot ".cargo-target\\\\release"'), "仍在源码目录内查找错误的 Cargo release 路径");\n`,
            `check(!runner.includes('Join-Path $SourceRoot ".cargo-target\\\\release"'), "仍在源码目录内查找错误的 Cargo release 路径");\ncheck(\n  runner.includes("function Get-RuntimeLogPaths")\n    && runner.includes("$_.FullName -notin $ExistingPaths")\n    && runner.includes("for ($attempt = 1; $attempt -le 2; $attempt++)")\n    && runner.includes("-RedirectStandardOutput $stdout")\n    && runner.includes("-RedirectStandardError $stderr")\n    && !runner.includes("$_.CreationTime -ge $StartedAt"),\n  "Windows 启动烟测未使用新文件集合、有界重试和诊断输出契约",\n);\n`,
          );
          replaceOnce(
            "scripts/verify-windows-path-contract.mjs",
            `console.log("Windows 路径契约验证通过：根入口日志参数、运行日志边界和 Cargo release 查找路径一致。");`,
            `console.log("Windows 路径契约验证通过：根入口日志参数、运行日志边界、Cargo release 查找和有界启动观测一致。");`,
          );

          replaceOnce(
            "scripts/verify-windows-acceptance.mjs",
            `  'FOOTBALL_PROJECT_ROOT',\n`,
            `  'FOOTBALL_PROJECT_ROOT',\n  'Start-ReleaseClient -Executable $exe',\n  'for ($attempt = 1; $attempt -le 2; $attempt++)',\n  '-RedirectStandardOutput $stdout',\n  '-RedirectStandardError $stderr',\n`,
          );
          replaceOnce(
            "scripts/verify-windows-acceptance.mjs",
            `check(!powershell.includes("Write-AcceptanceLog \\\"测试数据库 URL"), "验收日志不得写入完整数据库URL");\n`,
            `check(!powershell.includes("Write-AcceptanceLog \\\"测试数据库 URL"), "验收日志不得写入完整数据库URL");\ncheck(\n  powershell.includes("function Get-RuntimeLogPaths")\n    && powershell.includes("$_.FullName -notin $ExistingPaths")\n    && powershell.includes("Wait-NewRuntimeLog -ExistingPaths $existingPaths -TimeoutSeconds 45")\n    && powershell.includes("客户端连续两次启动均未在 45 秒内生成新的运行日志")\n    && !powershell.includes("$_.CreationTime -ge $StartedAt"),\n  "运行烟测未使用路径集合识别新日志或缺少有界重试硬失败",\n);\n`,
          );

          appendOnce(
            "README.md",
            '- R1-04 已同步迁移 19 个既有验证器读取新的 Tauri 命令注册表或状态所有者，消除旧 `lib.rs` 路径造成的伪失败；产品代码和公共契约未改变。\n',
            '- R1-04 Windows Automated 启动烟测改为按启动前日志路径集合识别新 session，并在首次 45 秒超时时最多重启一次；每次启动保留 stdout/stderr，连续两次超时仍硬失败。打包前后 EXE 的 A/B 运行均正常，产品入口、bundle、命令和业务行为未改变。\n',
          );
          appendOnce(
            "docs/modular-rewrite/R01-architecture-composition/R01-04-tauri-组合根.md",
            '## 10. 待执行验证与当前状态\n',
            '\n### Windows release 启动观测修正\n\n- 正式 Automated run `31029576871` 已通过前端、Rust 与 Tauri bundle 构建，但单次 release 启动 45 秒内未观测到 runtime log。\n- 生命周期探针 run `31032667039` 已确认公共入口、Builder、setup、状态安装和日志写入十个节点全部到达，组合根本身无启动回归。\n- A/B run `31034333416` 在相同 Windows runner 布局中验证打包前与打包后 EXE 均成功启动并建立 runtime log；两者 SHA-256 分别为 `f9f1afaaeb19ade39642be7d158be1cb17d078d14650871328e469c961bd344d` 与 `fd60ab2a04c93df558478554fa4dfe49522c686d19deb35728a4cdadb3882939`。\n- 因此未修改 Tauri 组合根或打包流程；Windows 验收器改为按启动前日志路径集合识别新 session，首次 45 秒超时后最多重启一次，并为每次尝试保留 stdout/stderr。进程提前退出仍立即失败，连续两次超时仍硬失败。\n- 该修正只影响外部启动观测与诊断，不改变产品入口、171 条命令、状态所有权、bundle 产物、依赖、迁移或模型保护资产。\n- R1-04 保持 `VERIFYING`，等待清理临时工作流后的正式 Windows Automated。\n',
          );
          appendOnce(
            "docs/modular-rewrite/R01-architecture-composition/README.md",
            '- 已新增 Tauri 组合根专项验证和确定性保护资产验证入口，并接入完整前端验证。\n',
            '- release 启动探针与打包前后 A/B 已排除组合根和 bundle 回归；Windows Automated 现按日志路径集合识别新 session，并使用最多一次有界重试和 stdout/stderr 诊断，仍待清理后最终 HEAD 验证。\n',
          );
          '@ | Set-Content -Path $scriptPath -Encoding UTF8
          node $scriptPath
          Remove-Item $scriptPath -Force
          git rm .github/workflows/r1-04-probe.yml

      - name: Verify targeted contracts
        shell: pwsh
        run: |
          npm ci
          node scripts/verify-windows-path-contract.mjs
          node scripts/verify-windows-acceptance.mjs
          node scripts/verify-tauri-bootstrap.mjs
          node scripts/architecture/verifyModuleBoundaries.mjs
          node scripts/architecture/verifyStateOwnership.mjs
          node scripts/architecture/verifyProtectedImports.mjs
          node scripts/verify-protected-assets-deterministic.mjs

      - name: Review and commit whitelist
        shell: pwsh
        run: |
          $allowed = @(
            '.github/workflows/r1-04-probe.yml',
            'README.md',
            'docs/modular-rewrite/R01-architecture-composition/README.md',
            'docs/modular-rewrite/R01-architecture-composition/R01-04-tauri-组合根.md',
            'scripts/windows-acceptance.ps1',
            'scripts/verify-windows-path-contract.mjs',
            'scripts/verify-windows-acceptance.mjs'
          )
          $changed = @(git diff --name-only HEAD)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected files: $($unexpected -join ', ')" }
          foreach ($required in $allowed) {
            if ($required -eq '.github/workflows/r1-04-probe.yml') {
              if (Test-Path $required) { throw 'Temporary workflow was not removed' }
            } elseif ($required -notin $changed) {
              throw "Required file not changed: $required"
            }
          }
          git diff --check
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add -A
          git commit -m "fix(r1): harden Windows release startup observation"
          git push origin HEAD:new-B
