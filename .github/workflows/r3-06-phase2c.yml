name: R3-06 P4 Snapshot API

on:
  push:
    branches:
      - rewrite/r3-06-prediction-service

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-06-prediction-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target
      - name: Apply Atomic Task 2C
        shell: pwsh
        run: python scripts/r3-06-phase2c.py
      - name: Format and refresh derived inventory
        shell: pwsh
        run: |
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
      - name: Run R3-06 hard gates
        shell: pwsh
        run: |
          npm run verify:prediction-service
          npm run verify:application-ports
          npm run verify:architecture
          cargo fmt --all -- --check
          cargo check --locked -p football-application
          cargo test --locked -p football-application
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Finalize verified status
        shell: pwsh
        run: |
          python scripts/r3-06-phase2c.py --finalize
          npm run verify:prediction-service
          npm run verify:architecture
          git diff --check
      - name: Commit clean Atomic Task 2C
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-06-phase2c.yml
          git rm -f scripts/r3-06-phase2c.py
          git add -A
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "refactor(r3): move P4 snapshot API into prediction service"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-06-prediction-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
