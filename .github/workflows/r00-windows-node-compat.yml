name: R0-06.1 Windows Node Compatibility Temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve repository line endings
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Prepare junction path
        shell: powershell
        run: |
          $sourceName = -join ([char[]](0x9879, 0x76EE, 0x6E90, 0x7801))
          $requiredSource = Join-Path $env:GITHUB_WORKSPACE $sourceName
          New-Item -ItemType Junction -Path $requiredSource -Target "$env:GITHUB_WORKSPACE\source" | Out-Null

      - name: Verify setup and frontend through junction path
        shell: powershell
        run: |
          $sourceName = -join ([char[]](0x9879, 0x76EE, 0x6E90, 0x7801))
          Set-Location (Join-Path $env:GITHUB_WORKSPACE $sourceName)
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ensure-node-dependencies.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-automated:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve repository line endings
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Prepare Windows project layout
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\logs" | Out-Null
          $sourceName = -join ([char[]](0x9879, 0x76EE, 0x6E90, 0x7801))
          $requiredSource = Join-Path $env:GITHUB_WORKSPACE $sourceName
          New-Item -ItemType Junction -Path $requiredSource -Target "$env:GITHUB_WORKSPACE\source" | Out-Null

      - name: Verify exact Automated reaches Rust stage
        shell: powershell
        run: |
          $script = "$env:GITHUB_WORKSPACE\source\scripts\windows-acceptance.ps1"
          $process = Start-Process -FilePath "powershell.exe" -ArgumentList @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", $script,
            "-Mode", "Automated",
            "-ProjectRoot", $env:GITHUB_WORKSPACE
          ) -Wait -PassThru -NoNewWindow
          $env:R0061_AUTOMATED_EXIT = [string]$process.ExitCode
          node -e "const fs=require('node:fs');const path=require('node:path');const root=path.join(process.env.GITHUB_WORKSPACE,'logs');const files=fs.readdirSync(root).filter(x=>/^windows-acceptance-.*\.txt$/.test(x)).map(x=>({x,t:fs.statSync(path.join(root,x)).mtimeMs})).sort((a,b)=>b.t-a.t);if(!files.length)throw new Error('Automated did not create an acceptance log.');const content=fs.readFileSync(path.join(root,files[0].x),'utf8');const pass='\u901a\u8fc7\uff1a\u524d\u7aef\u5951\u7ea6\u3001\u7c7b\u578b\u3001\u622a\u56fe\u4e0e\u751f\u4ea7\u6784\u5efa';const fail='\u5931\u8d25\uff1a\u524d\u7aef\u5951\u7ea6\u3001\u7c7b\u578b\u3001\u622a\u56fe\u4e0e\u751f\u4ea7\u6784\u5efa';const rust='\u5f00\u59cb\uff1aRust \u683c\u5f0f\u3001Clippy \u4e0e\u5de5\u4f5c\u533a\u6d4b\u8bd5';if(!content.includes(pass)||content.includes(fail)||!content.includes(rust))throw new Error('Automated frontend stage did not pass and continue to Rust. Exit code='+process.env.R0061_AUTOMATED_EXIT);console.log('Automated frontend stage passed and continued to Rust; overall exit code='+process.env.R0061_AUTOMATED_EXIT);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload R0-06.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r00-06-1-windows-node-compatibility
          path: logs/**
          if-no-files-found: error
          retention-days: 30
