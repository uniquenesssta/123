name: R6-07 bootstrap implementation

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify staged payload only
        shell: bash
        run: |
          set -euo pipefail
          base=7bf9b90bc235bdb397d003bdd6e61458e2e425c9
          test "$(git merge-base "$base" HEAD)" = "$base"
          actual="$(git diff --name-only "$base"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/r6-07-bootstrap.yml' \
            '.r6-07/payload-01.b64' \
            '.r6-07/payload-02.b64' \
            '.r6-07/payload-03.b64' \
            '.r6-07/payload-04.b64' \
            '.r6-07/payload-05.b64' \
            '.r6-07/payload-06.b64' | sort)"
          test "$actual" = "$expected"
          test -z "$(git status --short)"

      - name: Reconstruct and apply R6-07
        shell: bash
        run: |
          set -euo pipefail
          cat .r6-07/payload-*.b64 | tr -d '\r\n' | base64 -d > /tmp/r6-07-apply.py
          test "$(sha256sum /tmp/r6-07-apply.py | awk '{print $1}')" = "c31b039bb5b8561ebc25462537fcc6ee1316b20804e9557db09b0c050757311f"
          python3 -m py_compile /tmp/r6-07-apply.py
          python3 /tmp/r6-07-apply.py

      - name: Prepare Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version
          node --version

      - name: Format and regenerate official Domain inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
          git diff --check
          cargo fmt --all -- --check

      - name: R6-07 minimum gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-coach-formation-persistence.mjs
          node scripts/verify-formation-usage.mjs
          npm run verify:architecture
          cargo check --locked -p football-persistence-postgres
          cargo test --locked -p football-persistence-postgres --lib
          cargo test --locked -p football-persistence-postgres --test coach_formation_repository_contract --no-run
          cargo check --locked -p football-application

      - name: Record gate and commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          run_id = os.environ['GITHUB_RUN_ID']
          detail = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-07-coaches-and-formation-usage.md')
          text = detail.read_text(encoding='utf-8')
          old = '- implementation gate 将执行 rustfmt、official Domain inventory、R6-07 verifier、历史 Formation Usage verifier、完整 architecture、Persistence check/unit tests、R6-07 contract 编译和 Application check。'
          new = f'- implementation gate run `{run_id}` 已实际通过 rustfmt、official Domain inventory、R6-07 verifier、历史 Formation Usage verifier、完整 architecture、Persistence check/unit tests、R6-07 contract 编译和 Application check。'
          if text.count(old) != 1:
              raise SystemExit('implementation record anchor missing')
          detail.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          readme = Path('README.md')
          root = readme.read_text(encoding='utf-8')
          old_root = '- 新增 R6-07 ownership verifier 与 PostgreSQL contract；implementation gate 成功后仍保持 `VERIFYING`，直到 Windows/PostgreSQL 16 hard gate 与 clean canonical 完成。用户现有 PostgreSQL 数据真实 sample/write 与 Windows Full 人工交互验收未执行。'
          new_root = f'- 新增 R6-07 ownership verifier 与 PostgreSQL contract；implementation gate run `{run_id}` 已实际通过专项 ownership、历史 Formation Usage、完整 architecture、rustfmt、Persistence check/unit tests、contract 编译与 Application check。节点仍保持 `VERIFYING`，直到 Windows/PostgreSQL 16 hard gate 与 clean canonical 完成。用户现有 PostgreSQL 数据真实 sample/write 与 Windows Full 人工交互验收未执行。'
          if root.count(old_root) != 1:
              raise SystemExit('root gate anchor missing')
          readme.write_text(root.replace(old_root, new_root, 1), encoding='utf-8', newline='\n')
          PY

          rm -rf .r6-07 .github/workflows/r6-07-bootstrap.yml
          rm -f /tmp/r6-07-apply.py /tmp/__pycache__/r6-07-apply.* 2>/dev/null || true
          git diff --check
          test ! -e crates/persistence-postgres/src/formation_catalog.rs
          test -z "$(git diff --name-only | grep -E '^(crates/persistence-postgres/migrations/|Cargo.toml$|Cargo.lock$|src/|src-tauri/)' || true)"
          test -z "$(git status --short | grep '^??' | grep -vE '^\?\? (crates/persistence-postgres/src/adapters/catalog/(coaches|formations)/|crates/persistence-postgres/tests/coach_formation_repository_contract.rs|docs/modular-rewrite/R06-entity-catalog-persistence/R06-07-coaches-and-formation-usage.md|scripts/verify-coach-formation-persistence.mjs)' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(r6-07): modularize coaches and formation usage'
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
