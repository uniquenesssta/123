name: R1-04 finalize startup observation hardening

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-apply-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Reuse verified transformation
        shell: pwsh
        run: |
          $workflowPath = '.github/workflows/r1-04-probe.yml'
          $source = [System.IO.File]::ReadAllText($workflowPath, [System.Text.Encoding]::UTF8).Replace("`r`n", "`n")
          $startMarker = '          import { readFileSync, writeFileSync } from "node:fs";'
          $endMarker = "          '@ | Set-Content -Path `$scriptPath -Encoding UTF8"
          $start = $source.IndexOf($startMarker, [System.StringComparison]::Ordinal)
          $end = $source.IndexOf($endMarker, $start, [System.StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Unable to extract verified transformation script' }
          $script = $source.Substring($start, $end - $start)
          $script = [regex]::Replace($script, '(?m)^          ', '')
          $scriptPath = Join-Path $env:RUNNER_TEMP 'apply-r1-04-fix.mjs'
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          node $scriptPath
          Remove-Item $scriptPath -Force
          git rm .github/workflows/r1-04-probe.yml .github/workflows/r1-04-apply-fix.yml

      - name: Verify targeted contracts
        shell: pwsh
        run: |
          npm ci
          node scripts/verify-windows-path-contract.mjs
          node scripts/verify-windows-acceptance.mjs
          node scripts/verify-tauri-bootstrap.mjs
          node scripts/architecture/verifyModuleBoundaries.mjs
          node scripts/architecture/verifyStateOwnership.mjs
          node scripts/architecture/verifyProtectedImports.mjs
          node scripts/verify-protected-assets-deterministic.mjs

      - name: Review and commit whitelist
        shell: pwsh
        run: |
          git config core.quotepath false
          $allowed = @(
            '.github/workflows/r1-04-probe.yml',
            '.github/workflows/r1-04-apply-fix.yml',
            'README.md',
            'docs/modular-rewrite/R01-architecture-composition/README.md',
            'docs/modular-rewrite/R01-architecture-composition/R01-04-tauri-组合根.md',
            'scripts/windows-acceptance.ps1',
            'scripts/verify-windows-path-contract.mjs',
            'scripts/verify-windows-acceptance.mjs'
          )
          $changed = @(git diff --name-only HEAD)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected files: $($unexpected -join ', ')" }
          foreach ($required in $allowed) {
            if ($required -like '.github/workflows/r1-04-*.yml') {
              if (Test-Path $required) { throw "Temporary workflow was not removed: $required" }
            } elseif ($required -notin $changed) {
              throw "Required file not changed: $required"
            }
          }
          git diff --check
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add -A
          git commit -m "fix(r1): harden Windows release startup observation"
          git push origin HEAD:new-B
