name: R3-10 AT2 Facade Gate
on:
  push:
    branches:
      - agent/r3-10-application-service-facade
permissions:
  contents: write
jobs:
  at2:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-10-application-service-facade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Apply AT2 facade convergence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path
          import json

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, content):
              p=Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(content, encoding='utf-8', newline='\n')
          def replace(path, old, new):
              text=read(path)
              if old not in text: raise SystemExit(f'expected AT2 text missing: {path}: {old[:160]}')
              write(path, text.replace(old,new))

          write('crates/application/src/use_cases/application_facade/mod.rs', '''pub(crate) mod bootstrap;
pub(crate) mod database_lifecycle;
''')
          write('crates/application/src/use_cases/application_facade/database_lifecycle/mod.rs', '''pub(crate) mod connect;
pub(crate) mod initialize;
pub(crate) mod reset;
''')
          write('crates/application/src/use_cases/application_facade/database_lifecycle/initialize.rs', '''use crate::composition::ActiveDatabase;
use crate::{ApplicationResult, ApplicationService};

pub(crate) async fn execute(
    application: &ApplicationService,
    session: &ActiveDatabase,
) -> ApplicationResult<()> {
    application
        .rules
        .register_built_ins(&application.registry, session)
        .await?;
    application
        .research
        .register_persistence_artifacts(session)
        .await?;
    application
        .research
        .register_openai_research_artifacts(session)
        .await
}
''')
          write('crates/application/src/use_cases/application_facade/database_lifecycle/connect.rs', '''use super::initialize;
use crate::composition::{database_health_from_snapshot, DatabaseHealth, DatabaseOptions};
use crate::{ApplicationError, ApplicationResult, ApplicationService};
use std::sync::Arc;

pub(crate) async fn execute(
    application: &Arc<ApplicationService>,
    options: DatabaseOptions,
) -> ApplicationResult<DatabaseHealth> {
    let prepared = application.database.prepare_connection(&options).await?;
    if let Err(error) = initialize::execute(application, prepared.session()).await {
        prepared.close().await;
        return Err(error);
    }

    let health = match prepared.health().await {
        Ok(health) => database_health_from_snapshot(health),
        Err(error) => {
            prepared.close().await;
            return Err(error.into());
        }
    };
    application.database.activate(prepared).await?;

    let session = application
        .database
        .active_session()
        .await
        .ok_or(ApplicationError::DatabaseNotConnected)?;
    application.analytics.start_job_worker(session);
    application.p4_orchestration.start(Arc::clone(application));
    Ok(health)
}
''')
          write('crates/application/src/use_cases/application_facade/database_lifecycle/reset.rs', '''use super::connect;
use crate::composition::{DatabaseHealth, DatabaseOptions};
use crate::{ApplicationResult, ApplicationService};
use std::sync::Arc;

pub(crate) async fn execute(
    application: &Arc<ApplicationService>,
    options: DatabaseOptions,
    confirmation: String,
) -> ApplicationResult<DatabaseHealth> {
    if let Err(error) = application
        .database
        .reset_to_pristine(&options, &confirmation)
        .await
    {
        if !application.database.is_connected().await {
            let _ = connect::execute(application, options.clone()).await;
        }
        return Err(error.into());
    }
    connect::execute(application, options).await
}
''')

          write('crates/application/src/use_cases/application_facade/bootstrap.rs', '''use crate::composition::{database_health_from_snapshot, database_stats_from_statistics};
use crate::services::prediction::compatibility as prediction_compatibility;
use crate::use_cases::database::{health, statistics};
use crate::{
    default_match, default_rule_package_template, ApplicationResult, ApplicationService,
    BootstrapData,
};

pub(crate) async fn execute(application: &ApplicationService) -> ApplicationResult<BootstrapData> {
    let active_database = application.database.active_session().await;
    let database_configured = active_database.is_some();
    let (
        database_url,
        database_health,
        stats,
        competitions,
        seasons,
        stages,
        rounds,
        rule_packages,
        competition_bindings,
        recent_runs,
    ) = if let Some(active) = active_database {
        let hierarchy = application.competition.load_hierarchy(&active).await?;
        let rules = application.rules.load_catalog(&active).await?;
        (
            Some(active.redacted_url().to_string()),
            Some(database_health_from_snapshot(health::execute(&active).await?)),
            Some(database_stats_from_statistics(statistics::execute(&active).await?)),
            hierarchy.competitions,
            hierarchy.seasons,
            hierarchy.stages,
            hierarchy.rounds,
            rules.rule_packages,
            rules.competition_bindings,
            prediction_compatibility::list_recent_runs(&application.prediction, &active, 50).await?,
        )
    } else {
        (
            None,
            None,
            None,
            Vec::new(),
            Vec::new(),
            Vec::new(),
            Vec::new(),
            Vec::new(),
            Vec::new(),
            Vec::new(),
        )
    };

    Ok(BootstrapData {
        app_version: env!("CARGO_PKG_VERSION").to_string(),
        database_configured,
        database_url,
        database_health,
        stats,
        models: application.registry.descriptors(),
        competitions,
        seasons,
        stages,
        rounds,
        rule_packages,
        competition_bindings,
        recent_runs,
        default_match: default_match(),
        default_rule_package: default_rule_package_template(),
    })
}
''')
