name: R0-06 Windows Baseline Temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-baseline:
    name: Windows automated and runtime baseline
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source under required project directory
        uses: actions/checkout@v4
        with:
          path: 项目源码

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json

      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Record environment and verify Windows acceptance contract
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\logs" | Out-Null
          $environmentLog = "$env:GITHUB_WORKSPACE\logs\r00-windows-environment.txt"
          "runner_os=$env:RUNNER_OS" | Tee-Object -FilePath $environmentLog
          "windows_version=$([Environment]::OSVersion.VersionString)" | Tee-Object -FilePath $environmentLog -Append
          "node=$(node --version)" | Tee-Object -FilePath $environmentLog -Append
          "npm=$(npm --version)" | Tee-Object -FilePath $environmentLog -Append
          "rustc=$(rustc --version)" | Tee-Object -FilePath $environmentLog -Append
          "cargo=$(cargo --version)" | Tee-Object -FilePath $environmentLog -Append
          Set-Location "$env:GITHUB_WORKSPACE\项目源码"
          node scripts/verify-windows-acceptance.mjs *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\logs\r00-windows-contract-verification.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Automated Windows acceptance
        id: automated
        continue-on-error: true
        shell: powershell
        run: |
          $output = "$env:GITHUB_WORKSPACE\logs\r00-windows-automated-console.txt"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\项目源码\scripts\windows-acceptance.ps1" -Mode Automated -ProjectRoot "$env:GITHUB_WORKSPACE" *>&1 | Tee-Object -FilePath $output
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($code -ne 0) { exit $code }

      - name: Build Windows release independently
        id: release
        continue-on-error: true
        shell: powershell
        working-directory: 项目源码
        run: |
          npm run setup *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\logs\r00-windows-release-build.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri:build *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\logs\r00-windows-release-build.txt" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run startup RuntimeOnly acceptance
        id: runtime
        if: steps.release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $output = "$env:GITHUB_WORKSPACE\logs\r00-windows-runtime-only-console.txt"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\项目源码\scripts\windows-acceptance.ps1" -Mode RuntimeOnly -ProjectRoot "$env:GITHUB_WORKSPACE" *>&1 | Tee-Object -FilePath $output
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($code -ne 0) { exit $code }

      - name: Write execution summary
        if: always()
        shell: powershell
        run: |
          $summary = "$env:GITHUB_WORKSPACE\logs\r00-windows-step-summary.txt"
          "automated_outcome=${{ steps.automated.outcome }}" | Out-File -FilePath $summary -Encoding utf8
          "automated_exit_code=${{ steps.automated.outputs.exit_code }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "release_outcome=${{ steps.release.outcome }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "runtime_outcome=${{ steps.runtime.outcome }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "runtime_exit_code=${{ steps.runtime.outputs.exit_code }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          Get-ChildItem "$env:GITHUB_WORKSPACE\logs" -File -ErrorAction SilentlyContinue |
            Sort-Object Name |
            ForEach-Object { "artifact_file=$($_.Name);bytes=$($_.Length)" } |
            Out-File -FilePath $summary -Encoding utf8 -Append
          Get-Content $summary

      - name: Upload independent Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r00-06-windows-baseline
          path: logs/**
          if-no-files-found: error
          retention-days: 30

      - name: Preserve baseline result
        if: always()
        shell: powershell
        run: |
          if ("${{ steps.automated.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.release.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.runtime.outcome }}" -ne "success") { exit 1 }
