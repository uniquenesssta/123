name: R0-06 Windows Baseline Temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-baseline:
    name: Windows automated and runtime baseline
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Preserve repository line endings
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Prepare required source directory alias
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\logs" | Out-Null
          $sourceName = -join ([char[]](0x9879, 0x76EE, 0x6E90, 0x7801))
          $requiredSource = Join-Path $env:GITHUB_WORKSPACE $sourceName
          if (-not (Test-Path $requiredSource)) {
            New-Item -ItemType Junction -Path $requiredSource -Target "$env:GITHUB_WORKSPACE\source" | Out-Null
          }
          if (-not (Test-Path (Join-Path $requiredSource "package.json"))) {
            throw "Required source directory alias was not created correctly."
          }
          "required_source=$requiredSource" | Out-File -FilePath "$env:GITHUB_WORKSPACE\logs\r00-windows-layout.txt" -Encoding utf8

      - name: Record environment and verify Windows acceptance contract
        id: contract
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $environmentLog = "$env:GITHUB_WORKSPACE\logs\r00-windows-environment.txt"
          "runner_os=$env:RUNNER_OS" | Tee-Object -FilePath $environmentLog
          "windows_version=$([Environment]::OSVersion.VersionString)" | Tee-Object -FilePath $environmentLog -Append
          "node=$(node --version)" | Tee-Object -FilePath $environmentLog -Append
          "npm=$(npm --version)" | Tee-Object -FilePath $environmentLog -Append
          "rustc=$(rustc --version)" | Tee-Object -FilePath $environmentLog -Append
          "cargo=$(cargo --version)" | Tee-Object -FilePath $environmentLog -Append
          "git_core_autocrlf=$(git config --global --get core.autocrlf)" | Tee-Object -FilePath $environmentLog -Append
          "git_core_eol=$(git config --global --get core.eol)" | Tee-Object -FilePath $environmentLog -Append
          Set-Location "$env:GITHUB_WORKSPACE\source"
          $actualLockHash = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          "cargo_lock_sha256=$actualLockHash" | Tee-Object -FilePath $environmentLog -Append
          node scripts/verify-windows-acceptance.mjs *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\logs\r00-windows-contract-verification.txt"
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($code -ne 0) { exit $code }

      - name: Run exact Automated Windows acceptance
        id: automated
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $output = "$env:GITHUB_WORKSPACE\logs\r00-windows-automated-console.txt"
          $command = 'powershell -NoProfile -ExecutionPolicy Bypass -File "' + $env:GITHUB_WORKSPACE + '\source\scripts\windows-acceptance.ps1" -Mode Automated -ProjectRoot "' + $env:GITHUB_WORKSPACE + '" > "' + $output + '" 2>&1'
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList @("/d", "/s", "/c", $command) -Wait -PassThru -NoNewWindow
          if (Test-Path $output) { Get-Content -Raw -Encoding UTF8 $output -ErrorAction SilentlyContinue }
          "exit_code=$($process.ExitCode)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Build release with transient Windows launcher workaround
        id: release
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $sourceRoot = "$env:GITHUB_WORKSPACE\source"
          $output = "$env:GITHUB_WORKSPACE\logs\r00-windows-release-workaround.txt"
          $configPath = Join-Path $sourceRoot "src-tauri\tauri.conf.json"
          $originalConfig = [IO.File]::ReadAllText($configPath)
          $config = $originalConfig | ConvertFrom-Json
          $config.build.beforeBuildCommand = ""
          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($configPath, ($config | ConvertTo-Json -Depth 20), $utf8NoBom)
          try {
            $command = 'cd /d "' + $sourceRoot + '" && (npm run setup && node node_modules\typescript\bin\tsc --noEmit && node node_modules\vite\bin\vite.js build && node scripts\run-tauri.mjs build) > "' + $output + '" 2>&1'
            $process = Start-Process -FilePath "cmd.exe" -ArgumentList @("/d", "/s", "/c", $command) -Wait -PassThru -NoNewWindow
          } finally {
            [IO.File]::WriteAllText($configPath, $originalConfig, $utf8NoBom)
          }
          if (Test-Path $output) { Get-Content -Raw -Encoding UTF8 $output -ErrorAction SilentlyContinue }
          "exit_code=$($process.ExitCode)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($process.ExitCode -eq 0) {
            $sourceTarget = Join-Path $sourceRoot ".cargo-target"
            $outerTarget = Join-Path $env:GITHUB_WORKSPACE ".cargo-target"
            if (-not (Test-Path $outerTarget)) { throw "Outer Cargo target directory was not produced." }
            if (-not (Test-Path $sourceTarget)) {
              New-Item -ItemType Junction -Path $sourceTarget -Target $outerTarget | Out-Null
            }
            "runtime_target_alias=$sourceTarget" | Out-File -FilePath "$env:GITHUB_WORKSPACE\logs\r00-windows-runtime-layout.txt" -Encoding utf8
          } else {
            exit $process.ExitCode
          }

      - name: Run startup RuntimeOnly acceptance
        id: runtime
        if: always() && steps.release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $output = "$env:GITHUB_WORKSPACE\logs\r00-windows-runtime-only-console.txt"
          $command = 'powershell -NoProfile -ExecutionPolicy Bypass -File "' + $env:GITHUB_WORKSPACE + '\source\scripts\windows-acceptance.ps1" -Mode RuntimeOnly -ProjectRoot "' + $env:GITHUB_WORKSPACE + '" > "' + $output + '" 2>&1'
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList @("/d", "/s", "/c", $command) -Wait -PassThru -NoNewWindow
          if (Test-Path $output) { Get-Content -Raw -Encoding UTF8 $output -ErrorAction SilentlyContinue }
          "exit_code=$($process.ExitCode)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Write execution summary
        if: always()
        shell: powershell
        run: |
          $summary = "$env:GITHUB_WORKSPACE\logs\r00-windows-step-summary.txt"
          "contract_outcome=${{ steps.contract.outcome }}" | Out-File -FilePath $summary -Encoding utf8
          "contract_exit_code=${{ steps.contract.outputs.exit_code }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "automated_outcome=${{ steps.automated.outcome }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "automated_exit_code=${{ steps.automated.outputs.exit_code }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "release_workaround_outcome=${{ steps.release.outcome }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "release_workaround_exit_code=${{ steps.release.outputs.exit_code }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "runtime_outcome=${{ steps.runtime.outcome }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          "runtime_exit_code=${{ steps.runtime.outputs.exit_code }}" | Out-File -FilePath $summary -Encoding utf8 -Append
          Get-ChildItem "$env:GITHUB_WORKSPACE\logs" -File -ErrorAction SilentlyContinue |
            Sort-Object Name |
            ForEach-Object { "artifact_file=$($_.Name);bytes=$($_.Length)" } |
            Out-File -FilePath $summary -Encoding utf8 -Append
          Get-Content $summary

      - name: Upload independent Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r00-06-windows-baseline
          path: logs/**
          if-no-files-found: error
          retention-days: 30

      - name: Preserve evidence collection result
        if: always()
        shell: powershell
        run: |
          if ("${{ steps.contract.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.release.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.runtime.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.automated.outcome }}" -ne "success") {
            Write-Warning "Exact Automated acceptance failed; the failure is preserved in the uploaded evidence."
          }
