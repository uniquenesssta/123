name: R6-08 implementation gate

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-08-implementation
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify R6-08 staging baseline
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r6-08.log
          exec > >(tee -a /tmp/r6-08.log) 2>&1
          base="a44e11aceccdb1c582636ff8d4c49f9d24529baa"
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = ".github/workflows/r6-08-bootstrap.yml"
          test "${changed[1]}" = ".r6-08-failure.txt"
          test "${changed[2]}" = ".r6-08/apply.py"
          test ! -e crates/persistence-postgres/src/adapters/catalog/entity_matching/mod.rs
          test ! -e crates/persistence-postgres/src/adapters/catalog/references/mod.rs

      - name: Prepare Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/r6-08.log) 2>&1
          rustup toolchain install 1.88.0 --profile minimal
          rustup component add rustfmt --toolchain 1.88.0
          rustup default 1.88.0

      - name: Apply R6-08 owner switch
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/r6-08.log) 2>&1
          python3 .r6-08/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("crates/persistence-postgres/src/adapters/catalog/references/entity_type.rs")
          text = p.read_text(encoding="utf-8")
          pattern = re.compile(
              r'        assert_eq!\(\n'
              r'\s*validate_entity_type\("match"\)\.unwrap_err\(\)\.to_string\(\),\n'
              r'\s*"状态无效: 不支持的实体类型：match"\n'
              r'\s*\);'
          )
          new = '''        assert!(matches!(
              validate_entity_type("match"),
              Err(crate::PersistenceError::InvalidState(message)) if message == "不支持的实体类型：match"
          ));'''
          text, count = pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit(f"R6-08 invalid-type test anchor mismatch: {count}")
          p.write_text(text, encoding="utf-8", newline="\n")
          PY
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
          git diff --check

      - name: Verify R6-08 ownership and retained contracts
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/r6-08.log) 2>&1
          node scripts/verify-entity-matching-references-persistence.mjs
          node scripts/verify-coach-formation-persistence.mjs
          node scripts/verify-entity-relationships.mjs
          npm run verify:architecture
          node scripts/verify-protected-assets-deterministic.mjs
          node scripts/verify_database_baseline.mjs

      - name: Persistence and Application minimum gate
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/r6-08.log) 2>&1
          cargo fmt --all -- --check
          cargo check --locked -p football-persistence-postgres
          cargo test --locked -p football-persistence-postgres --lib
          cargo test --locked -p football-persistence-postgres --test entity_matching_references_repository_contract --no-run
          cargo check --locked -p football-application
          git diff --check

      - name: Commit verified R6-08 implementation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/r6-08.log) 2>&1
          rm -rf .r6-08
          rm -f .r6-08-failure.txt
          rm -f .github/workflows/r6-08-bootstrap.yml
          test ! -e .r6-08
          test ! -e .r6-08-failure.txt
          test ! -e .github/workflows/r6-08-bootstrap.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "refactor(r6-08): modularize entity matching and references"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence

      - name: Persist failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/r6-08.log ]; then
            tail -n 260 /tmp/r6-08.log > .r6-08-failure.txt
          else
            printf '%s\n' 'R6-08 failed before diagnostic log initialization.' > .r6-08-failure.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .r6-08-failure.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(r6-08): record implementation gate failure"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
