name: R6-02 Owner Switch

on:
  push:
    branches:
      - agent/r6-02-team-names-profiles
    paths:
      - .github/workflows/r6-02-owner-switch.yml

permissions:
  contents: read

jobs:
  owner-switch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_02_owner_switch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_02_owner_switch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_02_owner_switch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Verify R6-01 retained ownership
        run: node scripts/verify-team-directory-detail.mjs
      - name: Verify R6-02 ownership
        run: node scripts/verify-team-names-profiles.mjs
      - name: Verify rustfmt
        run: cargo fmt --all -- --check
      - name: Check Persistence and Application
        run: cargo check --locked -p football-persistence-postgres -p football-application
      - name: Run Persistence unit tests
        run: cargo test --locked -p football-persistence-postgres --lib
      - name: Run R6-02 PostgreSQL 16 contract
        run: cargo test --locked -p football-persistence-postgres --test team_names_profiles_repository_contract -- --ignored --nocapture
