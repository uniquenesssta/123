name: R5-05 Advance Verifiers

on:
  push:
    branches:
      - agent/r5-05-route-resolution
    paths:
      - ".github/workflows/r5-05-advance-verifiers.yml"

permissions:
  contents: write

jobs:
  advance-verifiers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-05-route-resolution
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Advance R5 ownership gates to R5-05 state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          route = Path('scripts/verify-route-resolution.mjs')
          text = route.read_text(encoding='utf-8')
          old_scope = 'check(scope.includes("赛事层级不一致") && scope.includes("{label}层级不一致"), "scope validation must preserve hierarchy mismatch semantics");'
          new_scope = 'check(scope.includes("{label}层级不一致") && scope.includes("Some(Uuid::new_v4())"), "scope validation must preserve generic hierarchy mismatch semantics and mismatch coverage");'
          if old_scope not in text:
              raise SystemExit('R5-05 scope verifier assertion not found')
          route.write_text(text.replace(old_scope, new_scope, 1), encoding='utf-8')

          repo = Path('scripts/verify-competition-repository.mjs')
          text = repo.read_text(encoding='utf-8')
          text = text.replace(
              'import "./verify-competition-bindings.mjs";\n',
              'import "./verify-route-resolution.mjs";\nimport "./verify-competition-bindings.mjs";\n',
              1,
          )
          text = text.replace(
              'const legacy = read("crates/persistence-postgres/src/competitions.rs");',
              'const legacyPath = "crates/persistence-postgres/src/competitions.rs";\nconst legacyExists = exists(legacyPath);\nconst legacy = legacyExists ? read(legacyPath) : "";',
              1,
          )
          text = text.replace(
              'check(!competitionMod.includes("route_resolution") && !competitionMod.includes("model_run_identity"), "R5-04 must not pre-implement R5-05/R5-06 responsibilities");',
              'check(competitionMod.includes("mod route_resolution;"), "competition/mod.rs must register the approved R5-05 route_resolution owner");\ncheck(!competitionMod.includes("model_run_identity"), "R5-05 must not pre-implement R5-06 model_run_identity owner");',
              1,
          )
          text = text.replace(
              'check(new RegExp(`pub\\\\s+async\\\\s+fn\\\\s+resolve_competition_context\\\\b`).test(legacy), "R5-04 must leave R5-05 resolve_competition_context in its current owner");',
              'check(!legacyExists, "R5-05 must remove legacy competitions.rs after route context owner switch");',
              1,
          )
          text = text.replace(
              'console.log("R5-01 Competitions Repository verified: directory/detail remain unique Competition CRUD owners, typed Row/Mapper and delete SQL boundaries remain intact, with approved hierarchy and Binding modules registered without pre-implementing R5-05/R5-06.");',
              'console.log("R5-01 Competitions Repository verified: directory/detail remain unique Competition CRUD owners, approved hierarchy/Binding/Route Resolution owners are registered, legacy competitions.rs is removed, and R5-06 remains blocked.");',
              1,
          )
          repo.write_text(text, encoding='utf-8')

          bindings = Path('scripts/verify-competition-bindings.mjs')
          text = bindings.read_text(encoding='utf-8')
          text = text.replace(
              'const contextOwner = read("crates/persistence-postgres/src/competitions.rs");',
              'const contextOwnerExists = exists("crates/persistence-postgres/src/competitions.rs");',
              1,
          )
          text = text.replace(
              'check(!competitionMod.includes("route_resolution") && !competitionMod.includes("model_run_identity"), "R5-04 must not pre-implement R5-05/R5-06 owners");',
              'check(competitionMod.includes("mod route_resolution;"), "R5-04 gate must recognize the approved R5-05 route_resolution owner");\ncheck(!competitionMod.includes("model_run_identity"), "R5-05 must not pre-implement R5-06 model_run_identity owner");',
              1,
          )
          old = '''for (const required of ["pub async fn resolve_route", "fn route_decision_from_row", "pub async fn register_model", "pub(crate) async fn register_model_in_tx"]) {
            check(legacy.includes(required), `R5-04 must leave later owner in routing.rs: ${required}`);
          }
          check(contextOwner.includes("pub async fn resolve_competition_context"), "R5-04 must leave R5-05 competition context owner untouched");
          check(contextOwner.includes("fn ensure_scope_id"), "R5-04 must leave R5-05 scope validation untouched");'''
          new = '''for (const removed of ["pub async fn resolve_route", "fn route_decision_from_row"]) {
            check(!legacy.includes(removed), `R5-05 must remove route resolution from legacy routing.rs: ${removed}`);
          }
          for (const required of ["pub async fn register_model", "pub(crate) async fn register_model_in_tx"]) {
            check(legacy.includes(required), `R5-05 must leave R5-06 model registration in routing.rs: ${required}`);
          }
          check(!contextOwnerExists, "R5-05 must remove legacy competitions.rs after context owner switch");'''
          if old not in text:
              raise SystemExit('R5-04 later-owner assertion block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'console.log("R5-04 Competition Bindings verified: typed binding persistence has one owner, legacy Binding CRUD/helpers are removed, and R5-05 route/context plus R5-06 model registration remain untouched.");',
              'console.log("R5-04 Competition Bindings verified: Binding persistence remains unique, R5-05 route/context has moved to its approved owner, and R5-06 model registration remains untouched.");',
              1,
          )
          bindings.write_text(text, encoding='utf-8')

          rules = Path('scripts/verify-rule-package-repository.mjs')
          text = rules.read_text(encoding='utf-8')
          old = '''// R5-05/R5-06 remain blocked and therefore must stay in the legacy routing owner.
          for (const retained of ["register_model", "resolve_route", "route_decision_from_row"]) {
            check(legacy.includes(retained), `R5-03/R5-04 must leave later/shared routing responsibility ${retained} in routing.rs`);
          }
          check(legacy.includes("pub(crate) async fn register_model_in_tx"), "shared model registration transaction helper must remain in routing owner with crate-only visibility");'''
          new = '''// R5-05 is now approved and must be absent from legacy routing; R5-06 remains blocked.
          for (const migrated of ["resolve_route", "route_decision_from_row"]) {
            check(!legacy.includes(migrated), `R5-05 route responsibility must be removed from routing.rs: ${migrated}`);
          }
          check(legacy.includes("register_model"), "R5-06 register_model must remain in routing.rs");
          check(legacy.includes("pub(crate) async fn register_model_in_tx"), "shared model registration transaction helper must remain in routing owner with crate-only visibility");'''
          if old not in text:
              raise SystemExit('R5-03 later-owner assertion block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'console.log("R5-03 Rule Package Repository verified: package registration/list/source-document persistence remains uniquely owned; R5-04 Binding ownership has moved out of routing.rs while R5-05 route resolution and R5-06 model registration remain untouched.");',
              'console.log("R5-03 Rule Package Repository verified: package persistence remains unique, R5-04 Binding and R5-05 Route Resolution have moved to approved owners, and R5-06 model registration remains untouched.");',
              1,
          )
          rules.write_text(text, encoding='utf-8')
          PY
          node scripts/verify-competition-repository.mjs
          git diff --check
      - name: Commit advanced ownership gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-competition-repository.mjs scripts/verify-competition-bindings.mjs scripts/verify-rule-package-repository.mjs scripts/verify-route-resolution.mjs
          git commit -m "arch(r5-05): advance competition ownership gates"
          git push origin HEAD:agent/r5-05-route-resolution
