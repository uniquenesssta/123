name: R6-04 hard-gate record sync

on:
  push:
    branches:
      - agent/r6-04-player-names-positions

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync verified R6-04 records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'安全停止：{path} 目标文本计数为 {content.count(old)}，预期 1')
              target.write_text(content.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'README.md',
              '- 当前节点保持 `VERIFYING`；PostgreSQL 16 真实 contract 执行、完整阶段回归、clean PR canonical 与 merged-stage canonical 尚未执行。',
              '- 阶段 hard gate run `31969619201` 已整体 `SUCCESS`：Windows job `95219904073` 的 `npm run verify:frontend`、rustfmt、workspace Clippy `-D warnings` 与 workspace tests 全部通过；PostgreSQL/architecture job `95219904082` 的 R6-01～R6-04 ownership、完整 architecture、模型保护/数据库迁移兼容门禁、R6-03 retained PG16 contract 与 R6-04 PG16 contract 全部通过。R6-03 ownership verifier 仅跟随 Names/Positions 新 owner 更新，原 R6-03 契约未删除或放宽；临时 hard-gate workflow 已清理。当前节点继续 `VERIFYING`，仅剩 clean PR canonical、合并与 merged-stage canonical 收口。'
          )

          doc = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-04-player-names-and-positions.md')
          content = doc.read_text(encoding='utf-8')
          marker = '## 尚未执行\n\n'
          hard_gate = '''## 阶段 hard gate\n\n- run `31969619201` 整体 `SUCCESS`。\n- Windows stage regression job `95219904073`：`npm run setup`、`npm run verify:frontend`、`cargo fmt --all -- --check`、`cargo clippy --locked --workspace --all-targets -- -D warnings`、`cargo test --locked --workspace` 全部 `SUCCESS`。\n- PostgreSQL/architecture job `95219904082`：R6-01 / R6-02 retained ownership、R6-03 ownership、R6-04 ownership、`npm run verify:architecture`、public model boundary、deterministic protected assets、database migration compatibility 全部 `SUCCESS`。\n- 同一 PostgreSQL 16 专用测试库上，R6-03 `player_directory_detail_repository_contract` 与 R6-04 `player_names_positions_repository_contract` 的 ignored tests 均真实执行并 `SUCCESS`；不是仅编译。\n- R6-04 推进后，`scripts/verify-player-directory-detail.mjs` 只把 R6-03 对 Names/Positions 的“后续 owner 尚未迁移”断言跟随到 R6-04 新 owner；R6-03 Directory/Detail、Dynamic Tag 与后续 R6-05/R6-06/R6-09 边界断言保持。\n- 临时 `.github/workflows/r6-04-hard-gate.yml` 已在成功后删除。\n\n'''
          if marker not in content:
              raise SystemExit('R06-04 文档缺少 尚未执行 标题')
          content = content.replace(marker, hard_gate + marker, 1)
          content = content.replace('- R6-04 PostgreSQL 16 ignored contract 真实执行。\n', '', 1)
          content = content.replace('- `npm run verify:frontend`。\n', '', 1)
          content = content.replace('- workspace Clippy `-D warnings`。\n', '', 1)
          content = content.replace('- `cargo test --locked --workspace`。\n', '', 1)
          doc.write_text(content, encoding='utf-8', newline='\n')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          content = stage.read_text(encoding='utf-8')
          old = '- 临时实施 gate run `31969378628` 已通过 R6-04 ownership、official Domain inventory、完整 architecture、rustfmt、Persistence unit tests、R6-04 contract 编译和 Application check。\n- 当前状态 `VERIFYING`；PG16 真实 contract、阶段 hard gate、clean PR 与 merged-stage canonical 尚未完成，R6-05 继续 `BLOCKED`。'
          new = '- 临时实施 gate run `31969378628` 已通过 R6-04 ownership、official Domain inventory、完整 architecture、rustfmt、Persistence unit tests、R6-04 contract 编译和 Application check。\n- 阶段 hard gate run `31969619201` 整体 `SUCCESS`：Windows job `95219904073` 已通过 frontend、rustfmt、workspace Clippy `-D warnings` 与 workspace tests；PostgreSQL/architecture job `95219904082` 已通过 R6-01～R6-04 ownership、完整 architecture、模型保护/数据库迁移兼容门禁以及 R6-03/R6-04 PostgreSQL 16 真实 contracts。R6-03 verifier 只跟随 Names/Positions 新 owner 更新，未放宽原契约。临时 hard-gate workflow 已清理。\n- 当前状态 `VERIFYING`；仅剩 clean PR canonical、合并与 merged-stage canonical，R6-05 继续 `BLOCKED`。'
          if content.count(old) != 1:
              raise SystemExit('R6 阶段索引 R6-04 事实块不符合预期')
          stage.write_text(content.replace(old, new, 1), encoding='utf-8', newline='\n')

          workflow = Path('.github/workflows/r6-04-doc-sync.yml')
          if not workflow.exists():
              raise SystemExit('临时 doc-sync workflow 不存在')
          workflow.unlink()
          PY

      - name: Commit factual hard-gate records and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(r6-04): record successful stage hard gate"
          git push origin HEAD:agent/r6-04-player-names-positions
