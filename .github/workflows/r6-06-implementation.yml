name: R6-06 implementation gate

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
    paths:
      - .github/workflows/r6-06-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_06_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_06_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_06_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify protected R6-06 baseline ancestry and temp-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f48841a8a50f51cd71e09969d858b95e7d9ba9fa HEAD
          changed="$(git diff --name-only f48841a8a50f51cd71e09969d858b95e7d9ba9fa..HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/r6-06-implementation.yml' 'scripts/r6_06_implementation.py' 'scripts/r6_06_recovery.py' | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --short)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Apply R6-06 modular migration and scoped recovery
        shell: bash
        run: |
          set -euo pipefail
          python scripts/r6_06_implementation.py
          python scripts/r6_06_recovery.py

      - name: Setup declared Node development dependencies
        shell: bash
        run: npm run setup

      - name: Format and refresh deterministic Domain inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs

      - name: Verify R6-06 ownership and retained R6 boundaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-player-abilities-dynamic-tags.mjs
          node scripts/verify-player-team-periods-availability.mjs
          node scripts/verify-player-names-positions.mjs
          node scripts/verify-player-directory-detail.mjs

      - name: Verify architecture and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture
          node scripts/verify_protected_assets.mjs
          node scripts/verify_database_baseline.mjs
          cargo fmt --all -- --check

      - name: Verify targeted Rust and PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --lib
          cargo test --locked -p football-persistence-postgres --test player_abilities_dynamic_tags_repository_contract --no-run
          cargo test --locked -p football-persistence-postgres --test player_abilities_dynamic_tags_repository_contract -- --ignored --nocapture
          cargo check --locked -p football-application

      - name: Record implementation gate and commit only verified tree
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          run_id = os.environ['RUN_ID']
          detail = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-06-abilities-and-dynamic-tags.md')
          text = detail.read_text(encoding='utf-8')
          text = text.replace(
              '- R6-06 ownership verifier、R6-05 retained verifier、完整 architecture、模型保护、数据库基线、rustfmt、Persistence unit tests、Application check 与 PostgreSQL 16 专用 contract 均由本节点 implementation gate 执行；仅在全部成功后提交本源码树。',
              f'- implementation gate run `{run_id}` 已实际通过 R6-06 ownership、R6-03～R6-05 retained ownership、完整 architecture、模型保护、数据库基线、rustfmt、Persistence unit tests、Application check、R6-06 PostgreSQL contract 编译及 PostgreSQL 16 专用测试库真实执行。',
          )
          detail.write_text(text, encoding='utf-8')
          readme = Path('README.md')
          root = readme.read_text(encoding='utf-8')
          root = root.replace(
              '- 当前节点为 `VERIFYING`；implementation gate 必须实际通过 ownership/architecture/模型保护/数据库基线/Rust 与 PostgreSQL 16 contract 后才提交，阶段 hard gate 与 clean canonical CI 完成前不标记 `DONE`。',
              f'- implementation gate run `{run_id}` 已实际通过 R6-06 ownership、retained R6 ownership、完整 architecture、模型保护、数据库基线、rustfmt、Persistence unit tests、Application check 与 PostgreSQL 16 contract；当前保持 `VERIFYING`，等待阶段 hard gate 与 clean canonical CI。',
          )
          readme.write_text(root, encoding='utf-8')
          PY
          rm .github/workflows/r6-06-implementation.yml scripts/r6_06_implementation.py scripts/r6_06_recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(r6-06): modularize abilities and dynamic tags persistence"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
