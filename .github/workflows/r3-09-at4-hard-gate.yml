name: R3-09 AT4 Hard Gate

on:
  push:
    branches:
      - agent/r3-09-at4-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r3-09-at4-hard-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hard-gate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target
      - name: Release service gate
        shell: pwsh
        run: node scripts/verify-release-service.mjs
      - name: Historical release acceptance contract
        shell: pwsh
        run: node scripts/verify-release-acceptance.mjs
      - name: Full architecture gate
        shell: pwsh
        run: npm run verify:architecture
      - name: Prepare Cargo target
        shell: pwsh
        run: node scripts/prepare-cargo-target.mjs
      - name: Rustfmt
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Application check
        shell: pwsh
        run: cargo check --locked -p football-application
      - name: Application tests
        shell: pwsh
        run: cargo test --locked -p football-application
      - name: Application Clippy
        shell: pwsh
        run: cargo clippy --locked -p football-application --all-targets -- -D warnings
