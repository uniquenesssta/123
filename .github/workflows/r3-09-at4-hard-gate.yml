name: R3-09 AT4 Hard Gate

on:
  push:
    branches:
      - agent/r3-09-at4-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hard-gate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Refresh deterministic Domain inventory
        shell: pwsh
        run: |
          node scripts/generate-domain-type-inventory.mjs
          if (-not (git diff --quiet -- architecture/domain-type-inventory.json)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add architecture/domain-type-inventory.json
            git commit -m "chore(r3-09): refresh domain type inventory"
            git push origin HEAD:agent/r3-09-at4-release
          }
      - name: Release architecture gates
        shell: pwsh
        run: |
          node scripts/verify-release-service.mjs
          node scripts/verify-release-acceptance.mjs
          npm run verify:architecture
      - name: Application Rust gate
        shell: pwsh
        run: |
          node scripts/prepare-cargo-target.mjs
          cargo fmt --all -- --check
          cargo check --locked -p football-application
          cargo test --locked -p football-application
          cargo clippy --locked -p football-application --all-targets -- -D warnings
