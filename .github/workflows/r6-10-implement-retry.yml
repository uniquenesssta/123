name: R6-10 Ordered Implementation Retry

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r6-10-implement-retry-${{ github.ref }}
  cancel-in-progress: false

env:
  R6_BRANCH: rewrite/r6-entity-catalog-persistence
  R6_10_SOURCE_BASELINE: e79f1becb1595b03f5d1ba4686363dd62fbac9e2

jobs:
  implement:
    name: R6-10 ordered minimum gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Confirm baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$R6_10_SOURCE_BASELINE" HEAD
          test -z "$(git status --short)"
          test -f scripts/r6-10-apply.py
          test -f crates/persistence-postgres/src/name_search.rs
          test ! -e crates/persistence-postgres/src/adapters/catalog/global_search

      - name: Apply R6-10 split
        run: python scripts/r6-10-apply.py

      - name: Format before inventory generation
        run: cargo fmt --all
      - name: Generate official Domain inventory after formatting
        run: node scripts/generate-domain-type-inventory.mjs

      - name: Verify Global Search contract and owner
        run: node scripts/verify-global-name-search.mjs
      - name: Check persistence crate
        run: cargo check --locked -p football-persistence-postgres
      - name: Focused Global Search unit tests
        run: cargo test --locked -p football-persistence-postgres --lib global_search -- --nocapture
      - name: Protected asset gate
        run: node scripts/verify_protected_assets.mjs
      - name: Frozen database baseline gate
        run: node scripts/verify_database_baseline.mjs
      - name: Official Domain inventory gate
        run: node scripts/verify-domain-type-inventory.mjs
      - name: PostgreSQL 16 focused Global Search contract
        run: cargo test --locked -p football-persistence-postgres --test global_name_search_repository_contract -- --ignored --nocapture

      - name: Diff scope and hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = (
              'README.md',
              'architecture/domain-type-inventory.json',
              'crates/persistence-postgres/src/lib.rs',
              'crates/persistence-postgres/src/name_search.rs',
              'crates/persistence-postgres/src/adapters/catalog/mod.rs',
              'crates/persistence-postgres/src/adapters/catalog/global_search/',
              'crates/persistence-postgres/src/adapters/catalog/players/directory/list_players.rs',
              'crates/persistence-postgres/src/adapters/catalog/teams/directory/list_teams.rs',
              'crates/persistence-postgres/src/adapters/catalog/teams/directory/list_team_options.rs',
              'crates/persistence-postgres/src/adapters/catalog/coaches/directory/list.rs',
              'crates/persistence-postgres/src/adapters/catalog/references/directory/read.rs',
              'crates/persistence-postgres/tests/global_name_search_repository_contract.rs',
              'scripts/verify-global-name-search.mjs',
              'docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md',
              'docs/modular-rewrite/R06-entity-catalog-persistence/README.md',
          )
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unexpected = [p for p in changed if not any(p == a or (a.endswith('/') and p.startswith(a)) for a in allowed)]
          if unexpected:
              raise SystemExit('unexpected R6-10 scope: ' + ', '.join(unexpected))
          print('\n'.join(changed))
          PY

      - name: Record minimum gate success
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          run = os.environ['RUN_ID']
          record = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-10-global-name-search.md')
          text = record.read_text(encoding='utf-8').replace(
              f'- implementation/minimum gate run `{run}` 执行中；硬门禁通过前保持 `VERIFYING`。',
              f'- implementation/minimum gate run `{run}` 已通过：Global Search owner/contract、Persistence check、5 个 focused unit tests、模型保护、database baseline、Domain inventory、PostgreSQL 16 focused contract 与 diff scope 全部 PASS。'
          )
          record.write_text(text, encoding='utf-8')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = stage.read_text(encoding='utf-8').replace(
              f'- implementation/minimum gate run `{run}` 执行中；完成前保持 `VERIFYING`。',
              f'- implementation/minimum gate run `{run}` 已通过；R6-10 保持 `VERIFYING`，等待完整 Windows 与 retained PostgreSQL 16 阶段回归。'
          )
          stage.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8').replace(
              f'implementation/minimum gate run `{run}` 执行中，节点暂为 `VERIFYING`。',
              f'implementation/minimum gate run `{run}` 已通过，节点暂为 `VERIFYING`，等待阶段回归。'
          )
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit verified production owner switch
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/r6-10-apply.py
          git rm -f .r6-10-failure.txt || true
          git rm .github/workflows/r6-10-implement-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md architecture/domain-type-inventory.json crates/persistence-postgres docs/modular-rewrite/R06-entity-catalog-persistence scripts/verify-global-name-search.mjs
          git commit -m 'refactor(r6-10): modularize global name search'
          git push origin HEAD:"$R6_BRANCH"

  record-failure:
    name: Record ordered R6-10 failure
    needs: implement
    if: ${{ always() && needs.implement.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R6_BRANCH }}
          fetch-depth: 0
      - name: Save failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "phase=ordered-implement"
            echo "head=$(git rev-parse HEAD)"
          } > .r6-10-failure.txt
          gh run view "$GITHUB_RUN_ID" --log-failed >> .r6-10-failure.txt 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .r6-10-failure.txt
          git commit -m 'ci(r6-10): record ordered implementation failure' || true
          git push origin HEAD:"$R6_BRANCH"
