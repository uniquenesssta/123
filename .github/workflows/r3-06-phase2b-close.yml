name: R3-06 Close P4 Freeze Status

on:
  push:
    branches:
      - rewrite/r3-06-prediction-service

permissions:
  contents: write

jobs:
  close-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r3-06-prediction-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified 2B status
        shell: pwsh
        run: python scripts/r3-06-phase2b-close.py
      - name: Validate documentation state
        shell: pwsh
        run: |
          node scripts/verify-r3-06-p4-freeze.mjs
          node scripts/verify-application-ports.mjs
          npm run verify:architecture
          git diff --check
      - name: Commit clean documentation state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r3-06-phase2b-close.yml
          git rm -f scripts/r3-06-phase2b-close.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "docs(r3): close P4 freeze execution task"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:rewrite/r3-06-prediction-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
