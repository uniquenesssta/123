name: R1-04 deterministic finalization

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-04-finalize-safe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic completion records
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'finalize-r1-04.mjs'
          @'
          import { readFileSync, writeFileSync } from "node:fs";

          function read(path) {
            const raw = readFileSync(path);
            const hasBom = raw.length >= 3 && raw[0] === 0xef && raw[1] === 0xbb && raw[2] === 0xbf;
            return { text: raw.toString("utf8").replace(/^\uFEFF/, ""), hasBom };
          }

          function write(path, text, hasBom) {
            const body = Buffer.from(text, "utf8");
            writeFileSync(path, hasBom ? Buffer.concat([Buffer.from([0xef, 0xbb, 0xbf]), body]) : body);
          }

          function replaceOnce(path, oldText, newText) {
            const file = read(path);
            const count = file.text.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one replacement anchor, got ${count}`);
            write(path, file.text.replace(oldText, newText), file.hasBom);
          }

          function replaceSection(path, startMarker, endMarker, replacement) {
            const file = read(path);
            const start = file.text.indexOf(startMarker);
            if (start < 0) throw new Error(`${path}: missing section start: ${startMarker}`);
            const secondStart = file.text.indexOf(startMarker, start + startMarker.length);
            if (secondStart >= 0) throw new Error(`${path}: duplicate section start: ${startMarker}`);
            const end = endMarker === null ? file.text.length : file.text.indexOf(endMarker, start + startMarker.length);
            if (end < 0) throw new Error(`${path}: missing section end: ${endMarker}`);
            write(path, `${file.text.slice(0, start)}${replacement}${file.text.slice(end)}`, file.hasBom);
          }

          replaceOnce(
            "README.md",
            '- R1-04 已建立 `src-tauri/src/bootstrap/` Tauri 组合根，拆分 Builder、全局状态、171 条命令注册和启动错误映射；当前状态为 `VERIFYING`，正式 Windows Automated 通过前 R1-05 保持 `BLOCKED`。',
            '- R1-04 已建立 `src-tauri/src/bootstrap/` Tauri 组合根，拆分 Builder、全局状态、171 条命令注册和启动错误映射；状态为 `DONE`，R1-05 已开放为 `READY`。',
          );
          replaceOnce(
            "README.md",
            '- R1-04 Windows Automated 启动烟测改为按启动前日志路径集合识别新 session，并在首次 45 秒超时时最多重启一次；每次启动保留 stdout/stderr，连续两次超时仍硬失败。打包前后 EXE 的 A/B 运行均正常，产品入口、bundle、命令和业务行为未改变。',
            '- R1-04 Windows Automated 启动烟测改为按启动前日志路径集合识别新 session，并在首次 45 秒超时时最多重启一次；每次启动保留 stdout/stderr，连续两次超时仍硬失败。打包前后 EXE 的 A/B 运行均正常，产品入口、bundle、命令和业务行为未改变。\n- R1-04 workflow run `31037323146`、job `92412650719` 在清理后代码树提交 `5cb66fdedbfcaf89c86a7124f8894bdc71a533c9` 上通过；artifact `8943939773` 大小 `14119217` 字节，SHA-256 为 `7562c9137d52040627a58d9c8e104c4053b9923983a16daae08e4361e9a78f2b`。Automated 报告为 PASS，7 条运行记录、0 条无效记录、0 个运行时错误，release 客户端首次启动即建立日志。',
          );

          const taskPath = "docs/modular-rewrite/R01-architecture-composition/R01-04-tauri-组合根.md";
          replaceOnce(taskPath, '- 任务状态：`VERIFYING`', '- 任务状态：`DONE`');
          replaceSection(
            taskPath,
            "## 10. 待执行验证与当前状态",
            "\n## 11. 回退",
            `## 10. 最终验证与状态

### Windows release 启动观测诊断

- 正式 Automated run \`31029576871\` 已通过前端、Rust 与 Tauri bundle 构建，但单次 release 启动 45 秒内未观测到 runtime log；该失败未计为通过。
- 生命周期探针 run \`31032667039\` 已确认公共入口、Builder、setup、状态安装和日志写入十个节点全部到达，组合根本身无启动回归。
- A/B run \`31034333416\` 在相同 Windows runner 布局中验证打包前与打包后 EXE 均成功启动并建立 runtime log；两者 SHA-256 分别为 \`f9f1afaaeb19ade39642be7d158be1cb17d078d14650871328e469c961bd344d\` 与 \`fd60ab2a04c93df558478554fa4dfe49522c686d19deb35728a4cdadb3882939\`。
- 因此未修改 Tauri 组合根或打包流程；Windows 验收器改为按启动前日志路径集合识别新 session，首次 45 秒超时后最多重启一次，并为每次尝试保留 stdout/stderr。进程提前退出仍立即失败，连续两次超时仍硬失败。

### 清理后正式 Windows Automated

- 启动观测修复提交：\`379e1e1dfc4dfa7faed37c0900bcbbdd521d3f5e\`。
- 清理后同代码树验证提交：\`5cb66fdedbfcaf89c86a7124f8894bdc71a533c9\`。
- workflow run：\`31037323146\`。
- Windows job：\`92412650719\`。
- 结论：\`success\`。
- artifact：\`8943939773\`，名称 \`windows-automated-delivery-evidence-5cb66fdedbfcaf89c86a7124f8894bdc71a533c9\`，大小 \`14119217\` 字节，SHA-256 \`7562c9137d52040627a58d9c8e104c4053b9923983a16daae08e4361e9a78f2b\`，到期时间 2026-08-19T19:26:52Z。
- Automated 报告：\`status=pass\`、应用版本 \`0.23.0\`、7 条记录、0 条无效记录、0 个运行时错误；完成操作为 \`bootstrap\`、\`read_workspace_state\`、\`save_workspace_state\`。
- 前端契约、类型、截图与生产构建通过；Rust fmt、Clippy 与 workspace tests 通过；Tauri Windows release 通过；release 客户端在第 1 次尝试建立 runtime log；覆盖率与错误扫描通过。
- stdout 与 stderr 诊断文件均为空，未触发第 2 次启动尝试。
- 临时实施、探针、比较和 finalizer workflow 均未保留在最终交付树中。

R1-04 状态为 \`DONE\`，R1-05 开放为 \`READY\`。真实 PostgreSQL、Windows Full 交互验收和用户本机 Windows 实机验收继续保留到最终统一验收。
`,
          );

          const stagePath = "docs/modular-rewrite/R01-architecture-composition/README.md";
          replaceOnce(
            stagePath,
            '| R1-04 | Tauri 组合根 | VERIFYING | [`R01-04-tauri-组合根.md`](R01-04-tauri-组合根.md) | 专项契约、保护资产、格式和桌面 crate 编译通过 | Windows Automated 待最终 HEAD 验证 |',
            '| R1-04 | Tauri 组合根 | DONE | [`R01-04-tauri-组合根.md`](R01-04-tauri-组合根.md) | 专项契约、保护资产、格式和桌面 crate 编译通过 | workflow run `31037323146` 通过 |',
          );
          replaceOnce(
            stagePath,
            '| R1-05 | Application 组合根 | BLOCKED | 待创建 | 待执行 | 待执行 |',
            '| R1-05 | Application 组合根 | READY | 待创建 | 待执行 | 待执行 |',
          );
          replaceSection(
            stagePath,
            "## R1-04 当前结果",
            null,
            `## R1-04 完成结果

- \`src-tauri/src/lib.rs\` 已收敛为公共薄入口；Builder、状态构造、命令注册和启动错误映射分别由 \`src-tauri/src/bootstrap/\` 下的具名模块承担。
- \`AppState\` 已切换到 \`bootstrap/state.rs\` 唯一拥有；171 条 Tauri 命令的名称、顺序、参数和返回契约保持不变。
- 已新增 Tauri 组合根专项验证和确定性保护资产验证入口，并接入完整前端验证；19 个既有验证器已迁移到新的注册表或状态所有者。
- 启动探针与打包前后 A/B 已排除组合根和 bundle 回归；Windows Automated 使用日志路径集合识别新 session、最多一次有界重试和 stdout/stderr 诊断，连续两次超时仍硬失败。
- workflow run \`31037323146\`、job \`92412650719\` 在清理后验证提交 \`5cb66fdedbfcaf89c86a7124f8894bdc71a533c9\` 上完整通过；artifact \`8943939773\` 的 SHA-256 为 \`7562c9137d52040627a58d9c8e104c4053b9923983a16daae08e4361e9a78f2b\`。
- Automated 报告为 PASS：7 条运行记录、0 条无效记录、0 个运行时错误，release 客户端首次启动成功。
- 真实 PostgreSQL、Windows Full 和用户本机 Windows 实机验收继续保留到最终统一验收。
- R1-04 状态为 \`DONE\`；R1-05 开放为 \`READY\`。

## 当前唯一可执行任务

\`R1-05 Application 组合根\`
`,
          );
          '@ | Set-Content -Path $scriptPath -Encoding UTF8
          node $scriptPath
          Remove-Item $scriptPath -Force
          git rm .github/workflows/r1-04-finalize.yml
          git rm .github/workflows/r1-04-finalize-safe.yml

      - name: Verify completion records and contracts
        shell: pwsh
        run: |
          npm ci
          node scripts/verify-tauri-bootstrap.mjs
          npm.cmd run verify:architecture
          npm.cmd run verify:frontend
          node scripts/verify-protected-assets-deterministic.mjs
          git diff --check

      - name: Commit clean R1-04 completion
        shell: pwsh
        run: |
          git config core.quotepath false
          $allowed = @(
            '.github/workflows/r1-04-finalize-safe.yml',
            '.github/workflows/r1-04-finalize.yml',
            'README.md',
            'docs/modular-rewrite/R01-architecture-composition/README.md',
            'docs/modular-rewrite/R01-architecture-composition/R01-04-tauri-组合根.md'
          )
          $changed = @(git diff --name-only HEAD)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected files: $($unexpected -join ', ')" }
          foreach ($required in $allowed) {
            if ($required -like '.github/workflows/*') {
              if (Test-Path $required) { throw "Temporary workflow was not removed: $required" }
            } elseif ($required -notin $changed) {
              throw "Required file not changed: $required"
            }
          }
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add -A
          git commit -m "docs(r1): close R1-04 and open R1-05"
          git push origin HEAD:new-B
