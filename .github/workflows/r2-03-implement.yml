name: R2-03 Implement Team Player Coach Formation

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  implement:
    if: "${{ github.event.head_commit.message == 'chore(r2): bootstrap R2-03 implementation' }}"
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Apply R2-03 modular migration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem ".r2-03-payload/part*" | Sort-Object Name
          if ($parts.Count -ne 6) {
            throw "Expected 6 R2-03 payload parts, found $($parts.Count)"
          }
          $base64 = ($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) }) -join ""
          $compressed = [Convert]::FromBase64String($base64)
          $compressedDigest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($compressed)).ToLowerInvariant()
          if ($compressedDigest -ne "baa6ae40b7d0d4d74c7a54d3dd8bc491f9962617a9758dfef31036a88c9e2a1a") {
            throw "R2-03 compressed payload digest mismatch: $compressedDigest"
          }
          $input = [System.IO.MemoryStream]::new($compressed)
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $output = [System.IO.MemoryStream]::new()
          $gzip.CopyTo($output)
          $gzip.Dispose()
          $input.Dispose()
          $bytes = $output.ToArray()
          $output.Dispose()
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($digest -ne "c1241b01d8e917fb12d993432fa029b412041bfa2a3cf3a091fcf58f02207902") {
            throw "R2-03 payload digest mismatch: $digest"
          }
          $scriptPath = "scripts/r2-03-apply.py"
          [System.IO.File]::WriteAllBytes($scriptPath, $bytes)
          Add-Content -Path ".git/info/exclude" -Value "scripts/r2-03-apply.py"
          python -m py_compile $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "scripts/__pycache__" -Recurse -Force -ErrorAction SilentlyContinue
          python $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update moved-domain verifier paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Replace-ExactlyOnce([string]$Path, [string]$Old, [string]$New, [string]$Label) {
            $text = [System.IO.File]::ReadAllText($Path).Replace("`r`n", "`n")
            if (($text.Split($Old).Count - 1) -ne 1) {
              throw "$Label did not match exactly once"
            }
            $text = $text.Replace($Old, $New)
            [System.IO.File]::WriteAllText($Path, $text, [System.Text.UTF8Encoding]::new($false))
          }

          Replace-ExactlyOnce `
            "scripts/verify-force-team-delete.mjs" `
            'const domain = read("crates/domain/src/lib.rs");' `
            'const domain = read("crates/domain/src/team/deletion.rs");' `
            "force team delete verifier domain source"

          $entityOld = 'const domain = text("crates/domain/src/lib.rs");'
          $entityNew = @'
          const domain = [
            "crates/domain/src/coach/catalog.rs",
            "crates/domain/src/coach/name.rs",
            "crates/domain/src/coach/membership.rs",
            "crates/domain/src/team/membership.rs",
            "crates/domain/src/shared/entity_reference.rs",
            "crates/domain/src/shared/entity_match.rs",
            "crates/domain/src/shared/bulk_archive.rs",
          ].map(text).join("\n");
          '@.Trim()
          Replace-ExactlyOnce `
            "scripts/verify-entity-relationships.mjs" `
            $entityOld `
            $entityNew `
            "entity relationships verifier domain sources"

          Replace-ExactlyOnce `
            "scripts/verify-formation-usage.mjs" `
            'const domain = read("crates/domain/src/lib.rs");' `
            'const domain = read("crates/domain/src/formation/usage.rs") + read("crates/domain/src/formation/resolution.rs");' `
            "formation usage verifier domain sources"

          Replace-ExactlyOnce `
            "scripts/verify-entity-resource-center.mjs" `
            'const domain = read("crates/domain/src/lib.rs");' `
            'const domain = read("crates/domain/src/team/detail.rs") + read("crates/domain/src/player/listing.rs");' `
            "entity resource center verifier domain sources"

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Format migrated Rust modules
        shell: pwsh
        run: cargo fmt --all

      - name: Regenerate Domain inventory
        shell: pwsh
        run: node scripts/generate-domain-type-inventory.mjs

      - name: Verify R2-03 module and Serde contracts
        shell: pwsh
        run: cargo test --locked -p football-domain --test serde_contracts

      - name: Verify architecture and migration progress
        shell: pwsh
        run: npm run verify:architecture

      - name: Verify protected model assets
        shell: pwsh
        run: node scripts/verify-protected-assets-deterministic.mjs

      - name: Verify full frontend gate
        shell: pwsh
        run: npm run verify:frontend

      - name: Verify full Rust gate
        shell: pwsh
        run: npm run verify:rust

      - name: Commit verified R2-03 implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item "scripts/r2-03-apply.py" -Force
          git rm .github/workflows/r2-03-implement.yml
          git rm -r .r2-03-payload
          git add -A
          git diff --cached --check

          $base = "897a8bc0a43121908826eca41e0c1db3c2763889"
          $expected = @(
            'README.md',
            'architecture/domain-migration-progress.json',
            'architecture/domain-type-inventory.json',
            'crates/domain/src/coach/catalog.rs',
            'crates/domain/src/coach/detail.rs',
            'crates/domain/src/coach/listing.rs',
            'crates/domain/src/coach/membership.rs',
            'crates/domain/src/coach/mod.rs',
            'crates/domain/src/coach/name.rs',
            'crates/domain/src/formation/catalog.rs',
            'crates/domain/src/formation/mod.rs',
            'crates/domain/src/formation/resolution.rs',
            'crates/domain/src/formation/usage.rs',
            'crates/domain/src/lib.rs',
            'crates/domain/src/player/ability.rs',
            'crates/domain/src/player/availability.rs',
            'crates/domain/src/player/catalog.rs',
            'crates/domain/src/player/detail.rs',
            'crates/domain/src/player/listing.rs',
            'crates/domain/src/player/membership.rs',
            'crates/domain/src/player/mod.rs',
            'crates/domain/src/player/name.rs',
            'crates/domain/src/player/position.rs',
            'crates/domain/src/player/status.rs',
            'crates/domain/src/shared/ability.rs',
            'crates/domain/src/shared/bulk_archive.rs',
            'crates/domain/src/shared/bulk_delete.rs',
            'crates/domain/src/shared/data_provider.rs',
            'crates/domain/src/shared/entity_match.rs',
            'crates/domain/src/shared/entity_reference.rs',
            'crates/domain/src/shared/mod.rs',
            'crates/domain/src/shared/position.rs',
            'crates/domain/src/team/catalog.rs',
            'crates/domain/src/team/deletion.rs',
            'crates/domain/src/team/detail.rs',
            'crates/domain/src/team/listing.rs',
            'crates/domain/src/team/membership.rs',
            'crates/domain/src/team/mod.rs',
            'crates/domain/src/team/name.rs',
            'crates/domain/src/team/profile.rs',
            'crates/domain/tests/serde_contracts/module_paths.rs',
            'docs/modular-rewrite/R02-domain-rewrite/R02-02-competition-and-routing.md',
            'docs/modular-rewrite/R02-domain-rewrite/R02-03-team-player-coach-and-formation.md',
            'docs/modular-rewrite/R02-domain-rewrite/README.md',
            'scripts/domain-inventory/target-module-policy.mjs',
            'scripts/verify-entity-relationships.mjs',
            'scripts/verify-entity-resource-center.mjs',
            'scripts/verify-force-team-delete.mjs',
            'scripts/verify-formation-usage.mjs',
            'scripts/verify-player-role-inheritance.mjs',
            'scripts/verify-team-player-management.mjs'
          ) | Sort-Object
          $actual = @(git diff --name-only $base | Sort-Object)
          $difference = Compare-Object $expected $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Host
            throw "Unexpected R2-03 final change set"
          }

          git commit -m "rewrite(r2): implement R2-03 team player coach formation domains"
          git push origin HEAD:new-B
