name: R1-02 Chromium port retry patch

on:
  push:
    branches:
      - new-B
    paths:
      - .github/workflows/r1-02-screenshot-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-B
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded Chromium port retry
        shell: pwsh
        run: python scripts/r1-02-fix-screenshot-port.py
