name: R5-05 Closeout

on:
  push:
    branches:
      - rewrite/r5-competition-routing-persistence
    paths:
      - ".github/r5-05-closeout.py"
      - ".github/workflows/r5-05-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update R5-05 closeout records
        run: python .github/r5-05-closeout.py
      - name: Remove transient helpers and commit closeout
        shell: bash
        run: |
          rm .github/r5-05-closeout.py
          rm .github/workflows/r5-05-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(r5-05): close route resolution node"
          git push origin HEAD:rewrite/r5-competition-routing-persistence
