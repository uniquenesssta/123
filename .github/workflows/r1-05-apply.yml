name: R1-05 deterministic implementation

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

concurrency:
  group: r1-05-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-r1-05:
    if: >-
      github.repository == 'uniquenesssta/123' &&
      github.ref == 'refs/heads/new-B' &&
      github.event.head_commit.message == 'chore(r1): stage deterministic R1-05 implementation'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ../.cargo-target

      - name: Install locked frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Apply deterministic R1-05 implementation
        shell: pwsh
        run: node .github/scripts/r1-05-apply.mjs

      - name: Format Rust sources
        shell: pwsh
        run: cargo fmt --all

      - name: Verify application composition
        shell: pwsh
        run: npm run verify:application-composition

      - name: Verify architecture contracts
        shell: pwsh
        run: npm run verify:architecture

      - name: Verify full frontend gate
        shell: pwsh
        run: npm run verify:frontend

      - name: Verify full Rust gate
        shell: pwsh
        run: npm run verify:rust

      - name: Remove temporary execution files
        shell: pwsh
        run: |
          git rm .github/scripts/r1-05-apply.mjs
          git rm .github/workflows/r1-05-apply.yml

      - name: Verify exact change boundary
        shell: pwsh
        run: |
          git config core.quotepath false
          $allowed = @(
            '.github/scripts/r1-05-apply.mjs',
            '.github/workflows/r1-05-apply.yml',
            'README.md',
            'architecture/module-boundaries.json',
            'architecture/state-ownership.json',
            'crates/application/src/analytics.rs',
            'crates/application/src/composition/application_composition.rs',
            'crates/application/src/composition/mod.rs',
            'crates/application/src/composition/port_registry.rs',
            'crates/application/src/database.rs',
             'crates/application/src/fact_pipeline.rs',
            'crates/application/src/lib.rs',
            'crates/application/src/model_registry/mod.rs',
            'crates/application/src/model_registry/model_registry.rs',
            'crates/application/src/openai_research.rs',
            'crates/application/src/p4_orchestration.rs',
            'crates/application/src/p4_persistence.rs',
            'crates/application/src/p4_workbench.rs',
            'crates/application/src/prediction.rs',
            'crates/application/src/service/application_service.rs',
            'crates/application/src/service/mod.rs',
            'docs/modular-rewrite/R01-architecture-composition/R01-05-application-组合根.md',
            'docs/modular-rewrite/R01-architecture-composition/README.md',
            'package.json',
            'scripts/architecture/verifyProtectedImports.mjs',
            'scripts/verify-application-composition.mjs',
            'scripts/verify-frontend.mjs'
          )
          $changed = @(git status --porcelain | ForEach-Object {
            if ($_.Length -lt 4) { throw "Invalid git status line: $_" }
            $_.Substring(3).Trim('"')
          })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected files: $($unexpected -join ', ')"
          }
          foreach ($required in $allowed) {
            if ($required -like '.github/*') {
              if (Test-Path $required) {
                throw "Temporary file was not removed: $required"
              }
            } elseif ($required -notin $changed) {
              throw "Required file not changed: $required"
            }
          }

      - name: Commit verified implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rewrite(r1): implement R1-05 application composition root"
          git push origin HEAD:new-B
