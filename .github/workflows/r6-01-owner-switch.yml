name: R6-01 Team Directory Detail Owner Switch

on:
  push:
    branches:
      - agent/r6-01-team-directory-detail
    paths:
      - .github/workflows/r6-01-owner-switch.yml
      - scripts/r6_01_owner_switch.py

permissions:
  contents: write

jobs:
  switch-owner:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_r6_01_switch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_r6_01_switch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_r6_01_switch_test
    steps:
      - name: Checkout R6-01 implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/r6-01-team-directory-detail
          fetch-depth: 0
      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Apply responsibility owner switch
        run: python scripts/r6_01_owner_switch.py
      - name: Repair generated module visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          directory = Path("crates/persistence-postgres/src/adapters/catalog/teams/directory")
          detail = Path("crates/persistence-postgres/src/adapters/catalog/teams/detail")

          mod_path = directory / "mod.rs"
          mod_text = mod_path.read_text(encoding="utf-8")
          mod_text = "\n".join(
              line for line in mod_text.splitlines()
              if not line.startswith("pub(super) use ")
          ) + "\n"
          mod_path.write_text(mod_text, encoding="utf-8")

          replacements = {
              directory / "create_team.rs": (
                  "use super::normalize_team_name;",
                  "use super::name_policy::normalize_team_name;",
              ),
              directory / "update_team.rs": (
                  "use super::normalize_team_name;",
                  "use super::name_policy::normalize_team_name;",
              ),
              directory / "list_team_options.rs": (
                  "use super::{map_team_option_row, TeamOptionRow};",
                  "use super::{option_mapper::map_team_option_row, option_row::TeamOptionRow};",
              ),
              directory / "list_teams.rs": (
                  "use super::{map_team_list_row, TeamListRow};",
                  "use super::{list_mapper::map_team_list_row, list_row::TeamListRow};",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing visibility repair marker in {path}: {old}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          mapper = detail / "record_mapper.rs"
          mapper_text = mapper.read_text(encoding="utf-8")
          mapper_text = mapper_text.replace(
              "pub(super) fn map_team_record",
              "pub(in crate::adapters::catalog::teams) fn map_team_record",
              1,
          )
          mapper.write_text(mapper_text, encoding="utf-8")

          row = detail / "record_row.rs"
          row_text = row.read_text(encoding="utf-8")
          row_text = row_text.replace(
              "pub(super)",
              "pub(in crate::adapters::catalog::teams)",
          )
          row.write_text(row_text, encoding="utf-8")
          PY
      - name: Format owner switch
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Check persistence and application
        run: cargo check --locked -p football-persistence-postgres -p football-application
      - name: Run persistence unit tests
        run: cargo test --locked -p football-persistence-postgres --lib
      - name: Run frozen R6-01 PostgreSQL contract on new owner
        run: cargo test --locked -p football-persistence-postgres --test team_directory_detail_repository_contract -- --ignored --nocapture
      - name: Commit verified owner switch
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(r6-01): migrate team directory detail owner"
          git push origin HEAD:agent/r6-01-team-directory-detail
