name: Temporary R3-03 Protected Assets Fix

on:
  push:
    branches:
      - new-C

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make protected-assets verifier intrinsically deterministic
        shell: pwsh
        run: |
          $path = 'scripts/verify_protected_assets.mjs'
          $text = [System.IO.File]::ReadAllText($path)
          $old = '.sort((left, right) => left.path.localeCompare(right.path))'
          $new = @'
          .sort((left, right) => {
              if (left.path < right.path) return -1;
              if (left.path > right.path) return 1;
              return 0;
            })
          '@.Trim()
          if (-not $text.Contains($old)) { throw "expected localeCompare aggregate sort not found" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
      - name: Refresh protected verifier fingerprint and aggregate
        shell: pwsh
        run: |
          @'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const manifestPath = "architecture/protected-assets.json";
          const verifierPath = "scripts/verify_protected_assets.mjs";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const canonical = Buffer.from(fs.readFileSync(verifierPath, "utf8").replace(/\r\n?/g, "\n"), "utf8");
          const header = Buffer.from(`blob ${canonical.length}\0`, "utf8");
          const blobSha = crypto.createHash("sha1").update(header).update(canonical).digest("hex");
          const fingerprint = crypto.createHash("sha256").update(Buffer.from(`git-blob-sha1:${blobSha}`, "utf8")).digest("hex");
          const entry = manifest.protected_files.find((item) => item.path === verifierPath);
          if (!entry) throw new Error("protected verifier entry missing");
          entry.git_blob_sha1 = blobSha;
          entry.fingerprint_sha256 = fingerprint;
          const input = [...manifest.protected_files]
            .sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0)
            .map((item) => `${item.path}\0${item.fingerprint_sha256}\n`)
            .join("");
          manifest.aggregate_sha256 = crypto.createHash("sha256").update(Buffer.from(input, "utf8")).digest("hex");
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n", "utf8");
          console.log(`aggregate=${manifest.aggregate_sha256}`);
          '@ | Set-Content -Encoding utf8 .tmp-refresh-protected.mjs
          node .tmp-refresh-protected.mjs
          Remove-Item .tmp-refresh-protected.mjs
      - name: Verify both protected-assets entry points
        shell: pwsh
        run: |
          node scripts/verify_protected_assets.mjs
          node scripts/verify-protected-assets-deterministic.mjs
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add scripts/verify_protected_assets.mjs architecture/protected-assets.json
          git commit -m "fix(verify): make protected asset aggregation deterministic"
          git rm .github/workflows/temp-r3-03-protected-assets-fix.yml
          git commit -m "chore(r3): remove temporary protected asset workflow"
          git push origin HEAD:new-C
