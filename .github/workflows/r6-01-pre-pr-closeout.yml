name: R6-01 Pre-PR Closeout

on:
  push:
    branches:
      - agent/r6-01-team-directory-detail
    paths:
      - .github/workflows/r6-01-pre-pr-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R6-01 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r6-01-team-directory-detail
          fetch-depth: 0
      - name: Record hard gate and clean transient workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          node = Path("docs/modular-rewrite/R06-entity-catalog-persistence/R06-01-team-directory-and-detail.md")
          text = node.read_text(encoding="utf-8")
          old_status = "生产 owner 已完成切换，专项 PostgreSQL 契约、R6-01 ownership gate、Domain inventory、模型保护、完整 architecture、rustfmt、Persistence/Application check 与 Persistence unit tests 已通过。当前仍需完成阶段级 frontend/workspace Rust hard gate、clean PR、merge 与 merged-stage canonical gate；在这些门禁完成前不得标记为 `DONE`。"
          new_status = "生产 owner 已完成切换，专项 PostgreSQL 契约、R6-01 ownership/inventory/architecture gate 与阶段级 frontend/workspace Rust hard gate 均已实际通过。当前仅剩 clean PR、merge 与 merged-stage canonical gate；在这些门禁完成前状态保持 `VERIFYING`。"
          if old_status not in text:
              raise SystemExit("R6-01 node status marker missing")
          text = text.replace(old_status, new_status, 1)

          hard_gate_section = r'''## 阶段级 hard gate

为避免把旧 verifier 的文件位置假设误当成产品回归，阶段级 gate 始终 fail-fast，并只在确认真实 owner 已迁移且原契约语义仍需保持时推进 verifier call-path；没有删除检查、扩大白名单或降低门禁。

前五轮均保留失败事实：

- run `31889047691`：Windows frontend 在旧 `verify-global-name-search.mjs` 仍只统计 legacy Team owner 时停止；修复为同时读取 R6-01 `directory/list_teams.rs` 与 `list_team_options.rs`，仍要求不少于 7 个统一 `NameSearch` 接入点并拒绝 prefix-only 搜索。
- run `31889120709`：global name search 已通过，随后旧 `verify-team-player-management.mjs` 仍从 `team_catalog.rs` 查找已迁移的 detail profile/squad read；只推进这两项读取断言到新 detail owner。该 run 的 Ubuntu architecture/PG job 已成功。
- run `31889255910`：旧 `verify-entity-relationships.mjs` 仍从 `team_catalog.rs` 检查 Team player/coach history detail load；只将历史读取断言推进到 `detail/read_team.rs`，保留 legacy profile projection/delete 断言在原 owner。
- run `31889343316`：旧 `verify-database-reset.mjs` 仍查找已删除的动态 `team_record_from_row`；改为检查 typed `detail/record_mapper.rs::map_team_record`，仍拒绝把 `localized_name` 污染进基础 TeamRecord。
- run `31889463684`：完整 architecture、protected assets、database baseline 均已通过；Windows frontend 最后停在旧 `verify-entity-resource-center.mjs` 仍从 `team_catalog.rs` 查找 squad localized-name SQL/mapper。只把该断言推进到 `detail/read_squad.rs` / `squad_mapper.rs`，并把 TeamRecord no-localized-name 断言推进到 typed mapper。

最终 hard gate run `31889555412` 全部 `SUCCESS`：

- Windows job `95023694944`：`npm run verify:frontend`、`cargo fmt --all -- --check`、`cargo clippy --locked --workspace --all-targets -- -D warnings`、`cargo test --locked --workspace` 全部 `SUCCESS`。
- Ubuntu PostgreSQL/architecture job `95023694946`：R6-01 ownership、完整 `npm run verify:architecture`、模型保护、database baseline freeze 与同一 PostgreSQL 16 contract 全部 `SUCCESS`。
- 该 gate 的验证源码 HEAD：`051afcd9b08cdb57b862251ae4a66c9a6c5bd203`。

因此 R6-01 的最小验证、阶段 frontend、workspace Clippy、workspace tests、architecture、模型保护、数据库静态 baseline 与真实 PostgreSQL 16 专项契约均已有成功证据。

'''
          marker = "## 当前净变更清单（阶段级 hard gate 前）"
          if marker not in text:
              raise SystemExit("R6-01 net-change marker missing")
          text = text.replace(marker, hard_gate_section + "## 当前净变更清单（clean PR 前）", 1)

          old_modified = "- `scripts/verify-persistence-audit.mjs`\n- `README.md`（本节点同步）"
          new_modified = "- `scripts/verify-persistence-audit.mjs`\n- `scripts/verify-global-name-search.mjs`\n- `scripts/verify-team-player-management.mjs`\n- `scripts/verify-entity-relationships.mjs`\n- `scripts/verify-database-reset.mjs`\n- `scripts/verify-entity-resource-center.mjs`\n- `README.md`（本节点同步）"
          if old_modified not in text:
              raise SystemExit("R6-01 modified-list marker missing")
          text = text.replace(old_modified, new_modified, 1)

          old_remaining = r'''## 未执行项与剩余门禁

当前尚未宣称以下项目通过：

- `npm run verify:frontend` 的阶段级回归。
- `cargo clippy --locked --workspace --all-targets -- -D warnings`。
- `cargo test --locked --workspace`。
- clean PR canonical Public Platform CI。
- squash merge 与 merged-stage canonical Public Platform CI。
- 用户现有 PostgreSQL 数据库写入/真实数据 sample 验收。
- Windows Full 人工交互验收。

上述 hard gate 完成并补充到本记录、根 README 与阶段 README 后，R6-01 才能从 `VERIFYING` 进入 `DONE`。'''
          new_remaining = r'''## 未执行项与剩余门禁

阶段级 hard gate 已全部实际通过。当前尚未宣称以下项目通过：

- clean PR canonical Public Platform CI。
- squash merge 与 merged-stage canonical Public Platform CI。
- 用户现有 PostgreSQL 数据库写入/真实数据 sample 验收。
- Windows Full 人工交互验收。

用户现有数据库与 Windows Full 不属于云端 Automated 的替代项，继续作为明确未执行事实保留；PR/merge 两项完成前，R6-01 只能保持 `VERIFYING`。'''
          if old_remaining not in text:
              raise SystemExit("R6-01 remaining-gates marker missing")
          text = text.replace(old_remaining, new_remaining, 1)
          text = text.replace(
              "- 当前 ownership/inventory verified HEAD：`b2999e5dce982bddf2093f0596eec33a7dbd0333`。",
              "- ownership/inventory verified HEAD：`b2999e5dce982bddf2093f0596eec33a7dbd0333`。\n- stage hard-gate verified HEAD：`051afcd9b08cdb57b862251ae4a66c9a6c5bd203`。",
              1,
          )
          node.write_text(text, encoding="utf-8", newline="\n")

          stage = Path("docs/modular-rewrite/R06-entity-catalog-persistence/README.md")
          stage_text = stage.read_text(encoding="utf-8")
          stage_marker = "- 临时 baseline/owner-switch/inventory workflow 与 helper 已从当前 branch tree 清理。"
          stage_append = "- 临时 baseline/owner-switch/inventory workflow 与 helper 已从当前 branch tree 清理。\n- 阶段级 hard gate 最终 run `31889555412`：Windows job `95023694944` 与 PostgreSQL/architecture job `95023694946` 均 `SUCCESS`；frontend、rustfmt、workspace Clippy `-D warnings`、workspace tests、完整 architecture、模型保护、database baseline freeze 与同一 PG16 contract 已全部实际通过。\n- hard gate 前五轮均因旧 verifier 仍绑定已迁移的 Team owner 路径而 fail-fast；仅推进 verifier call-path 到新 owner，原搜索、审计、详情、历史、reset 与 localized-name 契约均保持。当前只剩 clean PR/merge/merged-stage canonical 门禁。"
          if stage_marker not in stage_text:
              raise SystemExit("R6 stage hard-gate insertion marker missing")
          stage_text = stage_text.replace(stage_marker, stage_append, 1)
          stage_text = stage_text.replace(
              "- R6-01 仍需阶段级 frontend/workspace Clippy/workspace tests、clean PR canonical、merge 与 merged-stage canonical；因此当前只能保持 `VERIFYING`。",
              "- R6-01 阶段级 frontend/workspace Rust hard gate 已通过；当前仅剩 clean PR canonical、merge 与 merged-stage canonical，因此仍保持 `VERIFYING`。",
              1,
          )
          stage.write_text(stage_text, encoding="utf-8", newline="\n")

          root = Path("README.md")
          root_text = root.read_text(encoding="utf-8")
          root_marker = "- 当前节点状态为 `VERIFYING`；阶段级 frontend/workspace Clippy/workspace tests、clean PR、merge 与 merged-stage canonical gate 尚未完成。详细记录见 `docs/modular-rewrite/R06-entity-catalog-persistence/R06-01-team-directory-and-detail.md`。"
          root_replacement = "- 阶段级 hard gate run `31889555412` 已通过：Windows job `95023694944` 的 frontend、rustfmt、workspace Clippy `-D warnings`、workspace tests 与 Ubuntu job `95023694946` 的完整 architecture、模型保护、database baseline freeze、PostgreSQL 16 contract 均 `SUCCESS`。\n- 当前节点状态仍为 `VERIFYING`；只剩 clean PR、merge 与 merged-stage canonical gate。详细记录见 `docs/modular-rewrite/R06-entity-catalog-persistence/R06-01-team-directory-and-detail.md`。"
          if root_marker not in root_text:
              raise SystemExit("root README R6-01 status marker missing")
          root_text = root_text.replace(root_marker, root_replacement, 1)
          root.write_text(root_text, encoding="utf-8", newline="\n")

          Path(".github/workflows/r6-01-hard-gate.yml").unlink(missing_ok=True)
          Path(".github/workflows/r6-01-pre-pr-closeout.yml").unlink(missing_ok=True)
          PY
      - name: Commit clean pre-PR tree
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(r6-01): record stage hard gate"
          git push origin HEAD:agent/r6-01-team-directory-detail
