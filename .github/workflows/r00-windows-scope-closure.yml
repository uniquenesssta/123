      - name: Commit R00 closure and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            docs/modular-rewrite/R00-baseline/README.md \
            docs/modular-rewrite/R00-baseline/R00-stage-completion.md \
            docs/modular-rewrite/R01-architecture-composition/README.md
          git rm .github/workflows/r00-windows-scope-closure.yml
          git commit -m 'docs(r00): close Windows-only baseline stage'
          git push origin HEAD:new-A
          git rev-parse HEAD >> r00-closure-evidence/summary.txt

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
