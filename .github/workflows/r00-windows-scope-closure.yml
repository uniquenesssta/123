name: R00 Windows Scope Closure Temporary

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  close-r00:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout new-A
        uses: actions/checkout@v4
        with:
          ref: new-A
          fetch-depth: 2

      - name: Apply R00 scope closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r00-closure-evidence
          python .github/r00-windows-scope-closure.py
          git diff --check
          git diff --name-only | sort > r00-closure-evidence/changed-files.txt
          cat > r00-closure-evidence/expected-files.txt <<'EOF'
          README.md
          docs/modular-rewrite/R00-baseline/R00-stage-completion.md
          docs/modular-rewrite/R00-baseline/README.md
          docs/modular-rewrite/R01-architecture-composition/README.md
          EOF
          diff -u r00-closure-evidence/expected-files.txt r00-closure-evidence/changed-files.txt
          git diff --stat > r00-closure-evidence/diff-stat.txt
          printf 'scope=windows-only\nstatus=DONE\nnext=R1-01\n' > r00-closure-evidence/summary.txt

      - name: Commit R00 closure and remove temporary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            docs/modular-rewrite/R00-baseline/README.md \
            docs/modular-rewrite/R00-baseline/R00-stage-completion.md \
            docs/modular-rewrite/R01-architecture-composition/README.md
          git rm \
            .github/r00-windows-scope-closure.py \
            .github/workflows/r00-windows-scope-closure.yml
          git commit -m 'docs(r00): close Windows-only baseline stage'
          git push origin HEAD:new-A
          printf 'final_commit=%s\n' "$(git rev-parse HEAD)" >> r00-closure-evidence/summary.txt

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r00-windows-scope-closure
          path: r00-closure-evidence/**
          if-no-files-found: error
          retention-days: 30
