name: R5-06 Domain Inventory Refresh

on:
  push:
    branches:
      - rewrite/r5-06-model-run-identity-reads
    paths:
      - .github/workflows/r5-06-inventory-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-domain-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate official Domain inventory
        run: node scripts/generate-domain-type-inventory.mjs

      - name: Verify generated Domain inventory
        run: node scripts/verify-domain-type-inventory.mjs

      - name: Commit generated inventory
        shell: bash
        run: |
          if git diff --quiet -- architecture/domain-type-inventory.json; then
            echo "Domain inventory already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/domain-type-inventory.json
          git commit -m "chore(r5-06): refresh domain inventory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
