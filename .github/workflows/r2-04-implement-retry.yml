name: R2-04 Lineup and Match Implementation Retry

on:
  push:
    branches:
      - new-B

permissions:
  contents: write

jobs:
  implement:
    if: "${{ github.event.head_commit.message == 'chore(r2): retry R2-04 implementation' }}"
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Apply corrected R2-04 migration
        shell: pwsh
        env:
          BASE_SHA: 3256454e9d76b7b442a83f25964363256257cbcc
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/r2-04-implement.yml").read_text(encoding="utf-8").replace("\r\n", "\n")
          start_marker = "          @'\n"
          end_marker = "          '@ | Set-Content -Path r2_04_apply.py -Encoding utf8"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise RuntimeError("Unable to extract original R2-04 migration script")
          embedded = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(embedded)

          old = 'lib = lib.split(marker, 1)[0].rstrip() + "\\n"'
          new = '''lib = lib.split(marker, 1)[0].rstrip() + "\\n\\n" + """fn default_true() -> bool {
              true
          }

          fn default_team_page_limit() -> u32 {
              50
          }

          fn default_confidence() -> f64 {
              1.0
          }
          """'''
          if script.count(old) != 1:
              raise RuntimeError("R2-04 helper preservation patch did not match exactly once")
          script = script.replace(old, new, 1)
          Path("r2_04_apply.py").write_text(script, encoding="utf-8", newline="\n")
          '@ | Set-Content -Path extract_r2_04.py -Encoding utf8
          python extract_r2_04.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item extract_r2_04.py -Force
          python r2_04_apply.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item r2_04_apply.py -Force
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify targeted Serde and module path contracts
        run: cargo test --locked -p football-domain --test serde_contracts

      - name: Regenerate and verify Domain inventory
        shell: pwsh
        run: |
          node scripts/generate-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-domain-type-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify architecture and protected assets
        shell: pwsh
        run: |
          npm run verify:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-protected-assets-deterministic.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify frontend
        run: npm run verify:frontend

      - name: Verify Rust workspace
        run: npm run verify:rust

      - name: Commit R2-04 implementation
        shell: pwsh
        env:
          BASE_SHA: 3256454e9d76b7b442a83f25964363256257cbcc
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $remoteHead = (git ls-remote origin refs/heads/new-B).Split("`t")[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteHead -ne $env:GITHUB_SHA) { throw "new-B changed during R2-04 implementation" }

          git rm .github/workflows/r2-04-implement.yml .github/workflows/r2-04-implement-retry.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $expected = @(
            "README.md",
            "architecture/domain-migration-progress.json",
            "architecture/domain-type-inventory.json",
            "crates/domain/src/lib.rs",
            "crates/domain/src/lineup/chain.rs",
            "crates/domain/src/lineup/kind.rs",
            "crates/domain/src/lineup/mod.rs",
            "crates/domain/src/lineup/player.rs",
            "crates/domain/src/lineup/preset.rs",
            "crates/domain/src/lineup/snapshot.rs",
            "crates/domain/src/lineup_chain.rs",
            "crates/domain/src/match_record/catalog.rs",
            "crates/domain/src/match_record/mod.rs",
            "crates/domain/src/match_record/status.rs",
            "crates/domain/tests/serde_contracts/module_paths.rs",
            "docs/README.md",
            "docs/modular-rewrite/R02-domain-rewrite/R02-04-lineup-and-match.md",
            "docs/modular-rewrite/R02-domain-rewrite/README.md",
            "scripts/domain-inventory/target-module-policy.mjs"
          ) | Sort-Object
          $actual = @(git diff --name-only $env:BASE_SHA | Sort-Object)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $difference = Compare-Object $expected $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Host
            throw "Unexpected R2-04 change set"
          }

          git commit -m "rewrite(r2): implement R2-04 lineup and match domains"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new-B
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
