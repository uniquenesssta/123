name: R5-05 Clippy Fix Gate

on:
  push:
    branches:
      - agent/r5-05-route-resolution
    paths:
      - ".github/workflows/r5-05-clippy-fix-gate.yml"

permissions:
  contents: read

jobs:
  verify-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_r505
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_r505"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://football:football@127.0.0.1:5432/football_r505
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: R5 ownership
        run: node scripts/verify-competition-repository.mjs
      - name: Full architecture
        run: npm run verify:architecture
      - name: Canonical rustfmt
        run: cargo fmt --all -- --check
      - name: Workspace clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: PostgreSQL route resolution contract
        run: >-
          cargo test --locked -p football-persistence-postgres
          --test route_resolution_repository_contract
          route_resolution_repository_contract_is_preserved
          -- --ignored --exact --nocapture
