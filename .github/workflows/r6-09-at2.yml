name: R6-09 AT2 safe permanent delete

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-09-at2
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    outputs:
      production_sha: ${{ steps.publish.outputs.production_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Verify AT2 protected input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/persistence-postgres/src/team_catalog.rs)" = "38f48d74709c8a9673bf2ed0ba7649603f223981"
          test "$(git hash-object crates/persistence-postgres/src/player_catalog.rs)" = "ceb8b6ae74769f8d28ca593ea3298efa0ad730c5"
          test "$(git hash-object crates/persistence-postgres/src/team_force_delete.rs)" = "ec0fd77103c90b94a7eeef7e769c5b17b88f6915"
          test "$(git hash-object crates/persistence-postgres/src/lib.rs)" = "ba502deab94d4cc70f429a7f28ac5b5bf4a13c40"
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/preflight/check.rs
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/archive/bulk.rs
          test ! -e crates/persistence-postgres/src/adapters/catalog/deletion/force_delete
          test -f scripts/r6-09-at2-apply.py

      - name: Apply AT2 owner switch and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r6-09-at2-apply.py
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
          node scripts/verify-domain-type-inventory.mjs
          git diff --check

      - name: AT2 minimum gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-entity-deletion-persistence.mjs
          node scripts/verify-entity-deletion.mjs
          node scripts/verify-team-player-management.mjs
          node scripts/verify-team-directory-detail.mjs
          node scripts/verify-team-names-profiles.mjs
          node scripts/verify-player-directory-detail.mjs
          node scripts/verify-force-team-delete.mjs
          npm run verify:architecture
          node scripts/verify-public-model-boundary.mjs
          node scripts/verify-protected-assets-deterministic.mjs
          cargo fmt --all -- --check
          cargo check --locked -p football-persistence-postgres
          cargo test --locked -p football-persistence-postgres --lib
          cargo test --locked -p football-persistence-postgres --test entity_permanent_delete_repository_contract --no-run
          cargo check --locked -p football-application
          git diff --check

      - name: AT1 and AT2 PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test entity_deletion_repository_contract -- --ignored --test-threads=1
          cargo test --locked -p football-persistence-postgres --test entity_permanent_delete_repository_contract -- --ignored --test-threads=1

      - name: Record AT2 verifying state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: documentation anchor mismatch')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          detail = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md')
          text = detail.read_text(encoding='utf-8')
          if '## Atomic Task 2 — Safe Permanent Delete' not in text:
              text += '''\n## Atomic Task 2 — Safe Permanent Delete\n\n**状态：VERIFYING**\n\n- `bulk_delete_teams`、`bulk_delete_players` 与 `delete_player` 已迁入 `adapters/catalog/deletion/{bulk_delete,safe_delete,delete_write}.rs`；bulk/safe-delete 协调器 SQL-free，事务、行锁、最终竞态复检、external-ID 清理与审计写入由 `delete_write.rs` 唯一持有。\n- 旧 `team_catalog.rs` 已删除；`player_catalog.rs` 不再持有 `delete_player`。Team Force Delete 继续保留 `team_force_delete.rs`，未提前进入 AT3。\n- 公共 Port/DTO/Schema/迁移、无引用永久删除条件、错误语义、历史引用保护与用户可观察行为保持不变；无新增生产依赖。\n- AT2 Minimum Gate 与 AT1/AT2 PostgreSQL 16 focused contracts 已通过；完整 Windows Stage Regression 与 retained PostgreSQL contracts 尚待本 workflow 后续 jobs，在成功前 AT2 不关闭。\n'''
          detail.write_text(text, encoding='utf-8', newline='\n')

          replace_once(
              'docs/modular-rewrite/R06-entity-catalog-persistence/README.md',
              '- Atomic Task 1：Preflight / Reference Counts / Archive 已 `DONE`。PostgreSQL 16 contract run `32219150263` / job `95967398924` 与最终 Windows Stage Regression run `32220581584` / job `95970175840` 均为 `SUCCESS`；两处 retained verifier 仅跟随新的 `deletion/preflight/references.rs` owner，原断言保持。临时 retry workflow/markers 已清理。R6-09 节点整体继续 `IN_PROGRESS`；普通永久 Delete 与 Team Force Delete 尚未迁移，R6-10 继续 `BLOCKED`。',
              '- Atomic Task 1：Preflight / Reference Counts / Archive 已 `DONE` 并保留既有 PostgreSQL 16 / Windows 验收证据。Atomic Task 2：Safe Permanent Delete 已完成 owner switch、Minimum Gate 与 AT1/AT2 PostgreSQL 16 focused contracts，当前等待完整 Windows Stage Regression 与 retained PostgreSQL contracts；Team Force Delete 尚未迁移，R6-09 继续 `IN_PROGRESS`，R6-10 继续 `BLOCKED`。',
          )
          replace_once(
              'README.md',
              '- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、错误语义、历史 P4/运行引用保护、无引用永久删除和 force purge 行为均未改变；无新增生产依赖。AT1 已正式 `DONE`：PostgreSQL 16 contract run `32219150263` / job `95967398924` 为 `SUCCESS`；最终 Windows Stage Regression run `32220581584` / job `95970175840` 为 `SUCCESS`，实际通过完整 frontend、rustfmt、workspace Clippy `-D warnings`、workspace tests 与 diff hygiene。两处历史 verifier 仅把已迁移的 reference-count 检查跟随到 `deletion/preflight/references.rs`，原断言未删除或放宽；临时 retry workflow/markers 已由 cleanup commit `0fa05a3b67eb21009b5a56e00cb5b365fd0e66b5` 清理。R6-09 整体继续 `IN_PROGRESS`，普通永久 Delete 与 Team Force Delete 留待后续 Atomic Task。',
              '- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、错误语义、历史 P4/运行引用保护、无引用永久删除和 force purge 行为均未改变；无新增生产依赖。AT1 已正式 `DONE` 并保留 PostgreSQL 16 / Windows 成功证据。AT2 已将普通安全永久删除迁入 deletion adapter，Minimum Gate 与 AT1/AT2 PostgreSQL 16 focused contracts 已通过；完整 Windows Stage Regression / retained PostgreSQL contracts 尚待本 workflow 后续 jobs，R6-09 整体继续 `IN_PROGRESS`。',
          )
          PY
          rm -f scripts/r6-09-at2-apply.py .r6-09-at2-anchor-trigger.txt .github/workflows/r6-09-at2-anchor-fix.yml .github/workflows/r6-09-at2-failure-report.yml
          git diff --check

      - name: Publish AT2 production commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/r6-09-at2.yml'
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | grep -c '^crates/persistence-postgres/src/team_force_delete.rs$' || true)" = "0"
          git diff --cached --check
          git commit -m "refactor(r6-09): modularize safe permanent deletion"
          production_sha=$(git rev-parse HEAD)
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence

  windows-stage:
    needs: implement
    runs-on: windows-2025-vs2026
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.production_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Stage regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  postgres-retained:
    needs: implement
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.production_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Frozen architecture and database baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture
          node scripts/verify-public-model-boundary.mjs
          node scripts/verify-protected-assets-deterministic.mjs
          node scripts/verify_database_baseline.mjs
      - name: R6 retained PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in \
            team_directory_detail_repository_contract \
            team_names_profiles_repository_contract \
            player_directory_detail_repository_contract \
            player_names_positions_repository_contract \
            player_team_periods_availability_repository_contract \
            player_abilities_dynamic_tags_repository_contract \
            coach_formation_repository_contract \
            entity_matching_references_repository_contract \
            entity_deletion_repository_contract \
            entity_permanent_delete_repository_contract
          do
            cargo test --locked -p football-persistence-postgres --test "$contract" -- --ignored --test-threads=1
          done

  finalize:
    if: ${{ always() && needs.implement.result == 'success' && needs.windows-stage.result == 'success' && needs.postgres-retained.result == 'success' }}
    needs: [implement, windows-stage, postgres-retained]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Close AT2 and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          prod = '${{ needs.implement.outputs.production_sha }}'

          detail = Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md')
          text = detail.read_text(encoding='utf-8')
          text = text.replace('**状态：VERIFYING**', '**状态：DONE**', 1)
          old = '- AT2 Minimum Gate 与 AT1/AT2 PostgreSQL 16 focused contracts 已通过；完整 Windows Stage Regression 与 retained PostgreSQL contracts 尚待本 workflow 后续 jobs，在成功前 AT2 不关闭。'
          new = f'- AT2 生产提交 `{prod}`：Minimum Gate、AT1/AT2 focused PostgreSQL 16 contracts、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过。AT2 已独立关闭；AT3 Team Force Delete 为本节点剩余职责。'
          if text.count(old) != 1:
              raise SystemExit('detail AT2 finalize anchor mismatch')
          detail.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          stage = Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          text = stage.read_text(encoding='utf-8')
          old = 'Atomic Task 2：Safe Permanent Delete 已完成 owner switch、Minimum Gate 与 AT1/AT2 PostgreSQL 16 focused contracts，当前等待完整 Windows Stage Regression 与 retained PostgreSQL contracts；Team Force Delete 尚未迁移'
          new = f'Atomic Task 2：Safe Permanent Delete 生产提交 `{prod}` 已通过 Minimum Gate、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts并独立关闭；Team Force Delete 尚未迁移'
          if text.count(old) != 1:
              raise SystemExit('stage AT2 finalize anchor mismatch')
          stage.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          old = 'AT2 已将普通安全永久删除迁入 deletion adapter，Minimum Gate 与 AT1/AT2 PostgreSQL 16 focused contracts 已通过；完整 Windows Stage Regression / retained PostgreSQL contracts 尚待本 workflow 后续 jobs，R6-09 整体继续 `IN_PROGRESS`。'
          new = f'AT2 已将普通安全永久删除迁入 deletion adapter；生产提交 `{prod}` 的 Minimum Gate、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过。AT1/AT2 均已独立关闭，R6-09 继续 `IN_PROGRESS`，下一 Atomic Task 为 Team Force Delete。'
          if text.count(old) != 1:
              raise SystemExit('root AT2 finalize anchor mismatch')
          root.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/r6-09-at2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence/README.md docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md .github/workflows/r6-09-at2.yml
          git commit -m "docs(r6-09): close AT2 and open force-delete task"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
