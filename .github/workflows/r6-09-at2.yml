name: R6-09 AT2 safe permanent delete

on:
  push:
    branches:
      - rewrite/r6-entity-catalog-persistence

permissions:
  contents: write

concurrency:
  group: r6-09-at2
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    outputs:
      production_sha: ${{ steps.publish.outputs.production_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Verify AT2 protected input
        shell: bash
        run: |
          set -euo pipefail
          base=3bc7ca89ef0341b53985246602218c2ba6fbb094
          git merge-base --is-ancestor "$base" HEAD
          test "$(git hash-object crates/persistence-postgres/src/team_catalog.rs)" = "38f48d74709c8a9673bf2ed0ba7649603f223981"
          test "$(git hash-object crates/persistence-postgres/src/player_catalog.rs)" = "ceb8b6ae74769f8d28ca593ea3298efa0ad730c5"
          test "$(git hash-object crates/persistence-postgres/src/team_force_delete.rs)" = "ec0fd77103c90b94a7eeef7e769c5b17b88f6915"
          test "$(git hash-object crates/persistence-postgres/src/lib.rs)" = "ba502deab94d4cc70f429a7f28ac5b5bf4a13c40"
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/preflight/check.rs
          test -f crates/persistence-postgres/src/adapters/catalog/deletion/archive/bulk.rs
          test ! -e crates/persistence-postgres/src/adapters/catalog/deletion/force_delete

      - name: Implement AT2 and contract first
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          def read(path): return (root / path).read_text(encoding='utf-8')
          def write(path, text):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text.replace('\r\n', '\n'), encoding='utf-8', newline='\n')
          def need(condition, message):
              if not condition: raise SystemExit(message)
          def once(text, old, new, label):
              count = text.count(old)
              need(count == 1, f'{label}: expected 1 anchor, got {count}')
              return text.replace(old, new, 1)
          def remove_rust_function(text, signature, label):
              start = text.find(signature)
              need(start >= 0, f'{label}: signature missing')
              brace = text.find('{', start)
              need(brace >= 0, f'{label}: opening brace missing')
              depth = 0
              end = None
              for index in range(brace, len(text)):
                  if text[index] == '{': depth += 1
                  elif text[index] == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              need(end is not None, f'{label}: function not closed')
              while end < len(text) and text[end] in '\r\n': end += 1
              return text[:start] + text[end:]

          # Contract is created before the production owner switch.
          write('crates/persistence-postgres/tests/entity_permanent_delete_repository_contract.rs', r'''use chrono::Utc;
          use football_domain::{
              DataProviderDraft, ExternalEntityIdDraft, PlayerDraft, PlayerStatus,
              PlayerTeamPeriodDraft, PreferredFoot, TeamDraft,
          };
          use football_persistence_postgres::{DatabaseOptions, PostgresStore};
          use serde_json::json;
          use sqlx::{postgres::PgPoolOptions, PgPool};
          use uuid::Uuid;

          #[tokio::test]
          #[ignore = "需要专用且可写的 PostgreSQL 测试数据库；设置 FOOTBALL_TEST_DATABASE_URL 后显式运行"]
          async fn safe_permanent_delete_contract_is_preserved() {
              let url = std::env::var("FOOTBALL_TEST_DATABASE_URL")
                  .expect("设置 FOOTBALL_TEST_DATABASE_URL");
              let store = PostgresStore::connect(&DatabaseOptions {
                  connection_url: url.clone(),
                  max_connections: 4,
                  connect_timeout_seconds: 10,
              })
              .await
              .expect("connect");
              store.migrate().await.expect("migrate");
              let pool: PgPool = PgPoolOptions::new()
                  .max_connections(4)
                  .connect(&url)
                  .await
                  .expect("pool");

              let token = Uuid::new_v4().simple().to_string();
              let provider = store
                  .create_data_provider(&DataProviderDraft {
                      code: format!("r6_09_delete_{token}"),
                      name: format!("R6-09 Delete Provider {token}"),
                      provider_type: "official".into(),
                      base_url: Some("https://example.test/r6-09-delete".into()),
                      metadata: json!({"contract":"r6-09-at2"}),
                  })
                  .await
                  .expect("provider");

              let free_team = store
                  .create_team(&TeamDraft {
                      canonical_name: format!("R6-09 Delete Team {token}"),
                      country_code: Some("ZZ".into()),
                      metadata: json!({"contract":"r6-09-at2"}),
                  })
                  .await
                  .expect("free team");
              store
                  .add_external_entity_id(&ExternalEntityIdDraft {
                      provider_id: provider.id,
                      entity_type: "team".into(),
                      entity_id: free_team.id,
                      external_id: format!("TEAM-{token}"),
                      metadata: json!({}),
                  })
                  .await
                  .expect("team external id");
              let team_result = store
                  .bulk_delete_teams(&[free_team.id, free_team.id])
                  .await
                  .expect("bulk delete free team");
              assert_eq!(team_result.requested_count, 1);
              assert_eq!(team_result.deleted_ids, vec![free_team.id]);
              assert!(team_result.blocked.is_empty());
              let team_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM football.teams WHERE id=$1",
              )
              .bind(free_team.id)
              .fetch_one(&pool)
              .await
              .expect("team count");
              let team_external_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM football.external_entity_ids WHERE entity_type='team' AND entity_id=$1",
              )
              .bind(free_team.id)
              .fetch_one(&pool)
              .await
              .expect("team external count");
              let team_audit_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM audit.events WHERE event_type='team_deleted' AND entity_type='team' AND entity_id=$1",
              )
              .bind(free_team.id.to_string())
              .fetch_one(&pool)
              .await
              .expect("team audit count");
              assert_eq!(team_count, 0);
              assert_eq!(team_external_count, 0);
              assert_eq!(team_audit_count, 1);

              let free_player = store
                  .create_player(&PlayerDraft {
                      canonical_name: format!("R6-09 Delete Player {token}"),
                      date_of_birth: None,
                      nationality_code: Some("ZZ".into()),
                      preferred_foot: PreferredFoot::Right,
                      height_cm: Some(180),
                      status: PlayerStatus::Active,
                      metadata: json!({"contract":"r6-09-at2"}),
                  })
                  .await
                  .expect("free player");
              store
                  .add_external_entity_id(&ExternalEntityIdDraft {
                      provider_id: provider.id,
                      entity_type: "player".into(),
                      entity_id: free_player.id,
                      external_id: format!("PLAYER-{token}"),
                      metadata: json!({}),
                  })
                  .await
                  .expect("player external id");
              let player_result = store
                  .bulk_delete_players(&[free_player.id, free_player.id])
                  .await
                  .expect("bulk delete free player");
              assert_eq!(player_result.requested_count, 1);
              assert_eq!(player_result.deleted_ids, vec![free_player.id]);
              assert!(player_result.blocked.is_empty());
              let player_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM football.players WHERE id=$1",
              )
              .bind(free_player.id)
              .fetch_one(&pool)
              .await
              .expect("player count");
              let player_external_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM football.external_entity_ids WHERE entity_type='player' AND entity_id=$1",
              )
              .bind(free_player.id)
              .fetch_one(&pool)
              .await
              .expect("player external count");
              let player_audit_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM audit.events WHERE event_type='player_deleted' AND entity_type='player' AND entity_id=$1",
              )
              .bind(free_player.id.to_string())
              .fetch_one(&pool)
              .await
              .expect("player audit count");
              assert_eq!(player_count, 0);
              assert_eq!(player_external_count, 0);
              assert_eq!(player_audit_count, 1);

              let protected_team = store
                  .create_team(&TeamDraft {
                      canonical_name: format!("R6-09 Protected Team {token}"),
                      country_code: Some("ZZ".into()),
                      metadata: json!({}),
                  })
                  .await
                  .expect("protected team");
              let protected_player = store
                  .create_player(&PlayerDraft {
                      canonical_name: format!("R6-09 Protected Player {token}"),
                      date_of_birth: None,
                      nationality_code: Some("ZZ".into()),
                      preferred_foot: PreferredFoot::Left,
                      height_cm: Some(178),
                      status: PlayerStatus::Active,
                      metadata: json!({}),
                  })
                  .await
                  .expect("protected player");
              store
                  .add_player_team_period(&PlayerTeamPeriodDraft {
                      player_id: protected_player.id,
                      team_id: protected_team.id,
                      season_id: None,
                      squad_number: Some(7),
                      valid_from: Utc::now().date_naive(),
                      valid_to: None,
                      registration_status: "registered".into(),
                      source_document_id: None,
                  })
                  .await
                  .expect("protected period");

              let blocked_team = store
                  .bulk_delete_teams(&[protected_team.id])
                  .await
                  .expect("protected team result");
              assert!(blocked_team.deleted_ids.is_empty());
              assert_eq!(blocked_team.blocked.len(), 1);
              assert!(blocked_team.blocked[0].reason.contains("只允许归档"));
              let blocked_player = store
                  .bulk_delete_players(&[protected_player.id])
                  .await
                  .expect("protected player result");
              assert!(blocked_player.deleted_ids.is_empty());
              assert_eq!(blocked_player.blocked.len(), 1);
              assert!(blocked_player.blocked[0].reason.contains("只允许归档"));
              let period_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM football.player_team_periods WHERE team_id=$1 AND player_id=$2",
              )
              .bind(protected_team.id)
              .bind(protected_player.id)
              .fetch_one(&pool)
              .await
              .expect("protected period count");
              assert_eq!(period_count, 1);

              pool.close().await;
              store.close().await;
          }
          ''')

          write('crates/persistence-postgres/src/adapters/catalog/deletion/bulk_delete.rs', r'''use super::{
              ids::unique_ids,
              preflight::labels::entity_label,
              safe_delete::delete_team,
          };
          use crate::{PersistenceResult, PostgresStore};
          use football_domain::{BulkDeleteBlockedItem, BulkDeleteResult};
          use uuid::Uuid;

          impl PostgresStore {
              pub async fn bulk_delete_players(
                  &self,
                  player_ids: &[Uuid],
              ) -> PersistenceResult<BulkDeleteResult> {
                  let ids = unique_ids(player_ids);
                  let mut deleted_ids = Vec::new();
                  let mut blocked = Vec::new();
                  for player_id in &ids {
                      let label = entity_label(&self.pool, "player", *player_id)
                          .await?
                          .unwrap_or_else(|| player_id.to_string());
                      match self.delete_player(*player_id).await {
                          Ok(()) => deleted_ids.push(*player_id),
                          Err(error) => blocked.push(BulkDeleteBlockedItem {
                              id: *player_id,
                              label,
                              reason: error.to_string(),
                          }),
                      }
                  }
                  Ok(BulkDeleteResult {
                      requested_count: ids.len() as u64,
                      deleted_ids,
                      blocked,
                  })
              }

              pub async fn bulk_delete_teams(
                  &self,
                  team_ids: &[Uuid],
              ) -> PersistenceResult<BulkDeleteResult> {
                  let ids = unique_ids(team_ids);
                  let mut deleted_ids = Vec::new();
                  let mut blocked = Vec::new();
                  for team_id in &ids {
                      match delete_team(self, *team_id).await {
                          Ok(()) => deleted_ids.push(*team_id),
                          Err(error) => {
                              let label = entity_label(&self.pool, "team", *team_id)
                                  .await?
                                  .unwrap_or_else(|| team_id.to_string());
                              blocked.push(BulkDeleteBlockedItem {
                                  id: *team_id,
                                  label,
                                  reason: error.to_string(),
                              });
                          }
                      }
                  }
                  Ok(BulkDeleteResult {
                      requested_count: ids.len() as u64,
                      deleted_ids,
                      blocked,
                  })
              }
          }
          ''')

          write('crates/persistence-postgres/src/adapters/catalog/deletion/safe_delete.rs', r'''use super::delete_write::{write_player_delete, write_team_delete};
          use crate::{PersistenceError, PersistenceResult, PostgresStore};
          use uuid::Uuid;

          impl PostgresStore {
              pub async fn delete_player(&self, player_id: Uuid) -> PersistenceResult<()> {
                  let check = self.check_entity_deletion("player", player_id).await?;
                  if !check.can_permanently_delete {
                      return Err(PersistenceError::InvalidState(check.reason));
                  }
                  write_player_delete(&self.pool, player_id).await
              }
          }

          pub(crate) async fn delete_team(
              store: &PostgresStore,
              team_id: Uuid,
          ) -> PersistenceResult<()> {
              let check = store.check_entity_deletion("team", team_id).await?;
              if !check.can_permanently_delete {
                  return Err(PersistenceError::InvalidState(check.reason));
              }
              write_team_delete(&store.pool, team_id).await
          }
          ''')

          write('crates/persistence-postgres/src/adapters/catalog/deletion/delete_write.rs', r'''use crate::{write_audit_event, PersistenceError, PersistenceResult};
          use serde_json::json;
          use sqlx::PgPool;
          use uuid::Uuid;

          pub(crate) async fn write_player_delete(
              pool: &PgPool,
              player_id: Uuid,
          ) -> PersistenceResult<()> {
              let mut tx = pool.begin().await?;
              let player_name: String = sqlx::query_scalar(
                  "SELECT canonical_name FROM football.players WHERE id = $1 FOR UPDATE",
              )
              .bind(player_id)
              .fetch_optional(&mut *tx)
              .await?
              .ok_or_else(|| PersistenceError::InvalidState("球员不存在".to_string()))?;

              sqlx::query(
                  "DELETE FROM football.external_entity_ids WHERE entity_type = 'player' AND entity_id = $1",
              )
              .bind(player_id)
              .execute(&mut *tx)
              .await?;
              write_audit_event(
                  &mut tx,
                  "player_deleted",
                  "player",
                  player_id.to_string(),
                  json!({"canonical_name": player_name, "reference_check": "passed"}),
              )
              .await?;
              sqlx::query("DELETE FROM football.players WHERE id = $1")
                  .bind(player_id)
                  .execute(&mut *tx)
                  .await?;
              tx.commit().await?;
              Ok(())
          }

          pub(crate) async fn write_team_delete(
              pool: &PgPool,
              team_id: Uuid,
          ) -> PersistenceResult<()> {
              let mut tx = pool.begin().await?;
              let team_name = sqlx::query_scalar::<_, String>(
                  "SELECT canonical_name FROM football.teams WHERE id = $1 FOR UPDATE",
              )
              .bind(team_id)
              .fetch_optional(&mut *tx)
              .await?
              .ok_or_else(|| PersistenceError::InvalidState("球队不存在".to_string()))?;
              let match_count: i64 = sqlx::query_scalar(
                  "SELECT count(*)::bigint FROM football.matches WHERE home_team_id=$1 OR away_team_id=$1",
              )
              .bind(team_id)
              .fetch_one(&mut *tx)
              .await?;
              if match_count > 0 {
                  return Err(PersistenceError::InvalidState(format!(
                      "球队已关联 {match_count} 场比赛，为保留历史赛果不能永久删除"
                  )));
              }
              let review_count: i64 = sqlx::query_scalar(
                  r#"
                  SELECT
                      (SELECT count(*)::bigint FROM review.team_match_reviews WHERE team_id=$1)
                    + (SELECT count(*)::bigint FROM review.player_match_reviews WHERE team_id=$1)
                  "#,
              )
              .bind(team_id)
              .fetch_one(&mut *tx)
              .await?;
              if review_count > 0 {
                  return Err(PersistenceError::InvalidState(format!(
                      "球队已关联 {review_count} 条球队或球员赛后复盘，为保留历史记录不能永久删除"
                  )));
              }
              sqlx::query(
                  "DELETE FROM football.external_entity_ids WHERE entity_type='team' AND entity_id=$1",
              )
              .bind(team_id)
              .execute(&mut *tx)
              .await?;
              sqlx::query("DELETE FROM football.teams WHERE id=$1")
                  .bind(team_id)
                  .execute(&mut *tx)
                  .await?;
              write_audit_event(
                  &mut tx,
                  "team_deleted",
                  "team",
                  team_id.to_string(),
                  json!({"canonical_name": team_name}),
              )
              .await?;
              tx.commit().await?;
              Ok(())
          }
          ''')

          deletion_mod = read('crates/persistence-postgres/src/adapters/catalog/deletion/mod.rs')
          deletion_mod = once(
              deletion_mod,
              'mod archive;\nmod ids;\nmod preflight;\n',
              'mod archive;\nmod bulk_delete;\nmod delete_write;\nmod ids;\nmod preflight;\nmod safe_delete;\n',
              'deletion mod',
          )
          write('crates/persistence-postgres/src/adapters/catalog/deletion/mod.rs', deletion_mod)

          player = read('crates/persistence-postgres/src/player_catalog.rs')
          player = remove_rust_function(
              player,
              '    pub async fn delete_player(&self, player_id: Uuid) -> PersistenceResult<()> {',
              'player delete owner',
          )
          write('crates/persistence-postgres/src/player_catalog.rs', player)

          lib = read('crates/persistence-postgres/src/lib.rs')
          lib = once(lib, 'mod team_catalog;\n', '', 'team catalog module')
          write('crates/persistence-postgres/src/lib.rs', lib)
          (root / 'crates/persistence-postgres/src/team_catalog.rs').unlink()

          write('scripts/verify-entity-deletion-persistence.mjs', r'''import fs from "node:fs";
          const read=(p)=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8").replace(/\r\n?/g,"\n");
          const exists=(p)=>fs.existsSync(new URL(`../${p}`,import.meta.url));
          const req=(v,m)=>{if(!v)throw new Error(m)};
          const root="crates/persistence-postgres/src/adapters/catalog/deletion/";
          for(const p of [
            "mod.rs","ids.rs","preflight/mod.rs","preflight/check.rs","preflight/labels.rs","preflight/references.rs",
            "archive/mod.rs","archive/bulk.rs","archive/write.rs","bulk_delete.rs","safe_delete.rs","delete_write.rs"
          ])req(exists(root+p),`R6-09 owner missing: ${p}`);
          const entity=read("crates/persistence-postgres/src/entity_catalog.rs");
          const player=read("crates/persistence-postgres/src/player_catalog.rs");
          const lib=read("crates/persistence-postgres/src/lib.rs");
          const check=read(root+"preflight/check.rs");
          const refs=read(root+"preflight/references.rs");
          const archive=read(root+"archive/bulk.rs")+read(root+"archive/write.rs");
          const bulk=read(root+"bulk_delete.rs");
          const safeDelete=read(root+"safe_delete.rs");
          const deleteWrite=read(root+"delete_write.rs");
          for(const n of ["check_entity_deletion","bulk_archive_entities","team_reference_counts","player_reference_counts","coach_reference_counts"])req(!entity.includes(n),`legacy entity owner remains: ${n}`);
          req(!exists("crates/persistence-postgres/src/team_catalog.rs")&&!lib.includes("mod team_catalog;"),"legacy team deletion owner remains");
          req(!player.includes("pub async fn delete_player"),"legacy player delete owner remains");
          req(check.includes("pub async fn check_entity_deletion")&&archive.includes("pub async fn bulk_archive_entities"),"AT1 owners missing");
          for(const n of ["bulk_delete_players","bulk_delete_teams"])req((bulk.match(new RegExp(`pub async fn ${n}\\b`,"g"))||[]).length===1,`AT2 bulk owner invalid: ${n}`);
          req((safeDelete.match(/pub async fn delete_player\b/g)||[]).length===1,"AT2 delete_player owner invalid");
          for(const p of ["preflight/check.rs","archive/bulk.rs","bulk_delete.rs","safe_delete.rs"]){const s=read(root+p);req(!s.includes("sqlx::")&&!s.includes("SELECT ")&&!s.includes("DELETE FROM "),`coordinator owns SQL: ${p}`)}
          for(const r of ["matches","lineups","player_team_periods","team_coach_periods","player_availability","formation_usage","team_tactical_observations","team_ability_observations","substitutions","match_events","team_match_reviews","player_match_reviews","player_match_observations"])req(refs.includes(`"${r}"`),`reference count missing: ${r}`);
          req(check.includes("can_permanently_delete: total == 0")&&check.includes("只允许归档"),"preflight semantics changed");
          req(archive.includes("manual_bulk_archive")&&archive.includes("_archived"),"archive audit semantics changed");
          for(const token of ["check_entity_deletion(\"team\"","check_entity_deletion(\"player\""] )req(safeDelete.includes(token),`safe delete lost preflight: ${token}`);
          for(const token of ["team_deleted","player_deleted","FOR UPDATE","DELETE FROM football.external_entity_ids","tx.commit().await?"])req(deleteWrite.includes(token),`permanent delete write contract missing: ${token}`);
          for(const token of ["球队不存在","球员不存在","球队已关联 {match_count} 场比赛，为保留历史赛果不能永久删除","球队已关联 {review_count} 条球队或球员赛后复盘，为保留历史记录不能永久删除"])req(deleteWrite.includes(token),`permanent delete error changed: ${token}`);
          for(const table of ["football.player_team_periods","football.team_coach_periods","football.player_availability","feature.formation_usage_observations","feature.team_tactical_observations","feature.team_ability_observations"])req(!deleteWrite.includes(`DELETE FROM ${table}`),`safe permanent delete became destructive: ${table}`);
          req(read("crates/persistence-postgres/src/team_force_delete.rs").includes("pub async fn force_delete_team"),"AT3 force delete moved early");
          console.log("R6-09 AT1+AT2 deletion preflight/archive/safe-permanent-delete ownership verified.");
          ''')

          path='scripts/verify-entity-deletion.mjs'; t=read(path)
          t=once(t,
              'const teamPersistence = text("crates/persistence-postgres/src/team_catalog.rs");',
              'const teamPersistence = [\n  text("crates/persistence-postgres/src/adapters/catalog/deletion/safe_delete.rs"),\n  text("crates/persistence-postgres/src/adapters/catalog/deletion/delete_write.rs"),\n].join("\\n");',
              'entity deletion safe owner')
          write(path,t)

          path='scripts/verify-team-player-management.mjs'; t=read(path)
          t=once(t,
              'const persistenceCatalog = text("crates/persistence-postgres/src/team_catalog.rs");',
              'const deletionPersistence = [\n  text("crates/persistence-postgres/src/adapters/catalog/deletion/bulk_delete.rs"),\n  text("crates/persistence-postgres/src/adapters/catalog/deletion/safe_delete.rs"),\n  text("crates/persistence-postgres/src/adapters/catalog/deletion/delete_write.rs"),\n].join("\\n");\nconst persistenceCatalog = deletionPersistence;',
              'team player deletion owner')
          t=once(t,
              'const playerPersistence = text("crates/persistence-postgres/src/player_catalog.rs");',
              'const playerPersistence = deletionPersistence;',
              'team player player deletion owner')
          write(path,t)

          path='scripts/verify-team-directory-detail.mjs'; t=read(path)
          t=once(t,
              'const legacyTeam = read("crates/persistence-postgres/src/team_catalog.rs");',
              'const legacyTeam = exists("crates/persistence-postgres/src/team_catalog.rs") ? read("crates/persistence-postgres/src/team_catalog.rs") : "";\nconst r609Deletion = read("crates/persistence-postgres/src/adapters/catalog/deletion/bulk_delete.rs");',
              'team directory legacy owner')
          t=once(t,
              'check(legacyTeam.includes("pub async fn bulk_delete_teams"), "R6-01/R6-02 must not migrate R6-09 deletion early");',
              'check(!exists("crates/persistence-postgres/src/team_catalog.rs") && r609Deletion.includes("pub async fn bulk_delete_teams"), "R6-09 permanent team deletion owner advancement missing");',
              'team directory deletion advancement')
          t=t.replace('and R6-02 owner advancement without early R6-09 migration.', 'and R6-02/R6-09 owner advancement.')
          write(path,t)

          path='scripts/verify-team-names-profiles.mjs'; t=read(path)
          t=once(t,
              'const legacy = read("crates/persistence-postgres/src/team_catalog.rs");',
              'const legacy = exists("crates/persistence-postgres/src/team_catalog.rs") ? read("crates/persistence-postgres/src/team_catalog.rs") : "";\nconst r609Deletion = read("crates/persistence-postgres/src/adapters/catalog/deletion/bulk_delete.rs");',
              'team names legacy owner')
          t=once(t,
              'check(legacy.includes("pub async fn bulk_delete_teams"), "R6-02 must not migrate R6-09 team deletion early");\ncheck(legacy.includes("pub async fn bulk_delete_players"), "R6-02 must not disturb existing bulk player deletion path");',
              'check(!exists("crates/persistence-postgres/src/team_catalog.rs"), "R6-09 must remove legacy team_catalog deletion owner");\ncheck(r609Deletion.includes("pub async fn bulk_delete_teams") && r609Deletion.includes("pub async fn bulk_delete_players"), "R6-09 bulk permanent deletion owner advancement missing");',
              'team names deletion advancement')
          write(path,t)

          path='scripts/verify-player-directory-detail.mjs'; t=read(path)
          t=once(t,
              "const legacy = read('crates/persistence-postgres/src/player_catalog.rs');",
              "const legacy = read('crates/persistence-postgres/src/player_catalog.rs');\nconst r609Deletion = read('crates/persistence-postgres/src/adapters/catalog/deletion/safe_delete.rs');",
              'player directory deletion owner')
          old="""for (const retained of [
            'delete_player',
          ]) {
            if (!legacy.includes(`pub async fn ${retained}`)) {
              throw new Error(`Later R6 owner moved prematurely or disappeared: ${retained}`);
            }
          }"""
          new="""if (legacy.includes('pub async fn delete_player')) {
            throw new Error('R6-09 legacy player_catalog.rs still owns delete_player');
          }
          if (!r609Deletion.includes('pub async fn delete_player')) {
            throw new Error('R6-09 safe permanent deletion owner missing delete_player');
          }"""
          t=once(t,old,new,'player directory retained delete advancement')
          write(path,t)

          path='scripts/verify-entity-resource-center.mjs'; t=read(path)
          t=once(t,
              'const teamPersistence = read("crates/persistence-postgres/src/team_catalog.rs");\n',
              '',
              'entity resource unused legacy owner')
          write(path,t)

          # Fail once with every remaining stale verifier instead of whack-a-mole.
          stale=[]
          allowed_team_catalog={
              'scripts/verify-team-directory-detail.mjs',
              'scripts/verify-team-names-profiles.mjs',
          }
          for p in sorted(root.glob('scripts/**/*.mjs')):
              s=p.read_text(encoding='utf-8')
              rel=p.as_posix()
              if 'crates/persistence-postgres/src/team_catalog.rs' in s and rel not in allowed_team_catalog:
                  stale.append(f'{rel}: direct legacy team_catalog.rs read remains')
              if 'crates/persistence-postgres/src/player_catalog.rs' in s and any(x in s for x in ['delete_player','player_deleted','bulk_delete_players']) and 'adapters/catalog/deletion/' not in s:
                  stale.append(f'{rel}: player deletion verifier still bound only to player_catalog.rs')
          need(not stale, 'R6-09 AT2 stale verifier audit failed:\n- ' + '\n- '.join(stale))
          PY

      - name: Format and refresh inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          node scripts/generate-domain-type-inventory.mjs
          node scripts/verify-domain-type-inventory.mjs
          git diff --check

      - name: AT2 minimum static gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-entity-deletion-persistence.mjs
          node scripts/verify-entity-deletion.mjs
          node scripts/verify-team-player-management.mjs
          node scripts/verify-team-directory-detail.mjs
          node scripts/verify-team-names-profiles.mjs
          node scripts/verify-player-directory-detail.mjs
          node scripts/verify-force-team-delete.mjs
          npm run verify:architecture
          node scripts/verify-public-model-boundary.mjs
          node scripts/verify-protected-assets-deterministic.mjs
          cargo fmt --all -- --check
          cargo check --locked -p football-persistence-postgres
          cargo test --locked -p football-persistence-postgres --lib
          cargo test --locked -p football-persistence-postgres --test entity_permanent_delete_repository_contract --no-run
          cargo check --locked -p football-application
          git diff --check

      - name: AT1 and AT2 PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p football-persistence-postgres --test entity_deletion_repository_contract -- --ignored --test-threads=1
          cargo test --locked -p football-persistence-postgres --test entity_permanent_delete_repository_contract -- --ignored --test-threads=1

      - name: Record verifying docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8'); c=t.count(old)
              if c!=1: raise SystemExit(f'{path}: doc anchor count={c}')
              p.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')
          detail='docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md'
          p=Path(detail); t=p.read_text(encoding='utf-8')
          old='- Stage Regression 与 PostgreSQL 16 真实 contract 由本 workflow 后续独立 jobs 执行；在成功前 AT1 不关闭。'
          new='- AT1 最终验证：PostgreSQL 16 run `32219150263` / job `95967398924` 为 `SUCCESS`；历史 Match Review / Stage E2 verifier 仅跟随新 preflight owner 更新后，Windows Stage Regression run `32220581584` / job `95970175840` 为 `SUCCESS`。AT1 已独立关闭。'
          if old in t: t=t.replace(old,new,1)
          if '## Atomic Task 2 — Safe Permanent Delete' not in t:
              t += '\n## Atomic Task 2 — Safe Permanent Delete\n\n- `bulk_delete_teams`、`bulk_delete_players` 与 `delete_player` 已迁入 `adapters/catalog/deletion/{bulk_delete,safe_delete,delete_write}.rs`；bulk/safe-delete 协调器 SQL-free，事务、行锁、最终竞态复检、external-ID 清理与审计写入由 `delete_write.rs` 唯一持有。\n- 旧 `team_catalog.rs` 已删除；`player_catalog.rs` 不再持有 `delete_player`。Team Force Delete 继续保留 `team_force_delete.rs`，未提前进入 AT3。\n- 公共 Port/DTO/Schema/迁移、无引用永久删除条件、错误语义、历史引用保护与用户可观察行为保持不变；无新增生产依赖。\n- AT2 Minimum Gate、AT1/AT2 PostgreSQL 16 contract 已通过；Windows Stage Regression 与 retained PostgreSQL contracts 尚待本 workflow 后续 jobs，在成功前 AT2 不关闭。\n'
          p.write_text(t,encoding='utf-8',newline='\n')

          stage='docs/modular-rewrite/R06-entity-catalog-persistence/README.md'
          replace_once(stage,
              '- Atomic Task 1：Preflight / Reference Counts / Archive owner switch 已完成 Minimum Gate，节点整体继续 `IN_PROGRESS`；普通永久 Delete 与 Team Force Delete 尚未迁移，R6-10 继续 `BLOCKED`。',
              '- Atomic Task 1：Preflight / Reference Counts / Archive 已完成独立验证；PostgreSQL 16 run `32219150263` / job `95967398924` 与最终 Windows Stage Regression run `32220581584` / job `95970175840` 均为 `SUCCESS`。Atomic Task 2：Safe Permanent Delete 已完成 owner switch、Minimum Gate 与 AT1/AT2 PostgreSQL 16 contract，阶段回归尚待后续 jobs；Team Force Delete 尚未迁移，节点整体继续 `IN_PROGRESS`，R6-10 继续 `BLOCKED`。')

          root='README.md'
          replace_once(root,
              '- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、错误语义、历史 P4/运行引用保护、无引用永久删除和 force purge 行为均未改变；无新增生产依赖。AT1 Minimum Gate 已实际通过，Stage Regression / PostgreSQL 16 真实 contract 尚待本次 workflow 后续 jobs，R6-09 整体仍为 `IN_PROGRESS`。',
              '- `EntityReferencePort`、Domain DTO、Schema/0001–0046 migrations、错误语义、历史 P4/运行引用保护、无引用永久删除和 force purge 行为均未改变；无新增生产依赖。AT1 PostgreSQL 16 run `32219150263` / job `95967398924` 与最终 Windows Stage Regression run `32220581584` / job `95970175840` 均为 `SUCCESS`。AT2 已将普通安全永久删除迁入 deletion adapter，Minimum Gate 与 AT1/AT2 PostgreSQL 16 contract 已通过；完整 Windows Stage Regression / retained PostgreSQL contracts 尚待本次 workflow 后续 jobs，R6-09 整体继续 `IN_PROGRESS`。')
          PY
          git diff --check

      - name: Publish AT2 production commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/r6-09-at2.yml'
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | grep -c '^crates/persistence-postgres/src/team_force_delete.rs$' || true)" = "0"
          git commit -m "refactor(r6-09): modularize safe permanent deletion"
          production_sha=$(git rev-parse HEAD)
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence

  windows-stage:
    needs: implement
    runs-on: windows-2025-vs2026
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.production_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Stage regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  postgres-retained:
    needs: implement
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/football_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.production_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Frozen architecture and database baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture
          node scripts/verify-public-model-boundary.mjs
          node scripts/verify-protected-assets-deterministic.mjs
          node scripts/verify_database_baseline.mjs
      - name: R6 retained PostgreSQL 16 contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in \
            team_directory_detail_repository_contract \
            team_names_profiles_repository_contract \
            player_directory_detail_repository_contract \
            player_names_positions_repository_contract \
            player_team_periods_availability_repository_contract \
            player_abilities_dynamic_tags_repository_contract \
            coach_formation_repository_contract \
            entity_matching_references_repository_contract \
            entity_deletion_repository_contract \
            entity_permanent_delete_repository_contract
          do
            cargo test --locked -p football-persistence-postgres --test "$contract" -- --ignored --test-threads=1
          done

  finalize:
    if: ${{ always() && needs.implement.result == 'success' && needs.windows-stage.result == 'success' && needs.postgres-retained.result == 'success' }}
    needs: [implement, windows-stage, postgres-retained]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/r6-entity-catalog-persistence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Close AT2 docs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          prod='${{ needs.implement.outputs.production_sha }}'
          detail=Path('docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md')
          t=detail.read_text(encoding='utf-8')
          old='- AT2 Minimum Gate、AT1/AT2 PostgreSQL 16 contract 已通过；Windows Stage Regression 与 retained PostgreSQL contracts 尚待本 workflow 后续 jobs，在成功前 AT2 不关闭。'
          new=f'- AT2 生产提交 `{prod}`：Minimum Gate、AT1/AT2 focused PostgreSQL 16 contracts、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过。AT2 已独立关闭；AT3 Team Force Delete 为本节点剩余职责。'
          if t.count(old)!=1: raise SystemExit('detail final anchor mismatch')
          detail.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')

          stage=Path('docs/modular-rewrite/R06-entity-catalog-persistence/README.md')
          t=stage.read_text(encoding='utf-8')
          old='Atomic Task 2：Safe Permanent Delete 已完成 owner switch、Minimum Gate 与 AT1/AT2 PostgreSQL 16 contract，阶段回归尚待后续 jobs；Team Force Delete 尚未迁移'
          new=f'Atomic Task 2：Safe Permanent Delete 生产提交 `{prod}` 已通过 Minimum Gate、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts并独立关闭；Team Force Delete 尚未迁移'
          if t.count(old)!=1: raise SystemExit('stage final anchor mismatch')
          stage.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')

          root=Path('README.md')
          t=root.read_text(encoding='utf-8')
          old='AT2 已将普通安全永久删除迁入 deletion adapter，Minimum Gate 与 AT1/AT2 PostgreSQL 16 contract 已通过；完整 Windows Stage Regression / retained PostgreSQL contracts 尚待本次 workflow 后续 jobs，R6-09 整体继续 `IN_PROGRESS`。'
          new=f'AT2 已将普通安全永久删除迁入 deletion adapter；生产提交 `{prod}` 的 Minimum Gate、完整 Windows Stage Regression 与 R6-01～R6-09 retained PostgreSQL 16 contracts全部通过。AT1/AT2 均已独立关闭，R6-09 继续 `IN_PROGRESS`，下一 Atomic Task 为 Team Force Delete。'
          if t.count(old)!=1: raise SystemExit('root final anchor mismatch')
          root.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          rm -f .github/workflows/r6-09-at2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/modular-rewrite/R06-entity-catalog-persistence/README.md docs/modular-rewrite/R06-entity-catalog-persistence/R06-09-archive-delete-and-force-delete.md .github/workflows/r6-09-at2.yml
          git commit -m "docs(r6-09): close AT2 and open force-delete task"
          git push origin HEAD:rewrite/r6-entity-catalog-persistence
